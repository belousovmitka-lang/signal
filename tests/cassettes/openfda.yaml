        \"\", \"mdr_text\": [{\"mdr_text_key\": \"15617444028\", \"text_type_code\":
        \"Description of Event or Problem\", \"patient_sequence_number\": \"0\", \"text\":
        \"As reported, hemostasis failed after use of a 7F Exoseal vascular closure
        device (VCD), and closure was unsuccessful. Manual compression was ultimately
        used to achieve hemostasis. There was no reported patient injury. A 68-year-old
        male patient underwent surgery for lower-extremity arterial stenosis. The
        physician had many years of experience using Exoseal. A retrograde puncture
        was performed through the left femoral artery using a Cordis short sheath.
        The device was slowly retracted at an angle of 40 degrees. After pulsatile
        blood flow at the blood-return indicator stopped, the closure device was withdrawn
        another 1 cm. The indicator window turned black. The plug deployment button
        was pressed before the device was withdrawn. The device will be returned for
        evaluation.\"}, {\"mdr_text_key\": \"16117444029\", \"text_type_code\": \"Additional
