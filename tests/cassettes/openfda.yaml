        \"\", \"mdr_text\": [{\"mdr_text_key\": \"16247636230\", \"text_type_code\":
        \"Additional Manufacturer Narrative\", \"patient_sequence_number\": \"0\",
        \"text\": \"Bayer Case Number: (b)(4).I will be having to have the coils removed
        next month \\\"[Medical device removal]\\\".Case Narrative: This spontaneous
        case was reported by a consumer and describes the occurrence of MEDICAL DEVICE
        REMOVAL (\\\"I will be having to have the coils removed next month\\\") in
        an adult female patient who had ESSURE inserted for female sterilisation.
        There was no information on the patient's medical history or concurrent conditions.
        On an unknown date, the patient had ESSURE inserted. On an unknown date she
        underwent MEDICAL DEVICE REMOVAL (seriousness criterion intervention required).
        The patient was treated with Surgery (Hysterectomy to remove Essure). At the
        time of the report, the outcome of the event was unknown. The reporter considered
        MEDICAL DEVICE REMOVAL to be related to ESSURE administration. The reporter
        commented: I had the Essure coil put in 20+ years ago and am now having the
        side effects of this. I will be having to have the coils removed next month.
        It is my understanding that this product has been discontinued due to the
        side effects. I paid out of my pocket to have this procedure done and now
        will have to pay to have them removed including missing time from work. I
        would appreciate a response from Bayer to see if there is any way for reimbursement
        of this. Your response would be appreciated in a timely manner.I had previously
        emailed you the information you asked for. After going to my appointment yesterday
        I have been advised that I will need a hysterectomy to remove the coils. I
        have a follow up appointment on (b)(6), and we will then schedule the surgery.
