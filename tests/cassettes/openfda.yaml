        \"\", \"mdr_text\": [{\"mdr_text_key\": \"15616978686\", \"text_type_code\":
        \"Description of Event or Problem\", \"patient_sequence_number\": \"0\", \"text\":
        \"On (b)(6) 2026 the user reported that on (b)(6) 2026 the user experienced
        hypoglycemia with blood glucose (BG) levels of 41 mg/dL following treatment
        of the initial low glucose alert with food and a beverage. The user was transported
        to the hospital by a caregiver where the user was treated with IV glucose
        and discharged on (b)(6) 2026. No long-term health effects were reported.\"},
        {\"mdr_text_key\": \"16116978691\", \"text_type_code\": \"Additional Manufacturer
        Narrative\", \"patient_sequence_number\": \"0\", \"text\": \"The complaint
        investigation was performed by evaluation of the device engineering logs for
        the reported event on (b)(6) 2026. No instances of malfunction alerts or factory
        resets were identified. No motor errors were identified to indicate inaccurate
        insulin dosing relative to delivery requests. Review of the available data
        determined that the iLet was behaving as intended, alerts were triggered appropriately,
        and insulin doses were adjusted in response to CGM glucose values.The reported
        hypoglycemic event included a BG level of 41 mg/dL, loss of consciousness,
        seizure, and vomiting. The user was transported to the hospital by a caregiver,
        treated with IV glucose, and released without hospital admission. No outside
        insulin, meal announcements, or supply changes were reported prior to the
        event.The investigation did not identify an iLet device malfunction associated
        with the reported event. The device engineering log review determined that
        the iLet functioned as intended during the reviewed period.\"}], \"number_patients_in_event\":
