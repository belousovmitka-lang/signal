        [{\"mdr_text_key\": \"15617333853\", \"text_type_code\": \"Description of
        Event or Problem\", \"patient_sequence_number\": \"0\", \"text\": \"As reported,
        a plastic connector of a 5F Sidewinder II 125cm Tempo Aqua diagnostic catheter
        broke off and ended up in the KM syringe and was not injected into the patient.
        There was no reported patient injury. The product was not retained and therefore
        cannot be returned. The device was stored in a light-proof cupboard with the
        catheters hanging and was stored in the cupboard before the damage was discovered.
        The facility does not use room sterilization methods involving ultraviolet
        (UV) light or ozone. There was no visible damage to the product packaging
        prior to use. There were no difficulties connecting the syringe to the Luer
        connector; a red contrast medium syringe from a non-Cordis manufacturer was
        used. The same catheter was used as a replacement, and there were no problems
        with the replacement catheter. The device was not kept and will not be returned
        for evaluation.\"}, {\"mdr_text_key\": \"16117333854\", \"text_type_code\":
