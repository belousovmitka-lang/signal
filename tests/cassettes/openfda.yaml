        [{\"mdr_text_key\": \"16120402425\", \"text_type_code\": \"Additional Manufacturer
        Narrative\", \"patient_sequence_number\": \"0\", \"text\": \"At this time,
        product has not yet been returned, and a valid serial number has not been
        provided. An investigation has been performed for the reported complaint information.The
        investigation included a review of the complaint information. The information
        provided in the complaint was insufficient to conduct a comprehensive investigation.
        The lack of the full device configuration details restricts the ability to
        identify potential causes of the customer's reported issue. Based on the investigation
        findings, no software malfunction or product deficiency was identified. It
        is not possible to determine the probable cause of this event. There are mitigations
        in place to reduce and prevent issues such as disconnected, faulty or damaged
        components or misuse of the device. All vital manufacturing steps are validated,
        monitored, and verified during manufacturing to ensure the system is in conformance
        with the verified design. Labeling is provided to instruct the user on the
        intended use of all vital parts of the system to minimize misuse.All complaints
        and complaint trends are investigated to determine if there is a product defect/
        deficiency. If a product defect/ deficiency is identified, a Risk Evaluation
        is completed and compared to the Risk Management report, to ensure the risk
        profile has not changed. Additionally, as a part of Abbott\xBFs Post-Market
        Surveillance Process, all Risk Evaluations with associated complaint data
        are reviewed annually to determine if the risk profiles have changed as compared
        to the product Risk Management reports. These monitoring processes ensure
        that all product risk profiles remain acceptable and have a positive benefit/
        risk ratio.If the product is returned, a physical investigation will be performed
        and a follow-up report submitted.This complaint was reviewed and is being
        submitted as it has been reassessed as reportable as the result of retrospective
        review associated with a CAPA.All pertinent information available to Abbott
        Diabetes Care has been submitted.\"}, {\"mdr_text_key\": \"15620402424\",
