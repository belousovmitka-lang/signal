        \"\", \"mdr_text\": [{\"mdr_text_key\": \"15618299729\", \"text_type_code\":
        \"Description of Event or Problem\", \"patient_sequence_number\": \"0\", \"text\":
        \"REPORTER CALLED TO INFORM US OF AN ADVERSE EVENT HER HUSBAND EXPERIENCED
        WITH AQUACEL Ag. REPORTER STATES HER HUSBAND HAD HIP SURGERY ON (b)(6) AND
        THEY USED AQUACEL Ag AS AN ADHESIVE THAT WAS SUPPOSED TO STAY ON FOR 2 WEEKS
        BUT HER HUSBAND WAS EXPERIENCING SYMPTOMS EARLIER SO IT WAS REMOVED 2 DAYS
        PRIOR ON (b)(6). THE REPORTERS HUSBAND EXPERIENCED BURNING, BLISTERING, OOZING,
        THIRD DEGREE BURNS, AND NECROSIS WITH THE ADHESIVE PHYSICALLY ADHERING AND
        GROWING INTO THE AFFECTED AREA. THE HUSBANDS WOUND HAD TO GET DEBRIDED OF
        NECROTIC TISSUE AND WAS PRESCRIBED ANITBIOTICS TO PREVENT FURTHER SYSTEMIC
        INFECTION. THIS COMPLICATION HAS REQUIRED WEEKLY WOUND MANAGEMENT APPOINTMENTS.
        THE REPORTER STATES IT LOOKS LIKE \\\"SOMEONE HELD A BLOWTORCH TO IT\\\".
        THE DEVICE INCLUDES ACTIVE INGREDIENTS SUCH AS IONIC SILVER AND MALTODEXTERIN,
        WITH KNOWN POTENTIAL SIDE EFFECTS OF BLISTERING OR BURNING. REPORTER STATES
        THIS PRODUCT HAS BEEN RECALLED AND SAW A SIMILIAR CASE REPORT OF ANOTHER PATIENT
        EXPERIENCING AN ADVERSE EVENT DUE TO THIS PRODUCT. THE REPORTER IS ENCOURAGING
        THE PHYSICIAN TO FILE AN OFFICIAL REPORT AS WELL.\"}], \"number_patients_in_event\":
