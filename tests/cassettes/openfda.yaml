        the customer experienced an adverse event or required intervention as a result
        of the reported issue. There was no report of death, serious injury, or mistreatment
        associated with this event.\"}, {\"mdr_text_key\": \"16116930372\", \"text_type_code\":
        \"Additional Manufacturer Narrative\", \"patient_sequence_number\": \"0\",
        \"text\": \"An investigation has been performed for the reported complaint
        information.The investigation included a review of the complaint information
        and replication of user reported issue using a known good sensor and device
        of similar configuration. Functionality testing of the user reported alarm
        feature was performed to evaluate application performance to ensure the application
        is functioning as intended. Based on the investigation findings, no software
        malfunction or product deficiency was identified; therefore, the issue is
        not confirmed.  It is not possible to determine the probable cause of this
        event. There are mitigations in place to reduce and prevent issues such as
        disconnected, faulty or damaged components or misuse of the device. All vital
        manufacturing steps are validated, monitored, and verified during manufacturing
        to ensure the system is in conformance with the verified design. Labeling
        is provided to instruct the user on the intended use of all vital parts of
