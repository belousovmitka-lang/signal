        [{\"mdr_text_key\": \"15617316720\", \"text_type_code\": \"Description of
        Event or Problem\", \"patient_sequence_number\": \"0\", \"text\": \"A Trilogy
        100 Ventilator, U.S.A - BT device was returned to the manufacturer for recertification.
        There is no allegation of serious or permanent harm or injury. The device
        was not in use on a patient at the time of the occurrence.During the evaluation,
        the device failed the Test Active Exhalation Solenoid Valve and Test Active
        Exhalation Proportional Valve test steps. The device evaluation does not identify
        any specific component malfunction that would need to be replaced to resolve
        these failed test steps.Additionally, the evaluation of the device data identified
        unrelated error codes. These error codes are consistent with normal device
        operation and expected use conditions and are not considered reportable under
        medical device reporting requirements. No evidence was identified to suggest
        that these error codes contributed to or caused the reported event. The service
        technician also confirmed that the device MAC address label was damaged, the
        feet were missing, the rear enclosure was damaged, the handle was cracked,
        the keypad was damaged, the FAA label was damaged, and the front enclosure
        was damaged; all of which were added or replaced to address the issues. There
        was no problem found with the screen. Due to the failed test steps, the device
        has been returned to the technician for additional evaluation. If additional
        information is provided on the completion of the device evaluation, a follow-up
        report will be submitted.\"}], \"number_patients_in_event\": \"\", \"distributor_name\":
