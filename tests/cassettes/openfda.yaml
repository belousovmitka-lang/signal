        \"single_use_flag\": \"Y\", \"manufacturer_country\": \"\", \"mdr_text\":
        [{\"mdr_text_key\": \"15617219439\", \"text_type_code\": \"Description of
        Event or Problem\", \"patient_sequence_number\": \"0\", \"text\": \"It was
        reported that the subcutaneous implantable cardioverter defibrillator (S-ICD)
        recorded multiple untreated episodes due to sensing of noise since October
        2025. It was also observed that in July 2022 the S-ICD delivered an inappropriate
        shock due to the oversensing while the S-ICD was programmed to the Primary
        vector. The S-ICD was then programmed to the Alternate vector in October 2025.
        Technical Services (TS) discussed that there was non-physiologic artifact
        with wandering baseline and some signal deviation. It was recommended to try
        to reproduce the artifact in-clinic with pocket manipulation to evaluate system
        integrity. The S-ICD system remains in service.It was additionally reported
        that on (b)(6), 2026, x-rays were obtained. The patient was evaluated and
        it was possible to elicit noise in the Secondary and Alternate vectors which
        was marked correctly by the device. It was not possible to recreate the noise
        in the Primary vector. Technical Services discussed that reproducing noise
        related to Sense B can be challenging and it was planned to program the device
        to Secondary with 2X gain. No adverse pateint effects were reported.\"}],
