        [{\"mdr_text_key\": \"15618319279\", \"text_type_code\": \"Description of
        Event or Problem\", \"patient_sequence_number\": \"0\", \"text\": \"A customer
        reported receiving erroneous glucose results from an Abbott Diabetes Care
