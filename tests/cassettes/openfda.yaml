        \"\", \"mdr_text\": [{\"mdr_text_key\": \"15619468269\", \"text_type_code\":
        \"Description of Event or Problem\", \"patient_sequence_number\": \"0\", \"text\":
        \"Subject: VOLUNTARY CONSUMER MEDWATCH REPORT: Hazardous Product Defects and
        Lens Case Explosion - CLEAR CARE Triple Action Cleaning (12 Oz, 2-Pack). To
        the FDA MedWatch Safety Reporting Team, I am writing to formally file a voluntary
        medicaldevice incident report regarding consecutive safety failures and physical
        injuries involving two separate purchases of an over-the-counter medical device:
        CLEAR CARE Triple Action Cleaning Solution (12 Oz, 2-Pack) along with their
        accompanying special lens cases. Device Information: Product Name: CLEAR CARE
        Triple Action Cleaning Solution (12 Oz, 2-Pack) Manufacturer: Alcon. Retailer
        Location: (b)(6) Detailed Chronology of Events: 1. First Purchase Lot (Used
        from around (b)(6) 2026 to (b)(6) 2026): Following an eye doctor's advice,
        I purchased and used a 2-pack of CLEAR CARE Triple Action Cleaning. Around
        (b)(6) 2026, after using the solution for some time, I regularly experienced
        intense stinging pain and skin blanching (turning white) on my fingers immediately
        upon opening the lens case. This indicated a severe failure of the platinum
        disc to neutralize the 3% hydrogen peroxide, resulting in chemical burns.
        After finishing those two bottles, I saved this specific defective case in
        my cabinet but stopped using it. 2. Second Purchase Lot & Case Explosion (Used
        from (b)(6) 2026 to (b)(6) 2026): I started using a completely separate, second
        2-pack of the exact same product line. On (b)(6) 2026, approximately 20 minutes
        after beginning the normal cleaning process with a brand-new bottle and its
        newly provided lens case, a violent explosion occurred. The gas pressure buildup
        inside the device was so severe that the blue cap was violently blasted off,
        and the plastic neck/rim of the solution bottle completely shattered. We immediately
        visited (b)(6) on the same day to have my daughter's contact lenses inspected
        for physical cracks or structural damage. 3. Adverse Event Recurrence on (b)(6)
        2026. Since the new lenscase was completely broken from the explosion, I temporarily
        retrieved the stored case from the first purchase (b)(6) 2026 to clean the
        lenses. On the night of (b)(6) 2026, after allowing the lenses to undergo
        the neutralizing process for more than 6 hours, the sharp skin-whitening and
        painful burning symptoms immediately recurred on my hands upon opening the
        device. This traumatic recurrence proved that the platinum neutralizing ring
        was completely defective, failing to convert the 3% hydrogen peroxide into
        safe saline even after strictly following the required 6+ hour timeline.Conclusion
        of Severe Hazards & Public Risk: This sequence of events demonstrates persistent,
        hazardous quality control and structural integrity issues across multiple
        separate batches of the Alcon CLEAR CARE Triple Action Cleaning product line:
        Defect A: The lens case from the first purchase featured a failing platinum
        neutralizing disc, leaving 3% hydrogen peroxide unneutralized, causing immediate
        skin chemicalburns. Defect B: The lens case from the second purchase featured
        a defective or blocked safety vent in the cap, leading to dangerous pressure
        accumulation, physical explosion, and structural destruction of the bottle.
        These continuous defects present anextreme risk of severe corneal chemical
        burns and potential permanent vision loss for my daughter and the general
        public. Furthermore, the official product insert fails to warn consumers that
        severe chemical burns can occur from a hidden hardware defecteven when instructions
        are strictly followed. I have retained both the chemical-burning case and
        the shattered remnants of the exploded bottle as physical evidence. I urgently
        request the FDA to investigate these product batches, review the manufacturer's
        qualitycontrol protocols and evaluate if a public safety recall is warranted.
        Sincerely, (b)(6). REFERENCED REPORTS- CDRH-50515086_MW6001598.ANNEX A- 4006,
        2898, 1261, 3012.ANNEX E- 1994, 2074, 4540,2549.ANNEX F- 4614.ANNEX G- 424.This
        report Captures- CLEAR CARE TRIPLE ACTION CLEANING (12OZ, 2 PACK) #2.\"}],
