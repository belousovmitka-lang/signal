        [{\"mdr_text_key\": \"15618893397\", \"text_type_code\": \"Description of
        Event or Problem\", \"patient_sequence_number\": \"0\", \"text\": \"A customer
        reported a missing high/low glucose alarm with the ADC device. There was no
        indication that the customer experienced an adverse event or required intervention
        as a result of the reported issue. There was no report of death, serious injury,
        or mistreatment associated with this event.\"}, {\"mdr_text_key\": \"16118893399\",
        \"text_type_code\": \"Additional Manufacturer Narrative\", \"patient_sequence_number\":
        \"0\", \"text\": \"An investigation has been performed for the reported complaint
        information.The investigation included a review of the complaint information
        and replication of user reported issue using a known good sensor and device
        of similar configuration. Functionality testing of the user reported alarm
        feature was performed to evaluate application performance to ensure the application
        is functioning as intended. Based on the investigation findings, no software
        malfunction or product deficiency was identified; therefore, the issue is
        not confirmed.  It is not possible to determine the probable cause of this
        event. There are mitigations in place to reduce and prevent issues such as
        disconnected, faulty or damaged components or misuse of the device. All vital
        manufacturing steps are validated, monitored, and verified during manufacturing
        to ensure the system is in conformance with the verified design. Labeling
        is provided to instruct the user on the intended use of all vital parts of
        the system to minimize misuse.All complaints and complaint trends are investigated
        to determine if there is a product defect/ deficiency. If a product defect/
        deficiency is identified, a Risk Evaluation is completed and compared to the
        Risk Management report, to ensure the risk profile has not changed. Additionally,
        as a part of Abbott\xBFs Post-Market Surveillance Process, all Risk Evaluations
        with associated complaint data are reviewed annually to determine if the risk
        profiles have changed as compared to the product Risk Management reports.
        These monitoring processes ensure that all product risk profiles remain acceptable
        and have a positive benefit/ risk ratio.This complaint was reviewed and is
        being submitted as it has been reassessed as reportable as the result of retrospective
        review associated with a CAPA. All pertinent information available to Abbott
        Diabetes Care has been submitted.\"}], \"number_patients_in_event\": \"\",
