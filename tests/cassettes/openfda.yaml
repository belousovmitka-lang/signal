        \"Additional Manufacturer Narrative\", \"patient_sequence_number\": \"0\",
        \"text\": \"Effective August 1, 2026, MDR-related activities and responsibilities
        were transferred to PENTAX Medical Corporation as part of a corporate restructuring.
        This report is being submitted by PENTAX Medical Corporation. In accordance
        with 21 CFR 803.3(m), because this corporate restructuring does not affect
        the manufacturing site, the FDA Registration Number previously assigned for
        this site (#9610877) continues to be used. The product was returned to Pentax
        Medical for repair. Our technician checked the returned unit and confirmed
        that the Nozzle gluing missing. Based on the result, we concluded that it
        was caused due to the physical damage applied on the Nozzle gluing. In addition,
        our technician confirmed that the Air/Water socket deformed, and the Air/Water
        socket leak; however, these defects are not the main cause, and/or irrelevant
        to the alleged complaint. As a result of confirming the detail as GFE, no
        response was obtained, so we cannot deny the possibility of dropping into
        human.. Therefore, based on the technical report \\\"HR-RPT 0585(Nozzle)\\\"
        and/or the risk analysis results, it was evaluated to submit MDR.\"}], \"number_patients_in_event\":
