        reported an unexpected high/low glucose alarm with the ADC device, in use
        with the application. There was no indication that the customer experienced
        an adverse event or required intervention as a result of the reported issue.
        There was no report of death, serious injury, or mistreatment associated with
        this event.\"}, {\"mdr_text_key\": \"16117328585\", \"text_type_code\": \"Additional
