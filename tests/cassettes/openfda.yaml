        [{\"mdr_text_key\": \"15619449575\", \"text_type_code\": \"Description of
        Event or Problem\", \"patient_sequence_number\": \"0\", \"text\": \"A customer
        reported receiving erroneous glucose results from an Abbott Diabetes Care
        device. The customer received sensor scan results of 69.00 mg/dL,63.00 mg/dL,116.00
        mg/dL compared to glucose values of 189.00 mg/dL,199.00 mg/dL,169.00 mg/dL
        respectively obtained on the comparison device, when plotted on a Parkes Error
        Grid, fall into the C Zone, showing the difference in values to be clinically
        significant. The length of sensor wear was same day. There was no report of
        death, serious injury, or mistreatment associated with this event.\"}, {\"mdr_text_key\":
        \"16119449576\", \"text_type_code\": \"Additional Manufacturer Narrative\",
        \"patient_sequence_number\": \"0\", \"text\": \"At this time, product has
        not yet been returned. An investigation has been performed for the reported
        complaint information.The Device History Records (DHRs) for the product were
        reviewed and the DHRs showed the product passed all tests prior to release.The
        most probable root causes associated with the reported failure mode are disconnected,
        faulty or damaged components, software/data corruption, or misuse. Mitigations
        are in place to reduce and prevent such issues. Manufacturing steps are monitored
        and verified during manufacturing process to ensure the medical device is
        in conformance with the verified design. All vital functions are monitored
        by the system and, when necessary, function is suspended to safeguard against
        inaccurate results. Labeling is provided to instruct the user on the intended
        use of the system to minimize misuse. All complaints and complaint trends
        are investigated to determine if there is a product defect/ deficiency. If
        a product defect/ deficiency is identified, a Risk Evaluation is completed
        and compared to the Risk Management report, to ensure the risk profile has
        not changed. Additionally, as a part of Abbott\xBFs Post-Market Surveillance
        Process, all Risk Evaluations with associated complaint data are reviewed
        annually to determine if the risk profiles have changed as compared to the
        product Risk Management reports. These monitoring processes ensure that all
        product risk profiles remain acceptable and have a positive benefit/ risk
        ratio.If the product is returned, a physical investigation will be performed
        and a follow-up report submitted.This complaint was reviewed and is being
        submitted as it has been reassessed as reportable as the result of retrospective
        review associated with a CAPA.All pertinent information available to Abbott
        Diabetes Care has been submitted.\"}], \"number_patients_in_event\": \"\",
