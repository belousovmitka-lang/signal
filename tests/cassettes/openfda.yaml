        [{\"mdr_text_key\": \"15616979340\", \"text_type_code\": \"Description of
        Event or Problem\", \"patient_sequence_number\": \"0\", \"text\": \"On or
        about (b)(6) 2021, Plaintiff underwent placement of an AngioDynamics SmartPort
        Port Catheter product, with model number H787CT80STPDVI1 and lot number 5673775.
        This SmartPort device consisted of a port body and polyurethane catheter and
        was implanted through the left internal jugular vein for the administration
        of chemotherapy treatment related to lymphoma.On or about (b)(6), 2021, Plaintiff
        presented to (b)(6) in Indiana, Pennsylvania, with complaints of pain around
        his SmartPort site radiating into his neck and symptoms consistent with infection.
        During hospitalization, wound cultures obtained from the port site grew Pseudomonas,
        and Plaintiff was diagnosed with cellulitis, severe neutropenia, and sepsis.On
        or about (b)(6), 2021, Plaintiff underwent removal of the infected SmartPort.
        The procedure was performed by (b)(6), M. D. at (b)(6) in Indiana, Pennsylvania.
        During the procedure, the entire SmartPort and catheter were removed due to
        infection, cellulitis, sepsis, and positive Pseudomonas wound cultures.\"},
