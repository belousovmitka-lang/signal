        Event or Problem\", \"patient_sequence_number\": \"0\", \"text\": \"A customer
        reported a missing high/low glucose alarm with the ADC device. There was no
        indication that the customer experienced an adverse event or required intervention
        as a result of the reported issue. There was no report of death, serious injury,
        or mistreatment associated with this event.\"}, {\"mdr_text_key\": \"16116975241\",
        \"text_type_code\": \"Additional Manufacturer Narrative\", \"patient_sequence_number\":
        \"0\", \"text\": \"At this time, product has not yet been returned. An investigation
        has been performed for the reported complaint information.The Device History
        Records (DHRs) for the product were reviewed and the DHRs showed the product
        passed all tests prior to release.The investigation included a review of the
        complaint information. The reported configuration is not compatible with the
        user's reported application. The compatibility guide is available to the customer
        on the product's website. As the compatibility guide is provided to the customer
        and incompatible configurations were used, this complaint is determined to
        be due to use error. Based on the investigation findings, no software malfunction
        or product deficiency was identified.It is not possible to determine the probable
        cause of this event. There are mitigations in place to reduce and prevent
        issues such as disconnected, faulty or damaged components or misuse of the
        device. All vital manufacturing steps are validated, monitored, and verified
        during manufacturing to ensure the system is in conformance with the verified
        design. Labeling is provided to instruct the user on the intended use of all
        vital parts of the system to minimize misuse.All complaints and complaint
        trends are investigated to determine if there is a product defect/ deficiency.
        If a product defect/ deficiency is identified, a Risk Evaluation is completed
        and compared to the Risk Management report, to ensure the risk profile has
        not changed. Additionally, as a part of Abbott\xBFs Post-Market Surveillance
        Process, all Risk Evaluations with associated complaint data are reviewed
        annually to determine if the risk profiles have changed as compared to the
        product Risk Management reports. These monitoring processes ensure that all
        product risk profiles remain acceptable and have a positive benefit/ risk
        ratio.If the product is returned, a physical investigation will be performed
        and a follow-up report submitted.This complaint was reviewed and is being
        submitted as it has been reassessed as reportable as the result of retrospective
        review associated with a CAPA. All pertinent information available to Abbott
        Diabetes Care has been submitted.\"}], \"number_patients_in_event\": \"\",
