        \"Foreign Public Officials\", \"OECD\", \"CFPOA\"], \"fr\": [\"Loi\", \"corruption\",
        \"agents publics \xE9trangers\", \"OCDE\", \"LCAPE\"]}, \"license_id\": \"ca-ogl-lgo\",
        \"license_title\": \"Open Government Licence - Canada\", \"license_url\":
        \"https://open.canada.ca/en/open-government-licence-canada\", \"maintainer\":
        null, \"maintainer_email\": \"redacted@example.org\", \"metadata_created\":
        \"2026-10-09T11:43:04.578674\", \"metadata_modified\": \"2026-10-09T11:43:04.632816\",
        \"name\": \"d6e1303a-4415-4fc5-a3d4-cb7cb9e79e70\", \"notes\": \"Sometimes
        known as \u201Cgrease payments\u201D, facilitation payments are those made
        to expedite or secure the performance by a foreign public official of any
        act of a routine nature that is part of the foreign public official\u2019s
        duties or functions. Examples include: the issuance of a permit, licence or
        other document; the processing of official documents, such as visas and work
        permits; the provision of services normally offered to the public, such as
        mail and utilities; and the provision of other government services such as
        police protection, cargo logistics, the protection of perishable products
        from deterioration or the scheduling of inspections related to contract performance
        or transit of goods.\\r\\n\\r\\nSince October 31, 2017, any payment made by
        a Canadian to a foreign public official to secure or expedite the performance
        of acts of a routine nature that are within the scope of the official's duties
        and functions in order to obtain or retain an advantage in the course of business
        is not permitted under Canadian law, regardless of whether it takes place
        in Canada or abroad.\", \"notes_translated\": {\"en\": \"Sometimes known as
        \u201Cgrease payments\u201D, facilitation payments are those made to expedite
        or secure the performance by a foreign public official of any act of a routine
        nature that is part of the foreign public official\u2019s duties or functions.
        Examples include: the issuance of a permit, licence or other document; the
        processing of official documents, such as visas and work permits; the provision
        of services normally offered to the public, such as mail and utilities; and
        the provision of other government services such as police protection, cargo
        logistics, the protection of perishable products from deterioration or the
        scheduling of inspections related to contract performance or transit of goods.\\r\\n\\r\\nSince
        October 31, 2017, any payment made by a Canadian to a foreign public official
        to secure or expedite the performance of acts of a routine nature that are
        within the scope of the official's duties and functions in order to obtain
        or retain an advantage in the course of business is not permitted under Canadian
        law, regardless of whether it takes place in Canada or abroad.\", \"fr\":
        \"Un paiement de facilitation, ou \xAB d\u2019acc\xE9l\xE9ration \xBB, est
        un paiement vers\xE9 \xE0 un agent public \xE9tranger pour qu\u2019il ex\xE9cute
        ou acc\xE9l\xE8re l\u2019ex\xE9cution d\u2019une t\xE2che r\xE9guli\xE8re
        qui fait partie de ses fonctions officielles. Par exemple : d\xE9livrance
        de permis, de licences ou d\u2019autres documents; traitement de documents
        officiels, comme des visas et des permis de travail; prestation de services
        normalement offerts au public, comme la livraison du courrier ou les services
        publics; prestation d\u2019autres services gouvernementaux, comme la protection
        de la police, le fret et la logistique, la protection des produits p\xE9rissables
        contre la d\xE9t\xE9rioration ou l\u2019\xE9tablissement des calendriers des
        inspections relatives \xE0 l\u2019ex\xE9cution de contrats ou au transit de
        marchandises.\\r\\n\\r\\nDepuis le 31 octobre 2017, tout paiement vers\xE9
        par un Canadien \xE0 un agent public \xE9tranger pour qu\u2019il ex\xE9cute
        ou acc\xE9l\xE8re l\u2019ex\xE9cution d\u2019une t\xE2che r\xE9guli\xE8re
        qui fait partie de ses fonctions officielles n\u2019est pas permise en vertu
        de la loi canadienne, que le paiement ait eu lieu au Canada ou \xE0 l\u2019\xE9tranger.\"},
