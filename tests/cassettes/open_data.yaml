        \"id\": \"d6e1303a-4415-4fc5-a3d4-cb7cb9e79e70\", \"imso_approval\": \"true\",
        \"isbn\": \"\", \"isopen\": false, \"issn\": \"\", \"issuance\": \"\", \"issuance_frequency\":
