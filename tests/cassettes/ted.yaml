        and management of digital systems in Bankenes sikringsfond.\"}, \"buyer-country\":
        [\"NOR\"]}, {\"description-lot\": {\"pol\": [\"Przedmiotem zam\xF3wienia dla
        realizacji zadania - inwestycji pn.: \u201EDigitalizacja sieci ciep\u0142owniczej
        nale\u017C\u0105cej do Przedsi\u0119biorstwa Energetyki Cieplnej - Gliwice
        Sp. z o. o. w zakresie zadania pod nazw\u0105 Telemetria Kom\xF3r Ciep\u0142owniczych\u201D
        jest: 1.Zaprojektowanie i wykonanie rob\xF3t budowlanych w obr\u0119bie wskazanych
        lokalizacji 13 obiekt\xF3w (g\u0142\xF3wnie kom\xF3r ciep\u0142owniczych)
        oraz dostawa 7 zestaw\xF3w do zabudowy wraz z monta\u017Cem w lokalizacjach
        wskazanych na etapie realizacji, w zwi\u0105zku z konieczno\u015Bci\u0105
        wdro\u017Cenia systemu digitalizacji sieci ciep\u0142owniczej nale\u017C\u0105cej
        do PEC-Gliwice Sp. z o.o. w zakresie telemetrii kom\xF3r ciep\u0142owniczych.
        1.Roboty w obr\u0119bie obiekt\xF3w budowlanych b\u0119d\u0105 obejmowa\u0142y
        m.in.: -prace og\xF3lnobudowlane w zakresie przygotowania obiekt\xF3w (we
        wskazanych w PFU lokalizacjach \u2013 tabela nr 5 strona 22-24, wymiana p\u0142yt
        stropowych i w\u0142az\xF3w, nadbudowa \u015Bcian komory, renowacja \u015Bcian
        i posadzek, wymiana drabin z\u0142azowych oraz monta\u017C izolacji termicznej
        ruroci\u0105g\xF3w), -doposa\u017Cenie obiekt\xF3w (we wskazanych w PFU lokalizacjach\u2013
        tabela nr 5 strona 22-24) w instalacje o\u015Bwietleniow\u0105, -zabudow\u0119
        w 13 obiektach kompletnych system\xF3w dla telemetrii kom\xF3r ciep\u0142owniczych
        (szafy elektryczne, modu\u0142y transmisyjne, przetworniki i czujniki, urz\u0105dzenia
        do przylgowego pomiaru przep\u0142ywu) wraz z wymian\u0105 nap\u0119d\xF3w
        r\u0119cznych zasuw na elektryczne, -dostaw\u0119 7 kompletnych zestaw\xF3w
        dla telemetrii kom\xF3r ciep\u0142owniczych na terenie miasta Gliwice w obr\u0119bie
        czynnej sieci ciep\u0142owniczej, wraz z monta\u017Cem w lokalizacjach wskazanych
        na etapie realizacji (szafy elektryczne, modu\u0142y transmisyjne, czujniki,
        urz\u0105dzenia do przylgowego pomiaru parametr\xF3w), -integracj\u0119 telemetrii
        z dedykowanym systemu typu SCADA lub DCS (instalacja, oprogramowanie, wizualizacja
        na panelu, uruchomienie) -zainstalowanie oprogramowania dla telemetrii, -przetestowanie
        i uruchomienie telemetrii, -przeprowadzenie szkole\u0144 pracownik\xF3w, -udzielenie
        Zamawiaj\u0105cemu praw autorskich na zasadach opisanych Umow\u0105, -udzielenie
        gwarancji.\"]}, \"notice-type\": \"cn-standard\", \"publication-number\":
