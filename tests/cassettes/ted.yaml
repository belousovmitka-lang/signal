        {\"deu\": [\"Region Nord: Kreis Nordfriesland, Kreis Schleswig-Flensburg,
        Stadt Flensburg\", \"Region Mitte: Kreis Dithmarschen, Kreis Pl\xF6n, Kreis
        Rendsburg-Eckernf\xF6rde, Kreis Steinburg, Stadt Kiel, Stadt Neum\xFCnster\",
        \"Region S\xFCd: Kreis Ostholstein, Kreis Segeberg, Kreis Pinneberg, Kreis
        Stormarn, Kreis Herzogtum-Lauenburg, Stadt L\xFCbeck\", \"Gegenstand dieses
        Loses ist die Lieferung, Montage, Inbetriebnahme und Dokumentation von fest
        installierten Projektionsleinw\xE4nden f\xFCr R\xE4ume f\xFCr kommunale Sitzungen
        (Besprechungs-r\xE4ume, Sitzungss\xE4le oder \xE4hnliche) und Service. Die
        Leistungen umfassen insbesondere: \u2022 Aufma\xDF vor Ort \u2022 Lieferung
        der Leinw\xE4nde einschlie\xDFlich s\xE4mtlicher Befestigungsmaterialien \u2022
        Demontage und Entsorgung von Altleinw\xE4nden (im Einzelfall) \u2022 Montage
        und betriebsfertige Installation \u2022 elektrische Anbindung bei Motorsteuerung
        \u2022 Funktionspr\xFCfung \u2022 Einweisung des Auftraggebers (bei einziehbaren
        Leinw\xE4nden) \u2022 \xDCbergabe der Dokumentation \u2022 Entsorgung von
        Verpackungsmaterial Die Installation erfolgt in der Regel in Bestandsgeb\xE4uden
        w\xE4hrend des laufenden Betriebs. In Einzelf\xE4llen erfolgt die Installation
        im Rahmen einer Neugestaltung eines Sitzungs- oder Be-sprechungsraumes.\",
        \"Gegenstand dieses Loses ist die Lieferung von mobilen Projektleinw\xE4nden
        einschlie\xDFlich Transporttaschen f\xFCr den flexiblen Einsatz in kommunalen
        Sitzungs-, Besprechungs- und Veranstaltungsr\xE4umen. Die Leinw\xE4nde werden
        f\xFCr wechselnde Einsatzorte innerhalb kommunaler Liegenschaften verwendet
        und m\xFCssen von einer Person transportiert, aufgebaut und betrieben werden
        k\xF6nnen. Die Lieferung umfasst: \u2022 Mobile Projektionsleinwand \u2022
        Stand- bzw. Tragesystem \u2022 Transport- und Schutztasche \u2022 Bedienungsanleitung
        \u2022 Garantienachweise \u2022 Lieferung an den Erf\xFCllungsort\", \"Gegenstand
        dieses Loses ist die Lieferung eines vollst\xE4ndig integrierten, ultra-mobilen
        Medienwagens zur Durchf\xFChrung von: \u2022 Ratssitzungen \u2022 Ausschusssitzungen
        \u2022 Hybriden Gremiensitzungen \u2022 Hybriden B\xFCrgerversammlungen Die
        Bedienung erfolgt durch wechselnde Nutzende ohne besondere medientechnische
        Kenntnisse. Die L\xF6sung muss als kompakte All-in-one-Einheit ausgef\xFChrt
        sein und s\xE4mtliche Komponenten zur Bild-, Ton- und Sprach\xFCbertragung
        beinhalten.\", \"Gegenstand dieses Loses sind s\xE4mtliche Leistungen zur
        betriebsbereiten \xDCbergabe eines fest installierten Projektionssystems bestehend
        aus Deckenprojektor(en), Deckenhalterung(en), Signal\xFCbertragung, Steuerungstechnik,
        Verkabelung sowie s\xE4mtlichem f\xFCr den Betrieb erforderlichen Zubeh\xF6r
        einschlie\xDFlich Planung, Montage, Verkabelung, Konfiguration, Einweisung
        und Dokumentation sowie Service. Das System dient der Darstellung von Pr\xE4sentationen,
        Sitzungsunterlagen, Videokonferenzen, Livestreams und sonstigen medialen Inhalten
        in Rats-, Ausschuss-, Besprechungs- und Konferenzr\xE4umen.\", \"Gegenstand
        dieses Loses sind Lieferung, Einrichtung und betriebsbereite \xDCbergabe mobiler
        Projektionssysteme (Beamer) einschlie\xDFlich Transportzubeh\xF6r, Anschlusskabeln
        und aller f\xFCr den Betrieb erforderlichen Komponenten sowie Service. Die
        Ger\xE4te dienen der flexiblen Nutzung in Rats-, Ausschuss-, Besprechungs-,
        Schulungs- und Veranstaltungsr\xE4umen zur Darstellung von Pr\xE4sentationen,
        Sitzungsunterlagen, Videokonferenzen und multimedialen Inhalten. Die Projektoren
        m\xFCssen ohne feste Installation an unterschiedlichen Standorten innerhalb
        der Verwaltung einsetzbar sein.\", \"Gegenstand dieses Loses sind Lieferung,
        Montage, Inbetriebnahme und betriebsbereite \xDCbergabe interaktiver All-in-one
        Collaboration Boards mit integriertem Touchdisplay, Whiteboard-Funktion, Videokonferenztechnik,
        Lautsprechersystem, Mikrofonarray und Bildschirmfreigabe sowie Service. Die
        Systeme dienen der Durchf\xFChrung von Pr\xE4senz-, Hybrid- und Videokonferenzen
        sowie der gemeinsamen Bearbeitung von Dokumenten, Pr\xE4sentationen und Sitzungs-unterlagen.
        Der Auftragnehmer \xFCbernimmt Lieferung, Montage, Konfiguration, Inbetriebnahme,
        Dokumentation, Schulung und Support.\", \"Gegenstand dieses Loses sind Lieferung,
        Montage, Inbetriebnahme und Einmessung eines fest installierten Beschallungssystems
        f\xFCr die Sprach\xFCbertragung in Gremien-, Ausschuss- und Besprechungsr\xE4ume
        sowie Service. Das System dient der Unterst\xFCtzung von Pr\xE4senz-, Hybrid-
        und Videokonferenzen und ist f\xFCr einen dauerhaften Betrieb in kommunalen
        Sitzungsr\xE4umen ausgelegt. Der Auftragnehmer \xFCbernimmt s\xE4mtliche zur
        betriebsbereiten \xDCbergabe erforderlichen Leistungen einschlie\xDFlich Vor-Ort-Termin
        zur Bestandsaufnahme, Fachplanung, Verkabelung, Montage, Konfiguration, Dokumentation,
        Einweisung und Service.\", \"Gegenstand dieses Loses ist die Lieferung von
        mobilen Konferenzlautsprechern (Speakerphones/Soundbar) zur Nutzung in Sitzungs-,
        Besprechungs- und Gremienr\xE4umen sowie Service. Die Ger\xE4te dienen der
        Durchf\xFChrung von Pr\xE4senz-, Hybrid- und Videokonferenzen mit mehreren
        Teilnehmern und m\xFCssen mit g\xE4ngigen Konferenzplattformen kompatibel
        sein.\", \"Gegenstand dieses Loses sind Lieferung, Einrichtung, Inbetriebnahme
        und betriebsbereite \xDCbergabe eines drahtlosen digitalen Konferenzmikrofonsystems
        f\xFCr Rats-, Ausschuss-, Bei-rats- und Gremiensitzungen. Das System besteht
        aus Mitglieds- und Pr\xE4sidiumssprechstellen einschlie\xDFlich Schwanenhalsmikrofonen,
        integrierten Lautsprechern, Akkusystemen, Ladeinfrastruktur, Steuerungseinheit,
        Zubeh\xF6r sowie s\xE4mtlichen f\xFCr den Betrieb erforderlichen Komponenten.
        Das System muss f\xFCr Pr\xE4senzsitzungen, hybride Sitzungen, Livestreams,
        Aufzeichnungen sowie die Anbindung an Videokonferenzsysteme geeignet sein.
        Der Auftragnehmer \xFCbernimmt Planung, Lieferung, Konfiguration, Inbetriebnahme,
        Einweisung, Dokumentation und Service.\", \"Gegenstand dieses Loses sind Lieferung,
        Aufbau, Inbetriebnahme und betriebsbereite \xDCbergabe eines professionellen
        drahtlosen Handmikrofonsystems einschlie\xDFlich Mikrofonst\xE4ndern, Ladeeinrichtungen,
        Funkempf\xE4ngern, Zubeh\xF6r und aller zur Nutzung erforderlichen Komponenten.
        Das System dient der Sprach\xFCbertragung bei Rats-, Ausschuss-, Beirats-,
        Besprechungs- und Hybridveranstaltungen sowie \xF6ffentlichen Sitzungen. Der
        Auftragnehmer \xFCbernimmt s\xE4mtliche zur betriebsbereiten \xDCbergabe erforderlichen
        Leistungen einschlie\xDFlich Lieferung, Aufbau, Konfiguration, Frequenzplanung,
        Einmessung, Dokumentation und Einweisung sowie Service.\", \"Gegenstand dieses
        Loses sind Lieferung, Montage, Einrichtung, Inbetriebnahme und betriebs-bereite
        \xDCbergabe von professionellen PTZ-Raumkameras (Pan-Tilt-Zoom) zur Nutzung
        in Be-sprechungs-, Konferenz-, Ausschuss- und Ratss\xE4len. Die Kameras dienen
        der hochwertigen Videoerfassung von Sitzungen, Besprechungen, Videokonferenzen,
        Livestreams und hybriden Veranstaltungen. Der Auftragnehmer \xFCbernimmt s\xE4mtliche
        Leistungen einschlie\xDFlich Planung, Vor-Ort-Aufma\xDF, Lieferung, Montage,
        Verkabelung, Konfiguration, Inbetriebnahme, Dokumentation und Einweisung sowie
        Service.\", \"Gegenstand dieses Loses sind Lieferung, Einrichtung und betriebsbereite
        \xDCbergabe mobiler intelligenter Konferenzkamerasysteme f\xFCr Rats-, Ausschuss-,
        Besprechungs-, Schulungs- und Konferenzr\xE4ume sowie Service. Die Systeme
        m\xFCssen eine vollumf\xE4ngliche Audio- und Videoerfassung von Pr\xE4senzteilnehmenden
        erm\xF6glichen und f\xFCr hybride Sitzungen sowie Videokonferenzen geeignet
        sein. Die Systeme bestehen mindestens aus: \u2022 Kamerasystem \u2022 Mikrofonarray
        \u2022 Lautsprechersystem \u2022 Netzteil \u2022 Anschlusskabeln \u2022 Transportzubeh\xF6r
        (Transporttasche oder Transportkoffer) \u2022 erforderlicher Software\", \"Gegenstand
        dieses Loses sind Lieferung, Montage, Einrichtung, Inbetriebnahme und betriebs-bereite
        \xDCbergabe von frontalen Videokonferenzkamerasystemen (Videobars) f\xFCr
        Besprechungs-, Konferenz-, Ausschuss-, Schulungs- und Gremienr\xE4ume sowie
        Service. Die Systeme m\xFCssen Kamera, Mikrofonarray und Lautsprechersystem
        in einem Ger\xE4t integrieren und f\xFCr hybride Sitzungen, Videokonferenzen,
        digitale Zusammenarbeit und Pr\xE4sentationen geeignet sein. Die Systeme sind
        insbesondere f\xFCr die Montage an oder unter interaktiven Displays, Smartboards
        oder Gro\xDFbildschirmen vorgesehen. Der Auftragnehmer \xFCbernimmt Lieferung,
        Dokumentation und Support.\", \"Gegenstand dieses Loses sind Lieferung, Einrichtung
        und betriebsbereite \xDCbergabe von Zubeh\xF6rkomponenten f\xFCr die Medien-,
        Pr\xE4sentations- und Konferenztechnik sowie Service. Die Komponenten dienen
        der Signal\xFCbertragung, Anbindung mobiler Endger\xE4te, Erweiterung von
        Pr\xE4sentationssystemen sowie der Verwaltung mehrerer Signalquellen innerhalb
        von Besprechungs-, Schulungs-, Konferenz- und Gremienr\xE4umen. Der Auftragnehmer
        liefert s\xE4mtliche Zubeh\xF6rkomponenten einschlie\xDFlich notwendiger Adapter,
        Anschlussleitungen und Dokumentationen.\"]}, \"notice-type\": \"can-standard\",
