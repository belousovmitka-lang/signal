        agreement for the development and management of digital systems in Bankenes
        sikringsfond.\", \"ita\": \"Norvegia \u2013 Servizi informatici: consulenza,
        sviluppo di software, Internet e supporto \u2013 Framework agreement for the
        development and management of digital systems in Bankenes sikringsfond.\",
