        [\"POL\"]}, {\"description-lot\": {\"deu\": [\"Beschaffung einer browserbasierten
        und modernen Friedhofsmanagement-Software als On-Premise-L\xF6sung f\xFCr
        die Kunden der Komm.ONE/civillent GmbH, mit der das anfallende Tagesgesch\xE4ft
        im Friedhofswesen effizient und fehlerfrei erledigt werden kann und, dass
        die Verwaltung und Organisation aller friedhofsspezifischen Prozesse optimiert.
        Die angebotene L\xF6sung soll als Application Service Providing (ASP) beim
        Auftraggeber betrieben werden. Er stellt sie als Software as a Service (SaaS)
        zentral f\xFCr die eigenen Kunden in einer mandantenf\xE4higen Architektur
        bereit. Die Leistung beinhaltet au\xDFerdem dem 3rd-Level-Support und die
        Schulung der internen Anwenderbetreuung. Der Anbieter r\xE4umt der Komm.ONE
        das alleinige Vertriebsrecht f\xFCr Neukunden f\xFCr den Heimatmarkt in Baden-W\xFCrttemberg
        ein. Komm.ONE verfolgt eine duale Vertriebsstrategie: Das Produkt soll sowohl
        den eigenen Tr\xE4gern angeboten als auch \xFCber Genossenschaften, beispielsweise
        \\\"govdigital eG\\\" platziert werden k\xF6nnen. Die Leistung wird als Rahmenvereinbarung
        in einem Verhandlungsverfahren mit Teilnahmewettbewerb ausgeschrieben.\"]},
