        agreement for the development and management of digital systems in Bankenes
        sikringsfond.\", \"spa\": \"Noruega \u2013 Servicios TI: consultor\xEDa, desarrollo
        de software, Internet y apoyo \u2013 Framework agreement for the development
        and management of digital systems in Bankenes sikringsfond.\", \"est\": \"Norra
        \u2013 IT-teenused: n\xF5uande-, tarkvaraarendus-, Interneti- ja tugiteenused
        \u2013 Framework agreement for the development and management of digital systems
        in Bankenes sikringsfond.\", \"nld\": \"Noorwegen \u2013 IT-diensten: adviezen,
        softwareontwikkeling, internet en ondersteuning \u2013 Framework agreement
        for the development and management of digital systems in Bankenes sikringsfond.\",
        \"fin\": \"Norja \u2013 Tietotekniset palvelut: neuvonta, ohjelmistojen kehitt\xE4minen,
        Internet ja tuki \u2013 Framework agreement for the development and management
        of digital systems in Bankenes sikringsfond.\", \"pol\": \"Norwegia \u2013
        Us\u0142ugi informatyczne: konsultacyjne, opracowywania oprogramowania, internetowe
        i wsparcia \u2013 Framework agreement for the development and management of
        digital systems in Bankenes sikringsfond.\", \"hrv\": \"Norve\u0161ka \u2013
        Usluge informacijske tehnologije: savjetovanje, razvoj programske podr\u0161ke,
        internet i podr\u0161ka \u2013 Framework agreement for the development and
        management of digital systems in Bankenes sikringsfond.\", \"ces\": \"Norsko
        \u2013 Informa\u010Dn\xED technologie: poradenstv\xED, v\xFDvoj programov\xE9ho
        vybaven\xED, internet a podpora \u2013 Framework agreement for the development
        and management of digital systems in Bankenes sikringsfond.\", \"dan\": \"Norge
        \u2013 It-tjenester: r\xE5dgivning, programmeludvikling, internet og support
        \u2013 Framework agreement for the development and management of digital systems
        in Bankenes sikringsfond.\", \"ron\": \"Norvegia \u2013 Servicii IT: consultan\u0163\u0103,
        dezvoltare de software, internet \u015Fi asisten\u0163\u0103 \u2013 Framework
        agreement for the development and management of digital systems in Bankenes
        sikringsfond.\", \"por\": \"Noruega \u2013 Servi\xE7os de TI: consultoria,
        desenvolvimento de software, Internet e apoio \u2013 Framework agreement for
        the development and management of digital systems in Bankenes sikringsfond.\",
        \"slk\": \"N\xF3rsko \u2013 Slu\u017Eby informa\u010Dn\xFDch technol\xF3gi\xED:
        konzult\xE1cie, v\xFDvoj softv\xE9ru, internet a podpora \u2013 Framework
        agreement for the development and management of digital systems in Bankenes
        sikringsfond.\", \"fra\": \"Norv\xE8ge \u2013 Services de technologies de
        l'information, conseil, d\xE9veloppement de logiciels, internet et appui \u2013
        Framework agreement for the development and management of digital systems
        in Bankenes sikringsfond.\", \"mlt\": \"In-Norve\u0121ja \u2013 Servizzi ta'
        IT: konsulenza, \u017Cvilupp ta' softwer, Internet u appo\u0121\u0121 \u2013
        Framework agreement for the development and management of digital systems
        in Bankenes sikringsfond.\", \"deu\": \"Norwegen \u2013 IT-Dienste: Beratung,
        Software-Entwicklung, Internet und Hilfestellung \u2013 Framework agreement
        for the development and management of digital systems in Bankenes sikringsfond.\",
        \"lit\": \"Norvegija \u2013 IT paslaugos: konsultavimas, programin\u0117s
