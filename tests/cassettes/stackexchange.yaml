        \"CC BY-SA 4.0\", \"link\": \"https://law.stackexchange.com/questions/115689/is-cloning-functionality-of-a-software-exactly-as-is-without-adding-or-removing\",
        \"title\": \"Is cloning functionality of a software exactly as is, without
        adding or removing functionality compared to the original, a copyright violation?\",
        \"body\": \"<p>An example of this can be found on the audio and music production
        market, as an example, the Logic Pro DAW contains various built-in plugins.
        If these plugins' functionality is cloned with the same exact set of functionality
        and controls, but with original UI etc. is this a copyright violation? The
        same thing can be said if another DAW happens to have the same set of plugins
        found in Logic Pro, but with different names and UI. Some sources say that
        adding new functionality is essential.</p>\\n\"}, {\"tags\": [\"patents\"],
