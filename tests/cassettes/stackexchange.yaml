        115698, \"answer_count\": 1, \"score\": 13, \"last_activity_date\": 1791359188,
        \"creation_date\": 1791276868, \"last_edit_date\": 1791296039, \"question_id\":
        115697, \"content_license\": \"CC BY-SA 4.0\", \"link\": \"https://law.stackexchange.com/questions/115697/what-next-in-a-failed-execution\",
        \"title\": \"What next in a failed execution?\", \"body\": \"<p>What is the
        status of Christa Pike, who at this moment is in a hospital after \u201Csurviving
        \u201C an execution attempt by the State of Tennessee?</p>\\n<ol>\\n<li>Assuming
        she recovers, may the State try again? Or is the sentence deemed to have been
        carried out?</li>\\n<li>If she remains unconscious, is there a limit to how
        long she is hospitalized?</li>\\n<li>If she is left with a permanent disability
        as a result of the execution attempt, would the State have some liability?</li>\\n</ol>\\n\"},
