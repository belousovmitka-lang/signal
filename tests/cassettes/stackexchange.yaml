        \"closed_reason\": \"Not suitable for this site\", \"title\": \"Gated network
        communication in regards to 101 abstract idea\", \"body\": \"<p><a href=\\\"https://patents.google.com/patent/US12015615B2/en?oq=US-12015615-B2\\\"
        rel=\\\"nofollow noreferrer\\\">https://patents.google.com/patent/US12015615B2/en?oq=US-12015615-B2</a></p>\\n<p>Regarding
        the patent above, it is clearly directed to an abstract idea of managing human
        interactions and communications.</p>\\n<p>Yet it is allowed. This must mean
        that it clears Step 2A Prong Two (integrated into a practical application)
        or Step 2B (non-conventional inventive step).</p>\\n<p>My guess is that it
        cleared Step 2A Pron Two.</p>\\n<p>The only conceivable additional element
        that is non-generic is this:</p>\\n<p><code>enabling network communication
        between the first individual and the second individual in response to the
        match.</code></p>\\n<p>Questions:</p>\\n<ol>\\n<li>Do you agree that enabling
        network communications in response to some rule is what got it to clear the
        101 rejection?</li>\\n<li>If so, why? Is there precedent in how courts rule
        on gated network communications?</li>\\n<li>Does it need the &quot;in response
        to something&quot; trigger?</li>\\n<li>What if it just recites <code>enabling
        network communication between the first individual and the second individual</code>?</li>\\n</ol>\\n<p>In
        plain English, two electronic devices communicating over a network definitely
        sounds like a &quot;practical application&quot; to me. But if you leave out
        the &quot;in response to the abstract idea&quot;, would it be a practical
        application but not integrated with the abstract idea?</p>\\n\"}, {\"tags\":
