        "title": "Why is the content of a &lt;style&gt; element emptied (WebI)?",
        "body": "<p>In SAP BusinessObjects BI Platform 2025 (Web Intelligence), I
        use a cell with &quot;Read contents as&quot; set to <strong>HTML</strong>.
        The server only renders HTML elements that are on an allow list of permitted
        elements. I added <code>style</code> to that list, but the content of the
        <code>&lt;style&gt;</code> element is stripped.</p>\n<p><strong>Minimal reproduction</strong></p>\n<ol>\n<li><p>In
        a Web Intelligence report, create a blank cell and set &quot;Read contents
        as&quot; to <strong>HTML</strong>.</p>\n</li>\n<li><p>Set the cell''s formula/content
        to:</p>\n</li>\n</ol>\n<p>html</p>\n<pre><code>&lt;style&gt;\n  a.export {
        background-color: #346187; color: #fff; padding: 5px; }\n  a.export:hover
        { background-color: #ddd; color: #346187; }\n&lt;/style&gt;\n&lt;a class=&quot;export&quot;&gt;Test&lt;/a&gt;\n</code></pre>\n<ol
        start=\"3\">\n<li>Add <code>style</code> to the allowed HTML elements list,
        then reopen the report.</li>\n</ol>\n<p><strong>Expected:</strong> the CSS
        rules are applied to the link.</p>\n<p><strong>Actual:</strong> a <code>&lt;style&gt;</code>
        element is present in the DOM (visible in the browser dev tools), but it is
        completely empty, so none of the rules reach the browser.</p>\n<p><strong>What
        I tested</strong></p>\n<p>Allowed elementsResult in DOMstyle allowed&lt;style&gt;
        exists, content emptyscript also allowed&lt;script&gt; exists, content preservedscript
        removed again&lt;script&gt; disappears entirely</p>\n<p>So <code>&lt;style&gt;</code>
        behaves differently from both states: the element survives, but its text content
        is removed.</p>\n<p><strong>Why not inline styles or JavaScript?</strong></p>\n<ul>\n<li><p>Inline
        <code>style</code> attributes can''t express <code>:hover</code>, pseudo-elements,
        or shared rules across several buttons.</p>\n</li>\n<li><p>I could apply the
        styling through JavaScript, but that means permanently allowing <code>&lt;script&gt;</code>,
        which I (and the SecDep) would like to avoid for security reasons (XSS/HTML
        injection).</p>\n</li>\n</ul>\n<p><strong>Question</strong></p>\n<p>What controls
        whether the text content of a <code>&lt;style&gt;</code> element is kept in
        a Web Intelligence HTML cell? Is there a separate sanitizer or setting (CMC,
        Web Intelligence Processing Server properties, or a config file) besides the
        allowed HTML elements list? And is there a supported way to allow <code>&lt;style&gt;</code>
        content?</p>\n"}, {"tags": ["c#", "dependency-injection", "interface"], "owner":
