        "title": "How to make use of Rust functions/structs in rust/bindings/bindings_generated.rs?",
        "body": "<p>I am working on a Rust LKM. My kernel is Rust enabled and the
        Rust tool-chain is in working order. There are functions and structs from
        the <code>net</code> framework that I need to make use of in <em>rust/bindings/bindings_generated.rs</em>
        of the kernel sources on my machine.</p>\n<p>Though, if I change directory
        into <em>rust/kernel</em> and recursively grep for the function or struct,
        it''s not in use anywhere. So my understanding is, these functions are not
        available in crate kernel. And of course if I look in crate kernel, I do not
        see them listed.</p>\n<p>My question is, how can I start making use of (including)
        these functions or struct''s that appear to exist in the bindings file for
        my LKM?</p>\n"}, {"tags": ["bixby"], "owner": {"account_id": 25708503, "reputation":
