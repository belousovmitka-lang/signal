        "CC BY-SA 4.0", "link": "https://softwarerecs.stackexchange.com/questions/95670/is-there-an-android-shell-program-to-switch-to-any-open-application-according-to",
        "title": "Is there an Android shell program to switch to any open application
        according to some criteria?", "body": "<p>I''d like to get recommended an
        Android program to switch to any open\napplication window according to a set
        of criteria.</p>\n<p>For example I''d like to be able to type</p>\n<pre><code>window-select
        \\\n  &quot;throw google out of the window&quot;\n</code></pre>\n<p>or more
        like</p>\n<pre><code>wm \\\n  focus \\\n    &quot;throw google out of the
        window&quot;\n</code></pre>\n<p>to bring to focus the last focused browser
        window opened\non any webpage whose browser window title contains the text\n<em>throw
        google out of the window</em>.</p>\n<p>I am aware Google puts its <code>wm</code>
        window manager command,\nwhich of course has no <code>focus</code> sub-command,\nin
        <code>/system/bin/wm</code>, so I suppose a proper <code>wm</code>\nprogram
        to be placed in\n<code>/data/data/why-on-hell/bin/wm</code> or <em>GASP</em>
        in\n<code>/usr/bin/wm</code> could very\nmuch be appropriate as an answer
        to this question.</p>\n"}, {"tags": ["android", "android-app", "window-manager"],
        "owner": {"account_id": 2932158, "reputation": 157, "user_id": 107803, "user_type":
