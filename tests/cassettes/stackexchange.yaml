        \"https://law.stackexchange.com/questions/115700/what-is-the-legal-threshold-for-switching-from-execution-to-life-saving-medical\",
        \"title\": \"What is the legal threshold for switching from execution to life
        saving medical intervention?\", \"body\": \"<p>In the recent case of Christa
        Pike a &quot;botched&quot; execution turned into an emergency life saving
        exercise.  The result was that she was placed on a mechanical ventilator to
        sustain her life.</p>\\n<p>It would be one thing if she was able to survive
        and keep breathing on her own, but it seems rather odd that the state that
        fully intended to end her life would instead suddenly go to extraordinary
        lengths to extend it by artificial means.</p>\\n<p>Obviously the drugs did
        not have the immediate intended effect, (<em>presumably by meeting the criteria
        of stopping her heart...</em>) but it seems that if she was unconscious and
        had stopped breathing the net result would have been a successful execution,
        albeit with a short unplanned process delay while waiting for the heart to
        stop next.</p>\\n<p>Is there a legal standard that describes specifically
        <strong>at which point the state must switch</strong> from ending a life to
        attempting to revive the &quot;patient&quot; they intended to kill mere moments
        before?</p>\\n\"}, {\"tags\": [\"capital-punishment\", \"tennessee\"], \"owner\":
        {\"account_id\": 3083041, \"reputation\": 1954, \"user_id\": 34620, \"user_type\":
