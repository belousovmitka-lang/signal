        95668, "content_license": "CC BY-SA 4.0", "link": "https://softwarerecs.stackexchange.com/questions/95668/is-there-an-android-shell-program-which-returns-open-windows-titles-in-last-focu",
        "title": "Is there an Android shell program which returns open windows titles
        in last focus sorting?", "body": "<p>On all popular operating systems are
        available system programs\nwhich return open windows titles sorted by some
        criteria.</p>\n<p>In the last 20 years or so though I''ve never seen or heard\nabout
        one for Android, so I was wondering if it existed at all.</p>\n"}, {"tags":
