        "title": "Bixby Home Studio: voice intent list is empty and /intent/params
        returns 500", "body": "<p><strong>Clarification:</strong> The failing interface
        is Samsung''s hosted Bixby Home Studio web editor, not a page or HTTP client
        implemented by me. The URL below is requested by that editor when I open its
        intent selector. I do not have the source code for this editor or its <code>/intent/params</code>
        backend. I am asking about configuring this developer tool for a SmartThings
        Schema integration.</p>\n<p>I''m trying to set up an action flow for a SmartThings
        Schema device in <a href=\"https://bhs.bixbydevelopers.com/\" rel=\"nofollow
        noreferrer\">Bixby Home Studio</a>. I can sign in and see my SmartThings devices,
        but I get stuck when choosing a voice intent.</p>\n<p>The UI steps are:</p>\n<ol>\n<li>Open
        <code>https://bhs.bixbydevelopers.com/</code> and sign in with the Samsung
        account that owns the connected SmartThings device.</li>\n<li>Let the SmartThings
        location/device list load, then select the location/device.</li>\n<li>Start
        creating a project/action flow <strong>from scratch</strong>.</li>\n<li>Open
        the Bixby Voice Category / voice intent selector.</li>\n</ol>\n<p>Expected:
        a list of categories/intents to choose from. Actual: an empty list and the
        following failed request from the hosted editor:</p>\n<pre><code>https://bhs.bixbydevelopers.com/intent/params?locale=en-US&amp;visibility=DEVICE&amp;offset=0&amp;limit=100\n</code></pre>\n<p>The
        error shown in the log is:</p>\n<pre><code>Failed to load intent\nHttp failure
        response for https://bhs.bixbydevelopers.com/intent/params?locale=en-US&amp;visibility=DEVICE&amp;offset=0&amp;limit=100:
        500 OK\nPlease contact Bixby Home Studio Team if you face this issue continually\n</code></pre>\n<p>The
        device lookup still succeeds:</p>\n<pre><code>smartthings location / devices
        fetched successfully [PRD]\n</code></pre>\n<p>I''ve tried en-US and ko-KR,
        Chrome and an embedded browser on Windows, reloading, and signing out and
        back in. I get the same result. The last reproduction I recorded was October
        2, 2026, at 08:19 KST. I haven''t tested with another account.</p>\n<p>This
        fails during setup, before I run any device command. Creating a flow from
        capabilities gives me switch on/off/status, but I can''t use the from-scratch
        intent selection described in the <a href=\"https://bixbydevelopers.com/dev/docs/bhs-dev-guide/developers/using-bhs\"
        rel=\"nofollow noreferrer\">guide</a>.</p>\n<p>Does loading this list require
        an extra account permission or Schema setting? If so, where can I check it?
        If there isn''t an extra requirement, is there another way to select the intent
        while this request is failing?</p>\n"}, {"tags": ["javascript", "audio", "applescript",
