        \"question_id\": 115669, \"content_license\": \"CC BY-SA 4.0\", \"link\":
        \"https://law.stackexchange.com/questions/115669/are-screen-resolutions-and-sizes-copyrightable-or-patentable\",
        \"title\": \"Are screen resolutions and sizes copyrightable or patentable?\",
        \"body\": \"<p>Are screen resolutions and sizes copyrightable or patentable?</p>\\n<p>As
        an example, the 11-inch iPad Pro models have an 11-inch screen and a screen
        resolution of 2360 x 1640 pixels, while the 12.9-inch models have a screen
        resolution of 2732 x 2048 pixels. Can a competing mobile device manufacturer
        use these resolutions, with or without the same screen size?</p>\\n\"}, {\"tags\":
        [\"united-states\", \"us-constitution\", \"third-amendment\"], \"owner\":
        {\"account_id\": 10284051, \"reputation\": 1144, \"user_id\": 12499, \"user_type\":
        \"registered\", \"profile_image\": \"redacted\", \"display_name\": \"redacted\",
        \"link\": \"redacted\"}, \"is_answered\": true, \"view_count\": 2409, \"answer_count\":
        2, \"score\": 16, \"last_activity_date\": 1790964124, \"creation_date\": 1790727012,
        \"question_id\": 115667, \"content_license\": \"CC BY-SA 4.0\", \"link\":
        \"https://law.stackexchange.com/questions/115667/can-the-government-quarter-troops-in-your-yard-without-your-permission\",
        \"title\": \"Can the government quarter troops in your yard without your permission?\",
        \"body\": \"<p>The <a href=\\\"https://en.wikipedia.org/wiki/Third_Amendment_to_the_United_States_Constitution\\\"
        rel=\\\"noreferrer\\\">Third Amendment to the Constitution of the United States</a>
        reads, in full:</p>\\n<blockquote>\\n<p>No Soldier shall, in time of peace
        be quartered in any <strong>house</strong>, without the consent of the Owner,
        nor in time of war, but in a manner to be prescribed by law. <em>[Emphasis
        added.]</em></p>\\n</blockquote>\\n<p>On the one hand, the Amendment specifically
        mentions <em>houses</em> (and, more specifically, houses <em>with owners</em>).
        \ On the other hand, the grievances James Madison et al. had in mind when
        they wrote it involved the quartering of British troops in barns, outbuildings,
        and vacant residences, rather than owned houses, and it would, thus, be a
        rather odd oversight if the Third Amendment left the government a free hand
        to quarter troops anywhere that isn't a house with an owner; and the word
        &quot;house&quot; in law often actually refers to the whole property, not
        just the physical house building itself.</p>\\n<p>So, does the Third Amendment
        apply only to your physical house building?  Or can the government require
        you to let troops be quartered in tents in your yard, as long as they don't
        go in your house?</p>\\n\"}, {\"tags\": [\"copyright\", \"contract-law\"],
        \"owner\": {\"account_id\": 47138903, \"reputation\": 3, \"user_id\": 106407,
        \"user_type\": \"registered\", \"profile_image\": \"redacted\", \"display_name\":
        \"redacted\", \"link\": \"redacted\"}, \"is_answered\": true, \"view_count\":
        235, \"answer_count\": 4, \"score\": -4, \"last_activity_date\": 1790825474,
        \"creation_date\": 1790618113, \"last_edit_date\": 1790825474, \"question_id\":
        115656, \"content_license\": \"CC BY-SA 4.0\", \"link\": \"https://law.stackexchange.com/questions/115656/copyright-of-final-draft\",
        \"title\": \"Copyright of Final Draft\", \"body\": \"<p>If an author contains
        a final draft where all current contains were created with personal equipment
        and personal time but deleted contents were not (author still has copy of
        deleted contents just not in the final draft) basically author has copy of
        previous work , deleted work, and final work.\\nIf contract says something
        \u2018copyright is transferred if made with company time and company equipment\u2019
        does that only pertain to the deleted content or does it somehow affect the
        final/precious content?</p>\\n<p>Previous content means content made before
        employment.</p>\\n<p>Deleted content means content that was made during company
        time but got deleted.</p>\\n<p>Final content means content that does not include
        deleted content but still includes some or most  elements of previous content.</p>\\n<p>the
        similarities between each content is main characters or something like one
        character being only mentioned in previous version but having different versions
        of first speaking line appearances in deleted and final content.</p>\\n<p>Location:
        Texas</p>\\n\"}], \"has_more\": true, \"quota_max\": 300, \"quota_remaining\":
        237}"
