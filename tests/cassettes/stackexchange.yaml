        {"tags": ["advice", "c++", "datetime", "licensing"], "owner": {"account_id":
        20649409, "reputation": 196, "user_id": 15160086, "user_type": "registered",
        "profile_image": "redacted", "display_name": "redacted", "link": "redacted"},
        "is_answered": false, "view_count": 157, "answer_count": 1, "score": -4, "last_activity_date":
        1791555439, "creation_date": 1791383826, "last_edit_date": 1791555439, "question_id":
        80008492, "content_license": "CC BY-SA 4.0", "link": "https://stackoverflow.com/questions/80008492/can-a-c-desktop-application-reliably-detect-system-clock-rollback-without-a-tr",
        "title": "Can a C++ desktop application reliably detect system clock rollback
        without a trusted external time source?", "body": "<p>I have a C++ desktop
        application with a simple expiry-date license check based on the local system
        clock.</p>\n<p>The application is normally used with an external device/modem,
        but I cannot rely on that device as a time source: the tool may legitimately
        be used while the device is disconnected, malfunctioning, not yet initialized,
        or replaced by a simulator. Requiring permanent Internet access is also undesirable
        because the tool may need to operate offline during testing.</p>\n<p>At startup
        I currently do something like:</p>\n<pre class=\"lang-cpp prettyprint-override\"><code>bool
        LicenseManager::IsDateValid()\n{\n    return wxDateTime::Now() &lt;= GetExpiryDate();\n}\n</code></pre>\n<p>I
        understand that this is not specific to wxWidgets: the issue is that the local
        wall clock is controlled by the machine running the application.</p>\n<p>I
        considered persisting the maximum timestamp previously observed by the application.
        This would allow detection of some rollbacks:</p>\n<pre class=\"lang-none
        prettyprint-override\"><code>stored maximum:       2027-01-10\ncurrent system
        time:  2026-12-01\n</code></pre>\n<p>However, this does not prove that the
        current clock is correct. For example, if the stored maximum were <code>2026-11-01</code>,
        setting the clock to <code>2026-12-01</code> would still pass the local check
        even if the real date were in 2027.</p>\n<p>There is also no local baseline
        on the first run.</p>\n<p>Am I correct that, without a trusted external time
        source, an application cannot reliably determine that the system wall clock
        has been manipulated?</p>\n<p>If that is the case, is persisting the maximum
        observed timestamp only useful as a heuristic for detecting obvious rollback,
        while stronger expiry validation requires an authenticated external time source?</p>\n"},
