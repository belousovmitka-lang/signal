        \"title\": \"Is the handpan&#39;s basic structure copyrighted?\", \"body\":
        \"<p>I heard that the basic structure of the Handpan (a musical instrument
        based on the Hang, manufactured in the 2000s and early 2010s) has been copyright-claimed
        by the creators of the Hang, and there were multiple cases where instruments
        have been seized, including a case in the Netherlands. Is this true?</p>\\n\"},
        {\"tags\": [\"england-and-wales\"], \"owner\": {\"account_id\": 1225542, \"reputation\":
        385, \"user_id\": 16021, \"user_type\": \"registered\", \"profile_image\":
        \"redacted\", \"display_name\": \"redacted\", \"link\": \"redacted\"}, \"is_answered\":
        true, \"view_count\": 1111, \"accepted_answer_id\": 115688, \"answer_count\":
        3, \"score\": 5, \"last_activity_date\": 1791054063, \"creation_date\": 1790867654,
        \"last_edit_date\": 1790951102, \"question_id\": 115676, \"content_license\":
        \"CC BY-SA 4.0\", \"link\": \"https://law.stackexchange.com/questions/115676/are-there-any-other-obstacles-to-registering-a-company-in-someone-elses-name\",
        \"title\": \"Are there any other obstacles to registering a company in someone
        else&#39;s name?\", \"body\": \"<p>A few years ago footballer Achraf Hakimi
        made headlines because his wife of 5 years wanted 50% of his estimated $40
        million fortune, and this was refused by the Spanish courts because he had
        registered the majority of his assets in his mother's name, giving him on
        paper a lower net worth than hers. <a href=\\\"https://www.acumenlaw.co.uk/news/before-you-all-go-and-do-a-hakimi\\\"
        rel=\\\"noreferrer\\\">This UK law company</a> does a good job of summarising
        the case and the disadvantages. Namely, these are:</p>\\n<ul>\\n<li>That most
        of those assets would be given to his siblings if they were named in his mother's
        will</li>\\n<li>That his mother might turn against him, be financially irresponsible,
        manipulated, scammed, hacked, etc.</li>\\n<li>That any assets &quot;deliberately&quot;
        transferred to his mother within three years of the divorce filing are still
        likely to be considered his</li>\\n</ul>\\n<p>Let's hypothetically assume
        that none of these apply to me: I fully trust my mother now and forever, am
        named as her sole beneficiary, and I want to set up a limited company with
        her as the sole director. What other obstacles or risks would there be to
        setting a company up in this way?</p>\\n<p>Primarily looking for <a href=\\\"/questions/tagged/england-and-wales\\\"
        class=\\\"s-tag post-tag\\\" title=\\\"show questions tagged &#39;england-and-wales&#39;\\\"
        aria-label=\\\"show questions tagged &#39;england-and-wales&#39;\\\" rel=\\\"tag\\\"
        aria-describedby=\\\"tag-england-and-wales-tooltip-container\\\" data-tag-menu-origin=\\\"Unknown\\\">england-and-wales</a>
        but also interested in other jurisdictions.</p>\\n\"}, {\"tags\": [\"united-states\",
        \"texas\", \"bankruptcy\"], \"owner\": {\"account_id\": 16044632, \"reputation\":
        3240, \"user_id\": 41285, \"user_type\": \"registered\", \"profile_image\":
        \"redacted\", \"display_name\": \"redacted\", \"link\": \"redacted\"}, \"is_answered\":
        true, \"view_count\": 635, \"accepted_answer_id\": 115675, \"answer_count\":
        1, \"score\": 7, \"last_activity_date\": 1791405479, \"creation_date\": 1790865949,
        \"last_edit_date\": 1791405479, \"question_id\": 115674, \"content_license\":
        \"CC BY-SA 4.0\", \"link\": \"https://law.stackexchange.com/questions/115674/bankruptcy-vs-partially-owned-assets\",
        \"title\": \"Bankruptcy vs. partially-owned assets\", \"body\": \"<p>An individual
        (let's call him &quot;John Schmidt&quot;) files for bankruptcy. He owns a
        champion show dog. As is common in the dog showing world, he is technically
        only a part-owner of the dog. In this case, the dog's breeder retains a 50%
        stake, and the dog was sold to John under the condition that it cannot be
        sold or re-homed without the breeder's explicit written permission.</p>\\n<p>Assuming
        that his other assets are insufficient to cover the debt, what happens to
        the dog?</p>\\n<p>(Yes, I am aware of <a href=\\\"https://law.stackexchange.com/q/100953/41285\\\">a
        similar question</a>; it only considers the no-resale clause.)</p>\\n\"},
        {\"tags\": [\"copyright\", \"patents\"], \"owner\": {\"account_id\": 31972705,
