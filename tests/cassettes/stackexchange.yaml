        "is_answered": false, "view_count": 9, "answer_count": 0, "score": 1, "last_activity_date":
        1791277244, "creation_date": 1791277244, "question_id": 95656, "content_license":
        "CC BY-SA 4.0", "link": "https://softwarerecs.stackexchange.com/questions/95656/tool-or-service-that-tracks-deprecations-and-breaking-changes-per-library-versio",
        "title": "Tool or service that tracks deprecations and breaking changes per
        library version, with an API or feed", "body": "<p>I need a tool or service
        that tells me, for a given library and version, whether it has been\ndeprecated
        or whether newer releases contain breaking changes, before I upgrade.</p>\n<p>Requirements:</p>\n<ul>\n<li>Ecosystems:
        npm and Maven/Gradle (Android) at least; CocoaPods and Swift Package Manager
        would be a big plus</li>\n<li>Reports deprecations (with dates when available)
        and breaking changes, not only new versions</li>\n<li>Machine-readable access:
        REST API, RSS/Atom feed or downloadable data</li>\n<li>Free or open source
        preferred; a self-hostable tool is fine</li>\n<li>Works from a list of dependencies
        (e.g. an SBOM or package.json), without uploading source code</li>\n</ul>\n<p>What
        I already tried:</p>\n<ul>\n<li>Dependabot / Renovate: they open update PRs,
        but don''t say what breaks before upgrading</li>\n<li>OSV and deps.dev: great
        for vulnerabilities and the npm &quot;deprecated&quot; flag, but no breaking
        changes</li>\n<li>GitHub releases.atom: works, but it''s free text per repository,
        not structured</li>\n<li>ChangeRadar: covers developer platforms and AI tools,
        not libraries</li>\n</ul>\n<p>Is there anything that covers this, even partially?</p>\n"},
