      string: "WEBVTT\n\n00:00:00.300 --> 00:00:01.524\n<v SPEAKER_00>Hey, Travis
        Albritton here.\n\n00:00:01.564 --> 00:00:11.505\n<v SPEAKER_00>So I hope
        these episodes have been super helpful for you getting your show off the ground
        and having the confidence that you need to really launch a podcast, which
        is such an incredible thing.\n\n00:00:11.544 --> 00:00:30.881\n<v SPEAKER_00>Now,
        I recently had the opportunity to sit down for a conversation with Eric Newsom,
        who has been an executive producer on some of the biggest podcasts in the
        world, many of NPR's podcasts, Ted's podcasts, and just brings a lot of insight
        and depth of wisdom to podcasting.\n\n00:00:30.920 --> 00:00:35.088\n<v SPEAKER_00>And
        so I wanted to share this with you as kind of like a podcasting 201.\n\n00:00:35.607
        --> 00:00:45.685\n<v SPEAKER_00>This interview is what to do once you have
        your show going and you really want to see what's the next step, what's the
        next level that I can get to with my podcast.\n\n00:00:45.965 --> 00:00:49.773\n<v
        SPEAKER_00>He just wrote a brand new book on podcasting called Make Noise.\n\n00:00:50.213
        --> 00:00:52.579\n<v SPEAKER_00>I will leave a link to the book in the episode
        description.\n\n00:00:52.618 --> 00:00:53.820\n<v SPEAKER_00>It's a fantastic
        book.\n\n00:00:54.182 --> 00:00:58.210\n<v SPEAKER_00>So I hope that this
        conversation is helpful for you and that you get a lot out of it.\n\n00:00:58.691
        --> 00:01:01.597\n<v SPEAKER_00>And without further ado, here's my conversation
        with Eric Newsom.\n\n00:01:05.471 --> 00:01:14.826\n<v SPEAKER_01>So my name
        is Eric Newsom, and I spent most of the early part of my career in broadcast
        and eventually worked my way up to working at NPR.\n\n00:01:14.867 --> 00:01:28.808\n<v
        SPEAKER_01>And I started there in 2004, and less than a year later, I was
        in the cafeteria line at NPR, and the guy who was our COO at the time was
        behind me trying to make some kind of awkward chitchat.\n\n00:01:29.349 -->
        00:01:31.332\n<v SPEAKER_01>He says, well, what's interesting that you've
        seen lately?\n\n00:01:31.393 --> 00:01:33.295\n<v SPEAKER_01>And I said, well,
        there's this podcasting thing.\n\n00:01:33.334 --> 00:01:36.819\n<v SPEAKER_01>And
        I started explaining to him in the lunch line, just to kind of make conversation.\n\n00:01:36.859
        --> 00:01:40.965\n<v SPEAKER_01>He's like, oh, come by and give me a little
        spiel on it.\n\n00:01:41.025 --> 00:01:44.049\n<v SPEAKER_01>And so I came,
        I made an appointment, went and gave him a spiel.\n\n00:01:44.069 --> 00:01:50.938\n<v
        SPEAKER_01>A couple of weeks later, he shows back up at my door and says,
        you have a team of eight and you have 12 weeks.\n\n00:01:51.439 --> 00:01:54.265\n<v
        SPEAKER_01>And at the end of that 12 weeks, we want there to be NPR podcasts.\n\n00:01:54.965
        --> 00:01:55.706\n<v SPEAKER_01>I'm like, okay.\n\n00:01:55.867 --> 00:01:57.269\n<v
        SPEAKER_01>And we actually delivered it a month.\n\n00:01:57.290 --> 00:01:58.070\n<v
        SPEAKER_01>We got an extra month.\n\n00:01:58.912 --> 00:01:59.492\n<v SPEAKER_01>We
        delivered it.\n\n00:01:59.533 --> 00:02:00.894\n<v SPEAKER_01>It was 32 podcasts.\n\n00:02:01.135
        --> 00:02:06.745\n<v SPEAKER_01>And then for the following decade, I kind
        of remained kind of the editorial lead on NPR podcasts, both podcasts.\n\n00:02:06.745
        --> 00:02:16.459\n<v SPEAKER_01>figuring out how to take NPR programming and
        have it thrive in the podcast world, sound authentic there, and also making
        new things that were intended originally to be in that space.\n\n00:02:17.139
        --> 00:02:18.722\n<v SPEAKER_01>And did that for a decade.\n\n00:02:18.923
        --> 00:02:32.382\n<v SPEAKER_01>And then a couple of years ago, probably four
        and a half years or so ago, I left NPR and went to Audible, which is part
        of the Amazon extended universe, and created the original content team there.\n\n00:02:32.802
        --> 00:02:45.401\n<v SPEAKER_01>And Then about a year or so ago, one of my
        friends and I left and started Magnificent Noise, which is a podcast production
        and consultation company based in New York.\n\n00:02:45.962 --> 00:02:51.152\n<v
        SPEAKER_00>And so now you have your first podcast-related book, Make Noise.\n\n00:02:51.334
        --> 00:02:51.493\n<v SPEAKER_00>Yeah.\n\n00:02:51.854 --> 00:03:03.457\n<v
        SPEAKER_00>And as I was going through and reading it, and specifically one
        of the things that you harp on, which we'll dive into about the 10-word description,
        I was like, let me go back to the front cover and see if he...\n\n00:03:04.019
        --> 00:03:05.760\n<v SPEAKER_00>followed his own rules, and you did.\n\n00:03:06.342
        --> 00:03:10.627\n<v SPEAKER_00>You even got an extra word to spare, A Creator's
        Guide to Podcasting and Great Audio Storytelling.\n\n00:03:11.788 --> 00:03:16.754\n<v
        SPEAKER_00>So why did you feel like now was the time to publish this book?\n\n00:03:17.395
        --> 00:03:23.022\n<v SPEAKER_00>You've been in podcasting basically since
        the beginning, longer than just about anyone listening to this episode.\n\n00:03:23.905
        --> 00:03:29.771\n<v SPEAKER_00>So why did you feel like now was a really
        good time to bring this book out into the world and to promote\n\n00:03:30.473
        --> 00:03:30.513\n<v UNKNOWN>it?\n\n00:03:30.513 --> 00:03:33.635\n<v SPEAKER_01>That's
        a really good question because I think there's two factors.\n\n00:03:33.675
        --> 00:03:51.391\n<v SPEAKER_01>One, I think we are now at the point where
        there is such a groundswell of interest in podcasting that having a book about
        podcast creation that isn't like tips for equipment to buy or how to make
        money at it but is really focused on how to do something well, that's a commercially
        viable product now.\n\n00:03:51.692 --> 00:03:57.157\n<v SPEAKER_01>And I
        don't think even a couple years ago it was when I've been approached a couple
        times about doing this over the years.\n\n00:03:57.296 --> 00:03:59.699\n<v
        SPEAKER_01>And I'm like, I just don't think it's\u2013 I think it's a niche
        product.\n\n00:03:59.799 --> 00:04:02.844\n<v SPEAKER_01>I don't think it's\u2013
        It's going to be worth my time to spend time writing that book.\n\n00:04:03.586
        --> 00:04:09.719\n<v SPEAKER_01>And the last time I was asked about it, I
        said yes and was kind of shocked at the reaction.\n\n00:04:09.819 --> 00:04:15.953\n<v
        SPEAKER_01>And one of the great things about seeing podcasting evolve is watching
        at points like this.\n\n00:04:16.514 --> 00:04:32.053\n<v SPEAKER_01>that
        this is a profession and a vocation and a hobby, and there are tools for it,
        both a book or microphones or recording units or things that were literally
        unimaginable four or five years ago.\n\n00:04:32.074 --> 00:04:45.151\n<v
        SPEAKER_01>Now, I'm a big fan of the Rodecaster Pro, which is a little desktop
        unit that I advocate a lot of podcasters buy because it's$600, containing
        technology that would have cost you$10,000,$15,000 to duplicate forever.\n\n00:04:45.151
        --> 00:04:46.394\n<v SPEAKER_01>Four or five years ago.\n\n00:04:46.413 -->
        00:04:48.338\n<v SPEAKER_01>I mean, that to me is exciting and amazing.\n\n00:04:48.398
        --> 00:04:57.499\n<v SPEAKER_01>So first, I think we've kind of matured into
        being an industry now that can support that kind of thinking and a product
        like a book.\n\n00:04:57.699 --> 00:04:59.524\n<v SPEAKER_01>And the second
        reason is...\n\n00:05:01.047 --> 00:05:03.151\n<v SPEAKER_01>There's so many
        new podcasts.\n\n00:05:03.452 --> 00:05:17.365\n<v SPEAKER_01>And the thing
        that surprises me as someone who is a consultant for a lot of people, individuals,
        and I work with people who are sitting around their kitchen table trying to
        figure things out, up to some of the largest media companies in the world.\n\n00:05:17.786
        --> 00:05:32.730\n<v SPEAKER_01>And the conversations they have are almost
        identical, even though you have many more dollars, much bigger names and crazy
        resources compared to people who are trying to figure out how to do this with
        their friend.\n\n00:05:33.211 --> 00:05:34.851\n<v SPEAKER_01>Their obstacles
        are often the same.\n\n00:05:34.891 --> 00:05:39.196\n<v SPEAKER_01>They're
        kind of concerns or fears of how to get into this.\n\n00:05:39.857 --> 00:05:41.617\n<v
        SPEAKER_01>And they get stuck on the same things too.\n\n00:05:42.319 -->
        00:05:52.867\n<v SPEAKER_01>And so when I started to realize how universal
        a lot of the problems are that prevent people from being able to achieve what
        they want to do, I'm like, there's solutions to that.\n\n00:05:53.088 -->
        00:05:54.569\n<v SPEAKER_01>I've struggled through this a lot myself.\n\n00:05:55.250
        --> 00:06:02.456\n<v SPEAKER_01>So I just, and I was also worried when I was
        first asked about this book that I could write about a chapter and that would
        be about it.\n\n00:06:03.096 --> 00:06:06.223\n<v SPEAKER_01>And so I had
        a couple of days off for some reason.\n\n00:06:06.244 --> 00:06:07.827\n<v
        SPEAKER_01>I sat down and said, okay, I'm just going to try.\n\n00:06:07.848
        --> 00:06:09.612\n<v SPEAKER_01>I didn't even say yes to writing the book.\n\n00:06:09.632
        --> 00:06:10.975\n<v SPEAKER_01>I'm just going to try to write a chapter.\n\n00:06:11.014
        --> 00:06:15.264\n<v SPEAKER_01>And I sat down and I thought about what frustrates
        people and I just started.\n\n00:06:15.305 --> 00:06:21.880\n<v SPEAKER_01>And
        it became very clear to me that there was something to be said to an increasingly
        growing community of people.\n\n00:06:22.586 --> 00:06:40.273\n<v SPEAKER_00>Well,
        and what I appreciate about the angle that you took with the book is that
        it's not, it is and it isn't a book for beginner podcasters in the sense that
        if you're just getting started, it's a very valuable resource to help you
        avoid some of those early mistakes, classic mistakes, rookie mistakes that
        you see.\n\n00:06:41.134 --> 00:06:53.192\n<v SPEAKER_00>But it's also extremely
        challenging to, Even for someone like myself that's been in podcasting for
        years, you start reading through this and you're like, I don't do half the
        stuff that I even intellectually know I should be doing.\n\n00:06:53.233 -->
        00:07:01.947\n<v SPEAKER_00>And one that I want to really spend some time
        with, because I feel like it would be the most valuable for people listening,
        is the 10-word description.\n\n00:07:02.968 --> 00:07:08.336\n<v SPEAKER_00>Because
        one of my constant wrestling matches is that I, as a...\n\n00:07:09.077 -->
        00:07:12.684\n<v SPEAKER_00>As a creative outlet, I want my podcast to be
        self-serving in certain ways.\n\n00:07:13.165 --> 00:07:15.348\n<v SPEAKER_00>I
        want to wake up excited about making new episodes.\n\n00:07:15.389 --> 00:07:17.391\n<v
        SPEAKER_00>I want to expand my creativity.\n\n00:07:17.411 --> 00:07:19.235\n<v
        SPEAKER_00>I want to try new things, experiment with new things.\n\n00:07:20.357
        --> 00:07:27.730\n<v SPEAKER_00>But you do a really good job of kind of helping
        push against that in a really good way and the importance of staying focused.\n\n00:07:28.230
        --> 00:07:37.526\n<v SPEAKER_00>And and really being laser focused on why
        does your podcast exist for the expectations of your listeners and making
        sure you over deliver on that.\n\n00:07:37.586 --> 00:07:43.757\n<v SPEAKER_00>So
        I'd love to just maybe even if you want to just share the anecdote that you
        had about your yoga teacher and kind of going through that exercise.\n\n00:07:43.776
        --> 00:07:44.798\n<v SPEAKER_00>So I thought that was a good story.\n\n00:07:44.838
        --> 00:07:50.588\n<v SPEAKER_00>And I think we'll flesh out the importance
        of having a really clear idea of what your podcast is about.\n\n00:07:51.028
        --> 00:07:59.940\n<v SPEAKER_01>Yeah, I think a lot of my work is, just in
        general, a lot of my work, including this book, is simply taking people's
        heads and pointing them in a slightly different direction.\n\n00:08:01.023
        --> 00:08:05.509\n<v SPEAKER_01>They're worried about what they're going to
        do whenever someone says they want to do a podcast, and I say, what is it?\n\n00:08:05.910
        --> 00:08:08.613\n<v SPEAKER_01>They often describe it from a very features-based
        perspective.\n\n00:08:08.754 --> 00:08:13.581\n<v SPEAKER_01>Oh, I'm going
        to have conversations with women filmmakers about women in film.\n\n00:08:14.485
        --> 00:08:16.550\n<v SPEAKER_01>That's a feature that's not a benefit.\n\n00:08:17.012
        --> 00:08:25.495\n<v SPEAKER_01>And I always try to get people when that perspective
        shift is, and this is where my history as a broadcaster comes in, of let's
        think about the audience for that.\n\n00:08:26.112 --> 00:08:29.797\n<v SPEAKER_01>Let's
        not think about what you are at this moment.\n\n00:08:30.096 --> 00:08:31.718\n<v
        SPEAKER_01>Let's start with the listener.\n\n00:08:32.159 --> 00:08:37.206\n<v
        SPEAKER_01>It used to be part of my kind of standard stump speech.\n\n00:08:37.245
        --> 00:08:42.232\n<v SPEAKER_01>I would say even the yoga instructor down
        the street has a podcast.\n\n00:08:42.373 --> 00:08:47.639\n<v SPEAKER_01>And
        one day I was in yoga class and my yoga instructor came up to me and said,
        can I talk to you after class?\n\n00:08:48.100 --> 00:08:53.669\n<v SPEAKER_01>My
        first thought was like, oh, what did I do that required a talking to after
        class?\n\n00:08:53.730 --> 00:08:55.011\n<v SPEAKER_01>I'm like, oh, I didn't
        want to think about this.\n\n00:08:55.432 --> 00:08:56.654\n<v SPEAKER_01>And
        I kind of forgot about it.\n\n00:08:56.735 --> 00:09:04.970\n<v SPEAKER_01>And
        then he kind of came he came up to me like that day or a day later next class
        and said, hey, you know, everybody tells me I should have a podcast.\n\n00:09:05.431
        --> 00:09:10.620\n<v SPEAKER_01>And I'm like, oh, now even my yoga instructor
        has a podcast or wants to have a podcast.\n\n00:09:11.282 --> 00:09:21.061\n<v
        SPEAKER_01>And so I sat down with him and I started kind of talking about
        some of the concepts that I use with broadcasters or media people and realized
        they were far too advanced for where he was at.\n\n00:09:21.400 --> 00:09:27.854\n<v
        SPEAKER_01>He just had this passion to talk to people and he had something
        to say, but he had no idea of how to think about it.\n\n00:09:28.094 --> 00:09:34.743\n<v
        SPEAKER_01>And so I ended up drawing on a piece of paper, a circle or what
