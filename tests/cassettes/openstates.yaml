        of the Government Code, relating to economic recovery."}, "created_at": "2025-02-15T05:54:34.463336+00:00",
        "updated_at": "2026-10-02T09:16:55.280146+00:00", "openstates_url": "https://openstates.org/ca/bills/20252026/AB685/",
        "first_action_date": "2025-02-14", "latest_action_date": "2026-09-30", "latest_action_description":
        "Chaptered by Secretary of State - Chapter 824, Statutes of 2026.", "latest_passage_date":
        "2026-08-26", "abstracts": [{"abstract": "Existing law establishes the Office
        of Small Business Advocate (OSBA) within the Governor''s Office of Business
        and Economic Development, also known as GO-Biz, to advocate for causes of
        small business and to provide small businesses with the information they need
        to survive in the marketplace. Existing law also establishes the California
        Small Business Technical Assistance Program (SB-TAP) within OSBA, under the
        direct authority of the Small Business Advocate, for the purpose of assisting
        small businesses through free or low-cost one-on-one consulting and low-cost
        training by entering into grant agreements with one or more small business
        technical assistance centers. Under existing law, OSBA administers the Capital
        Infusion Program (CIP) pursuant to the SB-TAP, as specified.\n\nExisting law
        sets forth the criteria that an applicant must meet to be eligible to participate
        in these programs, which can vary depending on whether the applicant is receiving
        funding from federal or private sources.\n\nThis bill would revise certain
        eligibility criteria for the small business technical assistance center grant
        programs, as specified. The bill would create uniform eligibility requirements
        for applicants with funding from a nonstate source. The bill would also authorize
        multiple small business technical assistance centers to apply as a network
        with a single fiscal agent if their active contracts are under the same funding
        authority. The bill would also require the OSBA to establish standardized
        performance metrics, reporting requirements, and outcome measures applicable
        to all grant recipients participating in the SB-TAP and would require the
        OSBA to monitor grant recipients during the grant performance period to ensure
        their compliance with SB-TAP requirements, as provided. The bill would include
        findings and declarations by the Legislature relating to the administration
        of the CIP and would require the OSBA to report its findings and actions and
        aggregate program outcomes to the Legislature.", "note": "summary"}]}, {"id":
        "ocd-bill/2ff8c475-94d1-425b-9f21-d8a1b5a82152", "session": "20252026", "jurisdiction":
