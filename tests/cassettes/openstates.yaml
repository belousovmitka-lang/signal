        "classification": "state"}, "from_organization": {"id": "ocd-organization/e70e812e-44d2-46b0-9eae-2f3b9a1d5150",
        "name": "Assembly", "classification": "lower"}, "identifier": "AB 1679", "title":
        "Local pop-up small business program.", "classification": ["bill"], "subject":
        ["Localpop-upsmallbusinessprogram"], "extras": {"tags": ["fiscal committee",
        "local program"], "impact_clause": "An act to add Chapter 5.9 (commencing
        with Section 51028) to Part 1 of Division 1 of Title 5 of the Government Code,
        and to amend Section 113789 of the Health and Safety Code, relating to local
        government."}, "created_at": "2026-02-03T08:35:20.363464+00:00", "updated_at":
        "2026-10-02T09:19:02.475809+00:00", "openstates_url": "https://openstates.org/ca/bills/20252026/AB1679/",
        "first_action_date": "2026-02-02", "latest_action_date": "2026-09-30", "latest_action_description":
        "Chaptered by Secretary of State - Chapter 825, Statutes of 2026.", "latest_passage_date":
        "2026-08-26", "abstracts": [{"abstract": "(1) Existing law establishes various
        programs to promote small businesses operating in nonstandard locations, including
        cottage food operations and sidewalk vendors, and imposes requirements on,
        and provides authorizations to, local governments relating to these programs.
        Existing law authorizes the legislative body of an incorporated city or the
        board of supervisors of a county, as applicable, to license any kind of business
        not prohibited by law, transacted and carried on within the limits of the
        jurisdiction of the city or county, and to fix the rate of the license fee
        and provide for its collection, as provided.\n\nThis bill would require a
        city, including a charter city, county, or city and county, defined as a local
        jurisdiction to allow temporary commercial activation authorization for a
        pop-up small business, as those terms are defined, to operate for no more
        than 120 days in an eligible commercial space without requiring full compliance
        with standards applicable to permanent occupancy, as specified. The bill would
        require a local jurisdiction to consider temporarily suspending, deferring,
        or modifying specified standards and discretionary requirements. The bill
        would require a temporary commercial activation to comply with health and
        safety standards governing temporary use and structures, as specified.\n\n
        This bill would further require a local jurisdiction to provide written accessibility
        compliance guidance materials to an applicant. The bill would authorize a
        local jurisdiction to establish fees not exceeding the reasonable costs of
        program administration and create enforcement mechanisms and penalties for
        noncompliance. By requiring a city, including a charter city, county, or city
        and county to allow temporary commercial activation authorization for pop-up
        small businesses, this bill would impose a state-mandated local program.\n\n(2)
        Existing law, the California Retail Food Code, establishes uniform health
        and sanitation standards for, and provides for regulation by the State Department
        of Public Health of, retail food facilities and requires local health agencies
        to enforce those provisions. A violation of the California Retail Food Code
        is generally a misdemeanor. Existing law defines \"food facility\" to include
        specified permanent and nonpermanent food facilities.\n\nThis bill would specify
        that the term \"food facility\" includes a pop-up small business, as described
        above, that has been approved for limited food preparation. By changing the
        definition of a crime and because the bill would impose a higher level of
        service on local health agencies, this bill would impose a state-mandated
        local program.\n\n(3) The bill would include findings that changes proposed
        by this bill address a matter of statewide concern rather than a municipal
        affair and, therefore, apply to all cities, including charter cities.\n\nThe
        California Constitution requires the state to reimburse local agencies and
        school districts for certain costs mandated by the state. Statutory provisions
        establish procedures for making that reimbursement.\n\nThis bill would provide
        that no reimbursement is required by this act for specified reasons.", "note":
        "summary"}]}, {"id": "ocd-bill/a5c30672-83fb-44a5-b4c8-19a5d8b0a24a", "session":
