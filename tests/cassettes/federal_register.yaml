        "comments_close_on": null, "docket_ids": ["EPA-R04-OAR-2024-0626", "FRL-12934-02-R4"],
        "regulation_id_numbers": [], "significant": null, "action": "Final rule."},
        {"title": "Air Plan Approval; Maryland; Reasonably Available Control Technology
        for Municipal Waste Combustors", "abstract": "The U.S. Environmental Protection
        Agency (EPA) is approving state implementation plan (SIP) revisions submitted
        by the State of Maryland. The SIP revisions consist of a regulation that implements
        statewide reasonably available control technology (RACT) requirements by limiting
        air emissions of oxides of nitrogen (NO<INF>X</INF>) from municipal waste
        combustors (MWCs) in Maryland. This action is being taken under the Clean
        Air Act (CAA).", "html_url": "https://www.federalregister.gov/documents/2026/10/08/2026-20635/air-plan-approval-maryland-reasonably-available-control-technology-for-municipal-waste-combustors",
        "publication_date": "2026-10-08", "type": "Rule", "agencies": [{"raw_name":
