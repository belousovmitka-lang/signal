        rule; request for comments."}, {"title": "Optional Practical Training Fees",
        "abstract": "This rule proposes new fees for Optional Practical Training (OPT)
        to combat fraud, strengthen the integrity of the immigration system, and protect
        U.S. workers. The following fees would apply for each F-1 nonimmigrant student
        to engage in OPT through a Student and Exchange Visitor Program-certified
        institution: $70,000 for initial OPT; and $30,000 for any subsequent OPT.",
        "html_url": "https://www.federalregister.gov/documents/2026/10/08/2026-20660/optional-practical-training-fees",
        "publication_date": "2026-10-08", "type": "Proposed Rule", "agencies": [{"raw_name":
