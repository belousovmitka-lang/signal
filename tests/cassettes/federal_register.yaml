        "Schedules of Controlled Substances: Placement of O-Desmethyltramadol in Schedule
        I; Correction", "abstract": "On August 12, 2026, the Drug Enforcement Administration
        (DEA) published a temporary order placing O-desmethyltramadol (other names:
        O-DSMT; desmetramadol; 3-[(1R,2R)-2-[(dimethylamino)methyl]-1- hydroxycyclohexyl]phenol),
        including its salts, isomers, and salts of isomers whenever the existence
        of such salts, isomers, and salts of isomers are possible, in schedule I of
        the Controlled Substances Act. DEA published this temporary order that specifically
        noted in the summary that the control of O-desmethyltramadol included its
        salts, isomers, and salts of isomers whenever the existence of such salts,
        isomers, and salts of isomers are possible, however inadvertently omitted
        the correct language that should have been included. This document corrects
        that error, adding the correct language.", "html_url": "https://www.federalregister.gov/documents/2026/10/09/2026-20748/schedules-of-controlled-substances-placement-of-o-desmethyltramadol-in-schedule-i-correction",
