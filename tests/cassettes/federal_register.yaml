        {"title": "Airworthiness Directives; Engine Alliance Engines", "abstract":
        "The FAA is adopting a new airworthiness directive (AD) for certain Engine
        Alliance (EA) Model GP7270, GP7272, and GP7277 engines. This AD was prompted
        by a report of an aborted takeoff that resulted from an uncontained failure
        of the high-pressure turbine (HPT) interstage seal. This AD requires removal
        from service and replacement of the HPT interstage seal with a part eligible
        for installation. The FAA is issuing this AD to address the unsafe condition
        on these products.", "html_url": "https://www.federalregister.gov/documents/2026/10/08/2026-20666/airworthiness-directives-engine-alliance-engines",
        "publication_date": "2026-10-08", "type": "Rule", "agencies": [{"raw_name":
