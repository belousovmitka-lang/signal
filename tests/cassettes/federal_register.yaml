        care to non-IHS-beneficiaries. Eliminating this obsolete language will not
        change IHS''s existing practices or authorities.", "html_url": "https://www.federalregister.gov/documents/2026/10/08/2026-20685/removal-of-obsolete-portion-of-regulation-relating-to-care-and-treatment-of-ineligible-individuals",
