        "json_url": "https://www.federalregister.gov/api/v1/agencies/227", "parent_id":
        null, "slug": "homeland-security-department"}], "document_number": "2026-20660",
        "comments_close_on": "2026-11-09", "docket_ids": ["DHS Docket No. ICEB-2026-0100"],
        "regulation_id_numbers": ["1653-AB01"], "significant": null, "action": "Notice
        of proposed rulemaking (NPRM)."}, {"title": "Atlantic Highly Migratory Species;
        Atlantic Bluefin Tuna Fisheries; General Category October Through November
        Quota Transfer and Adjustment", "abstract": "NMFS is adjusting the Atlantic
        bluefin tuna (BFT) General category October through November 2026 time period
        subquota by transferring 70.2 metric tons (mt) of quota from the Reserve category.
        Simultaneously, NMFS is adding 16.7 mt of subquota remaining from the June
        through August time period to the General category October through November
        time period. This action results in a total adjusted General category October
        through November time period subquota of 192.9 mt and an adjusted Reserve
        category of 42 mt. This action would affect Atlantic Tunas General category
        (commercial) permitted vessels and Highly Migratory Species (HMS) Charter/Headboat
        permitted vessels with a commercial sale endorsement when fishing commercially
        for BFT.", "html_url": "https://www.federalregister.gov/documents/2026/10/08/2026-20652/atlantic-highly-migratory-species-atlantic-bluefin-tuna-fisheries-general-category-october-through",
