        "significant": false, "action": "Notice of proposed rulemaking (NPRM)."},
        {"title": "Airworthiness Directives; Airbus SAS Airplanes", "abstract": "The
        FAA proposes to adopt a new airworthiness directive (AD) for all Airbus SAS
        Model A318, A319, A320, and A321 series airplanes. This proposed AD was prompted
        by a finding that severe corrosion could occur on affected slotted nuts located
        at the wing thrust spigots. This proposed AD would require repetitive inspections
        of the affected slotted nuts and applicable corrective actions. This proposed
        AD would also prohibit the installation of affected parts. The FAA is proposing
