        implemented by the IHS, and were referred to as \"suspended\" in a 1999 Federal
        Register Notice. Removing these regulations will not change the IHS''s existing
        practices or authorities.", "html_url": "https://www.federalregister.gov/documents/2026/10/08/2026-20684/removal-of-obsoletesuspended-regulations",
