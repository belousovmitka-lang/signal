        ["3064-AG26"], "significant": null, "action": "Notice of proposed rulemaking;
        extension of comment period."}, {"title": "Medical Devices; Immunology and
        Microbiology Devices; Classification of the System for Detection of Nucleic
        Acid From Non-Viral Microorganism(s) Causing Sexually Transmitted Infections
        Using Home-Collected Specimens", "abstract": "The Food and Drug Administration
        (FDA) is classifying the system for detection of nucleic acid from non-viral
        microorganism(s) causing sexually transmitted infections using home-collected
        specimens into class II (special controls). The special controls that apply
        to the device type are identified in this order and will be part of the codified
        language for classification of the system for detection of nucleic acid from
        non-viral microorganism(s) causing sexually transmitted infections using home-collected
        specimens. We are taking this action because we have determined that classifying
        the device into class II will provide a reasonable assurance of the safety
        and effectiveness of the device. We believe this action will also enhance
        patients'' access to beneficial innovative devices, in part by reducing regulatory
        burdens.", "html_url": "https://www.federalregister.gov/documents/2026/10/09/2026-20727/medical-devices-immunology-and-microbiology-devices-classification-of-the-system-for-detection-of",
