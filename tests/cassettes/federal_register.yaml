        ["1685-AA38"], "significant": null, "action": "Notice of proposed rulemaking."},
        {"title": "Air Plan Approval; Kentucky; Louisville Area Limited Maintenance
        Plan for the 1997 8-Hour Ozone NAAQS", "abstract": "The U.S. Environmental
        Protection Agency (EPA or Agency) is approving a State Implementation Plan
        (SIP) revision submitted by the Commonwealth of Kentucky through the Energy
        and Environment Cabinet (Cabinet) on behalf of the Louisville Metro Air Pollution
        Control District (District) via a letter dated June 3, 2024. The SIP revision
        consists of a Limited Maintenance Plan (LMP) for the Kentucky portion of the
        bi-state Louisville, Kentucky-Indiana 1997 8-hour ozone maintenance area (the
        \"bi-state Louisville Area\"). The Kentucky portion of the bi-state Louisville
        Area is comprised of Bullitt, Jefferson, and Oldham Counties in Kentucky (the
        \"Louisville Area\"). The EPA is approving the Louisville Area''s LMP because
        it provides for the maintenance of the 1997 8-hour ozone National Ambient
        Air Quality Standards (NAAQS) within the bi-state Louisville Area through
        the end of the second 10-year portion of the maintenance period. The effect
        of this action is to make certain commitments related to maintenance of the
        1997 8-hour ozone NAAQS in the Louisville Area federally enforceable as part
        of the Kentucky SIP.", "html_url": "https://www.federalregister.gov/documents/2026/10/08/2026-20641/air-plan-approval-kentucky-louisville-area-limited-maintenance-plan-for-the-1997-8-hour-ozone-naaqs",
        "publication_date": "2026-10-08", "type": "Rule", "agencies": [{"raw_name":
        "ENVIRONMENTAL PROTECTION AGENCY", "name": "Environmental Protection Agency",
        "id": 145, "url": "https://www.federalregister.gov/agencies/environmental-protection-agency",
        "json_url": "https://www.federalregister.gov/api/v1/agencies/145", "parent_id":
        null, "slug": "environmental-protection-agency"}], "document_number": "2026-20641",
        "comments_close_on": null, "docket_ids": ["EPA-R04-OAR-2024-0295", "FRL-13322-02-R4"],
        "regulation_id_numbers": [], "significant": null, "action": "Final rule."},
        {"title": "Air Plan Approval; Oklahoma; Interstate Transport Requirements
        for the 2010 SO2 NAAQS", "abstract": "Pursuant to the Federal Clean Air Act
        (CAA or the Act), the U.S. Environmental Protection Agency (EPA) is approving
        portions of the State Implementation Plan (SIP) submittal from the State of
        Oklahoma demonstrating that the State satisfies the interstate transport requirements
        of the CAA for the 2010 1-hour sulfur dioxide (SO<INF>2</INF>) primary National
        Ambient Air Quality Standard (NAAQS). This provision requires each State''s
        implementation plan to contain adequate requirements prohibiting the interstate
        transport of air pollution in amounts that will contribute significantly to
        nonattainment, or interfere with maintenance, of a NAAQS in any other State.",
        "html_url": "https://www.federalregister.gov/documents/2026/10/08/2026-20640/air-plan-approval-oklahoma-interstate-transport-requirements-for-the-2010-so2-naaqs",
        "publication_date": "2026-10-08", "type": "Rule", "agencies": [{"raw_name":
        "ENVIRONMENTAL PROTECTION AGENCY", "name": "Environmental Protection Agency",
        "id": 145, "url": "https://www.federalregister.gov/agencies/environmental-protection-agency",
        "json_url": "https://www.federalregister.gov/api/v1/agencies/145", "parent_id":
        null, "slug": "environmental-protection-agency"}], "document_number": "2026-20640",
        "comments_close_on": null, "docket_ids": ["EPA-R06-OAR-2025-2270", "FRL-13190-02-R6"],
        "regulation_id_numbers": [], "significant": null, "action": "Final rule."},
        {"title": "Approval and Promulgation of State Implementation Plans; New Jersey;
        RACT Certifications for the 2008 and 2015 Ozone National Ambient Air Quality
        Standards", "abstract": "The Environmental Protection Agency (EPA) is approving
        a State Implementation Plan (SIP) revision submitted by the State of New Jersey
        for purposes of certifying and meeting the requirements for Reasonably Available
        Control Technology (RACT) for the Serious classification of the 2008 and the
        Moderate classification of the 2015 8-hour ozone National Ambient Air Quality
        Standards (NAAQS). The EPA is also approving that the SIP revisions fulfill
        SIP requirements pertaining to the Ozone Transport Region (OTR) for the 2015
        ozone NAAQS. These actions are being taken in accordance with the requirements
        of the Clean Air Act (CAA).", "html_url": "https://www.federalregister.gov/documents/2026/10/08/2026-20638/approval-and-promulgation-of-state-implementation-plans-new-jersey-ract-certifications-for-the-2008",
        "publication_date": "2026-10-08", "type": "Rule", "agencies": [{"raw_name":
        "ENVIRONMENTAL PROTECTION AGENCY", "name": "Environmental Protection Agency",
        "id": 145, "url": "https://www.federalregister.gov/agencies/environmental-protection-agency",
        "json_url": "https://www.federalregister.gov/api/v1/agencies/145", "parent_id":
        null, "slug": "environmental-protection-agency"}], "document_number": "2026-20638",
        "comments_close_on": null, "docket_ids": ["EPA-R02-OAR-2026-0793, FRL-13420-02-R2"],
        "regulation_id_numbers": [], "significant": null, "action": "Final rule."},
        {"title": "Fisheries of the Exclusive Economic Zone Off Alaska; Pacific Cod
        by Vessels Using Pot Gear in the Central Regulatory Area of the Gulf of Alaska",
        "abstract": "NMFS is prohibiting directed fishing for Pacific cod by vessels
        using pot gear in the Central Regulatory Area of the Gulf of Alaska (GOA).
        This action is necessary to prevent exceeding the 2026 total allowable catch
        (TAC) of Pacific cod allocated to vessels using pot gear in the Central Regulatory
        Area of the GOA.", "html_url": "https://www.federalregister.gov/documents/2026/10/08/2026-20637/fisheries-of-the-exclusive-economic-zone-off-alaska-pacific-cod-by-vessels-using-pot-gear-in-the",
        "publication_date": "2026-10-08", "type": "Rule", "agencies": [{"raw_name":
        "DEPARTMENT OF COMMERCE", "name": "Commerce Department", "id": 54, "url":
        "https://www.federalregister.gov/agencies/commerce-department", "json_url":
