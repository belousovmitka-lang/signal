        "RTID 0648-XG086"], "regulation_id_numbers": [], "significant": null, "action":
        "Temporary rule; quota transfer and adjustment."}, {"title": "Low-Value Shipments",
        "abstract": "This document proposes to amend the U.S. Customs and Border Protection
        regulations to modify filing requirements for informal entries of goods valued
        at $2,500 or less and to establish a new electronic informal entry type for
        merchandise entering through the mail environment. This document also proposes
        other related changes such as requiring an additional data element for carriers
        pertaining to mail shipments and imposing bonding requirements for certain
        informal entries.", "html_url": "https://www.federalregister.gov/documents/2026/10/08/2026-20650/low-value-shipments",
