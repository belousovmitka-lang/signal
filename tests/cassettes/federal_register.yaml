        "json_url": "https://www.federalregister.gov/api/v1/agencies/361", "parent_id":
        54, "slug": "national-oceanic-and-atmospheric-administration"}], "document_number":
        "2026-20637", "comments_close_on": null, "docket_ids": ["Docket No. 260305-0067",
        "RTID 0648-XF996"], "regulation_id_numbers": [], "significant": null, "action":
        "Temporary rule; closure."}, {"title": "Air Plan Approval; GA; Removal of
        Nonattainment Area New Source Review", "abstract": "The U.S. Environmental
        Protection Agency (EPA or Agency) is approving a State Implementation Plan
        (SIP) revision submitted by the State of Georgia through the Georgia Environmental
        Protection Division (EPD) on June 27, 2024. The revision removes permitting
        requirements related to nonattainment, including nonattainment new source
        review (NNSR), from Georgia''s SIP as obsolete, removes certain provisions
        related to the use of emission reduction credits (ERCs), and makes other changes
        based upon the lack of any areas designated as nonattainment for the National
        Ambient Air Quality Standards (NAAQS) in Georgia. The EPA is approving these
        changes pursuant to the Clean Air Act (CAA or Act).", "html_url": "https://www.federalregister.gov/documents/2026/10/08/2026-20636/air-plan-approval-ga-removal-of-nonattainment-area-new-source-review",
