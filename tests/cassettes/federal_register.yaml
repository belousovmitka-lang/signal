        Substances; Removal of Exemption Status for Inactive Butalbital Products",
        "abstract": "The Drug Enforcement Administration (DEA) is revoking the exempted
        status for certain nonnarcotic prescription products that are currently on
        DEA''s Table of Exempted Prescription Products, but whose National Drug Codes
        (NDC) are inactive because they are no longer available and/or the company
        that applied for the exemption no longer exists. These products will be removed
        from DEA''s Table of Exempted Prescription Products and will no longer be
        considered exempt prescription products under the Controlled Substances Act.
        This action does not impact exempted prescription products with active NDC
        numbers.", "html_url": "https://www.federalregister.gov/documents/2026/10/09/2026-20757/schedules-of-controlled-substances-removal-of-exemption-status-for-inactive-butalbital-products",
