        a detailed inspection of each affected part and applicable corrective actions,
        and provide additional requirements for maintenance. The FAA is proposing
        this AD to address the unsafe condition on these products.", "html_url": "https://www.federalregister.gov/documents/2026/10/08/2026-20701/airworthiness-directives-airbus-sas-airplanes",
