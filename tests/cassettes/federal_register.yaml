        null, "docket_ids": [], "regulation_id_numbers": ["0917-AA13"], "significant":
        false, "action": "Final rule."}, {"title": "Airworthiness Directives; The
        Boeing Company Airplanes", "abstract": "The FAA is superseding Airworthiness
        Directive (AD) 2019-20- 07, which applied to The Boeing Company Model 787-8,
        787-9, and 787-10 airplanes. AD 2019-20-07 required repetitive operational
        checks of the leading edge (LE) outboard (OB) slats and applicable on-condition
        actions. AD 2019-20-07 also required revising the airplane flight manual (AFM)
        to prohibit flap retraction under icing conditions after landing and revising
        the existing maintenance or inspection program, as applicable, to incorporate
        a new operation check. This AD was prompted by the manufacturer developing
        further actions to address the unsafe condition. This AD continues to require
        all requirements of AD 2019-20- 07. This AD would also require replacing the
        LE outboard geared rotary actuator (GRA) with a LE outboard lockout actuator
        (LEOLA) at leading edge OB slat locations and revising the existing maintenance
        or inspection program, as applicable, to incorporate a new certification maintenance
        requirement (CMR), which terminates the retained requirements of AD 2019-20-07.
        This AD also removes airplanes from the applicability. The FAA is issuing
        this AD to address the unsafe condition on these products.", "html_url": "https://www.federalregister.gov/documents/2026/10/08/2026-20680/airworthiness-directives-the-boeing-company-airplanes",
        "publication_date": "2026-10-08", "type": "Rule", "agencies": [{"raw_name":
