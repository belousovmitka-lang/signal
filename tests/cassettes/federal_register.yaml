        of availability."}, {"title": "Airworthiness Directives; Airbus SAS Airplanes",
        "abstract": "The FAA proposes to adopt a new airworthiness directive (AD)
        for all Airbus SAS Model A350-941 and -1041 airplanes. This proposed AD was
        prompted by a girt bar fitting safety hook on an airplane in the production
        line was found stuck in the upward position due to excessive sealant applied
