        isPermaLink=\"false\">https://www.jlconline.com/?p=188595</guid>\n\n\t\t\t\t\t<description><![CDATA[<p>Doma
        Intelligent Doors by Kolbe Windows &#38; Doors are custom-crafted, wooden
        entry doors with automated technology. The Doma WelcomeDrive is a motorized
        opener and closer that, according to the company, authenticates the homeowner
        and automatically opens the door as they approach. It does this via advanced
        radar, motion, and facial recognition sensors that detect movement [&#8230;]</p>\n<p>The
        post <a href=\"https://www.jlconline.com/products-tools/windows-doors/smart-tech-entry-door/\">Smart
        Tech Entry Door</a> appeared first on <a href=\"https://www.jlconline.com\">Journal
        of Light Construction</a>.</p>\n]]></description>\n\t\t\t\t\t\t\t\t\t\t<content:encoded><![CDATA[\n<p
        class=\"wp-block-paragraph\">Doma Intelligent Doors by Kolbe Windows &amp;
        Doors are custom-crafted, wooden entry doors with automated technology. The
        Doma WelcomeDrive is a motorized opener and closer that, according to the
        company, authenticates the homeowner and automatically opens the door as they
        approach. It does this via advanced radar, motion, and facial recognition
        sensors that detect movement and identity for secure access with no batteries,
        bridges, or external components required. Kolbe\u2019s spectrum of wood species
        and glass options make it possible to match doors to just about any architectural
        design.<br><a href=\"https://domahome.com/\" data-type=\"link\" data-id=\"https://domahome.com/\"
        target=\"_blank\" rel=\"noreferrer noopener\">domahome.com</a></p>\n\n\n\n<p
        class=\"wp-block-paragraph\"></p>\n<p>The post <a href=\"https://www.jlconline.com/products-tools/windows-doors/smart-tech-entry-door/\">Smart
        Tech Entry Door</a> appeared first on <a href=\"https://www.jlconline.com\">Journal
        of Light Construction</a>.</p>\n]]></content:encoded>\n\t\t\t\t\t\n\t\t\t\t\t<wfw:commentRss>https://www.jlconline.com/products-tools/windows-doors/smart-tech-entry-door/feed/</wfw:commentRss>\n\t\t\t<slash:comments>0</slash:comments>\n\t\t\n\t\t\n\t\t<post-id
        xmlns=\"com-wordpress:feed-additions:1\">188595</post-id>\t</item>\n\t\t<item>\n\t\t<title>Joist
