        says that its downlight hoods and lids help reduce the amount of heat lost
        during use by creating an airtight seal around the lamp. The seal also minimizes
        condensation risk and reduces sound transmission to the floor above. Made
        from flame retardant materials, the TH125 hoods require little to no maintenance
        after installation and [&#8230;]</p>\n<p>The post <a href=\"https://www.jlconline.com/products-tools/easy-install-recessed-lighting-hoods/\">Easy
        Install Recessed Lighting Hoods</a> appeared first on <a href=\"https://www.jlconline.com\">Journal
        of Light Construction</a>.</p>\n]]></description>\n\t\t\t\t\t\t\t\t\t\t<content:encoded><![CDATA[\n<p
        class=\"wp-block-paragraph\">Thermahood says that its downlight hoods and
        lids help reduce the amount of heat lost during use by creating an airtight
        seal around the lamp. The seal also minimizes condensation risk and reduces
        sound transmission to the floor above. Made from flame retardant materials,
        the TH125 hoods require little to no maintenance after installation and are
        available online in packs of ten priced at $99. <a href=\"https://www.thermahooddirect.com/\"
        data-type=\"link\" data-id=\"https://www.thermahooddirect.com/\" target=\"_blank\"
        rel=\"noreferrer noopener\">thermahooddirect.com</a></p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n<p>The
        post <a href=\"https://www.jlconline.com/products-tools/easy-install-recessed-lighting-hoods/\">Easy
        Install Recessed Lighting Hoods</a> appeared first on <a href=\"https://www.jlconline.com\">Journal
