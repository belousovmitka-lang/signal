        xmlns=\"com-wordpress:feed-additions:1\">188598</post-id>\t</item>\n\t\t<item>\n\t\t<title>Self-Adhering
        Roof Tape</title>\n\t\t<link>https://www.jlconline.com/products-tools/exteriors-roofing/self-adhering-roof-tape/</link>\n\t\t\t\t\t<comments>https://www.jlconline.com/products-tools/exteriors-roofing/self-adhering-roof-tape/#respond</comments>\n\t\t\n\t\t<dc:creator>redacted</dc:creator>\n\t\t<pubDate>Thu,
        08 Oct 2026 13:38:33 +0000</pubDate>\n\t\t\t\t<category><![CDATA[Roofing material]]></category>\n\t\t<guid
        isPermaLink=\"false\">https://www.jlconline.com/?p=188616</guid>\n\n\t\t\t\t\t<description><![CDATA[<p>CertaSeam
        Roof Tape from CertainTeed is composed of two waterproofing materials: an
        aggressive rubberized asphalt adhesive backed by a layer of slip-resistant
        film. A roll of CertaSeam is 50 feet long, with one roll covering a 16-square-foot
        area. According to Certainteed, the rubberized asphalt layer seals around
        fasteners while protecting the roof from leaks caused [&#8230;]</p>\n<p>The
        post <a href=\"https://www.jlconline.com/products-tools/exteriors-roofing/self-adhering-roof-tape/\">Self-Adhering
        Roof Tape</a> appeared first on <a href=\"https://www.jlconline.com\">Journal
        of Light Construction</a>.</p>\n]]></description>\n\t\t\t\t\t\t\t\t\t\t<content:encoded><![CDATA[\n<p
        class=\"wp-block-paragraph\">CertaSeam Roof Tape from CertainTeed is composed
        of two waterproofing materials: an aggressive rubberized asphalt adhesive
        backed by a layer of slip-resistant film. A roll of CertaSeam is 50 feet long,
        with one roll covering a 16-square-foot area. According to Certainteed, the
        rubberized asphalt layer seals around fasteners while protecting the roof
        from leaks caused by water backup. The membrane forms watertight overlaps
        and protects asphalt shingles, slate, tile, cedar shakes, or metal roofing.
        It\u2019s self-adhesive and bonds firmly to the roof deck without the need
        for heat or special adhesives. <a href=\"https://www.certainteed.com/\" data-type=\"link\"
        data-id=\"https://www.certainteed.com/\" target=\"_blank\" rel=\"noreferrer
        noopener\">certainteed.com</a></p>\n<p>The post <a href=\"https://www.jlconline.com/products-tools/exteriors-roofing/self-adhering-roof-tape/\">Self-Adhering
        Roof Tape</a> appeared first on <a href=\"https://www.jlconline.com\">Journal
        of Light Construction</a>.</p>\n]]></content:encoded>\n\t\t\t\t\t\n\t\t\t\t\t<wfw:commentRss>https://www.jlconline.com/products-tools/exteriors-roofing/self-adhering-roof-tape/feed/</wfw:commentRss>\n\t\t\t<slash:comments>0</slash:comments>\n\t\t\n\t\t\n\t\t<post-id
        xmlns=\"com-wordpress:feed-additions:1\">188616</post-id>\t</item>\n\t\t<item>\n\t\t<title>Small
