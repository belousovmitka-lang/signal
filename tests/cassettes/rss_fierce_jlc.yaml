        \n<site xmlns=\"com-wordpress:feed-additions:1\">238909177</site>\t<item>\n\t\t<title>Undermount
        Drawer Slides</title>\n\t\t<link>https://www.jlconline.com/products-tools/undermount-drawer-slides/</link>\n\t\t\t\t\t<comments>https://www.jlconline.com/products-tools/undermount-drawer-slides/#respond</comments>\n\t\t\n\t\t<dc:creator>redacted</dc:creator>\n\t\t<pubDate>Fri,
        09 Oct 2026 19:57:40 +0000</pubDate>\n\t\t\t\t<category><![CDATA[cabinet making]]></category>\n\t\t<category><![CDATA[Hardware]]></category>\n\t\t<category><![CDATA[Innovative
        Kitchen Design]]></category>\n\t\t<guid isPermaLink=\"false\">https://www.jlconline.com/?p=188610</guid>\n\n\t\t\t\t\t<description><![CDATA[<p>Grass
        America says that its Dynapro undermount drawer slides can be moved with just
        a slight pull or gentle push. They also claim that the glide is smooth enough
        to reduce noise and prevent the drawer from binding when being closed. Offered
        in both 2D and 3D versions, the latter supports tilt adjustment via an [&#8230;]</p>\n<p>The
        post <a href=\"https://www.jlconline.com/products-tools/undermount-drawer-slides/\">Undermount
        Drawer Slides</a> appeared first on <a href=\"https://www.jlconline.com\">Journal
        of Light Construction</a>.</p>\n]]></description>\n\t\t\t\t\t\t\t\t\t\t<content:encoded><![CDATA[\n<p
        class=\"wp-block-paragraph\">Grass America says that its Dynapro undermount
        drawer slides can be moved with just a slight pull or gentle push. They also
        claim that the glide is smooth enough to reduce noise and prevent the drawer
        from binding when being closed. Offered in both 2D and 3D versions, the latter
        supports tilt adjustment via an additional rear adapter. The slides are designed
        for wooden drawers up to 48 inches wide and according to the company will
        move in sync without the need for connecting hardware. <a href=\"https://www.grassusa.com/\"
        data-type=\"link\" data-id=\"https://www.grassusa.com/\" target=\"_blank\"
        rel=\"noreferrer noopener\">grassusa.com</a></p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n<p>The
        post <a href=\"https://www.jlconline.com/products-tools/undermount-drawer-slides/\">Undermount
        Drawer Slides</a> appeared first on <a href=\"https://www.jlconline.com\">Journal
        of Light Construction</a>.</p>\n]]></content:encoded>\n\t\t\t\t\t\n\t\t\t\t\t<wfw:commentRss>https://www.jlconline.com/products-tools/undermount-drawer-slides/feed/</wfw:commentRss>\n\t\t\t<slash:comments>0</slash:comments>\n\t\t\n\t\t\n\t\t<post-id
