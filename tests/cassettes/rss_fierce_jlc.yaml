        isPermaLink=\"false\">https://www.jlconline.com/?p=188607</guid>\n\n\t\t\t\t\t<description><![CDATA[<p>The
        28NR Joist Repair Notch Reinforcer from Metwood allows users to reinforce
        5-inch-wide by 3-inch-deep notch cuts into 2&#215;8 joists and does not require
        glue. It\u2019s made from engineered light-gauge steel and can be used on
        engineered I-joists or conventional framing. By allowing larger openings in
        floor joists, the joist reinforcer simplifies the routing and [&#8230;]</p>\n<p>The
        post <a href=\"https://www.jlconline.com/products-tools/foundations-framing/joist-repair-reinforcer/\">Joist
        Repair Reinforcer</a> appeared first on <a href=\"https://www.jlconline.com\">Journal
        of Light Construction</a>.</p>\n]]></description>\n\t\t\t\t\t\t\t\t\t\t<content:encoded><![CDATA[\n<p
        class=\"wp-block-paragraph\">The 28NR Joist Repair Notch Reinforcer from Metwood
        allows users to reinforce 5-inch-wide by 3-inch-deep notch cuts into 2&#215;8
        joists and does not require glue. It\u2019s made from engineered light-gauge
        steel and can be used on engineered I-joists or conventional framing. By allowing
        larger openings in floor joists, the joist reinforcer simplifies the routing
        and installation of utilities. The reinforcers help restore the strength of
        floor joists weakened by the placement of large holes or cut-outs. <a href=\"https://metwood.com/contact-us/?msclkid=38bbb0b51d5a182b84d2da7293f6a376&amp;utm_source=bing&amp;utm_medium=cpc&amp;utm_campaign=Bing%20Performance%20Max-3%20Merchant%20Center%20Direct&amp;utm_term=metwood.com&amp;utm_content=Performance%20Max-3%20Merchant%20Center%20Direct\"
        data-type=\"link\" data-id=\"https://metwood.com/contact-us/?msclkid=38bbb0b51d5a182b84d2da7293f6a376&amp;utm_source=bing&amp;utm_medium=cpc&amp;utm_campaign=Bing%20Performance%20Max-3%20Merchant%20Center%20Direct&amp;utm_term=metwood.com&amp;utm_content=Performance%20Max-3%20Merchant%20Center%20Direct\"
        target=\"_blank\" rel=\"noreferrer noopener\">metwood.com</a></p>\n\n\n\n<p
        class=\"wp-block-paragraph\"></p>\n<p>The post <a href=\"https://www.jlconline.com/products-tools/foundations-framing/joist-repair-reinforcer/\">Joist
        Repair Reinforcer</a> appeared first on <a href=\"https://www.jlconline.com\">Journal
        of Light Construction</a>.</p>\n]]></content:encoded>\n\t\t\t\t\t\n\t\t\t\t\t<wfw:commentRss>https://www.jlconline.com/products-tools/foundations-framing/joist-repair-reinforcer/feed/</wfw:commentRss>\n\t\t\t<slash:comments>0</slash:comments>\n\t\t\n\t\t\n\t\t<post-id
