        \ <description>Federal regulators released the hotly anticipated star ratings
        for the 2027 Medicare Advantage plan year, and winners and losers emerged
        in the data.</description>\n  <pubDate>Oct 9, 2026 11:08am</pubDate>\n    <dc:creator>redacted</dc:creator>\n
        \   <guid isPermaLink=\"true\">https://www.fiercehealthcare.com/7af916c8-4a71-4099-891b-515f9f2bcaa7</guid>\n
        \   </item>\n<item>\n  <title><a href=\"/providers/hospital-closures-accelerated-2010-rates-similar-among-rural-urban-facilities\"
        hreflang=\"en\">Urban hospitals face closure rates similar to rural facilities,
        study finds</a></title>\n  <link>https://www.fiercehealthcare.com/providers/hospital-closures-accelerated-2010-rates-similar-among-rural-urban-facilities</link>\n
        \ <description>There were 432 acute hospital closures and 216 openings across
        the country from 2010 through 2025, with the former accelerating over time
        and the latter slowing, according to a new study. Closure rates were statistically
        similar between rural and urban hospitals, and generally increased among safety
        net facilities and for-profits.</description>\n  <pubDate>Oct 8, 2026 3:46pm</pubDate>\n
        \   <dc:creator>redacted</dc:creator>\n    <guid isPermaLink=\"true\">https://www.fiercehealthcare.com/62887cec-3688-4666-9f20-9935b9f464ea</guid>\n
        \   </item>\n<item>\n  <title><a href=\"/regulatory/look-stakeholder-perspectives-medicare-advantage-reform\"
