        08 Oct 2026 13:32:20 +0000</pubDate>\n\t\t\t\t<category><![CDATA[Remodeling]]></category>\n\t\t<guid
        isPermaLink=\"false\">https://www.jlconline.com/?p=188592</guid>\n\n\t\t\t\t\t<description><![CDATA[<p>The
        Side Mount Garage Door Opener (SMO) from Skylink features a DC motor, soft
        start and stop technology, and built-in LED lighting to illuminate the garage
        without additional fixtures. The unit connects to the home\u2019s Wi-Fi and
        is compatible with Amazon Alexa, allowing users to remotely control their
        garage door. As with all garage doors, [&#8230;]</p>\n<p>The post <a href=\"https://www.jlconline.com/products-tools/windows-doors/small-profile-garage-opener/\">Small
        Profile Garage Opener</a> appeared first on <a href=\"https://www.jlconline.com\">Journal
        of Light Construction</a>.</p>\n]]></description>\n\t\t\t\t\t\t\t\t\t\t<content:encoded><![CDATA[\n<p
        class=\"wp-block-paragraph\">The Side Mount Garage Door Opener (SMO) from
        Skylink features a DC motor, soft start and stop technology, and built-in
        LED lighting to illuminate the garage without additional fixtures. The unit
        connects to the home\u2019s Wi-Fi and is compatible with Amazon Alexa, allowing
        users to remotely control their garage door. As with all garage doors, the
        automatic safety reversal system stops and reverses the door when obstructions
        are detected. The SMO comes with a backup battery that keeps it functional
        during power outages. <a href=\"https://www.skylinkhome.com/product-category/side-mount-garage-door-opener-smo/\"
        data-type=\"link\" data-id=\"https://www.skylinkhome.com/product-category/side-mount-garage-door-opener-smo/\"
        target=\"_blank\" rel=\"noreferrer noopener\">skylinkhome.com</a></p>\n\n\n\n<p
        class=\"wp-block-paragraph\"></p>\n<p>The post <a href=\"https://www.jlconline.com/products-tools/windows-doors/small-profile-garage-opener/\">Small
        Profile Garage Opener</a> appeared first on <a href=\"https://www.jlconline.com\">Journal
        of Light Construction</a>.</p>\n]]></content:encoded>\n\t\t\t\t\t\n\t\t\t\t\t<wfw:commentRss>https://www.jlconline.com/products-tools/windows-doors/small-profile-garage-opener/feed/</wfw:commentRss>\n\t\t\t<slash:comments>0</slash:comments>\n\t\t\n\t\t\n\t\t<post-id
        xmlns=\"com-wordpress:feed-additions:1\">188592</post-id>\t</item>\n\t\t<item>\n\t\t<title>Load
        Testing</title>\n\t\t<link>https://www.jlconline.com/deck-builder/load-testing/</link>\n\t\t\t\t\t<comments>https://www.jlconline.com/deck-builder/load-testing/#respond</comments>\n\t\t\n\t\t<dc:creator>redacted</dc:creator>\n\t\t<pubDate>Thu,
        01 Oct 2026 21:00:01 +0000</pubDate>\n\t\t\t\t<guid isPermaLink=\"false\">https://www.jlconline.com/?p=188561</guid>\n\n\t\t\t\t\t<description><![CDATA[<p>Load
        testing a helical pile is far simpler than it sounds. The height of the pile
        above grade is measured (A). Next, a cap is inserted into the pile to protect
        its top. This cap is slammed five times with a sledge hammer (B), and the
        pile\u2019s height is measured again. The sledge\u2019s weight is [&#8230;]</p>\n<p>The
        post <a href=\"https://www.jlconline.com/deck-builder/load-testing/\">Load
        Testing</a> appeared first on <a href=\"https://www.jlconline.com\">Journal
        of Light Construction</a>.</p>\n]]></description>\n\t\t\t\t\t\t\t\t\t\t<content:encoded><![CDATA[\n<p
        class=\"wp-block-paragraph\">Load testing a helical pile is far simpler than
        it sounds. The height of the pile above grade is measured (A). Next, a cap
        is inserted into the pile to protect its top. This cap is slammed five times
        with a sledge hammer (B), and the pile\u2019s height is measured again. The
        sledge\u2019s weight is specific to the size of the pile \u2014 a heavier
        hammer is used with bigger piles. The amount that the pile sinks indicates
        the soil bearing capacity, which an engineer will verify. </p>\n\n\n\n<p class=\"wp-block-paragraph\">The
        dynamic loading imposed by an impact load is surprisingly large and correlates
        to the static load a pile can handle. Load testing, as opposed to taking a
        torque reading, is done in several instances. One is when the pile bottoms
        out on a large rock. Another is when the soil is particularly slippery \u2014
        wet clay, for instance. With slippery soil, the bearing capacity can be higher
        than torque readings would suggest because the soil is lubricating the helix
        and reducing the force required to turn it. </p>\n\n\n\n<p class=\"wp-block-paragraph\">Return
        to <a href=\"https://www.jlconline.com/how-to/foundations/helical-pile-deck-foundations_s/\"
        data-type=\"link\" data-id=\"https://www.jlconline.com/how-to/foundations/helical-pile-deck-foundations_s/\">main
        article</a>.</p>\n<p>The post <a href=\"https://www.jlconline.com/deck-builder/load-testing/\">Load
        Testing</a> appeared first on <a href=\"https://www.jlconline.com\">Journal
        of Light Construction</a>.</p>\n]]></content:encoded>\n\t\t\t\t\t\n\t\t\t\t\t<wfw:commentRss>https://www.jlconline.com/deck-builder/load-testing/feed/</wfw:commentRss>\n\t\t\t<slash:comments>0</slash:comments>\n\t\t\n\t\t\n\t\t<post-id
        xmlns=\"com-wordpress:feed-additions:1\">188561</post-id>\t</item>\n\t</channel>\n</rss>\n"
