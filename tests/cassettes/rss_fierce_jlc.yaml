        \ <description>In a report issued October 2, the Texas attorney general said
        the company disclosed that Social Security numbers, addresses and medical
        information of almost 20 million people, including about 3 million Texans,
        Bloomberg reported.</description>\n  <pubDate>Oct 9, 2026 3:15pm</pubDate>\n
        \   <dc:creator>redacted</dc:creator>\n    <guid isPermaLink=\"true\">https://www.fiercehealthcare.com/e890ecf9-5648-4a8e-831e-cb8299977386</guid>\n
