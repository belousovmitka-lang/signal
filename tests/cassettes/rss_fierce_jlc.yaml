        Vivid Swinging Door is a part of the manufacturer\u2019s Vivid Collection,
        a line of windows and doors with large-format sizes and design-forward color
        palettes. The Swinging Door is available in up to three panels for a maximum
        width of 9 feet with a performance rating up to PG40 for air, water, and structural
        integrity. [&#8230;]</p>\n<p>The post <a href=\"https://www.jlconline.com/products-tools/windows-doors/large-swinging-doors/\">Large
        Swinging Doors</a> appeared first on <a href=\"https://www.jlconline.com\">Journal
        of Light Construction</a>.</p>\n]]></description>\n\t\t\t\t\t\t\t\t\t\t<content:encoded><![CDATA[\n<p
        class=\"wp-block-paragraph\">Marvin\u2019s Vivid Swinging Door is a part of
        the manufacturer\u2019s Vivid Collection, a line of windows and doors with
        large-format sizes and design-forward color palettes. The Swinging Door is
        available in up to three panels for a maximum width of 9 feet with a performance
        rating up to PG40 for air, water, and structural integrity. The collection
        features durable, low-maintenance Ultrex fiberglass inside and out with either
        an inswing or outswing option. <a href=\"https://www.marvin.com/\" data-type=\"link\"
        data-id=\"https://www.marvin.com/\" target=\"_blank\" rel=\"noreferrer noopener\">marvin.com</a></p>\n\n\n\n<p
        class=\"wp-block-paragraph\"></p>\n<p>The post <a href=\"https://www.jlconline.com/products-tools/windows-doors/large-swinging-doors/\">Large
        Swinging Doors</a> appeared first on <a href=\"https://www.jlconline.com\">Journal
        of Light Construction</a>.</p>\n]]></content:encoded>\n\t\t\t\t\t\n\t\t\t\t\t<wfw:commentRss>https://www.jlconline.com/products-tools/windows-doors/large-swinging-doors/feed/</wfw:commentRss>\n\t\t\t<slash:comments>0</slash:comments>\n\t\t\n\t\t\n\t\t<post-id
