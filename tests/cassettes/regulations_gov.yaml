      string: '{"data": {"id": "SBA-2026-0199-2943", "type": "comments", "links":
        {"self": "https://api.regulations.gov/v4/comments/SBA-2026-0199-2943"}, "attributes":
        {"commentOn": "09000064b95b6b08", "commentOnDocumentId": "SBA-2026-0199-2726",
        "duplicateComments": 0, "address1": null, "address2": null, "agencyId": "SBA",
        "city": null, "category": "Govt-Other", "comment": "To the Small Business
        Administration:<br/><br/>As a concerned citizen and shareholder in a West
        Virginia-based small business, I strongly oppose the proposed small business
        size rule. This proposal threatens the survival of authentic small businesses
        and distorts the definition of a small business entirely. I urge the Small
        Business Administration (SBA) to withdraw this rule immediately for the following
        reasons.<br/><br/>Flawed Impact Projections<br/>The SBA recently revised its
        impact projections, estimating that 4,000 to 6,000 mid-size contractors will
        newly gain small business status. This is a drastic reduction from the initial
        estimate of over 115,000. This severe discrepancy demonstrates a lack of reliable
        data and raises fundamental questions about the SBA&#39;s understanding of
        how this rule will impact the federal contractor community. <br/><br/>Extreme
        Threshold Jumps<br/>The proposed threshold increases are extreme. For example,
        under North American Industry Classification System (NAICS) code 541512, the
        size standard jumps from $34 million to $431 million in annual receipts, representing
        a 15-fold increase. Similarly, computer facilities management jumps from $37
        million to $531 million. A company generating $431 million annually possesses
        infrastructure and financial backing that do not exist at a $30 million company.
        These changes stretch the definition of &quot;small&quot; beyond logical limits.<br/><br/>Market
        Dilution and Increased Competition<br/>Authentic small businesses lack the
        massive business development resources, extensive past performance, and deep
        financial reserves of these much larger companies. The expansion punishes
        current small businesses by forcing them to compete against well-funded, mid-tier
        corporations for the same set-aside contracts. This creates a severe and insurmountable
        competitive imbalance.<br/><br/>Ignoring Pre-existing Declines<br/>The federal
        government has lost thousands of small business prime contractors over recent
        years. Opening small business programs to larger entities does nothing to
        reverse this trend. Artificially inflating small business participation numbers
        by relabeling mid-size companies ignores the structural loss of authentic
        small-scale innovators.<br/><br/>The federal government must protect authentic
        small businesses rather than redefine the market to accommodate large companies.
        I strongly urge the SBA to withdraw this proposed rule. <br/>", "country":
        "United States", "displayProperties": [{"name": "pageCount", "label": "Page
        Count", "tooltip": "Number of pages In the content file"}], "docAbstract":
        null, "docketId": "SBA-2026-0199", "documentType": "Public Submission", "email":
