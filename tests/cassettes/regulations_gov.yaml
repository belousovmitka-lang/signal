    body:
      string: '{"data": {"id": "SBA-2026-0265-0939", "type": "comments", "links":
        {"self": "https://api.regulations.gov/v4/comments/SBA-2026-0265-0939"}, "attributes":
        {"commentOn": "09000064b946e139", "commentOnDocumentId": "SBA-2026-0265-0001",
        "duplicateComments": 0, "address1": null, "address2": null, "agencyId": "SBA",
        "city": null, "category": "Private Industry", "comment": "Docket No.: SBA-2026-0265
        / RIN 3245-AI67<br/><br/>Rule: Small Business Size Standards: Revised Size
        Standards Methodology<br/><br/>STRONG OPPOSITION TO REVISED SIZE STANDARDS
        METHODOLOGY (DOCKET NO. SBA-2026-0265)<br/><br/>To the Small Business Administration:<br/><br/>I
        am writing as an active small business owner and federal contractor to register
        my strong opposition to the SBA&rsquo;s proposed Revised Size Standards Methodology.<br/><br/>While
        the SBA frames this methodology as a modernization and simplification of standards,
        its real-world effect will severely disadvantage genuine small enterprises.
        By collapsing distinct 6-digit NAICS codes into broad industry groupings,
        drastically elevating revenue caps, and switching industries to massive headcount
        standards (minimums of 500 employees), this rule invites mid-market enterprises
        and well-capitalized corporations directly into small business set-asides.<br/><br/>I
        strongly oppose this methodology for the following core reasons:<br/>Direct
        Dilution of Small Business Set-Asides: The SBA&#39;s own analysis indicates
        this change reclassifies tens of thousands of large and mid-tier firms&mdash;holding
        tens of billions in existing contracts&mdash;as &quot;small.&quot; When firms
        generating tens or hundreds of millions in revenue compete under the exact
        same set-aside banner as true small enterprises, set-asides cease to serve
        their statutory purpose under the Small Business Act.<br/><br/>Disproportionate
        Competitive Imbalance: True small businesses operate with lean margins, self-funded
        infrastructure, and local labor. Forcing true small concerns to bid against
        near-conglomerate entities with corporate balance sheets, extensive proposal-writing
        machinery, and massive bonding capacity creates an unlevel playing field.<br/><br/>Loss
        of Industry Granularity (6-Digit to 4/5-Digit NAICS): Eliminating the specific
        6-digit industry codes in favor of broad 4- and 5-digit aggregates erases
        operational realities. Specialized sectors require tailored revenue ceilings,
        not sweeping multi-hundred-million-dollar thresholds that only serve large
        market aggregators.<br/><br/>Flawed Formula: Replacing proven competitive
        health factors with broad &quot;average market size&quot; formulas ignores
        the barriers to capital, labor access, and contract entry that bona fide small
        firms face every day.<br/><br/>The Small Business Administration must protect
        the growth engine of the American economy&mdash;actual small businesses&mdash;not
        artificially expand the definition to make agency set-aside quotas easier
        to meet on paper by awarding contracts to near-large competitors.<br/><br/>I
        urge the SBA to withdraw this methodology revision and maintain standards
        that protect true small business participation.<br/><br/>Respectfully submitted,<br/>An
