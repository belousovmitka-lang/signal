    body:
      string: '{"data": {"id": "SBA-2026-0298-0006", "type": "comments", "links":
        {"self": "https://api.regulations.gov/v4/comments/SBA-2026-0298-0006"}, "attributes":
        {"commentOn": "09000064b951d3b8", "commentOnDocumentId": "SBA-2026-0298-0001",
        "duplicateComments": 0, "address1": null, "address2": null, "agencyId": "SBA",
        "city": null, "category": null, "comment": "The notice was executed by Douglas
        Robertson in his capacity as &quot;Deputy Chief Information Officer (Alternate
        Authorizing Official)&quot; (91 FR 57952). The title &quot;Authorizing Official&quot;
        is a FISMA/NIST SP 800-37 cybersecurity ATO role that conveys zero statutory
        authority to promulgate Privacy Act notices or modify System of Records Notice
        (SORN) routine uses under 5 U.S.C. &sect; 552a or OMB Circular A-108.<br/><br/>OMB
        Circular A-108 requires Privacy Act matching notices to be executed by the
        Agency Head or the formally designated Senior Agency Official for Privacy
        (SAOP). Bypassing the designated Acting Chief Privacy Officer (Michael Post)
        to have a Deputy <br/>   CIO execute the notice under a FISMA IT security
        title violates mandatory executive branch <br/>   privacy regulations and
        renders the notice void ab initio under APA 5 U.S.C. &sect; 706(2)(C) as <br/>   agency
        action taken in excess of statutory jurisdiction and authority.", "country":
