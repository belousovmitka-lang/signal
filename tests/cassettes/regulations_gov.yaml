        "duplicateComments": 0, "address1": null, "address2": null, "agencyId": "SBA",
        "city": null, "category": null, "comment": "The notice was executed by Douglas
        Robertson in his capacity as &quot;Deputy Chief Information Officer (Alternate
        Authorizing Official)&quot; (91 FR 57952). The title &quot;Authorizing Official&quot;
        is a FISMA/NIST SP 800-37 cybersecurity ATO role that conveys zero statutory
        authority to promulgate Privacy Act notices or modify System of Records Notice
        (SORN) routine uses under 5 U.S.C. &sect; 552a or OMB Circular A-108.<br/><br/>Violation
        of OMB Circular A-108 &sect; 6: OMB Circular A-108 requires Privacy Act matching
        notices to be executed by the Agency Head or the formally designated Senior
        Agency Official for Privacy (SAOP). Bypassing the designated Acting Chief
        Privacy Officer (Michael Post) to have a Deputy CIO execute the notice under
        a FISMA IT security title violates mandatory executive branch privacy regulations
        and renders the notice void ab initio under APA 5 U.S.C. &sect; 706(2)(C)
