    body:
      string: '{"data": {"id": "SBA-2026-0298-0003", "type": "comments", "links":
        {"self": "https://api.regulations.gov/v4/comments/SBA-2026-0298-0003"}, "attributes":
        {"commentOn": "09000064b951d3b8", "commentOnDocumentId": "SBA-2026-0298-0001",
        "duplicateComments": 0, "address1": null, "address2": null, "agencyId": "SBA",
        "city": null, "category": null, "comment": "Under Mathews v. Eldridge, 424
        U.S. 319 (1976), evaluating whether agency procedures satisfy <br/>Fifth Amendment
        Procedural Due Process requires balancing three distinct factors:<br/>1. The
        Private Interest at Stake: Borrowers and participating financial institutions
        across <br/>   15 SBA programs hold protected property interests in approved
        financial assistance and <br/>   executed guaranty commitments (Board of Regents
        v. Roth, 408 U.S. 564). Freezing capital or <br/>   revoking guaranties causes
        immediate insolvency, capital interruption, and irreparable <br/>   commercial
        harm.<br/>2. The Risk of Erroneous Deprivation: Automated clearance against
        Treasury&rsquo;s DNP Working System <br/>   carries a high risk of false-positive
        matches due to stale data, name collisions, and TIN <br/>   transposition
        errors. Executing adverse flags without mandatory independent verification
        and <br/>   a pre-deprivation contest period maximizes the probability of
        arbitrary deprivation. The <br/>   probable value of substitute safeguards,
        specifically a mandatory 30-day written contest <br/>   window under 5 U.S.C.
        &sect; 552a(p), is overwhelming, as it enables rapid resolution of database
        <br/>   errors prior to financial injury.<br/>3. The Government&#39;s Burden:
        Establishing an automated 30-day pre-adverse action notice and contest <br/>   protocol
        imposes de minimis administrative or fiscal burdens on the SBA. Holding loan
        approvals <br/>   in abeyance during the 30-day window preserves federal funds
        while fulfilling both PIIA payment <br/>   integrity mandates and constitutional
        due process commands.<br/>Because the weight of Prongs 1 and 2 vastly exceeds
        the minimal administrative burden under Prong 3, <br/>operating this matching
        program without binding &sect; 552a(p) 30-day pre-adverse action contest <br/>protocols
        violates the Fifth Amendment to the United States Constitution.<br/><br/>Need
        for Data Integrity Board Statutory Oversight (5 U.S.C. &sect; 552a(u))<br/>While
        31 U.S.C. &sect; 3354 authorizes Treasury and OMB to waive 5 U.S.C. &sect;
        552a(o) (the bilateral Computer Matching Agreement text), it contains no statutory
        authorization to waive or suspend 5 U.S.C. &sect; 552a(u). The SBA Data Integrity
        Board (DIB) remains bound by non-waivable statutory duties to oversee, review,
        and certify all agency matching activities. Under &sect; 552a(u)(3)(B), the
        SBA DIB is required to review all matching programs to guarantee compliance
        with applicable privacy laws and OMB guidelines. Releasing a modified matching
        notice violating &sect; 552a(e)(12)), an unpromulgated routine use &sect;
        552a(e)(11), and an overbroad qualitative record payload violating &sect;
        552a(e)(1) demonstrates that the DIB either failed to perform its mandatory
        statutory review or issued an ultra vires approval of an illegal program.
        To the extent the SBA DIB has omitted this expanded 15-program DNP matching
        program from its annual DIB Reports submitted to OMB, the Senate Committee
        on Homeland Security and Governmental Affairs, and the House Committee on
        Oversight and Accountability pursuant to 5 U.S.C. &sect; 552a(u)(3)(G), the
        agency is operating an unvetted, unreported matching infrastructure in violation
        of federal statutory reporting mandates and federal law. ", "country": null,
        "displayProperties": [{"name": "pageCount", "label": "Page Count", "tooltip":
        "Number of pages In the content file"}], "docAbstract": null, "docketId":
