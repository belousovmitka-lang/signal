    body:
      string: '{"data": {"id": "SBA-2026-0265-0940", "type": "comments", "links":
        {"self": "https://api.regulations.gov/v4/comments/SBA-2026-0265-0940"}, "attributes":
        {"commentOn": "09000064b946e139", "commentOnDocumentId": "SBA-2026-0265-0001",
        "duplicateComments": 0, "address1": null, "address2": null, "agencyId": "SBA",
        "city": null, "category": null, "comment": "Re: Opposition to Proposed Small
        Business Size Standards  <br/>Docket SBA-2026-0199; RIN 3245-AI67<br/><br/>To
        the U.S. Small Business Administration:<br/><br/>I oppose the proposed increases
        to small-business size standards and request that SBA withdraw the proposed
        rule as drafted.<br/><br/>As a veteran entrepreneur working in emergency management,
        drone services, training, and emergency preparedness technology, I am concerned
        that these changes would weaken access to federal opportunities for smaller
        businesses trying to establish themselves.<br/><br/>The proposed increases
        are substantial. The management consulting threshold would rise from $24.5
        million to $295 million, computer systems design from $34 million to $531
        million, and professional and management development training from $15 million
        to $157 million. These changes would place emerging firms in the same small-business
        contracting category as companies with vastly greater resources.<br/><br/>My
        concern is practical: larger firms can maintain dedicated proposal teams,
        extensive past performance, greater working capital, and the capacity to pursue
        multiple contracts simultaneously. Calling both firms &ldquo;small&rdquo;
        does not eliminate those competitive differences. Expanding eligibility could
        make it harder for smaller firms to win the contracts they need to grow.<br/><br/>SBA&rsquo;s
        stated goal of avoiding a growth cliff deserves consideration. However, moving
        that cliff to hundreds of millions of dollars risks transferring the disadvantage
        to businesses at the beginning of their growth journey. SBA should demonstrate
        how its approach protects their competitive position.<br/><br/>I also oppose
        removing an explicit maximum from the size-standard methodology without adequate
        safeguards. Broad industry groupings and employee-based tests should not obscure
        meaningful differences in revenue, resources, and contracting capacity.<br/><br/>Before
        adopting any replacement proposal, I request that SBA:<br/><br/>1. Publish
        an industry-specific analysis of the likely effects on existing small businesses,
        including startups and veteran-owned firms.<br/>2. Measure expected changes
        in contract dollars, award concentration, and opportunities for new entrants&mdash;not
        simply the number of companies qualifying as small.<br/>3. Evaluate smaller
        adjustments supported by current industry evidence rather than the proposed
        increases.<br/>4. Explore separate transition mechanisms for growing midsized
        firms, including seeking congressional authority where necessary.<br/>5. Preserve
        meaningful industry distinctions and publish safeguards against concentrating
        small-business awards among the largest eligible firms.<br/><br/>Federal small-business
        goals should reflect meaningful opportunities for smaller enterprises. Reclassifying
        larger contractors should not substitute for expanding access for emerging
        businesses.<br/><br/>Please withdraw the proposed rule as drafted and develop
        an approach that preserves a realistic path into federal contracting for smaller
        businesses.<br/><br/>Respectfully,<br/><br/>Jae S. Brown", "country": null,
        "displayProperties": [{"name": "pageCount", "label": "Page Count", "tooltip":
        "Number of pages In the content file"}], "docAbstract": null, "docketId":
