        "duplicateComments": 0, "address1": null, "address2": null, "agencyId": "SBA",
        "city": null, "category": "Private Industry", "comment": "We are a ~100-employee
        certified federal IT services firm in a rural HUBZone, commenting for ourselves
        and similarly situated small businesses. See attached. Our points: (1) Raising
        5415 from $34M to $531M puts 100-person and ~2,500-person firms in one set-aside
        pool; we propose a two-tier standard separating set-aside eligibility from
        mid-tier relief. (2) Dropping the federal contracting factors ignores where
        dominance operates; restore a federal market factor where obligations exceed
        $20M. (3) Removing the 150-employee 541519 IT VAR exception makes volume resellers
        small on SEWP small business categories; retain it. (4) The IRFA counts firms
        losing status (&lt;200) but not dollars shifting away from firms under $34M.
        (5) $71B in newly small obligations lets agencies meet the 23% goal under
        15 U.S.C. 644(g) with no new dollars to today&#39;s small firms; require split
        reporting for five years. (6) Girth and Brown (2018) reflects survivors, not
        entrants. (7) Cap protege eligibility; set explicit transition rules for multiple-award
        vehicle on-ramps. We request SBA publish 5415 set-aside dollars by receipts
        band before finalizing.<br/>Sources: Extension notice, 91 FR 60524 &middot;
        NPRM, 91 FR 53741 &middot; Thompson Hine summary &middot; Sidley summary &middot;
