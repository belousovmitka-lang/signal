    body:
      string: '{"data": {"id": "SBA-2026-0199-2941", "type": "comments", "links":
        {"self": "https://api.regulations.gov/v4/comments/SBA-2026-0199-2941"}, "attributes":
        {"commentOn": "09000064b95b6b08", "commentOnDocumentId": "SBA-2026-0199-2726",
        "duplicateComments": 0, "address1": null, "address2": null, "agencyId": "SBA",
        "city": null, "category": "Govt-Other", "comment": "I am the Vice President
        of Finance at Pinnacle Petroleum, Inc., a fuel distributor that competes for
        federal set-aside work under NAICS 324110 and NAICS 424720. I write in opposition
        to the proposed changes as applied to these codes, for two reasons I believe
        are specific enough to warrant the SBA&rsquo;s attention.<br/><br/>First,
        employee count is a poor measure of size in this industry.<br/><br/>Fuel supply
        is capital and asset intensive, not labor intensive. What determines whether
        a company can win a federal fuel contract is refining capacity, terminal and
        rack access, storage, and the supply agreements that come with volume. None
        of that appears in a headcount. A refiner and a distributor employing the
        same number of people are not peers in any sense relevant to a procurement
        outcome. The refiner has a structurally lower cost of goods, and no amount
        of operational discipline on the distributor&rsquo;s side closes that gap.<br/><br/>This
        makes an employee ceiling an unusually weak constraint in petroleum. It admits
        firms whose entire competitive advantage lies in the dimension the headcount
        test does not measure. Raising the threshold for industry group 3241 to 1,500
        employees understates, considerably, how much larger in operational terms
        the newly eligible competitors would be.<br/><br/>Second, consolidating to
        four digit industry groups erases a distinction that matters here.<br/><br/>Under
        the proposal, NAICS 324110 would be governed by the standard for group 3241,
        Petroleum and Coal Products Manufacturing, and NAICS 424720 by the standard
        for group 4247, which also contains NAICS 424710, Bulk Stations and Terminals.<br/><br/>These
        are not interchangeable businesses. A distributor that buys at the rack and
        delivers to the end customer operates on a fundamentally different cost structure
        than a company that owns the terminal, and a refiner is different again. Setting
        a single threshold across the group means the firms sitting at the top of
        each bracket are structurally advantaged against precisely the businesses
        the set-aside program was created to support. Consolidation may reduce administrative
        complexity, but in this sector it achieves that by grouping firms that do
        not compete on comparable terms.<br/><br/>Request<br/><br/>I respectfully
        ask that the SBA retain six digit size standards for NAICS 324110 and NAICS
        424720 rather than folding them into their four digit groups, and retain the
        current employee thresholds for those codes.<br/><br/>If the SBA proceeds
        with consolidation, I would ask that it consider pairing the employee threshold
        in petroleum industries with a capacity or asset based qualifier, such as
        refining throughput or owned terminal capacity. A measure of that kind would
        capture what actually determines competitiveness in fuel supply, which an
        employee count on its own does not.<br/><br/>Respectfully,<br/>Nicholas Byers<br/>Vice
        President of Finance<br/>Pinnacle Petroleum, Inc.", "country": null, "displayProperties":
        [{"name": "pageCount", "label": "Page Count", "tooltip": "Number of pages
        In the content file"}], "docAbstract": null, "docketId": "SBA-2026-0199",
        "documentType": "Public Submission", "email": null, "fax": null, "field1":
        null, "field2": null, "fileFormats": null, "firstName": null, "govAgency":
        null, "govAgencyType": null, "objectId": "09000064b9655e25", "lastName": null,
        "legacyId": null, "modifyDate": "2026-10-09T21:42:48Z", "organization": "Pinnacle
