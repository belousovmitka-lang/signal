      string: '{"data": {"id": "SBA-2026-0265-0941", "type": "comments", "links":
        {"self": "https://api.regulations.gov/v4/comments/SBA-2026-0265-0941"}, "attributes":
        {"commentOn": "09000064b946e139", "commentOnDocumentId": "SBA-2026-0265-0001",
        "duplicateComments": 0, "address1": null, "address2": null, "agencyId": "SBA",
        "city": "redacted", "category": "Private Industry", "comment": "Dear Administrator
        Kelly Loeffler,<br/><br/>I am submitting these comments in response to SBA&#39;s
        extension of its proposed revisions to small business size standards.<br/><br/>As
        an architect with 15 years of experience, a sole proprietorship owner since
        2021, and the Board Secretary of the Boston Society of Architects, my local
        chapter of the American Institute of Architects (AIA), I appreciate the opportunity
        to comment. Architecture is overwhelmingly a small-business profession.<br/><br/>An
        upcoming 2026 AIA Firm Survey found more than 19,000 U.S. architecture firms:
        28% are sole practitioners, 32% have two to four employees, and 15% have five
        to nine, so a substantial majority have fewer than ten employees. <br/><br/>Under
        NAICS 541310 (Architectural Services), the current size standard is $12.5
        million in receipts. SBA now proposes $135 million, a 980% increase and 10.8
        times the current standard. Its August 2025 proposal, by comparison, was $16
        million.<br/><br/>I encourage SBA to consider merely adjusting the amount
        in receipts to reflect inflation. On behalf of myself/my firm and AIA, thank
        you for your time.<br/><br/>Sincerely,<br/>Kyle Barker<br/>Primary Projects,
        Principal<br/>Boston Society of Architects, Board Secretary", "country": "United
        States", "displayProperties": [{"name": "pageCount", "label": "Page Count",
        "tooltip": "Number of pages In the content file"}], "docAbstract": null, "docketId":
