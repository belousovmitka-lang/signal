      string: '{"data": {"id": "SBA-2026-0199-2946", "type": "comments", "links":
        {"self": "https://api.regulations.gov/v4/comments/SBA-2026-0199-2946"}, "attributes":
        {"commentOn": "09000064b95b6b08", "commentOnDocumentId": "SBA-2026-0199-2726",
        "duplicateComments": 0, "address1": null, "address2": null, "agencyId": "SBA",
        "city": null, "category": "Govt-Other", "comment": "On behalf of Woman-Owned
        Small Businesses (WOSB) and HUBZone-certified software development and IT
        services firms, I am writing to express our strong concerns regarding the
        Small Business Administration&rsquo;s (SBA) proposed rule regarding Small
        Business Size Standards (91 FR 53741) and the underlying Revised Size Standards
        Methodology (91 FR 54096).<br/>While we appreciate the SBA extending the comment
        period to November 20, 2026, to allow for comprehensive industry evaluation,
        we believe the proposed adjustments risk harming small businesses in the federal
        technology sector and weakening the federal industrial base.<br/>Specifically,
        we oppose these proposed changes on the following grounds:<br/>1. Premature
        &quot;Graduation&quot; Creates an Unfair &quot;Mid-Tier Trap&quot;<br/>For
        small IT and software development contractors operating under primary NAICS
        codes such as 541512 (Computer Systems Design Services) and 541511 (Custom
        Computer Programming Services), small business status is essential to securing
        set-aside contracts that allow us to build capacity, invest in technical talent,
        and earn advanced industry credentials (such as CMMI and ISO certifications).
        Restrictive or inadequate size standard adjustments force growing small businesses
        out of set-aside eligibility before they have built the capital, infrastructure,
        or scale necessary to compete against billion-dollar defense and IT integrators
        in full-and-open competition.<br/>2. Disproportionate Impact on Socioeconomic
        Programs (WOSB &amp; HUBZone)<br/>We take pride in driving high-tech economic
        growth and bringing software engineering opportunities to HUBZone areas. Socioeconomic
        programs like WOSB and HUBZone rely on realistic, stable size thresholds to
        foster equitable federal contracting opportunities. Lowering thresholds or
        under-adjusting for real-world cost increases directly penalizes firms operating
        in designated development zones and risks shrinking the overall pool of qualified,
        small socioeconomic prime contractors available to federal agencies.<br/>3.
        Failure to Account for Inflation and Technical Labor Costs<br/>The cost of
        technical talent, cloud infrastructure, DevSecOps tools, and cybersecurity
        compliance (e.g., CMMC requirements) has escalated significantly over recent
        years. Size standard calculations based purely on top-line revenue&mdash;without
        fully accounting for input cost inflation&mdash;distort a company&#39;s true
        scale. Revenue increases driven primarily by inflation and labor rate increases
        do not reflect structural corporate growth, yet they place small businesses
        at risk of prematurely exceeding size thresholds.<br/>4. Harm to Federal Agency
        Innovation and Competition<br/>Restricting the small business pipeline reduces
        agency access to agile, innovative, and cost-effective IT providers. When
        mid-tier small businesses are forced into unrestricted procurements prematurely,
        agencies lose the niche technical expertise, responsiveness, and specialized
        capabilities that specialized small businesses provide.<br/>Conclusion &amp;
        Recommendation<br/>We urge the SBA to reassess its proposed methodology and
        refrain from implementing any reduction or overly restrictive adjustments
        to size standards within the IT, software engineering, and technical services
        sectors (NAICS 541511, 541512, 541519). We recommend that the SBA adopt a
        methodology that incorporates higher baseline thresholds, accounts for persistent
        technical labor inflation, and provides a smoother transition bridge for growing
        small businesses entering the mid-tier market.<br/>Thank you for your consideration
        of these comments and your continued support of small business contractors.",
        "country": null, "displayProperties": [{"name": "pageCount", "label": "Page
        Count", "tooltip": "Number of pages In the content file"}], "docAbstract":
        null, "docketId": "SBA-2026-0199", "documentType": "Public Submission", "email":
