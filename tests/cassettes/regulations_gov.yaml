    body:
      string: '{"data": {"id": "SBA-2026-0265-0938", "type": "comments", "links":
        {"self": "https://api.regulations.gov/v4/comments/SBA-2026-0265-0938"}, "attributes":
        {"commentOn": "09000064b946e139", "commentOnDocumentId": "SBA-2026-0265-0001",
        "duplicateComments": 0, "address1": null, "address2": null, "agencyId": "SBA",
        "city": null, "category": "Private Industry", "comment": "In summary: This
        kills my spirit as a true small business owner just starting in government
        contracting. The headwinds individual operators will face starting out will
        be more difficult, regardless of the assistance resources like apex accel
        provide. What is needed is deconsolidation of major defense industry players.
        The idea of 6,000 employees being a small business is absurd, and perpetrated
        by a woman who&#39;s worth over a billion dollars. That premise alone is indefensible
        and un-American and borderline comical. <br/><br/>1. Suffocation of True Entry-Level
        Businesses and Reduced Competition<br/>The SBA&rsquo;s fundamental mandate
        is to support grassroots entrepreneurs, micro-enterprises, and emerging small
        businesses as they enter federal contracting. By redefining &quot;small&quot;
        to include firms generating up to $531 million in revenue or employing 3,600+
        workers, this rule completely destroys the ramp for new entrants.<br/><br/>When
        a 5-person startup or 20-person regional contractor bids under a small business
        set-aside, they will now be forced to compete directly against multi-hundred-million-dollar
        corporations. These large entities possess dedicated, fully-funded capture
        teams, extensive corporate overhead, deeply established agency relationships,
        and decades of past performance data.<br/><br/>Rather than increasing competition,
        this change shrinks it. Contracting officers will naturally seek to mitigate
        risk by awarding set-aside dollars to giant &quot;small&quot; firms, locking
        out genuine emerging businesses and driving new players out of the industrial
        base entirely.<br/><br/>2. Unjust Subsidies for Massive Corporations Masked
        as &quot;Small&quot;<br/>Categorizing a company with thousands of employees
        or half a billion dollars in revenue as a &quot;small business&quot; is an
        absurd distortion of language and economic reality.<br/><br/>Corporate Welfare:
        Firms of this magnitude already possess sufficient capital, market access,
        and operational scale to compete in open, unrestricted procurements alongside
        traditional prime contractors.<br/><br/>Distortion of Set-Aside Intent: Giving
        these entities access to small business set-aside dollars, SBA-backed lending
        programs, specialized subcontracts, and technical assistance provides a massive
        government-sponsored break to mature corporate entities at the direct expense
        of taxpayers and actual small business owners.<br/><br/>3. Defense Industrial
        Base Consolidation and Weakened Supply Chains<br/>A healthy defense industrial
        base requires deep, decentralized capacity across thousands of agile tier-3
        and tier-4 suppliers.<br/><br/>Accelerated Industry Roll-Ups: By eliminating
        upper size caps and raising employee thresholds into the thousands, private
        equity firms and mid-tier consolidators will be incentivized to execute aggressive
        roll-up strategies&mdash;buying up smaller, specialized vendors while retaining
        protected &quot;small business&quot; status.<br/><br/>Brittle Supply Lines:
        Consolidating federal spending into a smaller number of large &quot;small&quot;
        contractors creates single points of failure. When true micro-businesses go
        under or are absorbed, the industrial base loses specialized manufacturing,
        niche technological expertise, and regional supply chain resilience. This
        leaves critical defense and civilian supply chains fragile and vulnerable
        to disruption.<br/><br/>4. Heightened Vulnerability to Foreign Influence and
        Lobbying<br/>Inflating thresholds allows mid-sized defense contractors and
        large corporate entities to operate inside protected government set-aside
        channels while deploying multi-million-dollar government affairs, lobbying,
        and PAC budgets.<br/><br/>As the threshold expands to engulf major international
        joint ventures and global firms with complex holding structures, it becomes
        vastly more difficult for federal regulators to monitor ownership networks.
        This creates structural backdoors for foreign-backed entities, offshore capital,
        or compromised supply chains to exploit small business preference programs
        that were built to protect domestic innovation.<br/><br/>5. Widespread Insolvency
        and Job Losses Across Micro-Enterprises<br/>The federal government often serves
        as the primary revenue stream for small, regional, and sub-contracting firms.
        According to the SBA&#39;s own analysis, these proposed rules will allow over
        37,000 mid-to-large contractors&mdash;representing $71 billion in federal
        contract obligations&mdash;to suddenly flood the small business set-aside
        market.<br/><br/>If these multi-hundred-million-dollar corporations are permitted
        to capture small business set-aside awards, hundreds of thousands of micro-enterprises
        (accounting for the vast majority of true small business employment in America)
        will see their contracting pipelines dry up. As these smaller firms fail to
        win set-asides and inevitably go out of business, the result will be widespread
        industry-wide layoffs, destroying local jobs and dismantling the grassroots
        foundation of the American economy.", "country": null, "displayProperties":
        [{"name": "pageCount", "label": "Page Count", "tooltip": "Number of pages
        In the content file"}], "docAbstract": null, "docketId": "SBA-2026-0265",
