        {"commentOn": "09000064b95b6b08", "commentOnDocumentId": "SBA-2026-0199-2726",
        "duplicateComments": 0, "address1": null, "address2": null, "agencyId": "SBA",
        "city": "redacted", "category": "Other", "comment": "I oppose this proposal.  I&#39;d
        just like to say, I think it is great if someone wants to expand their business
        to the sizes mentioned in the proposal changes, and businesses should be encouraged
        to do so - but it should not work to penalize those starting out.  These systems
        are put in place to protect small businesses, and this proposed change would
        be antithetical to the purpose of the Small Business Administration and its
        existence by rendering its services to actual small businesses far less effective.  Furthermore,
        the businesses that will take advantage of these changes are not small businesses,
        nor do they actually even need the support of the SBA to begin with.  These
        changes seem to be designed for the purpose of enabling frictionless sole
        sourcing to larger corporations that would not have previously been considered
        small businesses and will certainly erode opportunity for actual small businesses
        attempting to gain a foothold.  I plead that the original reasons these existing
        policies were created in the first place be heavily considered.", "country":
