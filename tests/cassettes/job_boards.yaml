        \"updated_at\": \"2026-08-10T13:39:52-04:00\", \"requisition_id\": \"26NEW26\",
        \"title\": \"Director, Customer Success Operations\", \"company_name\": \"Tekmetric\",
        \"first_published\": \"2026-08-09T16:31:08-04:00\", \"language\": \"en\",
        \"application_deadline\": null, \"content\": \"&lt;div class=&quot;content-intro&quot;&gt;&lt;p&gt;&lt;strong&gt;&lt;u&gt;About
        Tekmetric&lt;/u&gt;&lt;/strong&gt;&lt;/p&gt;\\n&lt;p&gt;Tekmetric is the all-in-one,
        cloud-based software helping auto repair shops run smarter, grow faster, and
        serve customers better. &lt;br&gt;&lt;br&gt;Built by a shop owner and shaped
        by the needs of the industry, Tekmetric brings together innovation, real-world
        experience, and a thriving community to help shops thrive - not just survive.&amp;nbsp;From
        running a shop, to securing payments to engaging customers, our platform simplifies
        operations so shop owners can focus on what really matters: delivering exceptional
        service, earning trust, and growing sustainably.&lt;/p&gt;\\n&lt;p&gt;Officially
        founded in Houston in 2017, Tekmetric has grown from a single shop\u2019s
        vision to the industry\u2019s leading solution - all by staying true to our
        values of transparency, integrity, innovation, and a service-first mindset.&amp;nbsp;&lt;br&gt;&lt;br&gt;But
        we\u2019re not just building shop management software. We\u2019re building
        a movement. We\u2019re empowering repair shops to rise above the daily grind,
        create meaningful connections with their customers, and lead the industry
        forward - one interaction at a time.&lt;/p&gt;\\n&lt;p&gt;Come build with
        us. Join the journey. Shape the future of auto repair.&lt;/p&gt;\\n&lt;p&gt;&lt;span
        style=&quot;text-decoration: underline;&quot;&gt;&lt;strong&gt;Working the
        Tekmetric Way&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\\n&lt;p&gt;At Tekmetric,
        we\u2019re building a culture where winning matters - not for ego, but because
        when our customers win, we win together.&amp;nbsp;&lt;/p&gt;\\n&lt;p&gt;We
        move fast, stay curious, and take full ownership of our results \u2014 no
        excuses, no finger-pointing. If you thrive in ambiguity, take initiative,
        and view honest feedback as fuel for growth, you\u2019ll feel right at home
        here.&lt;/p&gt;\\n&lt;p&gt;We\u2019re direct but respectful, ambitious yet
        grounded, and collaborative at every level. Everyone leads through impact
        and is encouraged to speak up, share ideas, and challenge assumptions (even
        your manager\u2019s). This is a place for builders, not bystanders.&lt;/p&gt;\\n&lt;p&gt;Success
        here takes focus, follow-through, and a willingness to roll up your sleeves
        \u2014 but if you\u2019re driven by meaningful work and real results, it\u2019s
        deeply rewarding. You\u2019ll join a team that cares about the work, supports
        one another, and takes smart risks to achieve bold goals. &lt;strong&gt;Be
        yourself, stay mission-focused, and you\u2019ll thrive.&lt;/strong&gt; If
        that energizes you, we can\u2019t wait to meet you.&lt;/p&gt;\\n&lt;p&gt;&lt;strong&gt;Where
        We Work&lt;/strong&gt;: At Tekmetric, great work happens anywhere, but great
        teams are built through intentional connection. We offer hybrid and remote
        work models based on your proximity to our office hubs. Because we value in-person
        collaboration, travel is an expected part of every role. We come together
        several times a year for team and company-wide offsites to align on goals
        and strengthen relationships. Attendance at these events is expected and fully
        supported.&lt;/p&gt;&lt;/div&gt;&lt;p&gt;&lt;span style=&quot;text-decoration:
        underline;&quot;&gt;&lt;strong&gt;About the Role&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\\n&lt;p&gt;Tekmetric
        is building the operating system for the modern auto repair shop - and the
        Onboarding &amp;amp; Professional Services team is how we make that real for
        every new customer. As Director, Customer Success Operations, you&#39;ll be
        the operational engine behind a ~70-person team and the systems they use every
        day.&lt;/p&gt;\\n&lt;p&gt;This is a builder role. In the near term, you&#39;ll
        own the work directly - running analytics, standing up enablement programs,
        and designing processes hands-on. Over time, you&#39;ll hire and develop the
        team around you, starting with an Enablement Manager and a Data Analyst. You&#39;ll
        report directly to the VP of Onboarding &amp;amp; Professional Services and
        sit at the intersection of data, tooling, and team performance.&lt;/p&gt;\\n&lt;p&gt;If
        you love turning messy operational questions into clear answers, and you get
        energy from building the infrastructure that makes customer-facing teams great,
        this role is for you.&lt;/p&gt;\\n&lt;p&gt;&lt;span style=&quot;text-decoration:
        underline;&quot;&gt;&lt;strong&gt;What You&#39;ll Own&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\\n&lt;p&gt;&lt;strong&gt;Team
        Leadership &amp;amp; Development&lt;/strong&gt;&lt;/p&gt;\\n&lt;ul&gt;\\n&lt;li&gt;Build
        and lead a CS Operations team over time, starting with two planned hires:
        an Enablement Manager and a Data Analyst - roles you&#39;ll own directly before
        hiring into them&lt;/li&gt;\\n&lt;li&gt;Recruit, develop, and retain top operational
        talent as the team scales&lt;/li&gt;\\n&lt;li&gt;Model a culture of clarity,
        accountability, and continuous improvement&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;p&gt;&lt;strong&gt;Analytics
        &amp;amp; Insights&lt;/strong&gt;&lt;/p&gt;\\n&lt;ul&gt;\\n&lt;li&gt;Own the
        metrics and reporting layer for the onboarding org - kickoff completion rate,
        rebook rate, time-to-live, graduation rate, CSAT, and early-churn indicators&lt;/li&gt;\\n&lt;li&gt;Identify
        friction points and opportunities through product usage data, Vitally data,
        and Salesforce reporting&lt;/li&gt;\\n&lt;li&gt;Surface actionable insights
        to the VP and team managers on a regular cadence - not just dashboards, but
        recommendations&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;p&gt;&lt;strong&gt;Enablement&lt;/strong&gt;&lt;/p&gt;\\n&lt;ul&gt;\\n&lt;li&gt;Design
        and run the internal training program for COMs and managers before transitioning
        ownership to a dedicated Enablement Manager hire&lt;/li&gt;\\n&lt;li&gt;Ensure
        the team stays current on product releases, system changes (Vitally, Salesforce,
        Gong), and process updates&lt;/li&gt;\\n&lt;li&gt;Partner with cross-functional
        teams (Product, Support, Training) to translate external changes into internal
        readiness&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;p&gt;&lt;strong&gt;Process &amp;amp;
        Systems&lt;/strong&gt;&lt;/p&gt;\\n&lt;ul&gt;\\n&lt;li&gt;Own the operational
        design of the onboarding workflow - from AE-to-COM handoff through the hypercare-to-CS
        graduation handoff&lt;/li&gt;\\n&lt;li&gt;Drive adoption and optimization
        of the CS tech stack, primarily Vitally, Salesforce, and Gong&lt;/li&gt;\\n&lt;li&gt;Identify
        and eliminate manual processes; build playbooks, automations, and SOPs that
        scale&lt;/li&gt;\\n&lt;li&gt;Partner with internal ops stakeholders on data
        infrastructure, billing integrations, and tooling decisions&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;p&gt;&lt;strong&gt;Cross-Functional
        Partnership&lt;/strong&gt;&lt;/p&gt;\\n&lt;ul&gt;\\n&lt;li&gt;Serve as an
        operational partner to the Customer Success (CSM) team - sharing data, insights,
        playbooks, and process frameworks that support the full post-sale customer
        journey&lt;/li&gt;\\n&lt;li&gt;Help ensure continuity between the onboarding
        handoff and the CS team&#39;s retention motion, surfacing patterns that affect
        both sides of the customer lifecycle&lt;/li&gt;\\n&lt;li&gt;Collaborate with
        CS leadership on shared tooling, reporting, and enablement needs where applicable&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;p&gt;&lt;strong&gt;Strategic
        Support&lt;/strong&gt;&lt;/p&gt;\\n&lt;ul&gt;\\n&lt;li&gt;Serve as a thought
        partner to the VP on OKR development, capacity planning, and org design&lt;/li&gt;\\n&lt;li&gt;Help
        translate business goals into measurable operational programs&lt;/li&gt;\\n&lt;li&gt;Contribute
        to cross-functional initiatives with Sales, Customer Success, and Product&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;p&gt;&lt;span
        style=&quot;text-decoration: underline;&quot;&gt;&lt;strong&gt;What We&#39;re
        Looking For&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\\n&lt;ul&gt;\\n&lt;li&gt;6+
        years in customer success operations, revenue operations, or a related field
        - ideally in B2B SaaS&lt;/li&gt;\\n&lt;li&gt;3+ years managing or leading
        teams&lt;/li&gt;\\n&lt;li&gt;Strong analytical chops - you&#39;re comfortable
        pulling data, building dashboards, and translating numbers into decisions&lt;/li&gt;\\n&lt;li&gt;Experience
        designing or owning internal enablement or training programs&lt;/li&gt;\\n&lt;li&gt;A
        systems thinker who can map a process end-to-end and spot where things break&lt;/li&gt;\\n&lt;li&gt;Clear
        communicator - equally comfortable presenting to the VP and writing a SOP
        for an individual contributor&lt;/li&gt;\\n&lt;li&gt;Comfortable doing the
        IC work first and building the team around you over time - you don&#39;t need
        a fully staffed org to be effective&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;p&gt;&lt;span
        style=&quot;text-decoration: underline;&quot;&gt;&lt;strong&gt;Nice to Have&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\\n&lt;ul&gt;\\n&lt;li&gt;Experience
        in a vertical SaaS environment or with SMB customers&lt;/li&gt;\\n&lt;li&gt;Familiarity
        with onboarding or professional services motions (not just CS post-onboarding)&lt;/li&gt;\\n&lt;li&gt;Experience
        building or managing a customer success platform&lt;/li&gt;\\n&lt;li&gt;AI
        tooling experience - using AI to enhance analytics, automate workflows, or
        support coaching&lt;/li&gt;\\n&lt;/ul&gt;&lt;div class=&quot;content-conclusion&quot;&gt;&lt;p&gt;&lt;strong&gt;&lt;span
        style=&quot;text-decoration: underline;&quot;&gt;Why You&#39;ll Love Working
        With Us&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;\\n&lt;p&gt;&lt;em&gt;Health
        &amp;amp; Wellness That Have You Covered:&lt;/em&gt;&lt;/p&gt;\\n&lt;ul&gt;\\n&lt;li&gt;Enjoy
        the flexibility of remote work&lt;/li&gt;\\n&lt;li&gt;Competitive base salaries
        that reflect your value.&lt;/li&gt;\\n&lt;li&gt;Flexible PTO \u2014 No set
        number of days, just the trust to take the time you need. We genuinely encourage
        our team to disconnect and recharge.&lt;/li&gt;\\n&lt;li&gt;Support for every
        stage of life\u2014with paid maternity, parental bonding, and medical leave
        for you or your loved ones.&lt;/li&gt;\\n&lt;li&gt;Comprehensive health benefits,
        including Medical, Dental, Vision, and Prescription coverage. For employee
        only, we offer plans that cover 100% of premiums and we cover 50% of costs
        for families.&lt;/li&gt;\\n&lt;li&gt;Prioritizing your mental health: get
        free, confidential counseling through our partnership with BetterHelp.&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;p&gt;&lt;em&gt;Investing
        in Your Future (and Present):&lt;/em&gt;&lt;/p&gt;\\n&lt;ul&gt;\\n&lt;li&gt;401(k)
        Retirement Savings Plan with 100% employer match on contributions up to 6%
        - so your future self will thank you.&lt;/li&gt;\\n&lt;li&gt;Flexible Spending
        Accounts (FSA) and Health Savings Accounts (HSA) to make your money go further.&lt;/li&gt;\\n&lt;li&gt;Life
        and Accidental Death &amp;amp; Dismemberment (AD&amp;amp;D) Insurance for
        added peace of mind.&lt;/li&gt;\\n&lt;li&gt;Wellness on your terms: get up
        to $60/month toward fitness, mental health, or almost anything that helps
        you feel your best.&lt;/li&gt;\\n&lt;li&gt;After one year of employment, enjoy
        a $300 home office setup bonus to help make your space work for you.&amp;nbsp;&lt;/li&gt;\\n&lt;li&gt;Keep
        growing with support for continuing education - we\u2019re invested in your
        development.&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;p&gt;&amp;nbsp;&lt;/p&gt;\\n&lt;p&gt;Most
        importantly, we have a stellar team, a whole lot of fun, and work that actually
        matters to the shops and families we serve!&lt;/p&gt;\\n&lt;p&gt;&amp;nbsp;&lt;/p&gt;\\n&lt;p&gt;&lt;em&gt;Tekmetric
        is an equal opportunity employer. We hire hard-working individuals, regardless
        of gender, race or color, ethnicity or national origin, age, disability, religion,
        sexual orientation, gender identity or expression, or veteran status. We know
        that when our employees feel appreciated and included, they can be more creative,
        innovative and successful.&lt;/em&gt;&lt;br&gt;&lt;br&gt;&lt;em&gt;We will
        ensure that individuals with disabilities are provided reasonable accommodation
        to participate in the job application or interview process, to perform essential
        job functions, and to receive other benefits and privileges of employment.
        Please contact us to request accommodation.&lt;br&gt;&lt;br&gt;Tekmetric will
        never ask for your personal financial or banking information or require any
        financial commitment as part of our candidate search or application process.
        No job offers will be made without a formal interview process. All legitimate
        Tekmetric job postings are listed at &lt;a href=&quot;http://tekmetric.com/careers&quot;
        target=&quot;_blank&quot;&gt;tekmetric.com/careers&lt;/a&gt;. Recruiter communications
        come from &lt;strong&gt;@tekmetric&lt;/strong&gt;&lt;strong&gt;.com&lt;/strong&gt;
