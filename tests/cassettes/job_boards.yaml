        \"application_deadline\": null, \"content\": \"&lt;div class=&quot;content-intro&quot;&gt;&lt;p&gt;&lt;strong&gt;&lt;u&gt;About
        Tekmetric&lt;/u&gt;&lt;/strong&gt;&lt;/p&gt;\\n&lt;p&gt;Tekmetric is the all-in-one,
        cloud-based software helping auto repair shops run smarter, grow faster, and
        serve customers better. &lt;br&gt;&lt;br&gt;Built by a shop owner and shaped
        by the needs of the industry, Tekmetric brings together innovation, real-world
        experience, and a thriving community to help shops thrive - not just survive.&amp;nbsp;From
        running a shop, to securing payments to engaging customers, our platform simplifies
        operations so shop owners can focus on what really matters: delivering exceptional
        service, earning trust, and growing sustainably.&lt;/p&gt;\\n&lt;p&gt;Officially
        founded in Houston in 2017, Tekmetric has grown from a single shop\u2019s
        vision to the industry\u2019s leading solution - all by staying true to our
        values of transparency, integrity, innovation, and a service-first mindset.&amp;nbsp;&lt;br&gt;&lt;br&gt;But
        we\u2019re not just building shop management software. We\u2019re building
        a movement. We\u2019re empowering repair shops to rise above the daily grind,
        create meaningful connections with their customers, and lead the industry
        forward - one interaction at a time.&lt;/p&gt;\\n&lt;p&gt;Come build with
        us. Join the journey. Shape the future of auto repair.&lt;/p&gt;\\n&lt;p&gt;&lt;span
        style=&quot;text-decoration: underline;&quot;&gt;&lt;strong&gt;Working the
        Tekmetric Way&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\\n&lt;p&gt;At Tekmetric,
        we\u2019re building a culture where winning matters - not for ego, but because
        when our customers win, we win together.&amp;nbsp;&lt;/p&gt;\\n&lt;p&gt;We
        move fast, stay curious, and take full ownership of our results \u2014 no
        excuses, no finger-pointing. If you thrive in ambiguity, take initiative,
        and view honest feedback as fuel for growth, you\u2019ll feel right at home
        here.&lt;/p&gt;\\n&lt;p&gt;We\u2019re direct but respectful, ambitious yet
        grounded, and collaborative at every level. Everyone leads through impact
        and is encouraged to speak up, share ideas, and challenge assumptions (even
        your manager\u2019s). This is a place for builders, not bystanders.&lt;/p&gt;\\n&lt;p&gt;Success
        here takes focus, follow-through, and a willingness to roll up your sleeves
        \u2014 but if you\u2019re driven by meaningful work and real results, it\u2019s
        deeply rewarding. You\u2019ll join a team that cares about the work, supports
        one another, and takes smart risks to achieve bold goals. &lt;strong&gt;Be
        yourself, stay mission-focused, and you\u2019ll thrive.&lt;/strong&gt; If
        that energizes you, we can\u2019t wait to meet you.&lt;/p&gt;\\n&lt;p&gt;&lt;strong&gt;Where
        We Work&lt;/strong&gt;: At Tekmetric, great work happens anywhere, but great
        teams are built through intentional connection. We offer hybrid and remote
        work models based on your proximity to our office hubs. Because we value in-person
        collaboration, travel is an expected part of every role. We come together
        several times a year for team and company-wide offsites to align on goals
        and strengthen relationships. Attendance at these events is expected and fully
        supported.&lt;/p&gt;&lt;/div&gt;&lt;h3&gt;Role &amp;amp; Responsibilities&lt;/h3&gt;\\n&lt;p&gt;Tekmetric
        is seeking a Head of Growth and Demand to set the strategic direction for
        how we grow \u2014&lt;br&gt;across paid media, organic search, AI-driven visibility,
        our website as a primary conversion driver,&lt;br&gt;and integrated campaigns
        that reach the right shops across SMB, Mid-Market, and Enterprise&lt;br&gt;segments.&lt;br&gt;You\u2019ll
        hold full accountability for pipeline outcomes, build the programs that make
        inbound growth&lt;br&gt;repeatable, and develop the team that sustains it.
        You\u2019re a builder, not just an operator of an&lt;br&gt;inherited playbook.
        You know how to stand up an inbound demand engine from scratch, find the&lt;br&gt;channels
        and campaign strategies that work for a hard-to-reach SMB audience, and scale
        what\u2019s&lt;br&gt;working \u2014 all while holding yourself accountable
        to the numbers that matter to the business, not&lt;br&gt;marketing vanity
        metrics.&lt;/p&gt;\\n&lt;p&gt;Marketers now have two jobs: marketing to humans,
        and marketing to machines. This role owns&lt;br&gt;both. If you think in systems,
        live in the data, plan campaigns with the precision of a strategist and&lt;br&gt;the
        urgency of an operator, and are ready to own the number \u2014 this one\u2019s
        for you.&lt;/p&gt;\\n&lt;h3&gt;What You\u2019ll Do&lt;/h3&gt;\\n&lt;ul&gt;\\n&lt;li&gt;&lt;strong&gt;Run
        High-Performance Paid Media&lt;/strong&gt;\\n&lt;ul&gt;\\n&lt;li&gt;Own paid
        search and paid social strategy, execution, optimization, and reporting&lt;/li&gt;\\n&lt;li&gt;Manage
        our performance marketing agency to ensure top-tier productivity and ROI&lt;/li&gt;\\n&lt;li&gt;Oversee
        multi-million-dollar budgets with precision, balancing volume, quality, and
        efficiency across segments&lt;/li&gt;\\n&lt;li&gt;Run continuous experimentation
        across targeting, bidding, creative, and landing&lt;br&gt;experiences&lt;/li&gt;\\n&lt;li&gt;Ensure
        paid media strategy is tightly integrated with campaign and acquisition motions
        across SMB, Mid-Market, and Enterprise&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;/li&gt;\\n&lt;li&gt;&lt;strong&gt;SEO
        &amp;amp; AI-Driven Search Visibility&lt;/strong&gt;\\n&lt;ul&gt;\\n&lt;li&gt;Scale
        organic growth across traditional search and emerging AI/LLM discovery channels&lt;/li&gt;\\n&lt;li&gt;Build
        a durable, AI-accelerated content engine that captures high-intent demand
        from&amp;nbsp;shops actively evaluating solutions&lt;/li&gt;\\n&lt;li&gt;Execute
        across SEO fundamentals: technical health, content structure, on-page optimization,
        and search-friendly UX&lt;/li&gt;\\n&lt;li&gt;Continuously evolve strategy
        based on how buyers search, discover, and evaluate \u2014 because the shop
        owner Googling \u201Cbest auto repair software\u201D and the LLM generating
        a vendor recommendation are now equally important audience&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;/li&gt;\\n&lt;li&gt;&lt;strong&gt;Website
        &amp;amp; Conversion Performance&lt;/strong&gt;\\n&lt;ul&gt;\\n&lt;li&gt;Own
        Tekmetric.com as a revenue-driving product built for conversion, clarity,
        anddiscoverability&lt;/li&gt;\\n&lt;li&gt;Improve visitor \u2192 lead \u2192
        SQL conversion rates across all entry points and segments&lt;/li&gt;\\n&lt;li&gt;Build
        and optimize landing pages aligned to campaigns, segments, and the fullcustomer
        journey&lt;/li&gt;\\n&lt;li&gt;Establish a rigorous, always-on testing roadmap
        across pages, flows, and messaging&lt;/li&gt;\\n&lt;li&gt;Partner with Brand,
        Product Marketing, and Product to ensure unified messaging and positioning
        across the site&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;/li&gt;\\n&lt;li&gt;&lt;strong&gt;Integrated
        Campaign Planning&lt;/strong&gt;\\n&lt;ul&gt;\\n&lt;li&gt;Own the annual and
        quarterly campaign calendar \u2014 developing coordinated,multi-channel campaign
        strategies that drive inbound volume across all segments&lt;/li&gt;\\n&lt;li&gt;Lead
        segment-specific campaign planning for SMB, Mid-Market, and Enterprise \u2014&amp;nbsp;tailoring
        messaging, offers, channel mix, and timing to how each buyer discovers andevaluates
        solutions&lt;/li&gt;\\n&lt;li&gt;Develop campaign briefs that Brand, Content,
        Product Marketing, and Customer Marketing execute against \u2014 ensuring
        every function is pulling in the same direction&lt;/li&gt;\\n&lt;li&gt;Track
        campaign performance end-to-end from impression to pipeline, with clearattribution
        back to inbound volume by segment&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;/li&gt;\\n&lt;li&gt;&lt;strong&gt;AI-Enabled
        Growth Operations&lt;/strong&gt;\\n&lt;ul&gt;\\n&lt;li&gt;Leverage AI tools
        to accelerate content creation, testing velocity, and optimization atscale
        \u2014 building programs that perform for the human reading them and the machine
        deciding whether to surface them&lt;/li&gt;\\n&lt;li&gt;Build systems that
        enable rapid iteration without adding headcount&lt;/li&gt;\\n&lt;li&gt;Identify
        opportunities where AI can replace manual work and increase output quality
        and speed&lt;/li&gt;\\n&lt;li&gt;Foster a team culture of experimentation,
        AI adoption, and operational excellence&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;/li&gt;\\n&lt;li&gt;&lt;strong&gt;Analytics,
        Forecasting &amp;amp; Funnel Visibility&lt;/strong&gt;\\n&lt;ul&gt;\\n&lt;li&gt;Build
        forecasting models to predict inbound volume, pipeline quality, and costefficiency
        by channel and segment&lt;/li&gt;\\n&lt;li&gt;Partner with GTM Ops on attribution
        and funnel visibility \u2014 ensuring you have thereporting infrastructure
        to make fast, high-quality decisions&lt;/li&gt;\\n&lt;li&gt;Monitor performance
        daily to spot trends early and act quickly&lt;/li&gt;\\n&lt;li&gt;Translate
        performance data into strategic decisions across paid, organic, web, andcampaign
        channels&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;/li&gt;\\n&lt;li&gt;&lt;strong&gt;Team
        &amp;amp; Function Leadership&lt;/strong&gt;\\n&lt;ul&gt;\\n&lt;li&gt;Lead,
        grow, and inspire a team spanning Paid Media, Search, Website, Integrated
        Campaigns, and ABM \u2014 hiring for the skills you need and building a culture
        of accountability, experimentation, and speed&lt;/li&gt;\\n&lt;li&gt;Set clear
        priorities, workflows, and growth paths as the inbound acquisition enginescales&lt;/li&gt;\\n&lt;li&gt;Operate
        as a senior peer and strategic partner to Brand, Content, Product Marketing,
        Customer Marketing, Sales, and RevOps&lt;/li&gt;\\n&lt;li&gt;Serve as the
        connective tissue between the Growth function and the rest of themarketing
        org \u2014 briefing campaigns, aligning on messaging, and ensuring programs
        convert into pipeline&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;h3&gt;What
        You\u2019ll Bring&lt;/h3&gt;\\n&lt;ul&gt;\\n&lt;li&gt;10\u201312+ years in
        growth, performance marketing, demand generation, or digital acquisition roles
        in SaaS or high-growth tech \u2014 with meaningful time at the Director level
        or above&lt;/li&gt;\\n&lt;li&gt;Proven track record of scaling inbound pipelines
        and managing multi-million-dollar paid media programs with direct pipeline
        accountability&lt;/li&gt;\\n&lt;li&gt;Demonstrated experience owning integrated
        campaign planning across multiple segments (SMB, Mid-Market, and/or Enterprise)&lt;/li&gt;\\n&lt;li&gt;Deep
        experience across SEO and AEO \u2014 technical, content, and on-page \u2014
        and a sophisticated understanding of how AI is reshaping search behavior and
        discovery&lt;/li&gt;\\n&lt;li&gt;Demonstrated ability to own a website as
        a revenue-driving product, not a marketing asset&lt;/li&gt;\\n&lt;li&gt;Experience
        marketing to fragmented, distributed SMB audiences at scale \u2014 specifically
        reaching and converting a buyer who doesn\u2019t behave like a typical enterprise
        buyer (no big procurement cycles, short attention spans, word-of-mouth driven)&lt;/li&gt;\\n&lt;li&gt;Genuine
        fluency with AI-powered tools and modern martech \u2014 intent data platforms,
        signal-based targeting, AI-assisted content and personalization&lt;/li&gt;\\n&lt;li&gt;Strong
        analytical and forecasting instincts: you build the model, own the number,
        and explain the delta&lt;/li&gt;\\n&lt;li&gt;Experience building and developing
        a team \u2014 hiring, structuring, and elevating the people around you&lt;/li&gt;\\n&lt;li&gt;Comfort
        operating at a senior level: peer relationships with Sales, RevOps, Finance,
        and Product; executive-facing communication; high-stakes decisions under uncertainty&lt;/li&gt;\\n&lt;li&gt;Ability
        to prioritize ruthlessly, move fast, and create clarity for your team in a
        scalingenvironment&lt;/li&gt;\\n&lt;li&gt;Experience in the automotive aftermarket,
        field service software, or vertical SaaS for trade-based industries a plus&lt;/li&gt;\\n&lt;li&gt;Familiarity
        with AEO strategies and LLM-driven discovery a plus&lt;/li&gt;\\n&lt;li&gt;Familiarity
        with community-led growth or advocacy-driven acquisition models a plus&lt;/li&gt;\\n&lt;/ul&gt;&lt;div
        class=&quot;content-conclusion&quot;&gt;&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;text-decoration:
        underline;&quot;&gt;Why You&#39;ll Love Working With Us&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;\\n&lt;p&gt;&lt;em&gt;Health
        &amp;amp; Wellness That Have You Covered:&lt;/em&gt;&lt;/p&gt;\\n&lt;ul&gt;\\n&lt;li&gt;Enjoy
        the flexibility of remote work&lt;/li&gt;\\n&lt;li&gt;Competitive base salaries
        that reflect your value.&lt;/li&gt;\\n&lt;li&gt;Flexible PTO \u2014 No set
        number of days, just the trust to take the time you need. We genuinely encourage
        our team to disconnect and recharge.&lt;/li&gt;\\n&lt;li&gt;Support for every
        stage of life\u2014with paid maternity, parental bonding, and medical leave
        for you or your loved ones.&lt;/li&gt;\\n&lt;li&gt;Comprehensive health benefits,
        including Medical, Dental, Vision, and Prescription coverage. For employee
        only, we offer plans that cover 100% of premiums and we cover 50% of costs
        for families.&lt;/li&gt;\\n&lt;li&gt;Prioritizing your mental health: get
        free, confidential counseling through our partnership with BetterHelp.&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;p&gt;&lt;em&gt;Investing
        in Your Future (and Present):&lt;/em&gt;&lt;/p&gt;\\n&lt;ul&gt;\\n&lt;li&gt;401(k)
        Retirement Savings Plan with 100% employer match on contributions up to 6%
        - so your future self will thank you.&lt;/li&gt;\\n&lt;li&gt;Flexible Spending
        Accounts (FSA) and Health Savings Accounts (HSA) to make your money go further.&lt;/li&gt;\\n&lt;li&gt;Life
        and Accidental Death &amp;amp; Dismemberment (AD&amp;amp;D) Insurance for
        added peace of mind.&lt;/li&gt;\\n&lt;li&gt;Wellness on your terms: get up
        to $60/month toward fitness, mental health, or almost anything that helps
        you feel your best.&lt;/li&gt;\\n&lt;li&gt;After one year of employment, enjoy
        a $300 home office setup bonus to help make your space work for you.&amp;nbsp;&lt;/li&gt;\\n&lt;li&gt;Keep
        growing with support for continuing education - we\u2019re invested in your
        development.&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;p&gt;&amp;nbsp;&lt;/p&gt;\\n&lt;p&gt;Most
        importantly, we have a stellar team, a whole lot of fun, and work that actually
        matters to the shops and families we serve!&lt;/p&gt;\\n&lt;p&gt;&amp;nbsp;&lt;/p&gt;\\n&lt;p&gt;&lt;em&gt;Tekmetric
        is an equal opportunity employer. We hire hard-working individuals, regardless
        of gender, race or color, ethnicity or national origin, age, disability, religion,
        sexual orientation, gender identity or expression, or veteran status. We know
        that when our employees feel appreciated and included, they can be more creative,
        innovative and successful.&lt;/em&gt;&lt;br&gt;&lt;br&gt;&lt;em&gt;We will
        ensure that individuals with disabilities are provided reasonable accommodation
        to participate in the job application or interview process, to perform essential
        job functions, and to receive other benefits and privileges of employment.
        Please contact us to request accommodation.&lt;br&gt;&lt;br&gt;Tekmetric will
        never ask for your personal financial or banking information or require any
        financial commitment as part of our candidate search or application process.
        No job offers will be made without a formal interview process. All legitimate
        Tekmetric job postings are listed at &lt;a href=&quot;http://tekmetric.com/careers&quot;
        target=&quot;_blank&quot;&gt;tekmetric.com/careers&lt;/a&gt;. Recruiter communications
        come from &lt;strong&gt;@tekmetric&lt;/strong&gt;&lt;strong&gt;.com&lt;/strong&gt;
        email addresses. Please visit this link for further information&lt;a href=&quot;https://www.tekmetric.com/fraudulent-job-offers&quot;&gt;
        Fraudulent Job Offers&lt;/a&gt;&lt;br&gt;&lt;/em&gt;&lt;/p&gt;&lt;/div&gt;\",
