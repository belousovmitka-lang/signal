        \"updated_at\": \"2026-08-10T13:39:52-04:00\", \"requisition_id\": \"26AOP215\",
        \"title\": \"Senior Partner Marketing Manager\", \"company_name\": \"Tekmetric\",
        \"first_published\": \"2026-07-27T12:03:04-04:00\", \"language\": \"en\",
        \"application_deadline\": null, \"content\": \"&lt;div class=&quot;content-intro&quot;&gt;&lt;p&gt;&lt;strong&gt;&lt;u&gt;About
        Tekmetric&lt;/u&gt;&lt;/strong&gt;&lt;/p&gt;\\n&lt;p&gt;Tekmetric is the all-in-one,
        cloud-based software helping auto repair shops run smarter, grow faster, and
        serve customers better. &lt;br&gt;&lt;br&gt;Built by a shop owner and shaped
        by the needs of the industry, Tekmetric brings together innovation, real-world
        experience, and a thriving community to help shops thrive - not just survive.&amp;nbsp;From
        running a shop, to securing payments to engaging customers, our platform simplifies
        operations so shop owners can focus on what really matters: delivering exceptional
        service, earning trust, and growing sustainably.&lt;/p&gt;\\n&lt;p&gt;Officially
        founded in Houston in 2017, Tekmetric has grown from a single shop\u2019s
        vision to the industry\u2019s leading solution - all by staying true to our
        values of transparency, integrity, innovation, and a service-first mindset.&amp;nbsp;&lt;br&gt;&lt;br&gt;But
        we\u2019re not just building shop management software. We\u2019re building
        a movement. We\u2019re empowering repair shops to rise above the daily grind,
        create meaningful connections with their customers, and lead the industry
        forward - one interaction at a time.&lt;/p&gt;\\n&lt;p&gt;Come build with
        us. Join the journey. Shape the future of auto repair.&lt;/p&gt;\\n&lt;p&gt;&lt;span
        style=&quot;text-decoration: underline;&quot;&gt;&lt;strong&gt;Working the
        Tekmetric Way&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\\n&lt;p&gt;At Tekmetric,
        we\u2019re building a culture where winning matters - not for ego, but because
        when our customers win, we win together.&amp;nbsp;&lt;/p&gt;\\n&lt;p&gt;We
        move fast, stay curious, and take full ownership of our results \u2014 no
        excuses, no finger-pointing. If you thrive in ambiguity, take initiative,
        and view honest feedback as fuel for growth, you\u2019ll feel right at home
        here.&lt;/p&gt;\\n&lt;p&gt;We\u2019re direct but respectful, ambitious yet
        grounded, and collaborative at every level. Everyone leads through impact
        and is encouraged to speak up, share ideas, and challenge assumptions (even
        your manager\u2019s). This is a place for builders, not bystanders.&lt;/p&gt;\\n&lt;p&gt;Success
        here takes focus, follow-through, and a willingness to roll up your sleeves
        \u2014 but if you\u2019re driven by meaningful work and real results, it\u2019s
        deeply rewarding. You\u2019ll join a team that cares about the work, supports
        one another, and takes smart risks to achieve bold goals. &lt;strong&gt;Be
        yourself, stay mission-focused, and you\u2019ll thrive.&lt;/strong&gt; If
        that energizes you, we can\u2019t wait to meet you.&lt;/p&gt;\\n&lt;p&gt;&lt;strong&gt;Where
        We Work&lt;/strong&gt;: At Tekmetric, great work happens anywhere, but great
        teams are built through intentional connection. We offer hybrid and remote
        work models based on your proximity to our office hubs. Because we value in-person
        collaboration, travel is an expected part of every role. We come together
        several times a year for team and company-wide offsites to align on goals
        and strengthen relationships. Attendance at these events is expected and fully
        supported.&lt;/p&gt;&lt;/div&gt;&lt;p&gt;&lt;span style=&quot;text-decoration:
        underline; font-size: 12pt;&quot;&gt;&lt;strong&gt;What You\u2019ll Do&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\\n&lt;p&gt;&lt;span
        style=&quot;font-size: 12pt;&quot;&gt;As our Senior Partner Marketing Manager,
        you will own the co-marketing strategy and execution for Tekmetric\u2019s
        strategic alliances. This is a builder role for someone who can think at the
        program level, develop joint go-to-market plans with partners, and drive the
        marketing activation that turns alliance agreements into pipeline and brand
        leverage. Reporting to the Director of Demand Generation, you will be the
        primary marketing owner for Strategic Alliances \u2014 accountable for the
        campaigns that ship, the pipeline they generate, and the partner relationships
        that deepen as a result. You will work in close alignment with Business Development
        (the relationship owner) and collaborate across Brand, Field Marketing, Product,
        and Sales.&lt;/span&gt;&lt;/p&gt;\\n&lt;h3&gt;&lt;span style=&quot;font-size:
        12pt;&quot;&gt;&lt;strong&gt;Strategic Alliance Co-Marketing&lt;/strong&gt;&lt;/span&gt;&lt;/h3&gt;\\n&lt;ul&gt;\\n&lt;li
        style=&quot;font-size: 12pt;&quot;&gt;&lt;span style=&quot;font-size: 12pt;&quot;&gt;Own
        the ongoing partner marketing strategy for Strategic Alliances, starting with
        existing partners and expanding to new partners as programs mature.&lt;/span&gt;&lt;/li&gt;\\n&lt;li
        style=&quot;font-size: 12pt;&quot;&gt;&lt;span style=&quot;font-size: 12pt;&quot;&gt;Develop
        joint go-to-market plans for each active alliance, including co-marketing
        campaign briefs, messaging frameworks, audience segmentation, channel mix,
        and success metrics.&lt;/span&gt;&lt;/li&gt;\\n&lt;li style=&quot;font-size:
        12pt;&quot;&gt;&lt;span style=&quot;font-size: 12pt;&quot;&gt;Lead co-marketing
        activation with partners: co-branded campaigns, joint email and content programs,
        partner-facing landing pages, event sponsorships, and in-field amplification.&lt;/span&gt;&lt;/li&gt;\\n&lt;li
        style=&quot;font-size: 12pt;&quot;&gt;&lt;span style=&quot;font-size: 12pt;&quot;&gt;Serve
        as the day-to-day marketing counterpart to Business Development for each alliance,
        ensuring marketing activation keeps pace with the relationship.&lt;/span&gt;&lt;/li&gt;\\n&lt;li
        style=&quot;font-size: 12pt;&quot;&gt;&lt;span style=&quot;font-size: 12pt;&quot;&gt;Manage
        the partner-influenced pipeline metric: track leads sourced from co-marketing
        activity, pipeline ($) generated, and conversion rates from partner motion.&lt;/span&gt;&lt;/li&gt;\\n&lt;li
        style=&quot;font-size: 12pt;&quot;&gt;&lt;span style=&quot;font-size: 12pt;&quot;&gt;Build
        and maintain a partner marketing calendar, aligning campaign timing with partner
        seasonal moments, product milestones, and field activation windows.&lt;/span&gt;&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;h3&gt;&lt;span
        style=&quot;font-size: 12pt;&quot;&gt;&lt;strong&gt;Industry Influence Co-Marketing&lt;/strong&gt;&lt;/span&gt;&lt;/h3&gt;\\n&lt;ul&gt;\\n&lt;li
        style=&quot;font-size: 12pt;&quot;&gt;&lt;span style=&quot;font-size: 12pt;&quot;&gt;In
        partnership with Brand &amp;amp; Community, develop co-marketing activations
        with influence and community partners once strategic partner programs are
        established.&lt;/span&gt;&lt;/li&gt;\\n&lt;li style=&quot;font-size: 12pt;&quot;&gt;&lt;span
        style=&quot;font-size: 12pt;&quot;&gt;Support Tekmetric\u2019s presence and
        messaging at industry events through co-branded partner activations.&lt;/span&gt;&lt;/li&gt;\\n&lt;li
        style=&quot;font-size: 12pt;&quot;&gt;&lt;span style=&quot;font-size: 12pt;&quot;&gt;Own
        co-marketing opportunities at Tektonic.&lt;/span&gt;&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;h3&gt;&lt;span
        style=&quot;font-size: 12pt;&quot;&gt;&lt;strong&gt;Program Development and
        Enablement&lt;/strong&gt;&lt;/span&gt;&lt;/h3&gt;\\n&lt;ul&gt;\\n&lt;li style=&quot;font-size:
        12pt;&quot;&gt;&lt;span style=&quot;font-size: 12pt;&quot;&gt;Build the operational
        infrastructure for partner marketing at Tekmetric: partner marketing playbooks,
        co-brand guidelines, campaign templates, and asset libraries for use across
        pillars.&lt;/span&gt;&lt;/li&gt;\\n&lt;li style=&quot;font-size: 12pt;&quot;&gt;&lt;span
        style=&quot;font-size: 12pt;&quot;&gt;Partner with Enablement Teams to ensure
        external partner enablement reps have Tekmetric-consistent content and voice
        for their own activation with shops.&lt;/span&gt;&lt;/li&gt;\\n&lt;li style=&quot;font-size:
        12pt;&quot;&gt;&lt;span style=&quot;font-size: 12pt;&quot;&gt;Track partner
        marketing activity metrics (campaigns executed, joint customer reach, unique
        shops touched) alongside outcome metrics (pipeline, conversion) and report
        to Director, Demand Gen and relevant BD stakeholders.&lt;/span&gt;&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;h3&gt;&lt;span
        style=&quot;font-size: 12pt;&quot;&gt;&lt;strong&gt;Cross-Functional Collaboration&lt;/strong&gt;&lt;/span&gt;&lt;/h3&gt;\\n&lt;ul&gt;\\n&lt;li
        style=&quot;font-size: 12pt;&quot;&gt;&lt;span style=&quot;font-size: 12pt;&quot;&gt;Align
        with BD on priorities and sequencing (Move Now vs. Quick Win vs. Long Game)
        to ensure marketing investment tracks with partner readiness.&lt;/span&gt;&lt;/li&gt;\\n&lt;li
        style=&quot;font-size: 12pt;&quot;&gt;&lt;span style=&quot;font-size: 12pt;&quot;&gt;Collaborate
        with Field Marketing on territory-level amplification of strategic alliance
        programs, particularly where partner field reps and Tekmetric Field Channel
        Managers overlap.&lt;/span&gt;&lt;/li&gt;\\n&lt;li style=&quot;font-size:
        12pt;&quot;&gt;&lt;span style=&quot;font-size: 12pt;&quot;&gt;Work with Brand
        &amp;amp; Community on partner-adjacent brand moments, earned media, and community
        activations.&lt;/span&gt;&lt;/li&gt;\\n&lt;li style=&quot;font-size: 12pt;&quot;&gt;&lt;span
        style=&quot;font-size: 12pt;&quot;&gt;Partner with Product on integration
        partner co-marketing as needed on stickiness plays central to platform retention.&lt;/span&gt;&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;p&gt;&lt;span
        style=&quot;text-decoration: underline; font-size: 12pt;&quot;&gt;&lt;strong&gt;What
        You\u2019ll Bring&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\\n&lt;ul&gt;\\n&lt;li
        style=&quot;font-size: 12pt;&quot;&gt;&lt;span style=&quot;font-size: 12pt;&quot;&gt;6\u201310+
        years of experience in partner marketing, alliance marketing, or channel marketing,
        preferably in B2B SaaS or a technology-adjacent industry.&lt;/span&gt;&lt;/li&gt;\\n&lt;li
        style=&quot;font-size: 12pt;&quot;&gt;&lt;span style=&quot;font-size: 12pt;&quot;&gt;Proven
        track record building and executing co-marketing programs with external partners,
        including joint campaigns, shared pipeline goals, and co-branded content.&lt;/span&gt;&lt;/li&gt;\\n&lt;li
        style=&quot;font-size: 12pt;&quot;&gt;&lt;span style=&quot;font-size: 12pt;&quot;&gt;Strong
        strategic thinking: you can work from a framework like a pillar strategy and
        translate it into a quarterly marketing plan with clear priorities and tradeoffs.&lt;/span&gt;&lt;/li&gt;\\n&lt;li
        style=&quot;font-size: 12pt;&quot;&gt;&lt;span style=&quot;font-size: 12pt;&quot;&gt;Excellent
        cross-functional collaborator \u2014 comfortable working alongside BD, Sales,
        Brand, Field Marketing, and Product to drive aligned outcomes.&lt;/span&gt;&lt;/li&gt;\\n&lt;li
        style=&quot;font-size: 12pt;&quot;&gt;&lt;span style=&quot;font-size: 12pt;&quot;&gt;Analytical:
        able to build pipeline attribution models, track partner-influenced revenue,
        and communicate performance to leadership.&lt;/span&gt;&lt;/li&gt;\\n&lt;li
        style=&quot;font-size: 12pt;&quot;&gt;&lt;span style=&quot;font-size: 12pt;&quot;&gt;Experience
        managing multiple partner relationships simultaneously with different activation
        timelines and resource levels.&lt;/span&gt;&lt;/li&gt;\\n&lt;li style=&quot;font-size:
        12pt;&quot;&gt;&lt;span style=&quot;font-size: 12pt;&quot;&gt;Strong written
        and verbal communication skills; able to represent Tekmetric\u2019s brand
        voice in partner-facing materials and executive conversations.&lt;/span&gt;&lt;/li&gt;\\n&lt;li
        style=&quot;font-size: 12pt;&quot;&gt;&lt;span style=&quot;font-size: 12pt;&quot;&gt;Proficiency
        in CRM and marketing automation platforms (HubSpot, Salesforce, or similar).&lt;/span&gt;&lt;/li&gt;\\n&lt;li
        style=&quot;font-size: 12pt;&quot;&gt;&lt;span style=&quot;font-size: 12pt;&quot;&gt;Bonus:
        Experience in the automotive aftermarket, auto repair SaaS, or a vertically-specialized
        B2B environment.&lt;/span&gt;&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;p&gt;&lt;span
        style=&quot;text-decoration: underline; font-size: 12pt;&quot;&gt;&lt;strong&gt;Who
        You Are:&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\\n&lt;p&gt;&lt;span style=&quot;font-size:
        12pt;&quot;&gt;Successful candidates will also demonstrate many of the characteristics
        that our core values represent:&lt;/span&gt;&lt;/p&gt;\\n&lt;ul&gt;\\n&lt;li
        style=&quot;font-size: 12pt;&quot;&gt;&lt;span style=&quot;font-size: 12pt;&quot;&gt;&lt;em&gt;Build
        things that matter&lt;/em&gt;: You have a love of building something new or
        improving on current processes and care about making a positive difference.&lt;/span&gt;&lt;/li&gt;\\n&lt;li
        style=&quot;font-size: 12pt;&quot;&gt;&lt;span style=&quot;font-size: 12pt;&quot;&gt;&lt;em&gt;We\u2019re
        all entrepreneurs&lt;/em&gt;: You love learning new things and are comfortable
        working in a startup-like, dynamic environment -- moving quickly, even in
        the face of ambiguity. You are a self-directed leader who can jump in, structure
        their own work, and figure out how best to execute a plan yourself and with
        others. At Tekmetric our leaders are all players and coaches.&lt;/span&gt;&lt;/li&gt;\\n&lt;li
        style=&quot;font-size: 12pt;&quot;&gt;&lt;span style=&quot;font-size: 12pt;&quot;&gt;&lt;em&gt;Yes
        before no&lt;/em&gt;: You keep an open mind and are excited about new ideas
        and helping others actualize their ideas. You are intellectually curious and
        analytical in a strategic context.&lt;/span&gt;&lt;/li&gt;\\n&lt;li style=&quot;font-size:
        12pt;&quot;&gt;&lt;span style=&quot;font-size: 12pt;&quot;&gt;&lt;em&gt;We
        matter to each other&lt;/em&gt;: You care about people and see the success
        of one is success for us all. You are a highly ethical individual with unquestioned
        integrity and the experience, confidence, and stature to protect confidential
        information in a growing company.&lt;/span&gt;&lt;/li&gt;\\n&lt;/ul&gt;&lt;div
        class=&quot;content-conclusion&quot;&gt;&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;text-decoration:
        underline;&quot;&gt;Why You&#39;ll Love Working With Us&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;\\n&lt;p&gt;&lt;em&gt;Health
        &amp;amp; Wellness That Have You Covered:&lt;/em&gt;&lt;/p&gt;\\n&lt;ul&gt;\\n&lt;li&gt;Enjoy
        the flexibility of remote work&lt;/li&gt;\\n&lt;li&gt;Competitive base salaries
        that reflect your value.&lt;/li&gt;\\n&lt;li&gt;Flexible PTO \u2014 No set
        number of days, just the trust to take the time you need. We genuinely encourage
        our team to disconnect and recharge.&lt;/li&gt;\\n&lt;li&gt;Support for every
        stage of life\u2014with paid maternity, parental bonding, and medical leave
        for you or your loved ones.&lt;/li&gt;\\n&lt;li&gt;Comprehensive health benefits,
        including Medical, Dental, Vision, and Prescription coverage. For employee
        only, we offer plans that cover 100% of premiums and we cover 50% of costs
        for families.&lt;/li&gt;\\n&lt;li&gt;Prioritizing your mental health: get
        free, confidential counseling through our partnership with BetterHelp.&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;p&gt;&lt;em&gt;Investing
