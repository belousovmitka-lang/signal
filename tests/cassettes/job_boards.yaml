        supported.&lt;/p&gt;&lt;/div&gt;&lt;p&gt;&lt;span style=&quot;text-decoration:
        underline;&quot;&gt;&lt;strong&gt;What You\u2019ll Do&lt;br&gt;&lt;/strong&gt;&lt;/span&gt;&lt;br&gt;In
        this role, you will be responsible for leading and tracking strategic and
        operational programs to improve our Sales, Sales Development and Channel Partnership
        team\u2019s ability to deliver on revenue &amp;amp; Customer health goals.&lt;/p&gt;\\n&lt;p&gt;Your
        main objective will be to optimize Sales, Sales Development, and Channel Partnership
        processes, leveraging sales analytics to provide actionable insights, drive
        data-informed decision-making, and measure the impact of initiatives. You
        will use technology and automation to increase efficiency, ensure data integrity
        across systems, and create scalable, repeatable processes. You will work closely
        with team members to define goals, strategies, and tactics, while translating
        analytics into concrete actions that enhance sales performance and revenue
        outcomes.&lt;/p&gt;\\n&lt;ul&gt;\\n&lt;li&gt;Configure and manage business
        tools to optimize their use in our team\u2019s workflows, ensuring they are
        aligned with our process improvement goals.&lt;/li&gt;\\n&lt;li&gt;Leverage
        technology to automate processes where possible, enhancing efficiency and
        enabling the teams to focus on closing deals and delivering value.&lt;/li&gt;\\n&lt;li&gt;Continuously
        evaluate, assess, and implement new technologies (including system integrators
        and AI-driven platforms) into sales operations frameworks to drive innovation
        and scalability&lt;/li&gt;\\n&lt;li&gt;Collaborate with stakeholders to identify
        bottlenecks and opportunities for process improvements.&lt;/li&gt;\\n&lt;li&gt;Lead
        key initiatives to implement new processes and refine existing ones, ensuring
        they are streamlined and integrated across all revenue functions.&lt;/li&gt;\\n&lt;li&gt;Develop
        and maintain dashboards and reporting tools to provide insights into key performance
        indicators and operational metrics.&lt;/li&gt;\\n&lt;li&gt;Utilize data analytics
        to gain insights into customer behavior and success metrics, providing actionable
        recommendations for continuous improvement.&lt;/li&gt;\\n&lt;li&gt;Work with
        leadership to develop and execute the overall customer success strategy, aligning
        it with the company&#39;s vision and goals to drive customer retention, expansion,
        and advocacy.&lt;/li&gt;\\n&lt;li&gt;Understand customer journeys and pain
        points to identify areas for process improvement and customer engagement optimization.&lt;/li&gt;\\n&lt;li&gt;Leverage
        data outputs to create early signs of at-risk accounts and create workflows
        enabling teams to action proactively.&amp;nbsp;&lt;/li&gt;\\n&lt;li&gt;Analyze
        sales pipeline trends, conversion metrics, and forecast accuracy to strengthen
        pipeline health and revenue predictability.&lt;/li&gt;\\n&lt;li&gt;Use sales
        analytics to uncover productivity drivers and deal cycle bottlenecks, providing
        actionable insights to improve sales execution.&lt;/li&gt;\\n&lt;li&gt;Partner
        with Sales leadership to turn data into strategic recommendations that improve
        territory planning, quota setting, and overall sales performance.&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;p&gt;&lt;strong&gt;What
        You\u2019ll Bring&lt;/strong&gt;&lt;/p&gt;\\n&lt;ul&gt;\\n&lt;li&gt;5+ years
        of professional experience in an advanced analytics or Customer operations
        role; prior experience with SaaS a plus&lt;/li&gt;\\n&lt;li&gt;Experience
        developing strategies to scale revenue teams to meet the needs of our customers.&lt;/li&gt;\\n&lt;li&gt;Strong
        analytical skills with proficiency in data analysis and reporting tools (e.g.
        Google Sheets, Excel, Tableau, Looker) preferred&lt;/li&gt;\\n&lt;li&gt;Experience
        with CRM systems (e.g., HubSpot, Salesforce) and customer success platforms
        (e.g., ChurnZero, Zendesk, Gainsight) preferred&lt;/li&gt;\\n&lt;li&gt;Excellent
        communication and interpersonal skills, with the ability to collaborate effectively
        across teams and influence stakeholders at all levels&lt;/li&gt;\\n&lt;li&gt;Hands-on
        experience analyzing sales funnel metrics and identifying opportunities to
        improve conversion and pipeline efficiency.&lt;/li&gt;\\n&lt;li&gt;Detail-oriented
        with a strong focus on accuracy and quality&lt;/li&gt;\\n&lt;li&gt;Ability
        to thrive in a fast-paced, dynamic environment and manage multiple priorities
        effectively&lt;/li&gt;\\n&lt;li&gt;Demonstrate a passion for designing scalable,
