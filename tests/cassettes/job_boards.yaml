        \"About PushPress\\n\\nPushPress is the AI-powered gym management platform
        built for boutique fitness.\\n\\nWe are transforming how boutique fitness
        owners operate and how the entire $100B global fitness industry connects,
        transacts, and grows. Trusted by more than 5,000 gyms and 500,000 members,
        PushPress processes ~$1B annually.\\n\\nWe're a Series B company backed by
        Altos Ventures, StepStone, and Mucker Capital, and we're going all-in on AI.
        Our AI Assistant, AI Member Intel, and AI-powered reporting tools are already
        changing how gym owners and coaches operate. We believe AI should make the
        human side of fitness better, not replace it.\\n\\nBy embedding intelligence
        directly into the product, we enable boutique fitness owners to make faster
        decisions, unlock new revenue streams, and collaborate across a connected
        network. As more gyms join the platform, data compounds, intelligence strengthens,
        and the value of the ecosystem increases for every owner\\n\\nWe are a global
        team of builders, operators, and fitness fanatics on a mission to level the
        playing field for independent fitness entrepreneurs. If you are ready to help
        reshape an industry, let's talk!\\n\\n\\nAbout the Onboarding Team\\n\_\\nThe
        Onboarding Team is responsible for getting new PushPress customers set up,
        activated, and confident across all products. We focus on delivering a consistent,
        high-quality experience that drives Time to First Value and reduces early
        churn.\\n\_\\nWe are a globally distributed, async-first team. We value direct,
        respectful communication and strong ownership. Our goal is to remove friction
        from the customer journey so gym owners can get to work faster.\\n\\n\\n\",
