        underline;&quot;&gt;&lt;strong&gt;What You\u2019ll Do&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\\n&lt;p&gt;Tekmetric
        is looking for a Senior Software Engineer (Backend) to take part in the full
        development lifecycle, from ideation and brainstorming, to implementation
        and testing. You will build a strong relationship with Product and Design
        teams and ensure our vision and goals are aligned. You will take abstract
        problems and interactively distill and build scalable, sustainable, and performant
        solutions. Our ideal candidate has experience in Java, Spring, and MySQL.
        Experience with Javascript and React is a plus&lt;/p&gt;\\n&lt;p&gt;&lt;strong&gt;You
        will be responsible for:&amp;nbsp;&lt;/strong&gt;&lt;/p&gt;\\n&lt;ul&gt;\\n&lt;li&gt;Design
        and implement scalable services and applications that enable positive user
        experiences and measurable business growth&lt;/li&gt;\\n&lt;li&gt;Provide
