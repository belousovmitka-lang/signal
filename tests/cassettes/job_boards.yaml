        Tekmetric&lt;/u&gt;&lt;/strong&gt;&lt;/p&gt;\\n&lt;p&gt;Tekmetric is the all-in-one,
        cloud-based software helping auto repair shops run smarter, grow faster, and
        serve customers better. &lt;br&gt;&lt;br&gt;Built by a shop owner and shaped
        by the needs of the industry, Tekmetric brings together innovation, real-world
        experience, and a thriving community to help shops thrive - not just survive.&amp;nbsp;From
        running a shop, to securing payments to engaging customers, our platform simplifies
        operations so shop owners can focus on what really matters: delivering exceptional
        service, earning trust, and growing sustainably.&lt;/p&gt;\\n&lt;p&gt;Officially
        founded in Houston in 2017, Tekmetric has grown from a single shop\u2019s
        vision to the industry\u2019s leading solution - all by staying true to our
        values of transparency, integrity, innovation, and a service-first mindset.&amp;nbsp;&lt;br&gt;&lt;br&gt;But
        we\u2019re not just building shop management software. We\u2019re building
        a movement. We\u2019re empowering repair shops to rise above the daily grind,
        create meaningful connections with their customers, and lead the industry
        forward - one interaction at a time.&lt;/p&gt;\\n&lt;p&gt;Come build with
        us. Join the journey. Shape the future of auto repair.&lt;/p&gt;\\n&lt;p&gt;&lt;span
        style=&quot;text-decoration: underline;&quot;&gt;&lt;strong&gt;Working the
        Tekmetric Way&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\\n&lt;p&gt;At Tekmetric,
        we\u2019re building a culture where winning matters - not for ego, but because
        when our customers win, we win together.&amp;nbsp;&lt;/p&gt;\\n&lt;p&gt;We
        move fast, stay curious, and take full ownership of our results \u2014 no
        excuses, no finger-pointing. If you thrive in ambiguity, take initiative,
        and view honest feedback as fuel for growth, you\u2019ll feel right at home
        here.&lt;/p&gt;\\n&lt;p&gt;We\u2019re direct but respectful, ambitious yet
        grounded, and collaborative at every level. Everyone leads through impact
        and is encouraged to speak up, share ideas, and challenge assumptions (even
        your manager\u2019s). This is a place for builders, not bystanders.&lt;/p&gt;\\n&lt;p&gt;Success
        here takes focus, follow-through, and a willingness to roll up your sleeves
        \u2014 but if you\u2019re driven by meaningful work and real results, it\u2019s
        deeply rewarding. You\u2019ll join a team that cares about the work, supports
        one another, and takes smart risks to achieve bold goals. &lt;strong&gt;Be
        yourself, stay mission-focused, and you\u2019ll thrive.&lt;/strong&gt; If
        that energizes you, we can\u2019t wait to meet you.&lt;/p&gt;\\n&lt;p&gt;&lt;strong&gt;Where
        We Work&lt;/strong&gt;: At Tekmetric, great work happens anywhere, but great
        teams are built through intentional connection. We offer hybrid and remote
        work models based on your proximity to our office hubs. Because we value in-person
        collaboration, travel is an expected part of every role. We come together
        several times a year for team and company-wide offsites to align on goals
        and strengthen relationships. Attendance at these events is expected and fully
        supported.&lt;/p&gt;&lt;/div&gt;&lt;p&gt;&lt;span style=&quot;text-decoration:
        underline;&quot;&gt;&lt;strong&gt;What You\u2019ll Do&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\\n&lt;p&gt;We
        are looking for a high-energy and independent analyst to assist with planning,
        organizing, and enhancing the sales organization in an effort to maximize
        productivity as part of a quickly growing sales organization!&lt;/p&gt;\\n&lt;ul&gt;\\n&lt;li&gt;To
        help align sales goals to company strategy and collaborate across the revenue
        teams, enact quality control measures to ensure consistent and reliable processes
        are in place to support those goals&lt;/li&gt;\\n&lt;li&gt;Strategize with
        sales leadership to improve sales processes (including sales methodology,
        enablement, and operations) and reporting to ensure proper visibility of leading
        indicators that inform proactive decisions&lt;/li&gt;\\n&lt;li&gt;Oversee
        CRM (Salesforce) performance and engagement across the sales team to ensure
        adoption and adherence to policy and standard operating procedures (e.g. completing
        missing properties, correcting mis-matched records, etc..)&lt;/li&gt;\\n&lt;li&gt;Champion
        data hygiene: Audit and maintain Salesforce data integrity by merging duplicates,
        correcting inaccuracies, and running routine data-cleanup operations to ensure
        reliable reporting.&lt;/li&gt;\\n&lt;li&gt;Support the frontline: Serve as
        the first line of defense for day-to-day sales user issues, troubleshooting
        system roadblocks, and unblocking reps so they can focus on selling.&lt;/li&gt;\\n&lt;li&gt;Optimize
        the tech stack: Assist in managing and configuring our broader revenue tech
        ecosystem alongside Salesforce\u2014troubleshooting issues across platforms
        like Outreach, Chili Piper, and Gong.&lt;/li&gt;\\n&lt;li&gt;Drive process
        improvement: Monitor how the sales team actually interacts with newly rolled-out
        processes and gather on-the-ground feedback to help leadership refine and
        optimize workflows.&lt;/li&gt;\\n&lt;li&gt;Tackle ad-hoc RevOps projects:
        Collaborate with the broader Revenue Operations team on strategic initiatives,
        assisting with everything from data migrations to new tool implementations.&lt;/li&gt;\\n&lt;li&gt;Build
        the playbook: Document standard operating procedures (SOPs) and create accessible
        &quot;how-to&quot; guides and training materials to improve user adoption.&lt;/li&gt;\\n&lt;li&gt;Surface
        insights: Help build and maintain reports and dashboards to give sales managers
        clear, accurate visibility into pipeline health and rep activity.&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;p&gt;&amp;nbsp;&lt;/p&gt;\\n&lt;p&gt;&lt;strong&gt;&lt;span
        style=&quot;text-decoration: underline;&quot;&gt;What You\u2019ll Bring:&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;\\n&lt;ul&gt;\\n&lt;li&gt;1+
        years experience sales, operations, and sales operations management&lt;/li&gt;\\n&lt;li&gt;Experience
        working in SaaS or a fast-paced startup environment.&lt;/li&gt;\\n&lt;li&gt;Intrinsically
        motivated. No one needs to tell you what to do, you just do it&amp;nbsp;&lt;/li&gt;\\n&lt;li&gt;Excellent
        presentation, communication, and interpersonal skills&lt;/li&gt;\\n&lt;li&gt;Demonstrated
        ability to summarize key insights and effectively communicate them to leadership
        (especially Revenue Operations).&lt;/li&gt;\\n&lt;li&gt;Experience with following
        defined processes using a CRM (Salesforce is a plus)&lt;/li&gt;\\n&lt;li&gt;Innate
        interest in startups, sales, and technology, with a strong desire to be a
        top performer&lt;/li&gt;\\n&lt;li&gt;Strong organizational and time management
        skills&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;div class=&quot;content-conclusion&quot;&gt;&lt;p&gt;&lt;strong&gt;&lt;span
