        \"2026-02-05T09:36:24-05:00\", \"language\": \"en\", \"application_deadline\":
        null, \"content\": \"&lt;div class=&quot;content-intro&quot;&gt;&lt;p&gt;&lt;strong&gt;&lt;u&gt;About
        Tekmetric&lt;/u&gt;&lt;/strong&gt;&lt;/p&gt;\\n&lt;p&gt;Tekmetric is the all-in-one,
        cloud-based software helping auto repair shops run smarter, grow faster, and
        serve customers better. &lt;br&gt;&lt;br&gt;Built by a shop owner and shaped
        by the needs of the industry, Tekmetric brings together innovation, real-world
        experience, and a thriving community to help shops thrive - not just survive.&amp;nbsp;From
        running a shop, to securing payments to engaging customers, our platform simplifies
        operations so shop owners can focus on what really matters: delivering exceptional
        service, earning trust, and growing sustainably.&lt;/p&gt;\\n&lt;p&gt;Officially
        founded in Houston in 2017, Tekmetric has grown from a single shop\u2019s
        vision to the industry\u2019s leading solution - all by staying true to our
        values of transparency, integrity, innovation, and a service-first mindset.&amp;nbsp;&lt;br&gt;&lt;br&gt;But
        we\u2019re not just building shop management software. We\u2019re building
        a movement. We\u2019re empowering repair shops to rise above the daily grind,
        create meaningful connections with their customers, and lead the industry
        forward - one interaction at a time.&lt;/p&gt;\\n&lt;p&gt;Come build with
        us. Join the journey. Shape the future of auto repair.&lt;/p&gt;\\n&lt;p&gt;&lt;span
        style=&quot;text-decoration: underline;&quot;&gt;&lt;strong&gt;Working the
        Tekmetric Way&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\\n&lt;p&gt;At Tekmetric,
        we\u2019re building a culture where winning matters - not for ego, but because
        when our customers win, we win together.&amp;nbsp;&lt;/p&gt;\\n&lt;p&gt;We
        move fast, stay curious, and take full ownership of our results \u2014 no
        excuses, no finger-pointing. If you thrive in ambiguity, take initiative,
        and view honest feedback as fuel for growth, you\u2019ll feel right at home
        here.&lt;/p&gt;\\n&lt;p&gt;We\u2019re direct but respectful, ambitious yet
        grounded, and collaborative at every level. Everyone leads through impact
        and is encouraged to speak up, share ideas, and challenge assumptions (even
        your manager\u2019s). This is a place for builders, not bystanders.&lt;/p&gt;\\n&lt;p&gt;Success
        here takes focus, follow-through, and a willingness to roll up your sleeves
        \u2014 but if you\u2019re driven by meaningful work and real results, it\u2019s
        deeply rewarding. You\u2019ll join a team that cares about the work, supports
        one another, and takes smart risks to achieve bold goals. &lt;strong&gt;Be
        yourself, stay mission-focused, and you\u2019ll thrive.&lt;/strong&gt; If
        that energizes you, we can\u2019t wait to meet you.&lt;/p&gt;\\n&lt;p&gt;&lt;strong&gt;Where
        We Work&lt;/strong&gt;: At Tekmetric, great work happens anywhere, but great
        teams are built through intentional connection. We offer hybrid and remote
        work models based on your proximity to our office hubs. Because we value in-person
        collaboration, travel is an expected part of every role. We come together
        several times a year for team and company-wide offsites to align on goals
        and strengthen relationships. Attendance at these events is expected and fully
        supported.&lt;/p&gt;&lt;/div&gt;&lt;p&gt;&lt;span style=&quot;text-decoration:
        underline;&quot;&gt;&lt;strong&gt;What You\u2019ll Do&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\\n&lt;p&gt;Some
        of the most meaningful design problems aren&#39;t in consumer apps. They&#39;re
        in the software people rely on to run their businesses every day.&lt;/p&gt;\\n&lt;p&gt;You&#39;ll
        help shape the platform that powers tens of thousands of independent automotive
        businesses. From helping customers discover a shop, to answering the phone,
        scheduling appointments, managing repairs, communicating with drivers, getting
        paid, and everything in between, you&#39;ll design experiences that simplify
        complex work. Every improvement you ship saves time, reduces stress, and helps
        shop owners serve their customers better, grow their businesses, and spend
        more time with their families.&lt;/p&gt;\\n&lt;p&gt;At Tekmetric, Design is
        a strategic partner, not a service organization. You&#39;ll work alongside
        Product and Engineering from the earliest stages of discovery, helping define
        the right problems before designing the right solutions. You&#39;ll influence
        product direction, simplify complex workflows, and help shape the future of
        a platform relied on by thousands of businesses every day.&lt;/p&gt;\\n&lt;p&gt;If
        you enjoy turning complexity into clarity, working directly with customers,
        and solving meaningful enterprise workflow challenges, you&#39;ll find plenty
        to build here.&lt;/p&gt;\\n&lt;p&gt;Hear directly from our customers about
        the impact Tekmetric has had on their businesses and their lives:&lt;br&gt;&lt;br&gt;&lt;a
        href=&quot;https://youtu.be/JhmirrG-VJ0?si=LoNMxUR0P_0QAaoY&quot;&gt;The Builder
        - Adam&#39;s Automotive&lt;br&gt;&lt;/a&gt;&lt;a href=&quot;https://youtu.be/GuZyxsf-Wis?si=tz5T31yHy8uipnzr&quot;&gt;The
        Boss - Northrich Automotive&lt;br&gt;&lt;/a&gt;&lt;a href=&quot;https://youtu.be/MyyNH_9HE5Y?si=EbKySjcSytVTLcAy&quot;&gt;The
        Passion - Eurowise&lt;br&gt;&lt;/a&gt;&lt;a href=&quot;https://www.tekmetric.com/under-the-lift&quot;&gt;And
        many others\u2026&lt;/a&gt;&lt;/p&gt;\\n&lt;p&gt;You will be responsible for:&amp;nbsp;&lt;/p&gt;\\n&lt;ul&gt;\\n&lt;li&gt;Building
        end-to-end user experiences&lt;/li&gt;\\n&lt;li&gt;Aiding in discovery phases
        and helping define product requirements&lt;/li&gt;\\n&lt;li&gt;Creating designs,
        prototypes and artifacts to facilitate user testing and apply learnings to
        designs&lt;/li&gt;\\n&lt;li&gt;Guiding the design team to develop a shared
        understanding and alignment of solutions that best fit our customer needs.&amp;nbsp;&lt;/li&gt;\\n&lt;li&gt;Assisting
        in onboarding new design team members,&amp;nbsp; providing them with insights,
        best practices, and shadowing opportunities.&lt;/li&gt;\\n&lt;li&gt;Collaborating
        with product management, engineering and business partners to build and iterate
        on customer facing products&lt;/li&gt;\\n&lt;li&gt;Working with other product
        designers and front-end engineering team to manage a design system used within
        the consumer product ecosystem&lt;/li&gt;\\n&lt;li&gt;Collaborating with engineering
        to ensure visual quality and finesse of the product and user experience&lt;/li&gt;\\n&lt;li&gt;Regularly
        soliciting feedback from your peers, including other product designers, product
        managers and teammates in your product team&lt;/li&gt;\\n&lt;li&gt;Championing
        cohesion and consistency in UX design that unites a growing family of products/features&lt;/li&gt;\\n&lt;li&gt;Being
        a strategic leader with a vision in how to implement experiences that represent
