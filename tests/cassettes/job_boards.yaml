        \"location\": {\"name\": \"Houston, Texas\"}, \"metadata\": null, \"id\":
        6145246004, \"updated_at\": \"2026-10-02T11:07:15-04:00\", \"requisition_id\":
        \"26AOP214\", \"title\": \"Sr. Manager, Public Relations and Communications\",
        \"company_name\": \"Tekmetric\", \"first_published\": \"2026-08-17T11:04:40-04:00\",
        \"language\": \"en\", \"application_deadline\": null, \"content\": \"&lt;div
        class=&quot;content-intro&quot;&gt;&lt;p&gt;&lt;strong&gt;&lt;u&gt;About Tekmetric&lt;/u&gt;&lt;/strong&gt;&lt;/p&gt;\\n&lt;p&gt;Tekmetric
        is the all-in-one, cloud-based software helping auto repair shops run smarter,
        grow faster, and serve customers better. &lt;br&gt;&lt;br&gt;Built by a shop
        owner and shaped by the needs of the industry, Tekmetric brings together innovation,
        real-world experience, and a thriving community to help shops thrive - not
        just survive.&amp;nbsp;From running a shop, to securing payments to engaging
        customers, our platform simplifies operations so shop owners can focus on
        what really matters: delivering exceptional service, earning trust, and growing
        sustainably.&lt;/p&gt;\\n&lt;p&gt;Officially founded in Houston in 2017, Tekmetric
        has grown from a single shop\u2019s vision to the industry\u2019s leading
        solution - all by staying true to our values of transparency, integrity, innovation,
        and a service-first mindset.&amp;nbsp;&lt;br&gt;&lt;br&gt;But we\u2019re not
        just building shop management software. We\u2019re building a movement. We\u2019re
        empowering repair shops to rise above the daily grind, create meaningful connections
        with their customers, and lead the industry forward - one interaction at a
        time.&lt;/p&gt;\\n&lt;p&gt;Come build with us. Join the journey. Shape the
        future of auto repair.&lt;/p&gt;\\n&lt;p&gt;&lt;span style=&quot;text-decoration:
        underline;&quot;&gt;&lt;strong&gt;Working the Tekmetric Way&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\\n&lt;p&gt;At
        Tekmetric, we\u2019re building a culture where winning matters - not for ego,
        but because when our customers win, we win together.&amp;nbsp;&lt;/p&gt;\\n&lt;p&gt;We
        move fast, stay curious, and take full ownership of our results \u2014 no
        excuses, no finger-pointing. If you thrive in ambiguity, take initiative,
        and view honest feedback as fuel for growth, you\u2019ll feel right at home
        here.&lt;/p&gt;\\n&lt;p&gt;We\u2019re direct but respectful, ambitious yet
        grounded, and collaborative at every level. Everyone leads through impact
        and is encouraged to speak up, share ideas, and challenge assumptions (even
        your manager\u2019s). This is a place for builders, not bystanders.&lt;/p&gt;\\n&lt;p&gt;Success
        here takes focus, follow-through, and a willingness to roll up your sleeves
        \u2014 but if you\u2019re driven by meaningful work and real results, it\u2019s
        deeply rewarding. You\u2019ll join a team that cares about the work, supports
        one another, and takes smart risks to achieve bold goals. &lt;strong&gt;Be
        yourself, stay mission-focused, and you\u2019ll thrive.&lt;/strong&gt; If
        that energizes you, we can\u2019t wait to meet you.&lt;/p&gt;\\n&lt;p&gt;&lt;strong&gt;Where
        We Work&lt;/strong&gt;: At Tekmetric, great work happens anywhere, but great
        teams are built through intentional connection. We offer hybrid and remote
        work models based on your proximity to our office hubs. Because we value in-person
        collaboration, travel is an expected part of every role. We come together
        several times a year for team and company-wide offsites to align on goals
        and strengthen relationships. Attendance at these events is expected and fully
        supported.&lt;/p&gt;&lt;/div&gt;&lt;p&gt;&lt;span style=&quot;text-decoration:
        underline;&quot;&gt;&lt;strong&gt;What You\u2019ll Do&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\\n&lt;p&gt;&lt;strong&gt;&lt;em&gt;This
        is not a traditional PR role \u2014 and if that excites you, keep reading.&lt;/em&gt;&lt;/strong&gt;&lt;/p&gt;\\n&lt;p&gt;Tekmetric
        is at an inflection point. We&#39;ve built the leading platform for independent
        auto repair shops, and now we&#39;re investing in the stories, voices, and
        credibility that will define our position in the industry for years to come.
        We&#39;re looking for a Sr. Public Relations Manager who thinks well beyond
        press releases and clip reports \u2014 someone who understands that PR in
        2026 is as much about AI citation and &quot;share of model&quot; as it is
        about front-page features, and who knows how to build earned authority that
        shapes how journalists, industry voices, and AI engines understand and talk
        about Tekmetric.&lt;/p&gt;\\n&lt;p&gt;You&#39;ll own our external communications
        strategy end-to-end: from building our executive thought leadership program
        from the ground up, to managing high-value media partnerships, driving our
        founder-led content engine, and translating product milestones and community
        impact into compelling stories that land. This is a high-visibility, high-impact
        individual contributor role that sits at the intersection of earned media,
        executive positioning, and brand credibility \u2014 and it requires someone
        with both the strategic range to architect long-term programs and the polish
        to represent Tekmetric at the highest levels.&lt;/p&gt;\\n&lt;p&gt;&lt;em&gt;As
        our Sr. Public Relations Manager, you&#39;ll be the architect of Tekmetric&#39;s
        earned media presence and the steward of how our leaders, our company, and
        our community are seen by the world.&lt;/em&gt;&lt;/p&gt;\\n&lt;ul&gt;\\n&lt;li&gt;&lt;strong&gt;Build
        and lead our executive thought leadership program&lt;/strong&gt;. Develop
        a proactive, systematic approach to positioning Tekmetric&#39;s leadership
        team as authoritative, trusted voices in the auto repair industry and the
        broader space. Starting with our founder and CEO, you&#39;ll identify speaking
        opportunities, secure contributed content placements, pitch podcast and media
        appearances, and craft messaging that earns credibility in both traditional
        and AI-powered media environments.&lt;/li&gt;\\n&lt;li&gt;&lt;strong&gt;Own
        the earned media strategy \u2014 and evolve it for the AI era&lt;/strong&gt;.
        Develop and execute a media relations strategy rooted in data-driven storytelling
        and deep relationships with the trade and business press covering our space.
        You understand that the goal today isn&#39;t just earning a click \u2014 it&#39;s
        earning a citation. You&#39;ll build a sustainable earned media engine that
        positions Tekmetric as the defining voice in the auto repair technology category,
        with an eye on GEO and AI visibility as a core strategic lever.&lt;/li&gt;\\n&lt;li&gt;&lt;strong&gt;Drive
        our founder-led content engine&lt;/strong&gt;. Partner closely with our CEO
        to develop an authentic, high-impact content program that puts real expertise
        and perspective on the page. You&#39;ll own the strategy, develop the editorial
        framework, and manage the production workflow that turns leadership insights
        into industry-shaping content across publications, platforms, and media outlets.&lt;/li&gt;\\n&lt;li&gt;&lt;strong&gt;Lead
        Tektonic media partnerships and conference PR&lt;/strong&gt;. Tektonic is
        Tekmetric&#39;s flagship annual industry event \u2014 and one of our highest-profile
        brand moments. You&#39;ll own the media partnership strategy for Tektonic,
        developing and managing relationships with trade publications, journalists,
        and content partners to maximize coverage, credibility, and industry reach
        before, during, and after the event.&lt;/li&gt;\\n&lt;li&gt;&lt;strong&gt;Partner
        with Product on launches that earn attention&lt;/strong&gt;. Work hand-in-hand
        with Product and cross-functional teams to craft narratives for product announcements
        that drive coverage and real industry conversation. You&#39;ll develop pitch
        angles, coordinate the media strategy, and ensure every major product launch
        moment gets the external visibility and third-party validation it deserves.&lt;/li&gt;\\n&lt;li&gt;&lt;strong&gt;Position
        our leaders as subject matter experts. &lt;/strong&gt;Identify, develop, and
        amplify the expertise of Tekmetric&#39;s leaders across marketing, sales,
        product, finance, operations, customer success, and beyond \u2014 matching
        the right internal voices to the right audiences to build authority across
        the conversations that matter most to our business.&lt;/li&gt;\\n&lt;li&gt;&lt;strong&gt;Package
        Tekmetric&#39;s philanthropic and community impact&lt;/strong&gt;. Find and
        tell the human stories behind Tekmetric&#39;s investment in the auto repair
        community. You&#39;ll shape the narrative around our broader industry impact
        in a way that resonates with our audience and reinforces Tekmetric&#39;s reputation
        as a company that genuinely cares.&lt;/li&gt;\\n&lt;li&gt;&lt;strong&gt;Own
        our media sponsorships&lt;/strong&gt;. Manage and maximize Tekmetric&#39;s
        portfolio of media and trade sponsorships, ensuring each delivers real strategic
        value \u2014 not just logo placements. You&#39;ll evaluate opportunities,
        negotiate agreements, and build the partnerships that extend our reach in
        the right places.&lt;/li&gt;\\n&lt;li&gt;&lt;strong&gt;Apply a GEO-forward
        lens to everything&lt;/strong&gt;. You understand that earned media is the
        primary driver of AI citation, and that brands winning &quot;share of model&quot;
        today are those who&#39;ve systematically built external authority over time.
        You&#39;ll embed GEO thinking into media strategy, content structure, and
        narrative architecture \u2014 treating AI visibility as a core PR metric alongside
        traditional share of voice and earned impressions.&lt;/li&gt;\\n&lt;li&gt;&lt;strong&gt;Measure
        what actually matters&lt;/strong&gt;. Define and track the right signals:
        earned media reach, placement quality, executive visibility, share of voice
        trends, and brand mention sentiment inside AI-generated answers. You&#39;ll
        build reporting that connects PR activity to business outcomes and communicate
        progress clearly to senior stakeholders.&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;p&gt;&lt;span
        style=&quot;text-decoration: underline;&quot;&gt;&lt;strong&gt;What You\u2019ll
        Bring&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\\n&lt;ul&gt;\\n&lt;li&gt;Bachelor&#39;s
        degree and/or 8+ years of experience in public relations, communications,
        or a closely related field&lt;/li&gt;\\n&lt;li&gt;Proven track record of building
        and executing earned media strategies that drive meaningful, measurable results&lt;/li&gt;\\n&lt;li&gt;Deep
        experience in executive communications, thought leadership development, or
        executive visibility programs&lt;/li&gt;\\n&lt;li&gt;Strong, established relationships
        media, with a track record of securing high-quality placements&lt;/li&gt;\\n&lt;li&gt;Experience
        in B2B, SaaS, or technology communications \u2014 ideally in a vertical or
        industry-specific context with a non-desk or field-based end audience&lt;/li&gt;\\n&lt;li&gt;A
        working understanding of how GEO and AI search are reshaping PR strategy,
        and the curiosity and drive to stay ahead of it&lt;/li&gt;\\n&lt;li&gt;Exceptional
        writing, editing, and messaging skills \u2014 you can write a crisp media
        pitch, a polished op-ed, a sharp press release, and a tight set of talking
        points with equal confidence&lt;/li&gt;\\n&lt;li&gt;High executive presence
        and interpersonal polish; you&#39;re comfortable engaging directly with C-suite
        leaders, board members, and external media partners&lt;/li&gt;\\n&lt;li&gt;Ability
        to navigate ambiguity, lead without a roadmap, and bring structure to programs
        being built for the first time&lt;/li&gt;\\n&lt;li&gt;Proven track record
        of working cross-functionally, especially with Product, Sales, and executive
        stakeholders&lt;/li&gt;\\n&lt;li&gt;Experience managing media sponsorships,
        event media partnerships, or conference PR strategy&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;p&gt;&lt;span
        style=&quot;text-decoration: underline;&quot;&gt;&lt;strong&gt;Nice to have&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\\n&lt;ul&gt;\\n&lt;li&gt;Experience
        marketing to field-based, non-desk, or trade audiences (or anything adjacent
        to the skilled trades / local service economy)&lt;/li&gt;\\n&lt;li&gt;Familiarity
        with PR tools like Meltwater, Muck Rack or Cision, and emerging AI visibility
        tracking tools&lt;/li&gt;\\n&lt;li&gt;Familiarity with how AI search is changing
        discovery\u2014and curiosity to test how content earns visibility and trust
        in that environment&lt;/li&gt;\\n&lt;/ul&gt;&lt;div class=&quot;content-conclusion&quot;&gt;&lt;p&gt;&lt;strong&gt;&lt;span
        style=&quot;text-decoration: underline;&quot;&gt;Why You&#39;ll Love Working
        With Us&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;\\n&lt;p&gt;&lt;em&gt;Health
        &amp;amp; Wellness That Have You Covered:&lt;/em&gt;&lt;/p&gt;\\n&lt;ul&gt;\\n&lt;li&gt;Enjoy
        the flexibility of remote work&lt;/li&gt;\\n&lt;li&gt;Competitive base salaries
        that reflect your value.&lt;/li&gt;\\n&lt;li&gt;Flexible PTO \u2014 No set
        number of days, just the trust to take the time you need. We genuinely encourage
        our team to disconnect and recharge.&lt;/li&gt;\\n&lt;li&gt;Support for every
        stage of life\u2014with paid maternity, parental bonding, and medical leave
        for you or your loved ones.&lt;/li&gt;\\n&lt;li&gt;Comprehensive health benefits,
        including Medical, Dental, Vision, and Prescription coverage. For employee
        only, we offer plans that cover 100% of premiums and we cover 50% of costs
        for families.&lt;/li&gt;\\n&lt;li&gt;Prioritizing your mental health: get
        free, confidential counseling through our partnership with BetterHelp.&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;p&gt;&lt;em&gt;Investing
        in Your Future (and Present):&lt;/em&gt;&lt;/p&gt;\\n&lt;ul&gt;\\n&lt;li&gt;401(k)
        Retirement Savings Plan with 100% employer match on contributions up to 6%
        - so your future self will thank you.&lt;/li&gt;\\n&lt;li&gt;Flexible Spending
        Accounts (FSA) and Health Savings Accounts (HSA) to make your money go further.&lt;/li&gt;\\n&lt;li&gt;Life
        and Accidental Death &amp;amp; Dismemberment (AD&amp;amp;D) Insurance for
        added peace of mind.&lt;/li&gt;\\n&lt;li&gt;Wellness on your terms: get up
        to $60/month toward fitness, mental health, or almost anything that helps
        you feel your best.&lt;/li&gt;\\n&lt;li&gt;After one year of employment, enjoy
        a $300 home office setup bonus to help make your space work for you.&amp;nbsp;&lt;/li&gt;\\n&lt;li&gt;Keep
        growing with support for continuing education - we\u2019re invested in your
        development.&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;p&gt;&amp;nbsp;&lt;/p&gt;\\n&lt;p&gt;Most
        importantly, we have a stellar team, a whole lot of fun, and work that actually
        matters to the shops and families we serve!&lt;/p&gt;\\n&lt;p&gt;&amp;nbsp;&lt;/p&gt;\\n&lt;p&gt;&lt;em&gt;Tekmetric
        is an equal opportunity employer. We hire hard-working individuals, regardless
