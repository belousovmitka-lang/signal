        \"first_published\": \"2026-09-28T14:33:25-04:00\", \"language\": \"en\",
        \"application_deadline\": null, \"content\": \"&lt;div class=&quot;content-intro&quot;&gt;&lt;p&gt;&lt;strong&gt;&lt;u&gt;About
        Tekmetric&lt;/u&gt;&lt;/strong&gt;&lt;/p&gt;\\n&lt;p&gt;Tekmetric is the all-in-one,
        cloud-based software helping auto repair shops run smarter, grow faster, and
        serve customers better. &lt;br&gt;&lt;br&gt;Built by a shop owner and shaped
        by the needs of the industry, Tekmetric brings together innovation, real-world
        experience, and a thriving community to help shops thrive - not just survive.&amp;nbsp;From
        running a shop, to securing payments to engaging customers, our platform simplifies
        operations so shop owners can focus on what really matters: delivering exceptional
        service, earning trust, and growing sustainably.&lt;/p&gt;\\n&lt;p&gt;Officially
        founded in Houston in 2017, Tekmetric has grown from a single shop\u2019s
        vision to the industry\u2019s leading solution - all by staying true to our
        values of transparency, integrity, innovation, and a service-first mindset.&amp;nbsp;&lt;br&gt;&lt;br&gt;But
        we\u2019re not just building shop management software. We\u2019re building
        a movement. We\u2019re empowering repair shops to rise above the daily grind,
        create meaningful connections with their customers, and lead the industry
        forward - one interaction at a time.&lt;/p&gt;\\n&lt;p&gt;Come build with
        us. Join the journey. Shape the future of auto repair.&lt;/p&gt;\\n&lt;p&gt;&lt;span
        style=&quot;text-decoration: underline;&quot;&gt;&lt;strong&gt;Working the
        Tekmetric Way&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\\n&lt;p&gt;At Tekmetric,
        we\u2019re building a culture where winning matters - not for ego, but because
        when our customers win, we win together.&amp;nbsp;&lt;/p&gt;\\n&lt;p&gt;We
        move fast, stay curious, and take full ownership of our results \u2014 no
        excuses, no finger-pointing. If you thrive in ambiguity, take initiative,
        and view honest feedback as fuel for growth, you\u2019ll feel right at home
        here.&lt;/p&gt;\\n&lt;p&gt;We\u2019re direct but respectful, ambitious yet
        grounded, and collaborative at every level. Everyone leads through impact
        and is encouraged to speak up, share ideas, and challenge assumptions (even
        your manager\u2019s). This is a place for builders, not bystanders.&lt;/p&gt;\\n&lt;p&gt;Success
        here takes focus, follow-through, and a willingness to roll up your sleeves
        \u2014 but if you\u2019re driven by meaningful work and real results, it\u2019s
        deeply rewarding. You\u2019ll join a team that cares about the work, supports
        one another, and takes smart risks to achieve bold goals. &lt;strong&gt;Be
        yourself, stay mission-focused, and you\u2019ll thrive.&lt;/strong&gt; If
        that energizes you, we can\u2019t wait to meet you.&lt;/p&gt;\\n&lt;p&gt;&lt;strong&gt;Where
        We Work&lt;/strong&gt;: At Tekmetric, great work happens anywhere, but great
        teams are built through intentional connection. We offer hybrid and remote
        work models based on your proximity to our office hubs. Because we value in-person
        collaboration, travel is an expected part of every role. We come together
        several times a year for team and company-wide offsites to align on goals
        and strengthen relationships. Attendance at these events is expected and fully
        supported.&lt;/p&gt;&lt;/div&gt;&lt;h3&gt;&lt;span style=&quot;text-decoration:
        underline;&quot;&gt;&lt;strong&gt;What You&#39;ll Do&lt;/strong&gt;&lt;/span&gt;&lt;/h3&gt;\\n&lt;p&gt;The
        Senior Product Operations Manager will be the analytical and operational engine
        behind how product outcomes are defined, measured, and understood across Tekmetric.
        This person will work closely with product leadership to build the company&#39;s
        metrics program from the ground up, contributing to its design, owning execution,
        and bringing the statistical foundation that makes it credible. If you&#39;ve
        worked inside a well-run analytics or metrics program and have been waiting
        for the chance to help build one, this is that seat.&lt;/p&gt;\\n&lt;p&gt;&lt;strong&gt;Responsibilities:&lt;/strong&gt;&lt;/p&gt;\\n&lt;h4&gt;Metrics
        Program Design &amp;amp; Outcome Modeling&lt;/h4&gt;\\n&lt;ul&gt;\\n&lt;li&gt;Partner
        with product leadership to design and evolve Tekmetric&#39;s product metrics
        program, contributing to what we measure, why it matters, and how metrics
        connect to the outcomes the business is trying to drive.&lt;/li&gt;\\n&lt;li&gt;Build
        and maintain a multi-variable outcome model that captures the relationships
        between product inputs and business results across retention, revenue, customer
        health, and engagement.&lt;/li&gt;\\n&lt;li&gt;Apply statistical methods,
        including regression, correlation analysis, and predictive modeling, to validate
        metric definitions and ensure the model reflects how the business actually
        works, not just what&#39;s easy to measure.&lt;/li&gt;\\n&lt;li&gt;Contribute
        to the frameworks, taxonomies, and standards that make metrics consistent,
        trustworthy, and actionable across product and leadership.&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;h4&gt;Insights
        &amp;amp; Analytics&lt;/h4&gt;\\n&lt;ul&gt;\\n&lt;li&gt;Conduct proactive,
        deep-dive analyses to uncover customer behavior trends, product usage patterns,
        friction points, and revenue-impact opportunities.&lt;/li&gt;\\n&lt;li&gt;Deliver
        strategic insights that inform prioritization, roadmap decisions, and OKRs,
        not just findings, but clear recommendations with a point of view on what
        to do next and why it matters.&lt;/li&gt;\\n&lt;li&gt;Translate data into
        compelling narratives for executive reviews, board decks, and product planning
        cycles.&lt;/li&gt;\\n&lt;li&gt;Manage your own backlog of analytical work,
        identifying what needs attention, setting priorities, and closing the loop
        with stakeholders on what was learned and what it means.&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;h4&gt;Enablement
        &amp;amp; Data Democratization&lt;/h4&gt;\\n&lt;ul&gt;\\n&lt;li&gt;Develop
        easy-to-use dashboards, templates, and toolkits that empower PMs and cross-functional
        teams to self-serve insights.&lt;/li&gt;\\n&lt;li&gt;Train stakeholders on
        how to interpret and leverage product data to make better decisions.&lt;/li&gt;\\n&lt;li&gt;Standardize
        reporting practices across product teams, ensuring consistency and clarity.&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;h4&gt;Data
        Infrastructure &amp;amp; Collaboration&lt;/h4&gt;\\n&lt;ul&gt;\\n&lt;li&gt;Partner
        with Engineering and Data teams to define and maintain event tracking, taxonomy
        standards, and data governance practices across the product.&lt;/li&gt;\\n&lt;li&gt;Ensure
        data accuracy, completeness, and consistency to support strategic product
        decisions.&lt;/li&gt;\\n&lt;li&gt;Build and maintain core product metrics,
        dashboards, and self-service data models within the existing analytics stack
        (Looker, Pendo, Mixpanel, Redshift).&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;h3&gt;&lt;span
        style=&quot;text-decoration: underline;&quot;&gt;&lt;strong&gt;What You&#39;ll
        Bring&lt;/strong&gt;&lt;/span&gt;&lt;/h3&gt;\\n&lt;ul&gt;\\n&lt;li&gt;5-8+
        years in Product Operations, Product Analytics, Business Intelligence, or
        related roles.&lt;/li&gt;\\n&lt;li&gt;Genuine foundation in statistical methods,
        including regression, correlation, and predictive modeling. This is the one
        area where we&#39;re not looking for someone who will learn on the job; you
        need to bring it.&lt;/li&gt;\\n&lt;li&gt;Exposure to analytics or metrics
        program work. You&#39;ve seen what a well-built program looks like and you&#39;re
        ready to help build one, not just operate within one that already exists.&lt;/li&gt;\\n&lt;li&gt;Track
        record of translating complex data into actionable recommendations that influenced
        product and business decisions.&lt;/li&gt;\\n&lt;li&gt;Experience working
        in SaaS or platform products is strongly preferred.&lt;/li&gt;\\n&lt;li&gt;Strong
        command of SQL and proficiency with modern BI/analytics tools (Looker preferred).&lt;/li&gt;\\n&lt;li&gt;Fluency
        with AI tools as a core part of how you work. You use AI to synthesize, analyze,
        and scale your output, and you think about how to structure data and workflows
        to take advantage of it.&lt;/li&gt;\\n&lt;li&gt;A communicator who can answer
        &quot;so what?&quot; without being asked. You know how to find the right stakeholders,
        manage your own slate of work, and make sure the right people understand what
        the data is saying and why it matters.&lt;/li&gt;\\n&lt;li&gt;Highly organized,
        process-oriented, and capable of driving cross-functional alignment.&lt;/li&gt;\\n&lt;li&gt;Strategic
        thinker who can zoom out to see the big picture while also diving into the
        details.&lt;/li&gt;\\n&lt;/ul&gt;&lt;div class=&quot;content-conclusion&quot;&gt;&lt;p&gt;&lt;strong&gt;&lt;span
