        on the development of new features&lt;/li&gt;\\n&lt;li&gt;Provide technical
        leadership, mentorship and growth to junior team members as we scale&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;p&gt;&lt;span
        style=&quot;text-decoration: underline;&quot;&gt;&lt;strong&gt;What You\u2019ll
        Bring&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\\n&lt;ul&gt;\\n&lt;li&gt;You have
        5+ years software engineering experience&lt;/li&gt;\\n&lt;li&gt;You have experience
        with Java and SQL databases (2+ years)&lt;/li&gt;\\n&lt;li&gt;You enjoy working
