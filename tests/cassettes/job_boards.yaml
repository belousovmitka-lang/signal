        \"descriptionPlain\": \"About PushPress\\n\\nPushPress is the AI-powered gym
        management platform built for boutique fitness.\\n\\nWe are transforming how
        boutique fitness owners operate and how the entire $100B global fitness industry
        connects, transacts, and grows. Trusted by more than 5,000 gyms and 500,000
        members, PushPress processes ~$1B annually.\\n\\nWe're a Series B company
        backed by Altos Ventures, StepStone, and Mucker Capital, and we're going all-in
        on AI. Our AI Assistant, AI Member Intel, and AI-powered reporting tools are
        already changing how gym owners and coaches operate. We believe AI should
        make the human side of fitness better, not replace it.\\n\\nBy embedding intelligence
        directly into the product, we enable boutique fitness owners to make faster
        decisions, unlock new revenue streams, and collaborate across a connected
        network. As more gyms join the platform, data compounds, intelligence strengthens,
        and the value of the ecosystem increases for every owner\\n\\nWe are a global
        team of builders, operators, and fitness fanatics on a mission to level the
        playing field for independent fitness entrepreneurs. If you are ready to help
        reshape an industry, let's talk!\\n\\n\\nThe Role\\nWe\u2019re looking for
        a hands-on Controller to own the financial backbone of PushPress.\\nWe\u2019re
        a Series B SaaS company navigating increasing financial complexity: traditional
        SaaS subscriptions, AI-driven usage-based revenue, a multi-layered payments
        business processing nearly $1B annually, and expansion into new geographies.
        Our revenue model spans subscription billing, platform payment economics,
        and emerging AI monetization, each with distinct recognition and compliance
        considerations.\\nAs our first Controller, you\u2019ll build on the foundational
        work the team has already laid out. You\u2019ll have direct insight into company
        strategy to ensure you have the full context that goes into setting up our
        accounting infrastructure for the next phase of growth. While you\u2019ll
        set the direction and own the process, you\u2019ll also be in the details:
        closing the books, working through nuanced recognition questions, managing
        the order-to-cash flow, advising on product economics from a financial lens,
