        the Onboarding Team</strong></div>\\n<div>&nbsp;</div>\\n<div>The Onboarding
        Team is responsible for getting new PushPress customers set up, activated,
        and confident across all products. We focus on delivering a consistent, high-quality
        experience that drives Time to First Value and reduces early churn.</div>\\n<div>&nbsp;</div>\\n<div>We
        are a globally distributed, async-first team. We value direct, respectful
        communication and strong ownership. Our goal is to remove friction from the
        customer journey so gym owners can get to work faster.</div>\\n<p style=\\\"margin-top:
        12pt; margin-bottom: 12pt;\\\"><br><br></p>\", \"id\": \"6e15f01c-ff98-4099-a9a2-4dd0163168de\",
        \"lists\": [{\"text\": \"About The Role\", \"content\": \"<p>The Customer
        Onboarding Specialist is the first human connection new PushPress clients
        have after signing up, and that moment matters. This is a full-stack onboarding
        role, meaning you work across the entire PushPress product suite \u2014 gym
        management, CRM and marketing automation, and website services \u2014 onboarding
        customers on individual products, multiple products, or all of them together
        depending on what they\u2019ve purchased. This role is responsible for guiding
        new customers through setup, accelerating Time to First Value, and setting
        the foundation for long-term success.</p>\\n<p>You own the onboarding experience
        from kickoff through launch. Some customers are setting up one product. Others
        are standing up multiple products simultaneously, which means sequencing setup
        tracks, managing dependencies between platforms, and adapting your approach
        when priorities shift. You bring strong product knowledge, clear communication,
        and disciplined follow-through from day one. With a significant portion of
        churn occurring in the first six months, this role plays a direct role in
        retention and customer confidence.</p>\\n<p style=\\\"margin-top: 12pt; margin-bottom:
        12pt;\\\"><br><br></p>\"}, {\"text\": \"What You'll Do\", \"content\": \"\\n<li>Guide
        new clients through setup of PushPress products, including key configurations,
        integrations, and initial workflows.</li>\\n<li>Deliver onboarding through
        a mix of one-on-one calls and Intercom-based support.</li>\\n<li>Educate clients
        on workflows aligned to their business goals and operating model.</li>\\n<li>Track
        onboarding progress and proactively follow up to remove blockers.</li>\\n<li>Collaborate
        with Support and Operations teams to identify and close onboarding gaps.</li>\\n<li>Review
        and update Help Docs and customer training material to improve onboarding
        clarity.</li>\\n<li>Identify early churn signals and escalate risks to Support
        or Operations teams.</li>\\n<li>Provide how-to guidance via chat for customers
        in the onboarding phase.</li>\\n<li>Develop deep product expertise across
        the PushPress platform and stay current on new releases, feature updates,
        and best practices.</li>\\n<li>Lead scaled onboarding programs and own early
        churn identification and mitigation strategies.</li>\\n\"}, {\"text\": \"How
        Success Is Measured\", \"content\": \"\\n<li>Time to Complete Onboarding \u2014
        duration from contract signing to account launch.</li>\\n<li>Onboarding CSAT
        \u2014 client satisfaction score for the onboarding experience.</li>\\n<li>Early
        Retention \u2014 measured against churn reduction targets in the first six
        months.</li>\\n\"}, {\"text\": \"What You'll Need\", \"content\": \"\\n<li>Strong
        working knowledge of the PushPress product suite, including platform configuration
        and core workflows.</li>\\n<li>Experience leading customer onboarding, implementation,
        or setup projects in a SaaS environment.</li>\\n<li>Comfort delivering onboarding
        over video, screen share, and live troubleshooting sessions.</li>\\n<li>Strong
        project management skills with consistent follow-up and milestone ownership.</li>\\n<li>Clear,
        confident communication with the ability to explain technical concepts simply.</li>\\n<li>High
        attention to detail and disciplined use of systems and tracking tools.</li>\\n<li>Empathy
        and calm under pressure when supporting customers who feel overwhelmed.</li>\\n\"},
        {\"text\": \"Core Skills and Qualities\", \"content\": \"\\n<li>Ability to
        context-switch fluidly between calls, chat support, and follow-up work throughout
        the day.</li>\\n<li>Comfort screen sharing across desktop and mobile environments
        during live onboarding.</li>\\n<li>Proven ability to manage multiple onboarding
        timelines at once without losing quality.</li>\\n<li>Strong written and verbal
        communication that builds trust and momentum.</li>\\n<li>Comfort working in
        CRM systems to track progress, risks, and outcomes.</li>\\n<li>Ability to
        adapt onboarding approaches to different business models and client needs.</li>\\n<li>Ownership
        mindset with accountability for outcomes, not just meetings completed.</li>\\n<li>Comfort
        working asynchronously with cross-functional partners.</li>\\n\"}, {\"text\":
        \"Must Have Background\", \"content\": \"\\n<li>Two or more years of experience
        in SaaS onboarding, implementation, or client-facing roles.</li>\\n<li>Demonstrated
        ability to manage customers through multi-step, multi-week setup processes
        with consistent follow-through.</li>\\n\"}, {\"text\": \"Nice-To-Have Background\",
        \"content\": \"\\n<li>Experience building or improving onboarding playbooks,
        content, or automation.</li>\\n<li>Experience with PushPress software (current/former
        client)</li>\\n<li>Background in SMB ownership and management, especially
        gyms and fitness operations.</li>\\n<li>Understanding how fitness businesses
        operate and having the skills to educate, understand and question practices
        based on the software\u2019s capabilities</li>\\n<li>Experience supporting
        CRM pipelines, lead management, or messaging workflows.</li>\\n<li>Two or
        more years of experience in gym ownership, gym management, or fitness operations.</li>\\n\"},
        {\"text\": \"Tools and Systems\", \"content\": \"\\n<li>Daily tools: Intercom,
        HubSpot, Zoom, Slack, Google Workspace.</li>\\n<li>Familiarity with PushPress
        products preferred but not required.</li>\\n\"}, {\"text\": \"What We're Looking
        For\", \"content\": \"\\n<li>Product mastery. You invest in learning the full
        PushPress suite deeply and can articulate its value clearly to any audience.</li>\\n<li>Accountability.
        You own client milestones end to end. Success doesn\u2019t stop when the call
        ends.</li>\\n<li>Contribution. You proactively improve the process \u2014
        whether that\u2019s updating a help doc, flagging a gap in the playbook, or
        suggesting a better workflow.</li>\\n<li>Continuous learning. You stay current
        on product changes and look for ways to sharpen your onboarding approach over
        time.</li>\\n\"}, {\"text\": \"How We Evaluate This Role\", \"content\": \"<div>\\n\\n<li>Scenario-based
        onboarding exercises focused on real customer setups.</li>\\n<li>Review of
        communication style, clarity, and confidence during live walkthroughs.</li>\\n<li>Discussion
        of how you manage timelines, blockers, and competing priorities.</li>\\n<li>Assessment
        of ownership, urgency, and customer-centered decision making.</li>\\n\\n</div>\"},
        {\"text\": \"This Role Is Not\", \"content\": \"\\n<li>A reactive support
        role. You are proactively driving customers toward activation, not waiting
        for them to ask for help.</li>\\n<li>A scripted role. Customers come in with
        different products, different business models, and different levels of readiness.
        You adapt in real time, not just follow a checklist.</li>\\n<li>A role where
        the job ends at kickoff. Success means the customer is live, confident, and
        using the product \u2014 not just that the first call happened.</li>\\n\"},
