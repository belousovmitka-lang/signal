        \"description\": \"<div><span style=\\\"font-size: 20pt;\\\">About PushPress<br><br></span></div>\\n<div><span
        style=\\\"font-size: 11pt;\\\">PushPress is the AI-powered gym management
        platform built for boutique fitness.</span></div>\\n<div><span style=\\\"font-size:
        11pt;\\\"><br>We are transforming how boutique fitness owners operate and
        how the entire $100B global fitness industry connects, transacts, and grows.
        Trusted by more than 5,000 gyms and 500,000 members, PushPress processes ~$1B
        annually.</span></div>\\n<div><span style=\\\"font-size: 11pt;\\\"><br>We're
        a Series B company backed by Altos Ventures, StepStone, and Mucker Capital,
        and we're going all-in on AI. Our AI Assistant, AI Member Intel, and AI-powered
        reporting tools are already changing how gym owners and coaches operate. We
        believe AI should make the human side of fitness better, not replace it.</span></div>\\n<div><span
        style=\\\"font-size: 11pt;\\\"><br>By embedding intelligence directly into
        the product, we enable boutique fitness owners to make faster decisions, unlock
        new revenue streams, and collaborate across a connected network. As more gyms
        join the platform, data compounds, intelligence strengthens, and the value
        of the ecosystem increases for every owner</span></div>\\n<div><span style=\\\"font-size:
        11pt;\\\"><br>We are a global team of builders, operators, and fitness fanatics
        on a mission to level the playing field for independent fitness entrepreneurs.
        If you are ready to help reshape an industry, let's talk!</span></div><div><br></div><div>\\n<h3><strong>The
        Role</strong></h3>\\n<p>We\u2019re looking for a hands-on Controller to own
        the financial backbone of PushPress.</p>\\n<p>We\u2019re a Series B SaaS company
        navigating increasing financial complexity: traditional SaaS subscriptions,
        AI-driven usage-based revenue, a multi-layered payments business processing
        nearly $1B annually, and expansion into new geographies. Our revenue model
        spans subscription billing, platform payment economics, and emerging AI monetization,
        each with distinct recognition and compliance considerations.</p>\\n<p>As
        our first Controller, you\u2019ll build on the foundational work the team
        has already laid out. You\u2019ll have direct insight into company strategy
        to ensure you have the full context that goes into setting up our accounting
        infrastructure for the next phase of growth. While you\u2019ll set the direction
        and own the process, you\u2019ll also be in the details: closing the books,
        working through nuanced recognition questions, managing the order-to-cash
        flow, advising on product economics from a financial lens, owning cash flow
        forecasting, and rolling up your sleeves to get the job done.</p>\\n</div>\",
        \"id\": \"f916072c-83b1-4b0b-a35a-580c77335588\", \"lists\": [{\"text\": \"What
        You'll Own\", \"content\": \"<p><strong><span style=\\\"font-size: 10.5pt;
        font-family: Arial, sans-serif;\\\">Financial Close &amp; Reporting</span></strong></p>\\n\\n<li><span
        style=\\\"font-size: 10.5pt;\\\">Own the monthly, quarterly, and annual close
        process end-to-end with speed, accuracy, and clear documentation</span></li>\\n<li><span
        style=\\\"font-size: 10.5pt;\\\">Prepare and review financial statements,
        reconciliations, and supporting schedules</span></li>\\n<li><span style=\\\"font-size:
        10.5pt;\\\">Build and maintain internal controls that scale with the business
        and hold up under audit scrutiny</span></li>\\n<li><span style=\\\"font-size:
        10.5pt;\\\">Establish the reporting infrastructure that gives leadership and
        the board clear, reliable visibility into company financials</span></li>\\n<li><span
        style=\\\"font-size: 10.5pt;\\\">Own vendor COGS tracking and margin analysis
        across product lines, ensuring cost structures are well-understood as the
        business scales</span></li>\\n\\n<div>&nbsp;</div>\\n<div><span style=\\\"font-size:
        10.5pt;\\\"><strong><span style=\\\"font-size: 10.5pt; font-family: Arial,
        sans-serif;\\\">Revenue Recognition</span></strong></span></div>\\n\\n<li><span
        style=\\\"font-size: 10.5pt;\\\">Lead the application of ASC 606 across subscription
        SaaS, AI usage-based revenue, and platform payment revenue streams</span></li>\\n<li><span
        style=\\\"font-size: 10.5pt;\\\">Ensure the accounting treatment for payments
        economics is clean and defensible&nbsp;</span></li>\\n<li><span style=\\\"font-size:
        10.5pt;\\\">Partner with GTM, Product, and Engineering to ensure billing architecture
        and revenue data support clean recognition</span></li>\\n<li><span style=\\\"font-size:
        10.5pt;\\\">Own the full order-to-cash flow end-to-end, including how subscriptions
        and payments are created in Stripe, how invoices map to revenue, how settlements
        land, how refunds and disputes flow back, and how it all reconciles to the
        GL</span></li>\\n<li><span style=\\\"font-size: 10.5pt;\\\">Stay ahead of
        how our revenue model evolves (new AI features, new pricing structures, new
        markets) and flag accounting implications early</span></li>\\n\\n<div>&nbsp;</div>\\n<div><strong><span
        style=\\\"font-size: 10.5pt; font-family: Arial, sans-serif;\\\">Cash Flow
        &amp; Debt Facility</span></strong></div>\\n\\n<li><span style=\\\"font-size:
        10.5pt;\\\">Own cash flow forecasting and management, giving leadership real,
        actionable visibility into liquidity</span></li>\\n<li><span style=\\\"font-size:
        10.5pt;\\\">Manage compliance with our debt facility, including covenant tracking,
        lender reporting, and maintaining a healthy lender relationship</span></li>\\n<li><span
        style=\\\"font-size: 10.5pt;\\\">Partner with the leadership team on capital
        deployment decisions and ensure strategic use of the debt facility<br></span></li>\\n\\n<div>&nbsp;</div>\\n<div><strong><span
        style=\\\"font-size: 10.5pt; font-family: Arial, sans-serif;\\\">Tax &amp;
        Compliance</span></strong></div>\\n\\n<li><span style=\\\"font-size: 10.5pt;\\\">Own
        multi-state income tax compliance and stay current across all jurisdictions</span></li>\\n<li><span
        style=\\\"font-size: 10.5pt;\\\">Lead SaaS taxability analysis and indirect
        tax obligations (sales/use tax) across states with nexus exposure, ensuring
        the company is correctly collecting and remitting where required</span></li>\\n<li><span
        style=\\\"font-size: 10.5pt;\\\">Build the accounting and systems foundation
        to support international expansion, including GST, HST, VAT, and other indirect
        tax regimes as we enter new markets</span></li>\\n<li><span style=\\\"font-size:
        10.5pt;\\\">Own FX exposure tracking and multi-currency considerations as
        international revenue grows</span></li>\\n<li><span style=\\\"font-size: 10.5pt;\\\">Stay
        ahead of new tax and compliance obligations as the business scales and new
        products launch<br></span></li>\\n\\n<div>&nbsp;</div>\\n<div><strong><span
        style=\\\"font-size: 10.5pt; font-family: Arial, sans-serif;\\\">Operations
        &amp; Infrastructure<br></span></strong></div>\\n\\n<li><span style=\\\"font-size:
        10.5pt;\\\">Coordinate payroll, equity/options processing, billing, AR, AP,
        and cash management operations, ensuring accuracy and compliance</span></li>\\n<li><span
        style=\\\"font-size: 10.5pt;\\\">Evaluate and improve the accounting tech
        stack to support the complexity and scale ahead</span></li>\\n<li><span style=\\\"font-size:
        10.5pt;\\\">Partner with data and engineering to ensure financial data flows
        are reliable, reconciled, and audit-ready; comfort working with or directing
        modern data infrastructure (Snowflake, dbt, Stripe) is a plus</span></li>\\n<li><span
        style=\\\"font-size: 10.5pt;\\\">Drive automation where it creates real leverage
        and accuracy; identify where manual processes are creating risk</span></li>\\n\"},
        {\"text\": \"What We're Looking For\", \"content\": \"<div>\\n\\n<li style=\\\"line-height:
        1.2;\\\"><span style=\\\"font-size: 10.5pt;\\\">8+ years of progressive accounting
        experience, with meaningful ownership of the close, revenue recognition, and
        financial reporting</span></li>\\n<li style=\\\"line-height: 1.2;\\\"><span
        style=\\\"font-size: 10.5pt;\\\">CPA required</span></li>\\n<li style=\\\"line-height:
        1.2;\\\"><span style=\\\"font-size: 10.5pt;\\\">Deep, working knowledge of
        ASC 606 applied to SaaS including subscription billing, usage-based models,
        and multi-element arrangements</span></li>\\n<li style=\\\"line-height: 1.2;\\\"><span
        style=\\\"font-size: 10.5pt;\\\">Strong understanding of the full order-to-cash
        lifecycle in a Stripe-based billing environment</span></li>\\n<li style=\\\"line-height:
        1.2;\\\"><span style=\\\"font-size: 10.5pt;\\\">Experience managing or coordinating
        a debt facility, including covenant compliance and lender reporting</span></li>\\n<li
        style=\\\"line-height: 1.2;\\\"><span style=\\\"font-size: 10.5pt;\\\">Multi-state
        tax compliance experience, including SaaS taxability and indirect tax; comfortable
        building out international tax capabilities as the business grows</span></li>\\n<li
        style=\\\"line-height: 1.2;\\\"><span style=\\\"font-size: 10.5pt;\\\">Comfortable
        utilizing AI to automate workflows and create leverage and can speak to tangible
        process improvements</span></li>\\n<li style=\\\"line-height: 1.2;\\\"><span
        style=\\\"font-size: 10.5pt;\\\">Have navigated ERP transitions (QBO, Rillet,
        Campfire, NetSuite, or similar)</span></li>\\n<li style=\\\"line-height: 1.2;\\\"><span
        style=\\\"font-size: 10.5pt;\\\">High attention to detail paired with the
        ability to communicate clearly to non-finance stakeholders</span></li>\\n<li
        style=\\\"line-height: 1.2;\\\"><span style=\\\"font-size: 10.5pt;\\\">Comfortable
        operating in a fast-moving environment where priorities shift and ambiguity
        is the norm</span></li>\\n\\n</div>\"}, {\"text\": \"Nice to Have\", \"content\":
        \"<div>\\n\\n<li><span style=\\\"font-size: 10.5pt;\\\">Big 4 or public accounting
        background</span></li>\\n<li><span style=\\\"font-size: 10.5pt;\\\">Experience
        at a B2B SaaS startup, ideally with SMB customers</span></li>\\n<li><span
        style=\\\"font-size: 10.5pt;\\\">Exposure to payments, fintech, platform economics,
        or consumption/usage-based billing models</span></li>\\n<li><span style=\\\"font-size:
        10.5pt;\\\">Experience with multi-currency reporting, FX management, or international
        entity structures</span></li>\\n<li><span style=\\\"font-size: 10.5pt;\\\">Prior
        experience building an accounting function from scratch or significantly restructuring
        one</span></li>\\n<li><span style=\\\"font-size: 10.5pt;\\\">Familiarity with
        AI-driven revenue models and the recognition complexity they introduce</span></li>\\n<li><span
        style=\\\"font-size: 10.5pt;\\\">Comfort with modern data stacks (Snowflake,
        dbt, Metabase) and financial data pipeline concepts</span></li>\\n<li><span
        style=\\\"font-size: 10.5pt;\\\">Experience with Ramp, Bill.com, or similar
        modern finance infrastructure</span></li>\\n\\n</div>\"}, {\"text\": \"Benefits
        & Perks\", \"content\": \"<div>\\n\\n<li>Equity Incentive Plan</li>\\n<li>Flexible
        Paid Time Off (and Public Holidays)</li>\\n<li>Health Care Plan (Medical,
        Dental &amp; Vision)</li>\\n<li>Retirement Plan (Company Sponsored 401k with
        Match)</li>\\n<li>Life Insurance</li>\\n<li>Family Leave (Maternity, Paternity)</li>\\n<li>Work
        From Home Stipend</li>\\n<li>Wellness Stipend</li>\\n\\n</div>\"}], \"text\":
