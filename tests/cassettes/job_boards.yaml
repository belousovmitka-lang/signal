        \"updated_at\": \"2026-08-19T15:10:54-04:00\", \"requisition_id\": \"26BF206\",
        \"title\": \"Regional Marketing Manager\", \"company_name\": \"Tekmetric\",
        \"first_published\": \"2026-07-20T15:39:12-04:00\", \"language\": \"en\",
        \"application_deadline\": null, \"content\": \"&lt;div class=&quot;content-intro&quot;&gt;&lt;p&gt;&lt;strong&gt;&lt;u&gt;About
        Tekmetric&lt;/u&gt;&lt;/strong&gt;&lt;/p&gt;\\n&lt;p&gt;Tekmetric is the all-in-one,
        cloud-based software helping auto repair shops run smarter, grow faster, and
        serve customers better. &lt;br&gt;&lt;br&gt;Built by a shop owner and shaped
        by the needs of the industry, Tekmetric brings together innovation, real-world
        experience, and a thriving community to help shops thrive - not just survive.&amp;nbsp;From
        running a shop, to securing payments to engaging customers, our platform simplifies
        operations so shop owners can focus on what really matters: delivering exceptional
        service, earning trust, and growing sustainably.&lt;/p&gt;\\n&lt;p&gt;Officially
        founded in Houston in 2017, Tekmetric has grown from a single shop\u2019s
        vision to the industry\u2019s leading solution - all by staying true to our
        values of transparency, integrity, innovation, and a service-first mindset.&amp;nbsp;&lt;br&gt;&lt;br&gt;But
        we\u2019re not just building shop management software. We\u2019re building
        a movement. We\u2019re empowering repair shops to rise above the daily grind,
        create meaningful connections with their customers, and lead the industry
        forward - one interaction at a time.&lt;/p&gt;\\n&lt;p&gt;Come build with
        us. Join the journey. Shape the future of auto repair.&lt;/p&gt;\\n&lt;p&gt;&lt;span
        style=&quot;text-decoration: underline;&quot;&gt;&lt;strong&gt;Working the
        Tekmetric Way&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\\n&lt;p&gt;At Tekmetric,
        we\u2019re building a culture where winning matters - not for ego, but because
        when our customers win, we win together.&amp;nbsp;&lt;/p&gt;\\n&lt;p&gt;We
        move fast, stay curious, and take full ownership of our results \u2014 no
        excuses, no finger-pointing. If you thrive in ambiguity, take initiative,
        and view honest feedback as fuel for growth, you\u2019ll feel right at home
        here.&lt;/p&gt;\\n&lt;p&gt;We\u2019re direct but respectful, ambitious yet
        grounded, and collaborative at every level. Everyone leads through impact
        and is encouraged to speak up, share ideas, and challenge assumptions (even
        your manager\u2019s). This is a place for builders, not bystanders.&lt;/p&gt;\\n&lt;p&gt;Success
        here takes focus, follow-through, and a willingness to roll up your sleeves
        \u2014 but if you\u2019re driven by meaningful work and real results, it\u2019s
        deeply rewarding. You\u2019ll join a team that cares about the work, supports
        one another, and takes smart risks to achieve bold goals. &lt;strong&gt;Be
        yourself, stay mission-focused, and you\u2019ll thrive.&lt;/strong&gt; If
        that energizes you, we can\u2019t wait to meet you.&lt;/p&gt;\\n&lt;p&gt;&lt;strong&gt;Where
        We Work&lt;/strong&gt;: At Tekmetric, great work happens anywhere, but great
        teams are built through intentional connection. We offer hybrid and remote
        work models based on your proximity to our office hubs. Because we value in-person
        collaboration, travel is an expected part of every role. We come together
        several times a year for team and company-wide offsites to align on goals
        and strengthen relationships. Attendance at these events is expected and fully
        supported.&lt;/p&gt;&lt;/div&gt;&lt;p&gt;&lt;span style=&quot;text-decoration:
        underline;&quot;&gt;&lt;strong&gt;What You\u2019ll Do&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\\n&lt;p&gt;As
        our Regional Marketing Manager, you will own the demand generation motion
        that warms territories, builds pipeline, and sets our field sales team up
        to win. This role is equal parts strategist and executor \u2014 you&#39;ll
        design and run campaigns that reach shop owners and partners before a sales
        rep ever knocks on the door.&lt;/p&gt;\\n&lt;p&gt;Reporting to the Director
        of Customer Growth and Partner Marketing, you&#39;ll work closely with Field
        Sales, Business Development, Partner Marketing, and our Channel team to build
        the marketing engine that drives qualified pipeline from our partner ecosystems
        and key regions.&lt;/p&gt;\\n&lt;p&gt;&lt;strong&gt;Territory &amp;amp; Campaign
        Management&lt;/strong&gt;&lt;/p&gt;\\n&lt;ul&gt;\\n&lt;li&gt;Own the regional
        marketing calendar \u2014 designing multi-touch campaigns that warm territories
        ahead of field sales activity and partner outreach.&lt;/li&gt;\\n&lt;li&gt;Develop
        campaigns that move audiences from awareness to consideration without relying
        solely on in-person events \u2014 think email sequences, direct mail, digital
        programs, and localized content.&lt;/li&gt;\\n&lt;li&gt;Partner closely with
        Field Sales and AEs to align campaign timing with territory priorities, ensuring
        marketing activity directly supports pipeline goals.&lt;/li&gt;\\n&lt;li&gt;Maintain
        feedback loops with Field Channel Managers so campaign strategy reflects what&#39;s
        actually happening on the ground.&lt;/li&gt;\\n&lt;li&gt;Coordinate logistics
        when Tekmetric participates in field events, but your primary mandate is what
        happens before and after the event, not necessarily the event/booth itself.&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;p&gt;&lt;strong&gt;Partner
        &amp;amp; Channel Activation&lt;/strong&gt;&lt;/p&gt;\\n&lt;ul&gt;\\n&lt;li&gt;Build
        co-marketing programs with channel and referral partners that generate leads
        and referrals \u2014 not just brand presence.&lt;/li&gt;\\n&lt;li&gt;Develop
        field activation kits and partner enablement materials that give Field Channel
        Managers the tools to market within their territories independently.&lt;/li&gt;\\n&lt;li&gt;Act
        as the connective tissue between Partner Marketing, Field Sales, and Business
        Development \u2014 ensuring partner programs are built to drive pipeline,
        not just participation.&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;p&gt;&lt;strong&gt;Reporting
        &amp;amp; Pipeline Accountability&lt;/strong&gt;&lt;/p&gt;\\n&lt;ul&gt;\\n&lt;li&gt;Track
        campaign performance against pipeline contribution, not just activity metrics
        \u2014 partner referral volume, MQL/SQL generation, and territory coverage
        are your north stars.&lt;/li&gt;\\n&lt;li&gt;Maintain a regional marketing
        calendar visible to field sales and leadership.&lt;/li&gt;\\n&lt;li&gt;Own
        the lead handoff process with Sales, including CRM tagging, handoff SLAs,
        and closed-loop reporting so marketing influence on pipeline is always visible.&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;p&gt;&lt;span
        style=&quot;text-decoration: underline;&quot;&gt;&lt;strong&gt;What You&#39;ll
        Bring&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\\n&lt;ul&gt;\\n&lt;li&gt;5+ years
        in field marketing, demand generation, or channel marketing \u2014 with a
        track record of building pipeline, not just executing events.&lt;/li&gt;\\n&lt;li&gt;Experience
        owning regional or territory marketing programs in a B2B or SaaS environment,
        ideally where you worked directly alongside a field or channel sales team.&lt;/li&gt;\\n&lt;li&gt;Strong
        campaign instincts \u2014 you know how to reach an audience that hasn&#39;t
        raised their hand yet and move them toward a conversation.&lt;/li&gt;\\n&lt;li&gt;Proficiency
        in CRM and marketing automation tools (HubSpot, Salesforce) \u2014 you live
        in these systems, not just reference them.&lt;/li&gt;\\n&lt;li&gt;Proven ability
        to manage multiple campaigns across regions simultaneously without losing
        accountability for outcomes.&lt;/li&gt;\\n&lt;li&gt;Comfortable owning a number
        and reporting on it \u2014 you think in pipeline, not just programs.&lt;/li&gt;\\n&lt;li&gt;Willingness
        to travel up to 30% to support key markets and partner activations.&lt;/li&gt;\\n&lt;li&gt;Bonus:
        Experience in automotive aftermarket, automotive SaaS, or a related trade
        industry.&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;p&gt;&lt;span style=&quot;text-decoration:
        underline;&quot;&gt;&lt;strong&gt;Who You Are&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;\\n&lt;p&gt;Successful
        candidates will demonstrate the characteristics our core values represent:&lt;/p&gt;\\n&lt;ul&gt;\\n&lt;li&gt;&lt;strong&gt;Build
        things that matter:&lt;/strong&gt; You love building something new or improving
        on current processes and care about making a positive difference.&lt;/li&gt;\\n&lt;li&gt;&lt;strong&gt;We&#39;re
        all entrepreneurs:&lt;/strong&gt; You thrive in a fast-moving, startup environment
        \u2014 self-directed, comfortable with ambiguity, and ready to structure your
        own work and execute. At Tekmetric, our leaders are players and coaches.&lt;/li&gt;\\n&lt;li&gt;&lt;strong&gt;Yes
        before no:&lt;/strong&gt; You keep an open mind, stay intellectually curious,
        and are energized by new ideas and the chance to help others bring them to
        life.&lt;/li&gt;\\n&lt;li&gt;&lt;strong&gt;We matter to each other:&lt;/strong&gt;
        You care about people and understand that the success of one is success for
        all. You operate with integrity and protect the trust placed in you.&lt;/li&gt;\\n&lt;/ul&gt;&lt;div
        class=&quot;content-conclusion&quot;&gt;&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;text-decoration:
        underline;&quot;&gt;Why You&#39;ll Love Working With Us&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;\\n&lt;p&gt;&lt;em&gt;Health
        &amp;amp; Wellness That Have You Covered:&lt;/em&gt;&lt;/p&gt;\\n&lt;ul&gt;\\n&lt;li&gt;Enjoy
        the flexibility of remote work&lt;/li&gt;\\n&lt;li&gt;Competitive base salaries
        that reflect your value.&lt;/li&gt;\\n&lt;li&gt;Flexible PTO \u2014 No set
        number of days, just the trust to take the time you need. We genuinely encourage
        our team to disconnect and recharge.&lt;/li&gt;\\n&lt;li&gt;Support for every
        stage of life\u2014with paid maternity, parental bonding, and medical leave
        for you or your loved ones.&lt;/li&gt;\\n&lt;li&gt;Comprehensive health benefits,
        including Medical, Dental, Vision, and Prescription coverage. For employee
        only, we offer plans that cover 100% of premiums and we cover 50% of costs
        for families.&lt;/li&gt;\\n&lt;li&gt;Prioritizing your mental health: get
        free, confidential counseling through our partnership with BetterHelp.&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;p&gt;&lt;em&gt;Investing
        in Your Future (and Present):&lt;/em&gt;&lt;/p&gt;\\n&lt;ul&gt;\\n&lt;li&gt;401(k)
        Retirement Savings Plan with 100% employer match on contributions up to 6%
        - so your future self will thank you.&lt;/li&gt;\\n&lt;li&gt;Flexible Spending
        Accounts (FSA) and Health Savings Accounts (HSA) to make your money go further.&lt;/li&gt;\\n&lt;li&gt;Life
        and Accidental Death &amp;amp; Dismemberment (AD&amp;amp;D) Insurance for
        added peace of mind.&lt;/li&gt;\\n&lt;li&gt;Wellness on your terms: get up
        to $60/month toward fitness, mental health, or almost anything that helps
        you feel your best.&lt;/li&gt;\\n&lt;li&gt;After one year of employment, enjoy
        a $300 home office setup bonus to help make your space work for you.&amp;nbsp;&lt;/li&gt;\\n&lt;li&gt;Keep
        growing with support for continuing education - we\u2019re invested in your
        development.&lt;/li&gt;\\n&lt;/ul&gt;\\n&lt;p&gt;&amp;nbsp;&lt;/p&gt;\\n&lt;p&gt;Most
        importantly, we have a stellar team, a whole lot of fun, and work that actually
        matters to the shops and families we serve!&lt;/p&gt;\\n&lt;p&gt;&amp;nbsp;&lt;/p&gt;\\n&lt;p&gt;&lt;em&gt;Tekmetric
        is an equal opportunity employer. We hire hard-working individuals, regardless
        of gender, race or color, ethnicity or national origin, age, disability, religion,
        sexual orientation, gender identity or expression, or veteran status. We know
        that when our employees feel appreciated and included, they can be more creative,
