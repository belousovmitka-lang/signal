        \"closed_at\": null, \"assignee\": null, \"author_redacted\": \"MEMBER\",
        \"issue_field_values\": [], \"type\": null, \"active_lock_reason\": null,
        \"sub_issues_summary\": {\"total\": 0, \"completed\": 0, \"percent_completed\":
        0}, \"issue_dependencies_summary\": {\"blocked_by\": 0, \"total_blocked_by\":
        0, \"blocking\": 0, \"total_blocking\": 0}, \"body\": \"**Track:** Schema
        \xB7 **Priority:** High \xB7 **Bounty:** Yes, amount to be posted before assignment
        (see [BOUNTIES.md](https://github.com/Element-Ventures-Canada-Ltd/openchokepoint/blob/main/BOUNTIES.md))
        \xB7 **Window:** open now, programme runs to 31 March 2027\\n\\nExtends seed-backlog
        item #7 (Component, Lot, MaterialClass).\\n\\n## Why this matters\\n\\nCanada
        is building its first domestic launch supply chains. For rocket turbopumps,
        the binding constraint is not the design. It is the **evidence chain** that
        proves each part was made, treated, cleaned and inspected the way it must
        be. A pump geometry without that pedigree cannot be licensed, insured or flown.\\n\\nToday
        there is no open, shared grammar for that evidence chain. Every programme
        rebuilds it in spreadsheets. That makes the chain hard to inspect, hard to
        transfer between suppliers, and fragile when people move on.\\n\\nThis issue
        invites engineers, quality specialists, data modellers and students to design
        that grammar in the open. The result will be the reference schema that Canadian
        and allied programmes can adopt without lock-in.\\n\\n## Problem\\n\\nOpenChokepoint
        v0.1 can say *who* supplies *what capability*. It cannot yet say:\\n\\n1.
        **Which physical part** a record refers to (part number, revision, serial).\\n2.
        **Which material lot** it came from, and through which processing steps.\\n3.
        **Which evidence** each step produced (a build record, a heat-treatment record,
        a cleaning certificate, an inspection result) and whether that evidence exists.\\n4.
        **Which items are critical**: loss of the item would delay a programme by
        more than 30 days, and whether a qualified alternate exists.\\n\\n## Proposal
        scope\\n\\nPropose new types and links in `schema/openchokepoint.yaml`. The
        proposal includes two examples: a synthetic one, and one real-world example
        drawn only from published reports. A starting sketch, open to challenge:\\n\\n|
        Proposed type | Purpose |\\n|---|---|\\n| `Component` | A part design: part
        number and revision. No geometry, no drawings. |\\n| `SerialItem` | One physical
        instance of a `Component`. |\\n| `MaterialLot` | A batch of feedstock (powder,
        billet, bar) with its `MaterialClass`. |\\n| `ProcessStep` | One controlled
        operation: build, stress relief, HIP, heat treatment, machining, finishing,
        cleaning, inspection, balancing, assembly. |\\n| `EvidenceRecord` | A pointer
        to proof that a step happened: record kind, issuer, date, and a content hash
        or public citation. **Never the content itself.** |\\n| `CriticalItem` | A
        flag on a `Component`, `MaterialLot` or `Capability`: delay impact band, single-source
        flag, qualified-alternate flag. |\\n\\n| Proposed link | From \u2192 to |\\n|---|---|\\n|
        `instance_of` | `SerialItem` \u2192 `Component` |\\n| `made_from` | `SerialItem`
        \u2192 `MaterialLot` |\\n| `underwent` | `SerialItem` \u2192 `ProcessStep`
        (ordered) |\\n| `evidenced_by` | `ProcessStep` \u2192 `EvidenceRecord` |\\n|
        `performed_at` | `ProcessStep` \u2192 `Facility` |\\n| `alternate_for` | `Entity`
        or `Facility` \u2192 `CriticalItem` |\\n\\nAll new objects carry the existing
        shared properties: `evidence_grade`, `sources`, `as_of`, `lifecycle` and `synthetic`.\\n\\n##
        Hard boundaries (read before contributing)\\n\\nThis schema records **that**
        evidence exists and **where** it sits. It must never carry the technical content
        itself.\\n\\n- **No technical data.** This covers geometry, drawings, CAD,
        build parameters, process recipes, temperatures, pressures, test data and
        acceptance limits. Use references, hashes or citations only. Content that
        could be export-controlled is out of scope and will be rejected.\\n- **Two
        kinds of example:**\\n  - **Synthetic.** Fictional records, marked `synthetic:
        true`, under `examples/`.\\n  - **Real-world (one, from public reports only).**
        Records built solely from **published, publicly released** reports, such as
        NASA Technical Reports Server papers. They are marked `synthetic: false` and
        filed under `data/digital-thread/` with a complete `provenance.yaml`. Every
        record must cite its public source by URL and section.\\n- **No non-public
        records.** Do not post any organization's internal part, lot, supplier, inspection
        or test records, even if you have permission to see them. If it has not been
        publicly released, it does not belong here.\\n- **No assessments on real records.**
        `CriticalItem` judgments (delay band, single-source and alternate flags) appear
        in synthetic examples only. They are never recorded against a real organization
        or part.\\n- **Standards by citation.** Refer to public standards (for example
        NASA-STD-6033 or ASTM G93) by number and section. Do not copy their text into
        the repository.\\n- Follow [HANDLING.md](https://github.com/Element-Ventures-Canada-Ltd/openchokepoint/blob/main/HANDLING.md).
        If you think something sensitive was posted, report it privately via [SECURITY.md](https://github.com/Element-Ventures-Canada-Ltd/openchokepoint/blob/main/SECURITY.md).\\n\\n##
        Acceptance test\\n\\nA pull request resolves this issue when it meets all
        of the following:\\n\\n1. `schema/openchokepoint.yaml` adds the agreed types
        and links, with a version bump to 0.2.0-draft.\\n2. `examples/synthetic-turbopump-thread.yaml`
        traces at least **one fictional rotor part end to end**: material lot \u2192
        build \u2192 at least three post-processing steps \u2192 cleaning \u2192 inspection
        \u2192 assembly. Each step has an `EvidenceRecord`.\\n3. The same synthetic
        example includes at least **three `CriticalItem` records**: one single-sourced
        item, one with a qualified alternate, and one with a missing evidence record.\\n4.
        `data/digital-thread/` holds **one real-world trace**: a publicly documented
        turbopump component, traced from material lot to serial, or as far as the
        public record goes. Gaps in the public record are shown as missing `EvidenceRecord`s,
        not filled by inference. Each record cites its public source and is graded
        `confirmed` or `reported`.\\n5. `tools/validate.py` validates both examples.
        It also **rejects**:\\n   - an `EvidenceRecord` that carries inline content
        instead of a reference, hash or citation;\\n   - a real (`synthetic: false`)
        record outside `data/`, or one without an https public source;\\n   - a `CriticalItem`
        on a real record.\\n6. A short doc page, `docs/digital-thread.md`, explains
        the model in plain language for non-engineers.\\n7. CI passes and the contributor
        has signed the CLA.\\n\\n## How to take part\\n\\n1. **Comment** with your
        background and the part you want to own: types, a validator rule, the synthetic
        example, the real-world example, or the doc. A maintainer assigns it. Unassigned
        work is not bounty-eligible.\\n2. **Discuss** design choices in this thread
        before opening a large PR. Disagreement with the sketch above is welcome;
        that is the point of an open call.\\n3. Splitting the work is fine. A maintainer
        may break this into sub-issues once owners are assigned.\\n\\nContributions
        are under Apache-2.0 with the project CLA. Programme maintained by Element
        Ventures (Canada) Ltd.\\n\\n*Handling: Unclassified \u2014 public*\", \"reactions\":
