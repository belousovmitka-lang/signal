        0, \"blocking\": 0, \"total_blocking\": 0}, \"body\": \"## Problem or idea\\n\\nCurrent
        memory_search filters live owner/project rows, constructs literal-token seeds
        and optionally scores/expands them with recency, importance and PPR. With
        no lexical seeds it returns empty before graph expansion. Existing LLM Factory
        embeddings do not mean memory recall consumes vectors. A reranker alone cannot
        recover a missing candidate. HF TEI, BAAI/BGE and newer Qwen text retrieval
        models motivate a bounded comparison, not a predicted accuracy gain.\\n\\n##
        Expected outcome\\n\\nDeliver a runnable, read-only qualification pilot for
        bounded semantic candidate generation and optional reranking of synthetic
        non-PHI personalization memory. Compare actual baseline, semantic candidates
        and ordering separately; export candidate-bound evidence supporting an explicit
        adoption/rejection decision. Keep production retrieval defaults unchanged
