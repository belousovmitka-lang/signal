        \"<!-- misakanet-question-bounty:anchor-2833 -->\\n# [Bounty] Answer the 2
        linked question(s) as a lesson\\n\\n## Context\\n\\nThese intakes ask about
        something no lesson covers. Measured through the production retrieval path
        (BM25 plus the IDF-weighted relevance floor), every one of them returns `no_match`
        \u2014 so there is nothing to link the asker to, and the answer has to be
        written rather than looked up.\\n\\n- #2833 \u2014 [Question] RE-TEST AFTER
        #2829 fix merged. Verifying body assembly cap raised to 60000. the\\n- #2844
        \u2014 [Question] RE-TEST the misakanet dsh mcp intake sidebar fragment is
        alive the misakanet dsh\\n\\n_Shared vocabulary that grouped them: `alive`,
        `fragment`, `intake`, `mcp`._\\n\\n## Deliverable\\n\\nA lesson under `lessons/`
        that answers the question(s) above, following `docs/maintainer/lesson-fields.md`
        (title / domain / problem / root cause / fix, and a `## Verification` that
        is a checkable command with an expected result). A written answer in the issue
        is welcome as a first step, but the lesson is what makes it count \u2014 it
        is the artifact the corpus keeps and the FAQ is built from.\\n\\n## MANDATORY
        ACCEPTANCE CRITERIA (AC)\\n\\n**0. REPRODUCIBLE EVIDENCE \u2014 the condition
        most submissions fail**\\n\\n- [ ] Paste the command you ran and the output
        you got. Not a description of what you did \u2014 the command and its output.
        If you name an endpoint it must be `misakanet.org`.\\n- [ ] Say what you observed
        yourself versus what you read somewhere. A lesson citing a source that does
        not exist is worse than one citing nothing (`scripts/check_provenance.py`
        fails on it).\\n\\n**1. The derived artifacts are regenerated \u2014 this
        is the step that fails CI most often**\\n\\n- [ ] Run the three commands the
        daily job runs, in this order, and commit what they change:\\n\\n```bash\\npython3
        scripts/update_lessons_json.py    # data/lessons.json\\npython3 scripts/build_lesson_pages.py
        \    # docs/lessons/**, docs/topics/**, docs/sitemap.xml\\npython3 scripts/export_okf.py
        \            # data/okf/lessons.jsonl\\n```\\n\\n  Skipping this fails three
        tests on every platform \u2014 `test_lesson_page_generator` and\\n  `test_okf_export_freshness`
        twice \u2014 because a new lesson makes the index, the generated pages and\\n
        \ the OKF export stale. Measured 2026-09-26 on the first two lesson PRs opened
        against these tasks.\\n\\n**2. The lesson passes the repository's own gates**\\n\\n-
        [ ] `python3 scripts/lesson_gate.py <your lesson>` is clean.\\n- [ ] `python3
        scripts/check_provenance.py --check` does not report a dead source for it.\\n-
        [ ] `python3 -m pytest tests/ -q` still passes.\\n\\n**3. Answering means
        being found**\\n\\n- [ ] Your lesson is reachable for the question text that
        produced this bounty. **Two steps, and the second one is ours, not yours:**\\n
        \ - run the query locally against a fresh index and paste the result:\\n    `MISAKANET_LESSONS_INDEX=/tmp/idx.json
        python3 scripts/update_lessons_json.py` then search that file for the question's
        words (`grep -i`), or run the shipped search over the corpus (`python3 search_knowledge.py
        \\\"<question>\\\"`);\\n  - after the merge, a maintainer confirms it against
        the **hosted** `misakanet_search` once the daily index job has run. Measured
        2026-09-26: the live index lagged the corpus by hours (and froze outright
