        0, \"blocking\": 0, \"total_blocking\": 0}, \"body\": \"# \U0001F4DD Background\\n\\nThis
        is a community-suggested bounty that we have reviewed and assigned to [@samiyadev786](https://github.com/samiyadev786).\\n\\n`ttnn.sampling`
        is used for on-device non-greedy token sampling in the shared sampling path
        used by `tt-transformers` and other model integrations. The operation currently
        compares an FP32 cumulative probability against a random threshold that is
        packed to bfloat16. Because the threshold has only bfloat16 resolution, the
        sampler does not draw from the requested distribution accurately.\\n\\nThe
        issue has been reproduced on both Wormhole N150 and Blackhole P150. In the
        reported measurements, candidate tokens with small probabilities were never
        emitted or were emitted at materially incorrect frequencies. The existing
        tests primarily check candidate membership, determinism, and valid indices;
        they do not provide a sufficiently sensitive frequency-based regression test.\\n\\n#
        \U0001F4A1 Problem to Solve\\n\\nFix the random-threshold path in `ttnn.sampling`
        so that the threshold used by the comparison has sufficient FP32-level resolution
        across the supported Wormhole and Blackhole implementations.\\n\\nThe fix
        must preserve the existing public API and sampling controls, including top-k,
        top-p, temperature, per-user seeding, reproducibility, and trace replay. The
        change should not introduce a material performance regression in the decode
        sampling path.\\n\\nThe main implementation areas are expected to be under:\\n\\n*
        `ttnn/cpp/ttnn/operations/reduction/sampling/device/`\\n* `ttnn/cpp/ttnn/operations/reduction/sampling/device/kernels/compute/`\\n*
        `ttnn/cpp/ttnn/operations/reduction/sampling/device/kernels/dataflow/`\\n\\nThe
        exact implementation approach is not prescribed, provided the acceptance criteria
        below are met.\\n\\n# \U0001F3AF Acceptance Criteria\\n\\n* [ ] The sampler
        uses a random threshold with sufficient FP32-level resolution; the threshold
        must not be limited to the current bfloat16 grid or capped at `255/256` because
        of the packed representation.\\n* [ ] The corrected behavior is implemented
        and validated on Wormhole and Blackhole.\\n* [ ] A two-candidate frequency
        test covers small probabilities, including a case where the current implementation
        produces a materially biased or zero count.\\n* [ ] A multi-candidate frequency
        test verifies that low-probability tail candidates are sampled and that equal-probability
        candidates are sampled homogeneously within a documented statistical tolerance.\\n*
        [ ] The tests compare observed counts against an explicitly documented reference
        distribution and use a statistically justified pass/fail criterion.\\n* [
        ] Existing top-k, top-p, temperature, determinism, valid-index, and reproducibility
        tests continue to pass.\\n* [ ] Per-user manual-seed reproducibility and trace
        replay are preserved.\\n* [ ] Sampling performance remains within an agreed
        tolerance of the baseline for representative batch and width configurations.\\n*
        [ ] The PR includes the implementation, regression tests, and concise validation
        results for both architectures.\\n\\n# \U0001F6AB Out of Scope\\n\\n* Changing
        the public `ttnn.sampling` API.\\n* Replacing the sampler with host-side sampling.\\n*
        Redesigning the random-number generator globally.\\n* Changing the intended
        semantics of top-k, top-p, or temperature sampling.\\n* Unrelated RNG seeding
        or per-row entropy work.\\n* Broad accuracy changes to the approximate softmax
        or exponential implementation, except where strictly required to validate
        this threshold fix.\\n\\n# \u23F3 Deadline\\n\\nThe issue may be reopened
        or reassigned if there is no meaningful progress update within two weeks.
        The maximum completion window is two months unless otherwise agreed with Tenstorrent.\\n\\n#
        \U0001F9ED Guidance & Starting Points\\n\\nThe reported root cause is the
        conversion of the random tile to a 16-bit/bfloat16 representation before the
        writer compares it with the cumulative probability. Start by tracing the random
        tile format, the circular-buffer format, and the writer-side comparison together
        on both architectures.\\n\\nA robust fix should retain the existing index-width
        and output behavior while increasing the resolution of the random threshold.
        It should also retain fixed-seed behavior and avoid adding an avoidable program-cache
        or decode-latency cost.\\n\\nBefore finalizing the test thresholds, validate
        the reference probabilities and statistical bounds independently on the host.
        Include the draw count, seed policy, architecture, input distribution, and
        pass/fail calculation in the PR description or test comments.\\n\\nContributors
        are welcome to open a draft PR at any stage for feedback. Payment is made
        only after the completed contribution satisfies the acceptance criteria and
        is merged.\\n\\n# \U0001F50E Possible Approaches\\n\\n* Construct a higher-resolution
        uniform threshold from the random data already produced by the sampling path,
        while preserving deterministic seeded behavior.\\n* Keep the existing 16-bit
        index path separate from the random-threshold representation so large-vocabulary/index
        handling is not changed unnecessarily.\\n* Add focused statistical tests first,
        then use them to validate the device implementation on Wormhole and Blackhole.\\n\\nThese
        are starting points only; the submitted implementation may use another approach
        that satisfies the acceptance criteria.\\n\\n# Bounty\\n\\nReward: **$3,000
        USD**\\n\\nThis bounty is subject to the [Tenstorrent Bounty Program Terms
        & Conditions](https://docs.tenstorrent.com/bounty_terms.html) and applicable
