        0, \"blocking\": 0, \"total_blocking\": 0}, \"body\": \"## Problem or idea\\n\\nAnthropic
        sandbox-runtime offers OS-level filesystem/network containment for subprocesses.
        It could strengthen an isolated Astral effect worker, but its dependencies,
        degraded modes, global runtime state and platform constraints are not yet
        qualified for Astral. Sandbox containment supplements authorization; it cannot
        issue or replace a LETS receipt.\\n\\n## Expected outcome\\n\\nBuild an opt-in
        Linux qualification runner for one short-lived harmless local effect, using
        the existing ProcessSupervisor and existing generated-executor receipt verifier.
        Compare the authorized scratch-file effect and denied effects under an immutable
        SRT profile, without changing production launches.\\n\\n## Environment\\n\\nMVP
        mode; owning repository: AstralDeep. Reviewed baseline: `f89ba2ae9c0e8decd271544e05a93f6c8a202a66`
        (2026-10-06). Source review establishes an integration lead, not demonstrated
        clinical benefit, benchmark performance or production qualification.\\n\\n##
        Acceptance checks\\n\\n- [ ] Pin and declare the SRT runtime/artifact and
        required Linux primitives (reviewed package 0.0.78, Node >=22.12, bubblewrap
        and seccomp support); document one supported architecture/profile. No unpinned
        npx download at runtime. Unsupported OS/container/kernel or missing/degraded
        dependencies fail closed before the effect starts.\\n- [ ] Start one isolated
        non-root SRT process with an immutable profile per invocation. Deny all network
        including direct IP, DNS/proxy, loopback/private/link-local and Unix-socket
        paths; expose no inherited/passed host sockets, database/blob sockets, provider
        proxy or credentials. Use minimal explicit allow-only runtime/source reads
        and scratch writes, clean environment and no home/project settings discovery.
        Do not weaken host AppArmor/user-namespace policy for the pilot.\\n- [ ] Route
        the effect through existing normal dispatch, bounded ProcessSupervisor lifecycle
        and the existing LETS receipt verification/claim seam. Preserve audience/owner/scope/argument/digest/expiry/replay
        checks and ordinary audit. No new executor protocol, credential broker, process
        manager or generic raw-command tool.\\n- [ ] Test successful authorized scratch
        output, denied secret reads/out-of-scratch writes/network/IPC, symlink and
        mount-boundary cases, malformed or wrong-scope receipts, missing seccomp/bwrap,
        launch failure, output exhaustion, timeout/cancellation/revocation and descendant
        cleanup. Treat upstream warnings that reduce the required profile as hard
        failures; never fall back to an unsandboxed process.\\n- [ ] Verify real harmless
        local effects independently of the child's exit text and keep sanitized receipts/config/artifact
        digests. Fixed fixtures must exercise the actual sandbox on a supported isolated
        Linux runner; unsupported hosts report unavailable, never a simulated containment
        pass. Do not require live third-party network for CI.\\n- [ ] Keep SRT control-fd
        updates, long-lived draft agents, interactive terminals, Windows/macOS, nested
        weak container mode, AppleEvents and provider egress outside this pilot. A
        failed or unavailable pilot is a valid diagnostic outcome with an actionable
        qualification record.\\n- [ ] Preserve Keycloak-only IAM, owner isolation,
        RFC 8693 attenuation, tool/PHI/egress/confirmation gates, LETS enforcement
        and hash-chained audit. Models and vendor runtimes do not authorize effects.
        Declare and qualify any dependency in the owning manifest; no schema, shared
        contract, component pin, production default or release change is implicit.\\n-
        [ ] Cover golden paths, edge cases, denials, failures and recovery. Required
        checks remain deterministic/offline, production Python remains 3.11, changed
        Python lines retain at least 90% coverage, and each hosted CI job finishes
        within 30 minutes. Record exact candidate-bound checks and separate tests,
        live qualification and deployment.\\n\\n## Supporting details\\n\\n**Bounty:
        200 recognition points. Points only; no monetary payment.** One qualifying
        PR merged into main closes this issue for one bounty award. Avoid closing
        multiple eligible bounties with one PR. Opening this issue reserves no assignee.\\n\\nScope
        and related work: One new containment qualification profile only. [#256](https://github.com/AstralDeep/AstralDeep/issues/256)
