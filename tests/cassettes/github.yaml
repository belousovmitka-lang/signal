        0, \"blocking\": 0, \"total_blocking\": 0}, \"body\": \"## Problem or idea\\n\\nThe
        current file reader joins PDF page text and DOCX paragraphs; it does not traverse
        DOCX tables or preserve a structured PDF table/reading-order/source-region
        representation. Sparse PDF text can lead to a vision fallback. IBM Research-origin
        Docling, now a Docling Project/LF AI & Data project, offers a local structured
        parsing candidate. Its code license and documented features do not establish
        clinical correctness or containment.\\n\\n## Expected outcome\\n\\nImplement
        and qualify one opt-in, default-off, bounded PDF/DOCX adapter in the existing
        attachment/file-tool flow. Compare the actual reader with the candidate on
        a small synthetic corpus; return genuine structure/provenance and truthful
        partial/failure status. A defensible negative comparison may retain the baseline,
        but the runnable candidate and qualification evidence must be real.\\n\\n##
        Environment\\n\\nMVP mode; owning repository: AstralDeep; production Python
        3.11. Reviewed current remote main: `8d82a0b48493e5018bdf81a4f59c189a8b045f6b`
        (2026-10-06). Relevant source seams were rechecked against the earlier research
        baseline. Upstream commits are investigation snapshots, not approved dependency
        releases. No implementation, measured benefit or live qualification is claimed.\\n\\n##
        Acceptance checks\\n\\n- [ ] Obtain input only through the current authenticated
        owner-scoped attachment-byte path and MIME checks. Reuse the parser registry/autoparse
        lifecycle. Accept controlled DocumentStream bytes, never arbitrary paths/URLs,
        broad attachment-store mounts, nested archive formats, executable macros,
        plugins or external-resource resolution.\\n- [ ] Use one host-selected short-lived
        non-root Linux worker profile with immutable read-only runtime/model assets
        and disposable scratch/output. Deny all network and supply no provider/host
        credentials, services or sockets. Reuse existing host ProcessSupervisor kill/cancel/descendant
        contracts; missing or degraded containment/assets fail closed without an unsandboxed,
        networked or provider fallback.\\n- [ ] Declare a reproducible Python 3.11
        worker dependency set, exact native/model/OCR revisions, licenses/notices
        and file digests. Disable remote services, plugins and VLM/picture/chart/formula/code/audio
        enrichment. A pinned code SHA is insufficient: examined presets use mutable
        model revisions and first-use downloads.\\n- [ ] Apply explicit byte/page/decompression/output,
        CPU/memory/descendant, concurrency and host-deadline limits before expensive
        work; do not rely on the library's effectively unlimited defaults or cooperative
        timeout. Preserve requested PDF page ranges throughout rendering/OCR and keep
        original source-page identity.\\n- [ ] Normalize bounded reading order, table
        rows/cells and genuine PDF page/region provenance or DOCX block/table/cell
        identifiers, together with source digest and parser/profile identity. Do not
        invent DOCX page coordinates. Distinguish full, partial, truncated, timeout,
        cancelled and failed results; PARTIAL_SUCCESS must not become complete success
        or silently feed extraction as a complete note.\\n- [ ] Keep extracted content
        untrusted under existing taint/PHI rules and authorized response/artifact
        boundaries. Numeric/OCR confidence never establishes medical truth or permission.
        No PHI/raw document content enters debug/audit/evidence logs or a new persistence
        service.\\n- [ ] Use independent synthetic goldens for multi-column text,
        PDF/DOCX tables, scanned numeric/sign/decimal/unit cells, continuation tables,
        clean/degraded matched pages, selected-page behavior, blank/encrypted/malformed
