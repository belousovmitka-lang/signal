        0, \"blocking\": 0, \"total_blocking\": 0}, \"body\": \"## Problem or idea\\n\\nAstral
        already conditions drafts on successful examples and scores tool trajectories.
        Selected current source reads did not establish a metric-driven task-prompt
        workbench with disjoint search, selection and final evaluation sets. Stanford-origin
        DSPy and newer GEPA motivate one measured development-time experiment. Their
        paper results do not demonstrate gains or clinical safety for Astral.\\n\\n##
        Expected outcome\\n\\nImplement one bounded offline workbench that proposes/tests
        allowlisted task-instruction text and exports an inert reviewed candidate/report.
        Required CI uses deterministic scripted proposals and provider doubles; optional
        real-model qualification uses existing authorized provider controls. No automatic
        production prompt adoption.\\n\\n## Environment\\n\\nMVP mode; owning repository:
        AstralDeep; production Python 3.11. Reviewed current remote main: `8d82a0b48493e5018bdf81a4f59c189a8b045f6b`
        (2026-10-06). Relevant source seams were rechecked against the earlier research
        baseline. Upstream commits are investigation snapshots, not approved dependency
        releases. No implementation, measured benefit or live qualification is claimed.\\n\\n##
        Acceptance checks\\n\\n- [ ] Choose one small existing non-PHI task prompt
        with independent deterministic schema/answer/evidence metrics. Optimize only
        an allowlisted task-instruction string. Freeze system/security policy, tool
        schemas, dispatch, credentials, model/profile and permissions; no Flex/executable-code
        optimization, uploaded pickle/cloudpickle program or autonomous agent loop.\\n-
        [ ] Freeze disjoint train, selection-validation and untouched final held-out
        partitions with identities/digests and independent labels. Neither final results
        nor hidden duplicate cases can enter reflection/selection. Omitted or empty
        validation must fail configuration rather than silently use training data;
        after final evaluation, further tuning requires a new explicitly designated
        final hold-out.\\n- [ ] Bind the optimizer and both reflection/evaluation
        model calls to current owner/provider/PHI/egress/accounting controls. Optional
        real-model search is explicitly configured development work outside live requests;
        do not construct ambient-credential vendor clients, execute provider-hosted
        tools or export user/clinical data to a tracking platform.\\n- [ ] Bound total
        reflection plus evaluation calls, tokens, retries, concurrency and outputs.
        Reserve a conservative configured token/cost upper bound before each admitted
        call, then reconcile actual usage/cost afterward. The examined dspy.GEPA rejects
        max_reflection_cost; a metric-call count alone is not a total budget. Unknown/incomplete
        accounting, cancellation and exhausted budgets remain visible and cannot produce
        an unqualified success.\\n- [ ] Treat candidate prompts and feedback as untrusted
        bounded text. Validate artifact schema, allowed target fields, encoding and
        size while policy/schema/permission configuration remains immutable regardless
        of candidate text. Never interpret candidate text as code, tool declarations
        or authority. This does not claim to detect every malicious textual instruction.
        Use visible outputs and safe tool receipts for feedback; inaccessible hidden
        reasoning is not required.\\n- [ ] Export inert prompt-text JSON plus a candidate-bound
        report containing baseline/candidate hashes, fixture/source/optimizer/model
        identities, selection and untouched held-out results, full call/cost/failure
        inventory and a qualified adoption/rejection recommendation. Never auto-load
        generated Python, patch production prompts or promote from training scores.\\n-
        [ ] Provide real runnable optimizer/metric/export plumbing and scripted deterministic
        CI, with an optional actual authorized synthetic model run for qualification.
        A well-supported negative result may retain the baseline; never substitute
        a fake successful search or omit infrastructure/budget failures.\\n- [ ] Exercise
        denied provider/data requests, owner isolation, policy preservation, held-out
        leakage, deterministic selection, cancellation, malformed output, budget exhaustion
        and failure recovery. Ordinary reviewed source changes and applicable gates
        must precede any later production adoption.\\n- [ ] Cover golden, edge, denial,
        cancellation and failure paths. Retain at least 90% changed-Python-line coverage,
        all owning repository gates and required deterministic/offline CI jobs within
        30 minutes. No live third-party services, soak tests, shared-runner wall-clock
        pass bounds, gate weakening or retries that hide failures. Record exact checks
        and distinguish source review, test-passing, live qualification and deployment.\\n-
        [ ] Preserve Keycloak-only IAM, owner/project isolation, RFC 8693 attenuation,
        ordinary tool/PHI/egress/confirmation gates, LETS and hash-chained audit.
        Declare and pin any new dependencies/assets in their owning manifest. Durable
        mechanics belong in Plane; reusable rendering in Projection. No schema, shared
        UI contract, component pin, production default or release change is implicit.\\n\\n##
        Supporting details\\n\\n**Bounty: 200 recognition points. Points only; no
        monetary payment.** One qualifying PR merged into main closes this issue for
        one bounty award. Avoid closing multiple eligible bounties with one PR. No
        assignee is reserved by opening this issue.\\n\\nScope: one allowed task prompt,
        an offline optimization workbench and review artifact. [#317](https://github.com/AstralDeep/AstralDeep/issues/317),
        [#320](https://github.com/AstralDeep/AstralDeep/issues/320) and [#338](https://github.com/AstralDeep/AstralDeep/issues/338)
        retain their diagnostic corpora/replay; reuse suitable fixture/rubric seams
        without duplicating those features. [#274](https://github.com/AstralDeep/AstralDeep/issues/274)/[#275](https://github.com/AstralDeep/AstralDeep/issues/275)
        retain runtime harness/profile rollout and [#316](https://github.com/AstralDeep/AstralDeep/issues/316)
        context accounting. No new UI, persistence or deployed agent framework.\\n\\nDebt:
        one prompt/task and small synthetic partitions; clinician calibration, broad
        model comparisons and production adoption are separate. DSPy may start in
        a declared isolated development extra/environment; source metadata compatibility
        is not dependency resolution qualification.\\n\\nSource evidence, accessed
        2026-10-06:\\n- [Current successful-exemplar conditioning](https://github.com/AstralDeep/AstralDeep/blob/8d82a0b48493e5018bdf81a4f59c189a8b045f6b/backend/orchestrator/draft_archive.py),
        [trajectory evaluation](https://github.com/AstralDeep/AstralDeep/blob/8d82a0b48493e5018bdf81a4f59c189a8b045f6b/backend/orchestrator/agent_eval.py)\\n-
        [DSPy GEPA wrapper](https://github.com/stanfordnlp/dspy/blob/bc8af7ed3d5ee0b892211e5c03274396442a413c/dspy/teleprompt/gepa/gepa.py),
        [manifest](https://github.com/stanfordnlp/dspy/blob/bc8af7ed3d5ee0b892211e5c03274396442a413c/pyproject.toml).
        MIT; Python >=3.10,<3.15; inspected dependency set includes gepa[dspy]==0.1.4,
        LiteLLM and cloudpickle. Missing validation defaults to training; cost support
        and code-optimization defaults require explicit constraints.\\n- [GEPA: Reflective
        Prompt Evolution Can Outperform Reinforcement Learning \u2014 Lakshya A Agrawal,
        Shangyin Tan, Dilara Soylu et al.; ICLR 2026, peer-reviewed, full authors/paper
        in proceedings](https://proceedings.iclr.cc/paper_files/paper/2026/hash/0e9e708b6f48e14fd0ac29e167413f76-Abstract-Conference.html).
        Its six-task results motivate this pilot rather than predict Astral gains.\\n-
        [DSPy: Compiling Declarative Language Model Calls into State-of-the-Art Pipelines
        \u2014 Omar Khattab et al.; ICLR 2024, peer-reviewed](https://proceedings.iclr.cc/paper_files/paper/2024/hash/f1cf02ce09757f57c3b93c0db83181e0-Abstract-Conference.html).
        Older interface reference; compare the newer GEPA method rather than assume
        the original optimizer remains best.\\n\", \"reactions\": {\"url\": \"https://api.github.com/repos/AstralDeep/AstralDeep/issues/349/reactions\",
