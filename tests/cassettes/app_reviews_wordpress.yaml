        MCP shipped with latest WooCommerce (11.0.1) autoloads and breaks site (3
        stars)</title>\n\t\t\t\t\t<link>https://wordpress.org/support/topic/defunct-mcp-shipped-with-latest-woocommerce-11-0-1-autoloads-and-breaks-site/</link>\n\t\t\t\t\t<pubDate>Sat,
        15 Aug 2026 17:04:28 +0000</pubDate>\n\t\t\t\t\t<dc:creator>redacted</dc:creator>\n\n\t\t\t\t\t\n\t\t\t\t\t<description>\n\t\t\t\t\t\t<![CDATA[\n\t\t\t\t\t\t<p>\n\t\t\t\t\t\t\tReplies:
        3\t\t\t\t\t\t</p>\n\t\t\t\t\t\t<p>Rating: 3 stars</p>\n<p class=\"wp-block-paragraph\">I
        don&#8217;t have any idea why you&#8217;d ship a defunct MCP adapter (0.1)
        and have it autoload, even if someone has the feature turned off in settings.<br
        /><br />However, you&#8217;ve broken one of my client&#8217;s sites&#8217;
        ability to utilize Zapier with their Formidable Forms because Formidable ships
        its own MCP that is REQUIRED for their Formidable API use (they are currently
        requiring 5.0&lt;=6.0).<br /><br />Who knows what other API needs other sites
        have that your darned autoloading is breaking.</p>\n\n\n<ul id=\"bbp-topic-revision-log-18994483\"
        class=\"bbp-topic-revision-log\">\n\n\t<li id=\"bbp-topic-revision-log-18994483-item-18994484\"
        class=\"bbp-topic-revision-log-item\">\n\t\tThis topic was modified 1 month,
        3 weeks ago by <a href=\"https://wordpress.org/support/users/egsteam/\" title=\"View
        egsteam&#039;s profile\" class=\"bbp-author-link\"><span class=\"bbp-author-name\">egsteam</span></a>.\n\t</li>\n\n</ul>\n\n\t\t\t\t\t\t]]>\n\t\t\t\t\t</description>\n\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t</item>\n\n\t\t\t\t\n\t\t\t\t<item>\n\t\t\t\t\t<guid>https://wordpress.org/support/topic/thanks-2616/</guid>\n\t\t\t\t\t<title>Thanks!
