        rel=\"self\" type=\"application/rss+xml\" />\n\t\t<link>https://wordpress.org/support/plugin/woocommerce/feed/</link>\n\t\t<description></description>\t\t<lastBuildDate>Fri,
        09 Oct 2026 23:07:42 +0000</lastBuildDate>\n\t\t<generator>https://bbpress.org/?v=2.7.0-alpha-4</generator>\n\t\t<language>en-US</language>\n\n\t\t\n\t\t\n\t\t\t\n\t\t\t\t<item>\n\t\t\t\t\t<guid>https://wordpress.org/support/topic/woocommerce-customer-profile-shows-incorrect-number-of-purchased-products/</guid>\n\t\t\t\t\t<title>WooCommerce
        Customer Profile Shows Incorrect Number of Purchased Products</title>\n\t\t\t\t\t<link>https://wordpress.org/support/topic/woocommerce-customer-profile-shows-incorrect-number-of-purchased-products/</link>\n\t\t\t\t\t<pubDate>Fri,
        09 Oct 2026 19:47:28 +0000</pubDate>\n\t\t\t\t\t<dc:creator>redacted</dc:creator>\n\n\t\t\t\t\t\n\t\t\t\t\t<description>\n\t\t\t\t\t\t<![CDATA[\n\t\t\t\t\t\t<p>\n\t\t\t\t\t\t\tReplies:
        0\t\t\t\t\t\t</p>\n\t\t\t\t\t\t<p class=\"wp-block-paragraph\">Hello,</p>\n\n\n\n<p
        class=\"wp-block-paragraph\">I have an issue with WooCommerce regarding the
        number of purchased products displayed in a customer&#8217;s profile.</p>\n\n\n\n<p
        class=\"wp-block-paragraph\">One of my customers has purchased approximately
        <strong>150 product units across multiple orders</strong>, but the customer
        profile shows only <strong>26 purchased products</strong>.</p>\n\n\n\n<p class=\"wp-block-paragraph\">I
        would like to understand why the number of purchased products in the customer
        profile does not match the actual total quantity purchased.</p>\n\n\n\n<p
        class=\"wp-block-paragraph\">Has anyone experienced a similar issue? Could
        this be related to how WooCommerce calculates purchased products, order statuses,
        product quantities, or HPOS (High-Performance Order Storage)?</p>\n\n\n\n<p
        class=\"wp-block-paragraph\">I would appreciate any suggestions on how to
        troubleshoot and fix this issue.</p>\n\n\n\n<p class=\"wp-block-paragraph\">Thank
        you!</p>\n\t\t\t\t\t\t]]>\n\t\t\t\t\t</description>\n\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t</item>\n\n\t\t\t\t\n\t\t\t\t<item>\n\t\t\t\t\t<guid>https://wordpress.org/support/topic/store_email-placeholder-should-use-reply-email-not-from-email/</guid>\n\t\t\t\t\t<title>{store_email}
        placeholder should use Reply email, not From email</title>\n\t\t\t\t\t<link>https://wordpress.org/support/topic/store_email-placeholder-should-use-reply-email-not-from-email/</link>\n\t\t\t\t\t<pubDate>Fri,
        09 Oct 2026 17:04:10 +0000</pubDate>\n\t\t\t\t\t<dc:creator>redacted</dc:creator>\n\n\t\t\t\t\t\n\t\t\t\t\t<description>\n\t\t\t\t\t\t<![CDATA[\n\t\t\t\t\t\t<p>\n\t\t\t\t\t\t\tReplies:
        0\t\t\t\t\t\t</p>\n\t\t\t\t\t\t<p class=\"wp-block-paragraph\">The &#8220;Additional
        Content&#8221; setting for email notifications includes support for the placeholder
        {store_email}. This uses the From address.</p>\n\n\n\n<p class=\"wp-block-paragraph\">When
        a Reply-To address is configured (&#8220;Add a different email address to
        receive replies.&#8221;), the placeholder should probably be replaced with
        <em>that</em> address, not the From.</p>\n\t\t\t\t\t\t]]>\n\t\t\t\t\t</description>\n\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t</item>\n\n\t\t\t\t\n\t\t\t\t<item>\n\t\t\t\t\t<guid>https://wordpress.org/support/topic/elementor-keeps-loading-when-i-install-woocommerce/</guid>\n\t\t\t\t\t<title>elementor
        keeps loading when i install woocommerce</title>\n\t\t\t\t\t<link>https://wordpress.org/support/topic/elementor-keeps-loading-when-i-install-woocommerce/</link>\n\t\t\t\t\t<pubDate>Fri,
        09 Oct 2026 14:44:40 +0000</pubDate>\n\t\t\t\t\t<dc:creator>redacted</dc:creator>\n\n\t\t\t\t\t\n\t\t\t\t\t<description>\n\t\t\t\t\t\t<![CDATA[\n\t\t\t\t\t\t<p>\n\t\t\t\t\t\t\tReplies:
        0\t\t\t\t\t\t</p>\n\t\t\t\t\t\t<p class=\"wp-block-paragraph\">hi i need help
        whenever i install the woocommerce the elementor just keeps loading and tells
        me to enable safe mode, once i enable safe mode it still just keeps loading</p>\n\n\n\n<p
        class=\"wp-block-paragraph\">and never loads it stops and works fine once
        i delete/deactivate the woocommerce plugin please help!</p>\n\n\n\n<p class=\"wp-block-paragraph\">Thankyou</p>\n\t\t\t\t\t\t]]>\n\t\t\t\t\t</description>\n\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t</item>\n\n\t\t\t\t\n\t\t\t\t<item>\n\t\t\t\t\t<guid>https://wordpress.org/support/topic/problems-with-checkout-after-last-update-to-11-2-0/</guid>\n\t\t\t\t\t<title>Problems
        with checkout after last Update to 11.2.0</title>\n\t\t\t\t\t<link>https://wordpress.org/support/topic/problems-with-checkout-after-last-update-to-11-2-0/</link>\n\t\t\t\t\t<pubDate>Fri,
        09 Oct 2026 08:04:38 +0000</pubDate>\n\t\t\t\t\t<dc:creator>redacted</dc:creator>\n\n\t\t\t\t\t\n\t\t\t\t\t<description>\n\t\t\t\t\t\t<![CDATA[\n\t\t\t\t\t\t<p>\n\t\t\t\t\t\t\tReplies:
        3\t\t\t\t\t\t</p>\n\t\t\t\t\t\t<p class=\"wp-block-paragraph\">When finalizing
        the order, an error message appears stating that an address needs to be entered,
        even though all address fields have been filled in. I believe we encountered
        this issue once before following an update, which was subsequently fixed.
        Please look into this as soon as possible. Thanks.</p>\n\t\t\t\t\t\t]]>\n\t\t\t\t\t</description>\n\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t</item>\n\n\t\t\t\t\n\t\t\t\t<item>\n\t\t\t\t\t<guid>https://wordpress.org/support/topic/view-cart-and-checkout-not-properly-showing-in-message/</guid>\n\t\t\t\t\t<title>View
        Cart and checkout not properly showing in message</title>\n\t\t\t\t\t<link>https://wordpress.org/support/topic/view-cart-and-checkout-not-properly-showing-in-message/</link>\n\t\t\t\t\t<pubDate>Fri,
        09 Oct 2026 06:58:04 +0000</pubDate>\n\t\t\t\t\t<dc:creator>redacted</dc:creator>\n\n\t\t\t\t\t\n\t\t\t\t\t<description>\n\t\t\t\t\t\t<![CDATA[\n\t\t\t\t\t\t<p>\n\t\t\t\t\t\t\tReplies:
        0\t\t\t\t\t\t</p>\n\t\t\t\t\t\t<p class=\"wp-block-paragraph\">See screenshot
        <a href=\"https://postimg.cc/Z96FW8sz\" rel=\"nofollow ugc\">https://postimg.cc/Z96FW8sz</a></p>\n\n\n\n<figure
        class=\"wp-block-image size-large\"><img alt=\"\" src=\"https://kommodo.ai/i/eDfERwae9nriHmGsm4TK\"/></figure>\n\n\n\n<figure
        class=\"wp-block-image size-large\"><img alt=\"\" src=\"https://postimg.cc/Z96FW8sz\"/></figure>\n\t\t\t\t\t\t]]>\n\t\t\t\t\t</description>\n\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t</item>\n\n\t\t\t\t\n\t\t\t\t<item>\n\t\t\t\t\t<guid>https://wordpress.org/support/topic/v11-2-causes-issues-with-the-product-image-gallery/</guid>\n\t\t\t\t\t<title>v11.2
        causes issues with the product image gallery</title>\n\t\t\t\t\t<link>https://wordpress.org/support/topic/v11-2-causes-issues-with-the-product-image-gallery/</link>\n\t\t\t\t\t<pubDate>Fri,
        09 Oct 2026 03:18:03 +0000</pubDate>\n\t\t\t\t\t<dc:creator>redacted</dc:creator>\n\n\t\t\t\t\t\n\t\t\t\t\t<description>\n\t\t\t\t\t\t<![CDATA[\n\t\t\t\t\t\t<p>\n\t\t\t\t\t\t\tReplies:
        1\t\t\t\t\t\t</p>\n\t\t\t\t\t\t<p class=\"wp-block-paragraph\">v11.2 causes
        issues with the product image gallery.</p>\n\n\n\n<p class=\"wp-block-paragraph\">After
        applying the update, the primary image for the default product variation has
        been removed from the gallery. If there were 2 images, the 2nd image becomes
        primary, if there was only 1 image, then there is no primary image. This is
        true for every product. In addition it randomly inserts an unrelated product
        image into the gallery as well, it seems like the same image, into multiple
        products, and not the default variation, at least I can see no pattern with
        the 2nd issue.</p>\n\n\n\n<p class=\"wp-block-paragraph\">I had to restore
        my site from backup, since a rollback didn&#8217;t fix the issue it caused
        with the gallery.</p>\n\n\n\n<p class=\"wp-block-paragraph\">We use the Additional
        Variation Images Gallery for WooCommerce By Emran Ahmed along side WooCommerce
        </p>\n\t\t\t\t\t\t]]>\n\t\t\t\t\t</description>\n\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t</item>\n\n\t\t\t\t\n\t\t\t\t<item>\n\t\t\t\t\t<guid>https://wordpress.org/support/topic/%da%86%d9%be-%da%86%db%8c%d9%86-%d8%b4%d8%af%d9%85-%d9%88%d8%a7%d8%ad%d8%af-%d9%be%d9%88%d9%84/</guid>\n\t\t\t\t\t<title>\u0686\u067E
        \u0686\u06CC\u0646 \u0634\u062F\u0645 \u0648\u0627\u062D\u062F \u067E\u0648\u0644</title>\n\t\t\t\t\t<link>https://wordpress.org/support/topic/%da%86%d9%be-%da%86%db%8c%d9%86-%d8%b4%d8%af%d9%85-%d9%88%d8%a7%d8%ad%d8%af-%d9%be%d9%88%d9%84/</link>\n\t\t\t\t\t<pubDate>Fri,
        09 Oct 2026 02:13:21 +0000</pubDate>\n\t\t\t\t\t<dc:creator>redacted</dc:creator>\n\n\t\t\t\t\t\n\t\t\t\t\t<description>\n\t\t\t\t\t\t<![CDATA[\n\t\t\t\t\t\t<p>\n\t\t\t\t\t\t\tReplies:
        0\t\t\t\t\t\t</p>\n\t\t\t\t\t\t<p class=\"wp-block-paragraph\">\u062F\u0631
        \u0627\u067E\u062F\u06CC\u062A \u062C\u062F\u06CC\u062F \u0648\u0627\u062D\u062F
        \u067E\u0648\u0644 \u062A\u0648\u0645\u0627\u0646 \u0631\u0627 \u0628\u0627\u06CC\u062F
        \u0628\u0647 \u0686\u067E \u0628\u0627 \u0641\u0627\u0635\u0644\u0647 \u062A\u063A\u06CC\u06CC\u0631
        \u062F\u0647\u06CC\u062F \u062A\u0627 \u062F\u0631 \u0633\u0627\u06CC\u062A
        \u0628\u0647 \u062F\u0631\u0633\u062A\u06CC \u0646\u0645\u0627\u06CC\u0634
        \u062F\u0627\u062F\u0647 \u0634\u0648\u062F .</p>\n\t\t\t\t\t\t]]>\n\t\t\t\t\t</description>\n\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t</item>\n\n\t\t\t\t\n\t\t\t\t<item>\n\t\t\t\t\t<guid>https://wordpress.org/support/topic/feature-request-control-external-product-link-target/</guid>\n\t\t\t\t\t<title>Feature
        Request: Control External Product Link Target</title>\n\t\t\t\t\t<link>https://wordpress.org/support/topic/feature-request-control-external-product-link-target/</link>\n\t\t\t\t\t<pubDate>Thu,
        08 Oct 2026 22:28:26 +0000</pubDate>\n\t\t\t\t\t<dc:creator>redacted</dc:creator>\n\n\t\t\t\t\t\n\t\t\t\t\t<description>\n\t\t\t\t\t\t<![CDATA[\n\t\t\t\t\t\t<p>\n\t\t\t\t\t\t\tReplies:
        0\t\t\t\t\t\t</p>\n\t\t\t\t\t\t<p class=\"wp-block-paragraph\">Currently,
        <strong>External/Affiliate product</strong> buttons open URLs in a new tab
        by default.<br />This behavior makes sense for affiliate links but isn&#8217;t
        always desirable for products linking to booking forms, registration pages,
        or other destinations within the same website.<br />Could you add a simple
        checkbox beneath the Product URL field:<br /><strong>\u2611 Open product link
        in a new tab</strong><br />Ideally, the checkbox would be enabled by default
        to preserve existing behavior, but store owners could disable it when appropriate.<br
        />This would eliminate the need for custom code or template overrides for
        a fairly common use case.</p>\n\t\t\t\t\t\t]]>\n\t\t\t\t\t</description>\n\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t</item>\n\n\t\t\t\t\n\t\t\t\t<item>\n\t\t\t\t\t<guid>https://wordpress.org/support/topic/woocommerce-11-2-0-hides-add-order-button/</guid>\n\t\t\t\t\t<title>Woocommerce
        11.2.0 Hides &#8220;Add Order&#8221; Button</title>\n\t\t\t\t\t<link>https://wordpress.org/support/topic/woocommerce-11-2-0-hides-add-order-button/</link>\n\t\t\t\t\t<pubDate>Thu,
        08 Oct 2026 17:03:49 +0000</pubDate>\n\t\t\t\t\t<dc:creator>redacted</dc:creator>\n\n\t\t\t\t\t\n\t\t\t\t\t<description>\n\t\t\t\t\t\t<![CDATA[\n\t\t\t\t\t\t<p>\n\t\t\t\t\t\t\tReplies:
        1\t\t\t\t\t\t</p>\n\t\t\t\t\t\t<p class=\"wp-block-paragraph\">Apparently
        it&#8217;s more important for Woo to advertise their &#8220;Automate Woo&#8221;
        plugin than to have the &#8220;Add Order&#8221; button because after the update
        there&#8217;s a banner advertisement for that plugin that automatically hides
        the ability to manually add an order in the Orders dashboard. I see the button
        flash there for a second before some kind of CSS or whatever hides it and
        after dismissing the ad, this behavior continues.</p>\n\t\t\t\t\t\t]]>\n\t\t\t\t\t</description>\n\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t</item>\n\n\t\t\t\t\n\t\t\t\t<item>\n\t\t\t\t\t<guid>https://wordpress.org/support/topic/modified-meta-php-with-child-theme-not-working/</guid>\n\t\t\t\t\t<title>Modified
        meta.php with Child Theme Not Working</title>\n\t\t\t\t\t<link>https://wordpress.org/support/topic/modified-meta-php-with-child-theme-not-working/</link>\n\t\t\t\t\t<pubDate>Thu,
        08 Oct 2026 14:24:19 +0000</pubDate>\n\t\t\t\t\t<dc:creator>redacted</dc:creator>\n\n\t\t\t\t\t\n\t\t\t\t\t<description>\n\t\t\t\t\t\t<![CDATA[\n\t\t\t\t\t\t<p>\n\t\t\t\t\t\t\tReplies:
        2\t\t\t\t\t\t</p>\n\t\t\t\t\t\t<p class=\"wp-block-paragraph\">I&#8217;ve
        modified meta.php and placed it in my child theme (/public_html/wp-content/themes/CHILDTHEME/woocommerce),
        but it doesn&#8217;t work.  I&#8217;ve also tried placing the modified meta.php
        within a fully parallel structure (/public_html/wp-content/themes/CHILDTHEME/woocommerce/templates/single-product),
        but that also doesn&#8217;t work.  I know my modifications to the file work,
        because they implement just fine when I copy them directly to the plugin folder.
        \ So any ideas how I might get the child theme version to work?</p>\n\t\t\t\t\t\t]]>\n\t\t\t\t\t</description>\n\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t</item>\n\n\t\t\t\t\n\t\t\t\t<item>\n\t\t\t\t\t<guid>https://wordpress.org/support/topic/shipping-method-disappears-in-classic-checkout-after-woocommerce-11-2-0/</guid>\n\t\t\t\t\t<title>Shipping
        method disappears in Classic Checkout after WooCommerce 11.2.0</title>\n\t\t\t\t\t<link>https://wordpress.org/support/topic/shipping-method-disappears-in-classic-checkout-after-woocommerce-11-2-0/</link>\n\t\t\t\t\t<pubDate>Thu,
        08 Oct 2026 12:27:32 +0000</pubDate>\n\t\t\t\t\t<dc:creator>redacted</dc:creator>\n\n\t\t\t\t\t\n\t\t\t\t\t<description>\n\t\t\t\t\t\t<![CDATA[\n\t\t\t\t\t\t<p>\n\t\t\t\t\t\t\tReplies:
        3\t\t\t\t\t\t</p>\n\t\t\t\t\t\t<p class=\"wp-block-paragraph\">After updating
        WooCommerce from <strong>11.1.2 to 11.2.0</strong>, a third-party shipping
        method stopped displaying correctly in<strong> </strong>Classic Checkout.
        The same configuration works normally after reverting to WooCommerce 11.1.2.</p>\n\n\n\n<p
        class=\"wp-block-paragraph\"><strong>Environment:</strong></p>\n\n\n\n<ul>\n<li>WordPress
        7.1.3</li>\n\n\n\n<li>WooCommerce 11.2.0 \u2014 affected</li>\n\n\n\n<li>WooCommerce
        11.1.2 \u2014 works</li>\n\n\n\n<li>Classic Checkout (shortcode)</li>\n\n\n\n<li>Theme:
        Hestia</li>\n\n\n\n<li>Shipping plugin: Shipping Nova Poshta for WooCommerce
        1.5.9</li>\n</ul>\n\n\n\n<p class=\"wp-block-paragraph\"><strong></strong><strong>Shipping
        method:</strong></p>\n\n\n\n<p class=\"wp-block-paragraph\">The plugin uses
        the standard <code>WC_Shipping_Method</code> API:</p>\n\n\n\n<pre class=\"wp-block-code\"><code>class
        NovaPoshta extends WC_Shipping_Method</code></pre>\n\n\n\n<p class=\"wp-block-paragraph\">and
        adds the shipping rate through:</p>\n\n\n\n<pre class=\"wp-block-code\"><code>$this-&gt;add_rate($args);</code></pre>\n\n\n\n<p
        class=\"wp-block-paragraph\">It uses the classic checkout AJAX flow and does
        not use the Store API or Checkout Blocks.</p>\n\n\n\n<p class=\"wp-block-paragraph\">With
        WooCommerce 11.1.2:</p>\n\n\n\n<ul>\n<li><code>update_order_review</code>
        returns HTTP 200.</li>\n\n\n\n<li>The response contains <code>shipping_nova_poshta_for_woocommerce</code>.</li>\n\n\n\n<li>The
        response contains the plugin&#8217;s city/warehouse checkout fragments.</li>\n\n\n\n<li><code>updated_checkout</code>
        fires normally.</li>\n\n\n\n<li>The shipping fields remain present after checkout
        updates.</li>\n</ul>\n\n\n\n<p class=\"wp-block-paragraph\">With WooCommerce
        11.2.0, the shipping method is no longer displayed correctly. No changes were
        made to the shipping plugin or its configuration between the two versions.</p>\n\n\n\n<p
        class=\"wp-block-paragraph\">There is also a separate:</p>\n\n\n\n<pre class=\"wp-block-code\"><code>/checkout/undefinedwc/store/v1/cart
        404</code></pre>\n\n\n\n<p class=\"wp-block-paragraph\">error from WooCommerce
        Blocks <code>cart.js</code>, but this error is also present on 11.1.2 and
        therefore does not appear to be the cause of the shipping regression.<br /><br
        />Can you please check what&#8217;s wrong.</p>\n\n\n<ul id=\"bbp-topic-revision-log-19039823\"
        class=\"bbp-topic-revision-log\">\n\n\t<li id=\"bbp-topic-revision-log-19039823-item-19039838\"
        class=\"bbp-topic-revision-log-item\">\n\t\tThis topic was modified 1 day,
        10 hours ago by <a href=\"https://wordpress.org/support/users/exdred/\" title=\"View
        exdred&#039;s profile\" class=\"bbp-author-link\"><span class=\"bbp-author-name\">exdred</span></a>.\n\t</li>\n\n</ul>\n\n\t\t\t\t\t\t]]>\n\t\t\t\t\t</description>\n\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t</item>\n\n\t\t\t\t\n\t\t\t\t<item>\n\t\t\t\t\t<guid>https://wordpress.org/support/topic/how-to-make-the-sidebar-product-categories-look-better-for-sub-categories/</guid>\n\t\t\t\t\t<title>How
        to make the sidebar Product Categories look better for sub-categories</title>\n\t\t\t\t\t<link>https://wordpress.org/support/topic/how-to-make-the-sidebar-product-categories-look-better-for-sub-categories/</link>\n\t\t\t\t\t<pubDate>Thu,
        08 Oct 2026 11:26:18 +0000</pubDate>\n\t\t\t\t\t<dc:creator>redacted</dc:creator>\n\n\t\t\t\t\t\n\t\t\t\t\t<description>\n\t\t\t\t\t\t<![CDATA[\n\t\t\t\t\t\t<p>\n\t\t\t\t\t\t\tReplies:
        1\t\t\t\t\t\t</p>\n\t\t\t\t\t\t<p class=\"wp-block-paragraph\">Hi</p>\n\n\n\n<p
        class=\"wp-block-paragraph\">How do make the sidebar Product Categories look
        better for sub-categories?  Currently the sub category is only indented slightly
        from the main Categories so its not obvious or nice.  Is there a plugin or
        something that we can use to open and close with a + symbol maybe to view
        subcategories?  So it would stay closed on sidebar to show all the Categories
        and they could click on the + sign to view sub categories?  Or something like
        that?  I just need some nice formatting for customer site.</p>\n\n\n\n<p class=\"wp-block-paragraph\">If
        anyone has any recommendations or what you&#8217;ve done for your site, I&#8217;d
        be keen to hear what you have used or done.</p>\n\n\n\n<p class=\"wp-block-paragraph\">Thanks
        Kristin</p>\n\t\t\t\t\t\t]]>\n\t\t\t\t\t</description>\n\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t</item>\n\n\t\t\t\t\n\t\t\t\t<item>\n\t\t\t\t\t<guid>https://wordpress.org/support/topic/woocommerce-shortcodes-for-single-product-page/</guid>\n\t\t\t\t\t<title>woocommerce
        shortcodes for single product page</title>\n\t\t\t\t\t<link>https://wordpress.org/support/topic/woocommerce-shortcodes-for-single-product-page/</link>\n\t\t\t\t\t<pubDate>Thu,
        08 Oct 2026 10:58:09 +0000</pubDate>\n\t\t\t\t\t<dc:creator>redacted</dc:creator>\n\n\t\t\t\t\t\n\t\t\t\t\t<description>\n\t\t\t\t\t\t<![CDATA[\n\t\t\t\t\t\t<p>\n\t\t\t\t\t\t\tReplies:
        1\t\t\t\t\t\t</p>\n\t\t\t\t\t\t<p class=\"wp-block-paragraph\">Hi</p>\n\n\n\n<p
        class=\"wp-block-paragraph\">I&#8217;ve got a site I&#8217;m doing for a customer
        using Divi Theme with Woocommerce.  I need to add some Woocommerce codes for
        the single product page to show standard woocommerce page and the related
        products.  I need to ensure that it shows the related products relevant to
        that sub category that the product is in.</p>\n\n\n\n<p class=\"wp-block-paragraph\">Currently
        I will have Divi Theme as template for the single product page as I need some
        specific formatting required on the top of the single product page , hence
        editing in Divi BUT the whole site and all pages are still using Woocommerce
        for all products.</p>\n\n\n\n<p class=\"wp-block-paragraph\">So I just need
        Woocommerce code for single product page to show &amp; Related Products. Like
        the gallery on left, Product title, price, description on right like normal,
        and then the RELATED PRODUCTS underneath.</p>\n\n\n\n<p class=\"wp-block-paragraph\">Thanks
        in advance. Kristin</p>\n\t\t\t\t\t\t]]>\n\t\t\t\t\t</description>\n\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t</item>\n\n\t\t\t\t\n\t\t\t\t<item>\n\t\t\t\t\t<guid>https://wordpress.org/support/topic/woocommerce-analytics-25/</guid>\n\t\t\t\t\t<title>WooCommerce
        Analytics</title>\n\t\t\t\t\t<link>https://wordpress.org/support/topic/woocommerce-analytics-25/</link>\n\t\t\t\t\t<pubDate>Wed,
        07 Oct 2026 07:34:50 +0000</pubDate>\n\t\t\t\t\t<dc:creator>redacted</dc:creator>\n\n\t\t\t\t\t\n\t\t\t\t\t<description>\n\t\t\t\t\t\t<![CDATA[\n\t\t\t\t\t\t<p>\n\t\t\t\t\t\t\tReplies:
        3\t\t\t\t\t\t</p>\n\t\t\t\t\t\t<p class=\"wp-block-paragraph\">Unfortunately,
        I am having a problem with WooCommerce Analytics. The order chart shows the
        right amount of orders, but the total sales, net sales and items sold don&#8217;t
        match the right amount. </p>\n\t\t\t\t\t\t]]>\n\t\t\t\t\t</description>\n\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t</item>\n\n\t\t\t\t\n\t\t\t\t<item>\n\t\t\t\t\t<guid>https://wordpress.org/support/topic/paging-error-in-woocommerce-products-page/</guid>\n\t\t\t\t\t<title>Paging
        error in Woocommerce Products page</title>\n\t\t\t\t\t<link>https://wordpress.org/support/topic/paging-error-in-woocommerce-products-page/</link>\n\t\t\t\t\t<pubDate>Mon,
        05 Oct 2026 19:08:29 +0000</pubDate>\n\t\t\t\t\t<dc:creator>redacted</dc:creator>\n\n\t\t\t\t\t\n\t\t\t\t\t<description>\n\t\t\t\t\t\t<![CDATA[\n\t\t\t\t\t\t<p>\n\t\t\t\t\t\t\tReplies:
        3\t\t\t\t\t\t</p>\n\t\t\t\t\t\t<p class=\"wp-block-paragraph\">I have 662
        pages of products (it&#8217;s a record store).  Suddenly I can no longer page
        directly to, for example, page 300.   I have to hit the right arrow key 300
        times to page there.    I use to be able to put the number 300 in the PAGE
        of 662 box and go directly there.   Can you help please?</p>\n\t\t\t\t\t\t]]>\n\t\t\t\t\t</description>\n\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t</item>\n\n\t\t\t\t\n\t\t\t\t<item>\n\t\t\t\t\t<guid>https://wordpress.org/support/topic/flat-rate-shipping-cost-550-incorrectly-saved-as-550/</guid>\n\t\t\t\t\t<title>Flat
        rate shipping cost 5,50 incorrectly saved as 550</title>\n\t\t\t\t\t<link>https://wordpress.org/support/topic/flat-rate-shipping-cost-550-incorrectly-saved-as-550/</link>\n\t\t\t\t\t<pubDate>Mon,
        05 Oct 2026 14:31:11 +0000</pubDate>\n\t\t\t\t\t<dc:creator>redacted</dc:creator>\n\n\t\t\t\t\t\n\t\t\t\t\t<description>\n\t\t\t\t\t\t<![CDATA[\n\t\t\t\t\t\t<p>\n\t\t\t\t\t\t\tReplies:
        1\t\t\t\t\t\t</p>\n\t\t\t\t\t\t<p class=\"wp-block-paragraph\">I was investigating
        issue #69235 and PR #69293 about free shipping minimum bug.<br /><a target=\"_blank\"
        href=\"https://github.com/woocommerce/woocommerce/issues/69235\" rel=\"noreferrer
        noopener nofollow ugc\">https://github.com/woocommerce/woocommerce/issues/69235</a></p>\n\n\n\n<p
        class=\"wp-block-paragraph\">(summary: if the free shipping minimum is saved
        in a comma format like &#8220;100,00&#8221; on a dot-decimal store, small
        carts get free shipping. No error, the shop just stops collecting shipping
        on those orders. PR #69293 fixes it, and I tested trunk vs the PR head and
        can confirm the fix.)</p>\n\n\n\n<p class=\"wp-block-paragraph\">While testing
        I found something nearby that might be new. Saving the flat rate cost as &#8220;5,50&#8221;
        through the REST API ( v3 and v4 ) stores &#8220;550&#8221; on both trunk
        and the PR, so a cart would be charged 550 for shipping. The PR doesn&#8217;t
        touch it. I don&#8217;t know if that&#8217;s intended. Does anyone know if
        it&#8217;s been reported?</p>\n\n\n\n<p class=\"wp-block-paragraph\">Has anyone
        seen it on a client store, especially after locale change, migration or an
        import?</p>\n\n\n<ul id=\"bbp-topic-revision-log-19036874\" class=\"bbp-topic-revision-log\">\n\n\t<li
        id=\"bbp-topic-revision-log-19036874-item-19036877\" class=\"bbp-topic-revision-log-item\">\n\t\tThis
        topic was modified 4 days, 8 hours ago by <a href=\"https://wordpress.org/support/users/pranjalsharma01/\"
        title=\"View pranjalsharma01&#039;s profile\" class=\"bbp-author-link\"><span
        class=\"bbp-author-name\">pranjalsharma01</span></a>.\n\t</li>\n\n</ul>\n\n\t\t\t\t\t\t]]>\n\t\t\t\t\t</description>\n\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t</item>\n\n\t\t\t\t\n\t\t\t\t<item>\n\t\t\t\t\t<guid>https://wordpress.org/support/topic/flat-rate-shipping-cost-550-incorrectly-saved-as-550-in-wc-v3-v4/</guid>\n\t\t\t\t\t<title>Flat
        Rate Shipping Cost 5,50 Incorrectly Saved as 550 in wc/v3 &#038; v4</title>\n\t\t\t\t\t<link>https://wordpress.org/support/topic/flat-rate-shipping-cost-550-incorrectly-saved-as-550-in-wc-v3-v4/</link>\n\t\t\t\t\t<pubDate>Mon,
        05 Oct 2026 14:09:55 +0000</pubDate>\n\t\t\t\t\t<dc:creator>redacted</dc:creator>\n\n\t\t\t\t\t\n\t\t\t\t\t<description>\n\t\t\t\t\t\t<![CDATA[\n\t\t\t\t\t\t<p>\n\t\t\t\t\t\t\tReplies:
        1\t\t\t\t\t\t</p>\n\t\t\t\t\t\t<p class=\"wp-block-paragraph\">I was investigating
        issue #69235 and PR #69293 about free shipping minimum bug.<br /><a target=\"_blank\"
        href=\"https://github.com/woocommerce/woocommerce/issues/69235\" rel=\"noreferrer
        noopener nofollow ugc\">https://github.com/woocommerce/woocommerce/issues/69235</a></p>\n\n\n\n<p
        class=\"wp-block-paragraph\">(summary: if the free shipping minimum is saved
        in a comma format like &#8220;100,00&#8221; on a dot-decimal store, small
        carts get free shipping. No error, the shop just stops collecting shipping
        on those orders. PR #69293 fixes it, and I tested trunk vs the PR head and
        can confirm the fix.)</p>\n\n\n\n<ol>\n<li>While testing I found something
        nearby that might be new. Saving the flat rate cost as &#8220;5,50&#8221;
        through the REST API wc/v3 and wc/v4 stores &#8220;550&#8221; on both trunk
        and the PR, so a cart would be charged 550 for shipping. The PR doesn&#8217;t
        touch it. I don&#8217;t know if that&#8217;s intended. Does anyone know if
        it&#8217;s been reported?</li>\n\n\n\n<li>Has anyone seen it on a client store,
        especially after locale change, migration or an import?</li>\n</ol>\n\n\n\n<p
        class=\"wp-block-paragraph\"></p>\n\t\t\t\t\t\t]]>\n\t\t\t\t\t</description>\n\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t</item>\n\n\t\t\t\t\n\t\t\t\t<item>\n\t\t\t\t\t<guid>https://wordpress.org/support/topic/administrative-division-change-in-nepal-2/</guid>\n\t\t\t\t\t<title>Administrative
        division change in Nepal</title>\n\t\t\t\t\t<link>https://wordpress.org/support/topic/administrative-division-change-in-nepal-2/</link>\n\t\t\t\t\t<pubDate>Sun,
        04 Oct 2026 16:37:04 +0000</pubDate>\n\t\t\t\t\t<dc:creator>redacted</dc:creator>\n\n\t\t\t\t\t\n\t\t\t\t\t<description>\n\t\t\t\t\t\t<![CDATA[\n\t\t\t\t\t\t<p>\n\t\t\t\t\t\t\tReplies:
        1\t\t\t\t\t\t</p>\n\t\t\t\t\t\t<p class=\"wp-block-paragraph\">&lt;span style=&#8221;background-color:
        rgb(251, 251, 251); font-family: Inter, sans-serif; white-space: normal;&#8221;&gt;Due
        to political revolution administrative division system has changed in Nepal.
        I\u2019m creating this topic because WooCommerce plugins shows the old administrative
        divisions(Zone) by default. Now the administrative division has changed to
        Province and Local level.&lt;/span&gt;</p><p>There is no option to override
        the default zones.</p><p><a href=\"https://en.wikipedia.org/wiki/Administrative_divisions_of_Nepal\"
        rel=\"nofollow ugc\">https://en.wikipedia.org/wiki/Administrative_divisions_of_Nepal</a></p>\n\n\n\n<p
        class=\"wp-block-paragraph\">Also, unlike other countries the shipping rates
        for local delivery services vary significantly by location in Nepal. In some
        cases, rates can differ even between two places within the same district.
        Nepal has 77 districts, and most shipping providers have 100+ different pricing
        levels.</p>\n\n\n\n<p class=\"wp-block-paragraph\">I would like to request
        a feature that allows me to define custom locations and assign shipping rates
        using comma-separated lists.</p>\n\n\n\n<p class=\"wp-block-paragraph\">For
        example:</p>\n\n\n\n<ul>\n<li>20 local levels \u2014 NPR 100 per KG</li>\n\n\n\n<li>50
        local levels \u2014 NPR 150 per KG</li>\n\n\n\n<li>30 local levels \u2014
        NPR 200 per KG</li>\n</ul>\n\n\n\n<p class=\"wp-block-paragraph\">I would
        like to customize the existing State/Zone structure:</p>\n\n\n\n<ol>\n<li><strong>Province/Zone:</strong>
        The user first selects a province/zone (7 provinces of Nepal).</li>\n\n\n\n<li><strong>District:</strong>
        Based on the selected province, a second dropdown displays the relevant districts.
        I should be able to add these districts as a comma-separated list.</li>\n\n\n\n<li><strong>Local
        Level:</strong> After selecting a district, a third dropdown displays the
        corresponding local levels (municipalities, rural municipalities, etc.), also
        added as a comma-separated list.</li>\n\n\n\n<li><strong>Shipping Rate:</strong>
        Each local level can be assigned a specific shipping charge, and the applicable
        rate is automatically calculated based on the customer&#8217;s selection.</li>\n</ol>\n\n\n\n<p
        class=\"wp-block-paragraph\">The key requirement is the ability to <strong>edit/customize
        the predefined WooCommerce State/Zone options and create a hierarchical Province
        \u2192 District \u2192 Local Level structure</strong>, with individual shipping
        rates assigned to each local level.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><a
        href=\"https://wordpress.org/support/topic/administrative-division-change-in-nepal/#post-15940763\"
        rel=\"ugc\">https://wordpress.org/support/topic/administrative-division-change-in-nepal/#post-15940763</a></p>\n\t\t\t\t\t\t]]>\n\t\t\t\t\t</description>\n\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t</item>\n\n\t\t\t\t\n\t\t\t\t<item>\n\t\t\t\t\t<guid>https://wordpress.org/support/topic/dynamic-checkout-fields-expanded-block-editor-suppor/</guid>\n\t\t\t\t\t<title>Dynamic
        Checkout Fields &#038; Expanded Block Editor Suppor</title>\n\t\t\t\t\t<link>https://wordpress.org/support/topic/dynamic-checkout-fields-expanded-block-editor-suppor/</link>\n\t\t\t\t\t<pubDate>Sun,
        04 Oct 2026 15:26:05 +0000</pubDate>\n\t\t\t\t\t<dc:creator>redacted</dc:creator>\n\n\t\t\t\t\t\n\t\t\t\t\t<description>\n\t\t\t\t\t\t<![CDATA[\n\t\t\t\t\t\t<p>\n\t\t\t\t\t\t\tReplies:
        1\t\t\t\t\t\t</p>\n\t\t\t\t\t\t<p class=\"wp-block-paragraph\"><strong><br
        />Hello WooCommerce Team and Community,</strong></p>\n\n\n\n<p class=\"wp-block-paragraph\">I
        am writing to submit a feature request that I believe would significantly
        improve the user experience and conversion rates for thousands of WooCommerce
        store owners, particularly those selling digital products.</p>\n\n\n\n<p class=\"wp-block-paragraph\">While
        WooCommerce is an incredibly powerful platform, the checkout process has become
        increasingly rigid and unnecessarily long. I would like to propose the following
        enhancements for future updates:</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>1.
        Differentiate Checkout Fields for Virtual/Downloadable vs. Physical Products:</strong><br
        />Currently, customers purchasing only virtual or downloadable products (like
        software, e-books, or courses) are still presented with shipping-related fields
        at checkout. This creates unnecessary friction and cognitive load, leading
        to cart abandonment.</p>\n\n\n\n<ul>\n<li><strong>The Request:</strong> We
        need native, dynamic conditional logic that automatically detects if the cart
        contains only virtual/downloadable items and seamlessly hides all shipping-related
        fields.</li>\n</ul>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>2. Expanded
        Customization for Cart &amp; Checkout Blocks:</strong><br />The introduction
        of Cart and Checkout blocks was a massive step in the right direction. However,
        store owners still lack granular control over the layout and styling of these
        pages.</p>\n\n\n\n<ul>\n<li><strong>The Request:</strong> Please expand the
        capabilities of the Block Editor for WooCommerce. Give us the ability to rearrange
        the checkout fields, apply conditional visibility (e.g., hiding company name
        for B2C), and deeply customize the styling of the cart and checkout pages
        without relying on heavy third-party plugins or custom code snippets.</li>\n</ul>\n\n\n\n<p
        class=\"wp-block-paragraph\"><strong>3. A Shorter, Simpler Checkout Flow:</strong><br
        />The default checkout process is notoriously long. Modern e-commerce platforms
        are moving toward frictionless, one-page, or smart multi-step checkouts.</p>\n\n\n\n<ul>\n<li><strong>The
        Request:</strong> We need a streamlined, modern checkout layout out-of-the-box
        that reduces the number of steps and simplifies the process for the customer,
        ultimately increasing conversions for store owners.</li>\n</ul>\n\n\n\n<p
        class=\"wp-block-paragraph\">By implementing these changes, WooCommerce can
        provide a much more competitive, modern, and user-friendly shopping experience.</p>\n\n\n\n<p
        class=\"wp-block-paragraph\">I\u2019d love to hear what the rest of the community
        thinks about these suggestions. Thank you for your continuous work on this
        amazing platform!</p>\n\t\t\t\t\t\t]]>\n\t\t\t\t\t</description>\n\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t</item>\n\n\t\t\t\t\n\t\t\t\t<item>\n\t\t\t\t\t<guid>https://wordpress.org/support/topic/order-payment-error-no-such-paymentmethod/</guid>\n\t\t\t\t\t<title>Order
        Payment Error: No Such PaymentMethod</title>\n\t\t\t\t\t<link>https://wordpress.org/support/topic/order-payment-error-no-such-paymentmethod/</link>\n\t\t\t\t\t<pubDate>Sun,
        04 Oct 2026 14:51:10 +0000</pubDate>\n\t\t\t\t\t<dc:creator>redacted</dc:creator>\n\n\t\t\t\t\t\n\t\t\t\t\t<description>\n\t\t\t\t\t\t<![CDATA[\n\t\t\t\t\t\t<p>\n\t\t\t\t\t\t\tReplies:
        2\t\t\t\t\t\t</p>\n\t\t\t\t\t\t<p class=\"wp-block-paragraph\">Hi,</p>\n\n\n\n<p
        class=\"wp-block-paragraph\">I had my first website order but the payment
        failed. </p>\n\n\n\n<p class=\"wp-block-paragraph\">Its said:<br /><br />&#8220;A
        payment od \xA312.48 failed to complete with the following message: &#8216;pm_1UM2c5FuiXB5oUVx4qsCRW9g&#8217;:
        OAuth key or stripe-Accounte headr was used but API request was provided with
        a platform-owned payment methodID. Please ensure that the provided payment
        method matches the specified account.&#8221;</p>\n\n\n\n<p class=\"wp-block-paragraph\">I
        have since tested and ordered something and the order and payment has gone
        through fine using mastercard. </p>\n\n\n\n<p class=\"wp-block-paragraph\">Can
        you help explain the reason this payment might have failed and how to fix
        it?</p>\n\n\n\n<p class=\"wp-block-paragraph\">Shortly after the order came
        through on the website, I received an email to say an email to the customers
        email address had not been delivered. Not sure if this is a related problem
        or just the customer entering the email wrong.</p>\n\n\n\n<p class=\"wp-block-paragraph\">Thanks</p>\n\t\t\t\t\t\t]]>\n\t\t\t\t\t</description>\n\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t</item>\n\n\t\t\t\t\n\t\t\t\t<item>\n\t\t\t\t\t<guid>https://wordpress.org/support/topic/allow-backorder-not-working-as-designed/</guid>\n\t\t\t\t\t<title>allow
        backorder not working as designed</title>\n\t\t\t\t\t<link>https://wordpress.org/support/topic/allow-backorder-not-working-as-designed/</link>\n\t\t\t\t\t<pubDate>Sun,
        04 Oct 2026 06:34:08 +0000</pubDate>\n\t\t\t\t\t<dc:creator>redacted</dc:creator>\n\n\t\t\t\t\t\n\t\t\t\t\t<description>\n\t\t\t\t\t\t<![CDATA[\n\t\t\t\t\t\t<p>\n\t\t\t\t\t\t\tReplies:
        1\t\t\t\t\t\t</p>\n\t\t\t\t\t\t<p class=\"wp-block-paragraph\">I wish to use
        the setting &#8220;allow backorders&#8221; &#8211; the one that DOESN&#8217;T
        notify customers but whether I select that or &#8220;allow, but notify customer&#8221;
        &#8211; it is the same &#8211; on the front end it says &#8220;available on
        backorder&#8221; which gives a false impression that customers will have to
        wait days for it. It used to work properly. Don&#8217;t know when it changed.</p>\n\n\n\n<p
        class=\"wp-block-paragraph\">Thanks for any advice</p>\n\t\t\t\t\t\t]]>\n\t\t\t\t\t</description>\n\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t</item>\n\n\t\t\t\t\n\t\t\t\t<item>\n\t\t\t\t\t<guid>https://wordpress.org/support/topic/select-phone-orders-among-all-orders/</guid>\n\t\t\t\t\t<title>Select
        phone orders among all orders</title>\n\t\t\t\t\t<link>https://wordpress.org/support/topic/select-phone-orders-among-all-orders/</link>\n\t\t\t\t\t<pubDate>Sat,
        03 Oct 2026 15:01:49 +0000</pubDate>\n\t\t\t\t\t<dc:creator>redacted</dc:creator>\n\n\t\t\t\t\t\n\t\t\t\t\t<description>\n\t\t\t\t\t\t<![CDATA[\n\t\t\t\t\t\t<p>\n\t\t\t\t\t\t\tReplies:
        3\t\t\t\t\t\t</p>\n\t\t\t\t\t\t<p class=\"wp-block-paragraph\">I want to be
        able to select all phone orders made among all orders.<br />I have not seen
        that one can do that. So it is maybe room for improvement.</p>\n\t\t\t\t\t\t]]>\n\t\t\t\t\t</description>\n\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t</item>\n\n\t\t\t\t\n\t\t\t\t<item>\n\t\t\t\t\t<guid>https://wordpress.org/support/topic/woocommerce-downloadable-pdf-files-disappear-after-product-update/</guid>\n\t\t\t\t\t<title>WooCommerce
        downloadable PDF files disappear after product update</title>\n\t\t\t\t\t<link>https://wordpress.org/support/topic/woocommerce-downloadable-pdf-files-disappear-after-product-update/</link>\n\t\t\t\t\t<pubDate>Fri,
        02 Oct 2026 11:09:20 +0000</pubDate>\n\t\t\t\t\t<dc:creator>redacted</dc:creator>\n\n\t\t\t\t\t\n\t\t\t\t\t<description>\n\t\t\t\t\t\t<![CDATA[\n\t\t\t\t\t\t<p>\n\t\t\t\t\t\t\tReplies:
        3\t\t\t\t\t\t</p>\n\t\t\t\t\t\t<p class=\"wp-block-paragraph\">Hello,</p>\n\n\n\n<p
        class=\"wp-block-paragraph\">I am having a problem with downloadable files
        not being retained in a WooCommerce product.</p>\n\n\n\n<p class=\"wp-block-paragraph\">I
        created a Simple Product and checked both Virtual and Downloadable. The product
        is The Organized Dog Parent \u2013 Essential Care Collection, priced at $7.99.</p>\n\n\n\n<p
        class=\"wp-block-paragraph\">I need to include two PDF files with the same
        product purchase:</p>\n\n\n\n<ol start=\"1\">\n<li>Essential Care Collection
        \u2013 Printable PDF</li>\n\n\n\n<li>Essential Care Collection \u2013 Fillable
        PDF</li>\n</ol>\n\n\n\n<p class=\"wp-block-paragraph\">I add both PDFs under
        Product data \u2192 General \u2192 Downloadable files, and both file URLs
        populate correctly. I set the Download limit to Unlimited and the Download
        expiry to Never.</p>\n\n\n\n<p class=\"wp-block-paragraph\">The rest of the
        product information saves correctly, including the title, descriptions, price,
        product image, category, tags, and brand.</p>\n\n\n\n<p class=\"wp-block-paragraph\">However,
        when I Save Draft, Publish, or Update the product, WordPress/WooCommerce confirms
        that the product was saved or updated successfully, but after the page reloads,
        both downloadable file rows disappear.</p>\n\n\n\n<p class=\"wp-block-paragraph\">I
        have repeated the process several times with the same result. My hosting provider,
        Network Solutions, has advised me to contact WooCommerce support because the
        issue appears to be specific to the WooCommerce downloadable-product settings.</p>\n\n\n\n<p
        class=\"wp-block-paragraph\">Could you please help me determine why the downloadable
        PDF files are not being retained and what I should check or change to correct
        this?</p>\n\n\n\n<p class=\"wp-block-paragraph\">Thank you.</p>\n\t\t\t\t\t\t]]>\n\t\t\t\t\t</description>\n\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t</item>\n\n\t\t\t\t\n\t\t\t\t<item>\n\t\t\t\t\t<guid>https://wordpress.org/support/topic/short-thank-you-page/</guid>\n\t\t\t\t\t<title>short
