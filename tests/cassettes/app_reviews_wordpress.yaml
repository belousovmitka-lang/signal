        renewal card charged but payment missing from Payments and payouts</title>\n\t\t\t\t\t<link>https://wordpress.org/support/topic/subscription-renewal-card-charged-but-payment-missing-from-payments-and-payouts/</link>\n\t\t\t\t\t<pubDate>Thu,
        01 Oct 2026 14:04:32 +0000</pubDate>\n\t\t\t\t\t<dc:creator>redacted</dc:creator>\n\n\t\t\t\t\t\n\t\t\t\t\t<description>\n\t\t\t\t\t\t<![CDATA[\n\t\t\t\t\t\t<p>\n\t\t\t\t\t\t\tReplies:
        1\t\t\t\t\t\t</p>\n\t\t\t\t\t\t<p class=\"wp-block-paragraph\">Hi,</p>\n\n\n\n<p
        class=\"wp-block-paragraph\">On one of our client&#8217;s stores we have a
        subscription renewal that was charged to the customer&#8217;s card, but the
        payment doesn&#8217;t appear in WooCommerce.</p>\n\n\n\n<p class=\"wp-block-paragraph\">Details:</p>\n\n\n\n<ul>\n<li>Site
        URL: <a href=\"https://visologiq.com/\" rel=\"nofollow ugc\">https://visologiq.com/</a></li>\n\n\n\n<li>Renewal
        order ID: #23195</li>\n\n\n\n<li>Subscription ID: #21235</li>\n\n\n\n<li>Renewal
        date: 14/09/2026</li>\n\n\n\n<li>Amount: 80\u20AC</li>\n\n\n\n<li>Payment
        gateway: WooPayments</li>\n\n\n\n<li>Transaction/charge ID (from the card
        processor): seti_1UIl2F2HKigXvad01xTKT2bn</li>\n</ul>\n\n\n\n<p class=\"wp-block-paragraph\">What
        happened:</p>\n\n\n\n<ol>\n<li>The subscription renewal order was created
        and the customer was charged. We can see the card transaction on our side</li>\n\n\n\n<li>The
        order is stuck on &#8220;Processing&#8221; and was never marked as completed.</li>\n\n\n\n<li>The
        transaction does NOT appear under WooCommerce &gt; Payments &gt; Transactions.</li>\n\n\n\n<li>The
        amount was NOT included in any payout to the merchant&#8217;s bank account.</li>\n</ol>\n\n\n\n<p
        class=\"wp-block-paragraph\">What we expected:<br />The charge should be recorded
        under Payments &gt; Transactions, and the funds should be included in the
        next payout. The order should also have progressed to the correct status.</p>\n\n\n\n<p
        class=\"wp-block-paragraph\">What we&#8217;ve checked WooCommerce &gt; Status
        &gt; Logs but we could not find any errors for the gateway or Action Scheduler
        around the renewal time</p>\n\n\n\n<p class=\"wp-block-paragraph\">Could you
        please:</p>\n\n\n\n<ol>\n<li>Check whether this charge was actually captured
        and where the funds are.</li>\n\n\n\n<li>Tell us why it isn&#8217;t showing
        in Payments &gt; Transactions or in the payouts.</li>\n\n\n\n<li>Advise on
        how to fix the order status and make sure the merchant receives the funds.
        We&#8217;d like to avoid refunding and re-charging the customer if possible.</li>\n</ol>\n\n\n\n<p
        class=\"wp-block-paragraph\">Thank you,<br />Fabio</p>\n\n\n\n<p class=\"wp-block-paragraph\">System
