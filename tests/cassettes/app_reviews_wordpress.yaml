        2\t\t\t\t\t\t</p>\n\t\t\t\t\t\t<p class=\"wp-block-paragraph\">Hi, is there
        a way to have a thank you page after someone makes a purchase?  </p>\n\t\t\t\t\t\t]]>\n\t\t\t\t\t</description>\n\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t</item>\n\n\t\t\t\t\n\t\t\t\t<item>\n\t\t\t\t\t<guid>https://wordpress.org/support/topic/products-not-showing-up-in-store-catalog-but-show-up-with-direct-link-2/</guid>\n\t\t\t\t\t<title>Products
