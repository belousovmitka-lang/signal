        09 Oct 2026 23:07:42 +0000</lastBuildDate>\n\t\t<generator>https://bbpress.org/?v=2.7.0-alpha-4</generator>\n\t\t<language>en-US</language>\n\n\t\t\n\t\t\n\t\t\t\n\t\t\t\t<item>\n\t\t\t\t\t<guid>https://wordpress.org/support/topic/geweldig-18/</guid>\n\t\t\t\t\t<title>Geweldig
        (5 stars)</title>\n\t\t\t\t\t<link>https://wordpress.org/support/topic/geweldig-18/</link>\n\t\t\t\t\t<pubDate>Sat,
        26 Sep 2026 16:07:25 +0000</pubDate>\n\t\t\t\t\t<dc:creator>redacted</dc:creator>\n\n\t\t\t\t\t\n\t\t\t\t\t<description>\n\t\t\t\t\t\t<![CDATA[\n\t\t\t\t\t\t<p>\n\t\t\t\t\t\t\tReplies:
        1\t\t\t\t\t\t</p>\n\t\t\t\t\t\t<p>Rating: 5 stars</p>\n<p class=\"wp-block-paragraph\">Ik
        vind Woocommerce echt geweldig. </p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\t\t\t\t\t\t]]>\n\t\t\t\t\t</description>\n\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t</item>\n\n\t\t\t\t\n\t\t\t\t<item>\n\t\t\t\t\t<guid>https://wordpress.org/support/topic/i-have-almost-everything-i-need/</guid>\n\t\t\t\t\t<title>I
        have almost everything I need. (5 stars)</title>\n\t\t\t\t\t<link>https://wordpress.org/support/topic/i-have-almost-everything-i-need/</link>\n\t\t\t\t\t<pubDate>Thu,
        24 Sep 2026 14:23:33 +0000</pubDate>\n\t\t\t\t\t<dc:creator>redacted</dc:creator>\n\n\t\t\t\t\t\n\t\t\t\t\t<description>\n\t\t\t\t\t\t<![CDATA[\n\t\t\t\t\t\t<p>\n\t\t\t\t\t\t\tReplies:
        1\t\t\t\t\t\t</p>\n\t\t\t\t\t\t<p>Rating: 5 stars</p>\n<p class=\"wp-block-paragraph\">I
        really enjoy using it; it makes my job much easier in every way. However,
        I would like more features for promotions\u2014such as &#8220;Buy X, Pay for
        Y&#8221; or an &#8220;x% discount on the second item.&#8221;</p>\n\t\t\t\t\t\t]]>\n\t\t\t\t\t</description>\n\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t</item>\n\n\t\t\t\t\n\t\t\t\t<item>\n\t\t\t\t\t<guid>https://wordpress.org/support/topic/everything-is-hard/</guid>\n\t\t\t\t\t<title>Everything
        is hard (1 star)</title>\n\t\t\t\t\t<link>https://wordpress.org/support/topic/everything-is-hard/</link>\n\t\t\t\t\t<pubDate>Wed,
        09 Sep 2026 16:52:17 +0000</pubDate>\n\t\t\t\t\t<dc:creator>redacted</dc:creator>\n\n\t\t\t\t\t\n\t\t\t\t\t<description>\n\t\t\t\t\t\t<![CDATA[\n\t\t\t\t\t\t<p>\n\t\t\t\t\t\t\tReplies:
        2\t\t\t\t\t\t</p>\n\t\t\t\t\t\t<p>Rating: 1 star</p>\n<p class=\"wp-block-paragraph\">It
        works&#8230; But I dread having to add or change anything. Simple bulk editing
        like changing tags of more than 5 products leads to gateway timeout, with
        some being changed and some not. Editing them one-by-one takes about as much
        time as waiting for the timeout. Setting up shipping categories-zones-costs
        is a confusing and convoluted nightmare of multiple screens, tabs, and settings.
        Misleading warning popups like &#8220;all of these items will be deleted&#8221;
        instead of &#8220;clicking OK will delete this category name&#8221;. And too
        much of what seems like basic functionality requires paid third-party plugins.
        It&#8217;s always like that, these examples are just from the last two hours
        of struggle.</p>\n\t\t\t\t\t\t]]>\n\t\t\t\t\t</description>\n\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t</item>\n\n\t\t\t\t\n\t\t\t\t<item>\n\t\t\t\t\t<guid>https://wordpress.org/support/topic/its-good-281/</guid>\n\t\t\t\t\t<title>It&#8217;s
        good (5 stars)</title>\n\t\t\t\t\t<link>https://wordpress.org/support/topic/its-good-281/</link>\n\t\t\t\t\t<pubDate>Wed,
        09 Sep 2026 16:31:29 +0000</pubDate>\n\t\t\t\t\t<dc:creator>redacted</dc:creator>\n\n\t\t\t\t\t\n\t\t\t\t\t<description>\n\t\t\t\t\t\t<![CDATA[\n\t\t\t\t\t\t<p>\n\t\t\t\t\t\t\tReplies:
        1\t\t\t\t\t\t</p>\n\t\t\t\t\t\t<p>Rating: 5 stars</p>\n<p class=\"wp-block-paragraph\">It&#8217;s
        good and so much flexible&#8230;</p>\n\n\n\n<p class=\"wp-block-paragraph\">thanks</p>\n\t\t\t\t\t\t]]>\n\t\t\t\t\t</description>\n\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t</item>\n\n\t\t\t\t\n\t\t\t\t<item>\n\t\t\t\t\t<guid>https://wordpress.org/support/topic/every-release-is-a-new-surprise-on-how-it-breaks-my-website/</guid>\n\t\t\t\t\t<title>Every
        release is a new surprise on how it breaks my website. (2 stars)</title>\n\t\t\t\t\t<link>https://wordpress.org/support/topic/every-release-is-a-new-surprise-on-how-it-breaks-my-website/</link>\n\t\t\t\t\t<pubDate>Thu,
        03 Sep 2026 17:58:29 +0000</pubDate>\n\t\t\t\t\t<dc:creator>redacted</dc:creator>\n\n\t\t\t\t\t\n\t\t\t\t\t<description>\n\t\t\t\t\t\t<![CDATA[\n\t\t\t\t\t\t<p>\n\t\t\t\t\t\t\tReplies:
        6\t\t\t\t\t\t</p>\n\t\t\t\t\t\t<p>Rating: 2 stars</p>\n<p class=\"wp-block-paragraph\">WooCommerce
        update 11.1.0 \u2013 Endless scroll of fixes \u2013 because of the endless
        bugs.<br />They have NO concept of Quality!</p>\n\n\n\n<p class=\"wp-block-paragraph\">Woo
        was once pretty good. Now, it is endless bugs and abysmal quality.</p>\n\n\n\n<p
        class=\"wp-block-paragraph\">4 Stars for function (when it is working).<br
        />1 Star for quality releases.<br />1 Star for Support.</p>\n\n\n\n<p class=\"wp-block-paragraph\">The
        worst experience I have ever had with any WordPress related support. 5 weeks
        of misdirection! So bad, they even sent me an apology.</p>\n\n\n\n<p class=\"wp-block-paragraph\">It&#8217;s
        bad that they rely so heavily on AI for support &#8211; worse that humans
        don&#8217;t even look to oversee it &#8211; and disastrous that they don&#8217;t
        give the AI current version information. That is totally bone-headed!</p>\n\n\n\n<p
        class=\"wp-block-paragraph\">I should not be surprised because the software
        too is released without thinking. Just look at the endless scroll of fixes
        with release 11.1.0   What will break on my site this time?</p>\n\t\t\t\t\t\t]]>\n\t\t\t\t\t</description>\n\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t</item>\n\n\t\t\t\t\n\t\t\t\t<item>\n\t\t\t\t\t<guid>https://wordpress.org/support/topic/great-support-6722/</guid>\n\t\t\t\t\t<title>Great
