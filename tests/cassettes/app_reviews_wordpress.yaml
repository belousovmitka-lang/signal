        de Pedidos</title>\n\t\t\t\t\t<link>https://wordpress.org/support/topic/falta-de-pedidos/</link>\n\t\t\t\t\t<pubDate>Thu,
        01 Oct 2026 08:33:37 +0000</pubDate>\n\t\t\t\t\t<dc:creator>redacted</dc:creator>\n\n\t\t\t\t\t\n\t\t\t\t\t<description>\n\t\t\t\t\t\t<![CDATA[\n\t\t\t\t\t\t<p>\n\t\t\t\t\t\t\tReplies:
        2\t\t\t\t\t\t</p>\n\t\t\t\t\t\t<p class=\"wp-block-paragraph\">La tienda estaba
        recibiendo pedidos de forma estable y desde hace 5 d\xEDas no entra ninguno.
        Hemos hecho pruebas y no falla ninguna pasarela de pago. Tampoco hay descenso
        en el tr\xE1fico, en analytics todo est\xE1 correcto \xBFqu\xE9 podr\xEDa
        estar fallando?</p>\n\t\t\t\t\t\t]]>\n\t\t\t\t\t</description>\n\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t</item>\n\n\t\t\t\t\n\t\t\t\t<item>\n\t\t\t\t\t<guid>https://wordpress.org/support/topic/calif-sales-tax-on-digital-downloads-for-in-state-sales/</guid>\n\t\t\t\t\t<title>Calif
        sales tax on digital downloads for in-state sales</title>\n\t\t\t\t\t<link>https://wordpress.org/support/topic/calif-sales-tax-on-digital-downloads-for-in-state-sales/</link>\n\t\t\t\t\t<pubDate>Thu,
        01 Oct 2026 02:49:28 +0000</pubDate>\n\t\t\t\t\t<dc:creator>redacted</dc:creator>\n\n\t\t\t\t\t\n\t\t\t\t\t<description>\n\t\t\t\t\t\t<![CDATA[\n\t\t\t\t\t\t<p>\n\t\t\t\t\t\t\tReplies:
        1\t\t\t\t\t\t</p>\n\t\t\t\t\t\t<p class=\"wp-block-paragraph\">hello &#8211;
        the more i use WooCommerce, the more i just absolutely LOVE IT.  </p>\n\n\n\n<p
        class=\"wp-block-paragraph\">Apparently Calif is going to start charging a
        state sales tax on digital downloads if purchased in the same state (California).</p>\n\n\n\n<p
        class=\"wp-block-paragraph\">Has anybody else considered this?   Is this a
        simple matter of changing a tax code or similar?</p>\n\t\t\t\t\t\t]]>\n\t\t\t\t\t</description>\n\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t</item>\n\n\t\t\t\t\n\t\t\t\t<item>\n\t\t\t\t\t<guid>https://wordpress.org/support/topic/fetch_patterns-fails-via-wp-cron-on-woocommerce-11-1-2-issue-68409/</guid>\n\t\t\t\t\t<title>fetch_patterns
        fails via WP Cron on WooCommerce 11.1.2 \u2014 issue #68409</title>\n\t\t\t\t\t<link>https://wordpress.org/support/topic/fetch_patterns-fails-via-wp-cron-on-woocommerce-11-1-2-issue-68409/</link>\n\t\t\t\t\t<pubDate>Wed,
        30 Sep 2026 19:27:23 +0000</pubDate>\n\t\t\t\t\t<dc:creator>redacted</dc:creator>\n\n\t\t\t\t\t\n\t\t\t\t\t<description>\n\t\t\t\t\t\t<![CDATA[\n\t\t\t\t\t\t<p>\n\t\t\t\t\t\t\tReplies:
        1\t\t\t\t\t\t</p>\n\t\t\t\t\t\t<p class=\"wp-block-paragraph\">My live site,
        <a href=\"https://rudysribs.com\" rel=\"nofollow ugc\">https://rudysribs.com</a>,
        is hosted on Kinsta and runs WooCommerce 11.1.2.</p>\n\n\n\n<p class=\"wp-block-paragraph\">The
        recurring fetch_patterns action continues to fail via WP Cron. The latest
        example is action ID 72889, which failed on September 30, 2026 at 18:53:09
        UTC.</p>\n\n\n\n<p class=\"wp-block-paragraph\">Exact error:<br />\u201CScheduled
        action for fetch_patterns will not be executed as no callbacks are registered.\u201D</p>\n\n\n\n<p
        class=\"wp-block-paragraph\">This matches confirmed WooCommerce issue #68409:<br
        /><a href=\"https://github.com/woocommerce/woocommerce/issues/68409\" rel=\"nofollow
        ugc\">https://github.com/woocommerce/woocommerce/issues/68409</a></p>\n\n\n\n<p
        class=\"wp-block-paragraph\">Is there a supported workaround or a release
        planned to fix this on 11.1.2? I have preserved the failed records and have
        not rerun, cancelled, or deleted the actions.</p>\n\t\t\t\t\t\t]]>\n\t\t\t\t\t</description>\n\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t</item>\n\n\t\t\t\t\n\t\t\t\t<item>\n\t\t\t\t\t<guid>https://wordpress.org/support/topic/woocommerce-payments-card-errors/</guid>\n\t\t\t\t\t<title>Woocommerce
