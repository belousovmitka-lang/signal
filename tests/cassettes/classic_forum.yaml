        S7-1212C/TIA Portal: On HMI, #### appears instead of real values...</title>\n
        \     <pubDate>Fri, 09 Oct 2026 15:46:24 +0000</pubDate>\n      <link>https://www.plctalk.net/forums/threads/siemens-s7-1212c-tia-portal-on-hmi-appears-instead-of-real-values.150120/</link>\n
        \     <guid isPermaLink=\"false\">150120</guid>\n      <author>redacted</author>\n
        \     <category domain=\"https://www.plctalk.net/forums/forums/plc-questions-and-answers.2/\"><![CDATA[PLC
        Questions and Answers]]></category>\n      <dc:creator>redacted</dc:creator>\n
        \     <content:encoded><![CDATA[<div class=\"bbWrapper\">Hi All<br />\n<br
        />\nIt&#039;s been a while since I posted on here - mainly because the PLC
        that I delivered to a customer site a few years ago has been behaving itself
        (no news is good news, I guess...). Basically, the PLC system uses laser sensors
        to measure the perimeter of a machined part, it then compares it to &quot;the
        ideal artefact&quot; and decides whether the machined part is within tolerance
        and acceptable for installation.<br />\n<br />\nHowever, I got an email from
        the customer the other day. He told me that my PLC...<br />\n<br />\n<a href=\"https://www.plctalk.net/forums/threads/siemens-s7-1212c-tia-portal-on-hmi-appears-instead-of-real-values.150120/\"
        class=\"link link--internal\">Read more</a></div>]]></content:encoded>\n      <slash:comments>13</slash:comments>\n
        \   </item>\n    <item>\n      <title>Fluke meter to Analog Input channel</title>\n
        \     <pubDate>Fri, 09 Oct 2026 15:20:47 +0000</pubDate>\n      <link>https://www.plctalk.net/forums/threads/fluke-meter-to-analog-input-channel.146070/</link>\n
        \     <guid isPermaLink=\"false\">146070</guid>\n      <author>redacted</author>\n
        \     <category domain=\"https://www.plctalk.net/forums/forums/plc-questions-and-answers.2/\"><![CDATA[PLC
        Questions and Answers]]></category>\n      <dc:creator>redacted</dc:creator>\n
        \     <content:encoded><![CDATA[<div class=\"bbWrapper\">Hi, I have some trouble
        on injecting 4-20mA to one of the ET200SP Analog Input module 6es7134-6gf00-0aa1
        with base unit 6es7193-6bp00-0ba0. When I tried to inject current to AI Channel,
        I am not able to receive any reading in TIA portal. I have configured the
        Channel to 2 Wire Mode. My question is for the pin 9 (UV), is it necessary
        to connect 24VDC to it instead of 0VDC? Your feedback is greatly appreciated.
