        \     <slash:comments>36</slash:comments>\n    </item>\n    <item>\n      <title>Looking
        at Converting Air Handlers to PLC System</title>\n      <pubDate>Fri, 09 Oct
        2026 09:36:25 +0000</pubDate>\n      <link>https://www.plctalk.net/forums/threads/looking-at-converting-air-handlers-to-plc-system.150106/</link>\n
        \     <guid isPermaLink=\"false\">150106</guid>\n      <author>redacted</author>\n
        \     <category domain=\"https://www.plctalk.net/forums/forums/plc-questions-and-answers.2/\"><![CDATA[PLC
        Questions and Answers]]></category>\n      <dc:creator>redacted</dc:creator>\n
        \     <content:encoded><![CDATA[<div class=\"bbWrapper\">Hi All<br />\n<br
        />\nI make small air handlers for lab use. The air handlers are for creating
        and maintaining certain air pressure and air flow to what its hooked up to.
        \ I am looking at converting them from our PCB and SBC system to a PLC setup.
        \ The previous setup is an AC/DC power supply supplying 24vdc to a control
        board that controls 4 64W dc fans via PWM signals. The control board also
        has inputs for air pressure sensors, air flow sensors, gas sensors, and temperature
        sensors.  The sensors we&#039;ve...<br />\n<br />\n<a href=\"https://www.plctalk.net/forums/threads/looking-at-converting-air-handlers-to-plc-system.150106/\"
        class=\"link link--internal\">Read more</a></div>]]></content:encoded>\n      <slash:comments>7</slash:comments>\n
        \   </item>\n    <item>\n      <title>Bosch Rexroth [VT-HMC-2-10/M-0-00/00]
        Two-Axis Hydraulic Press Project</title>\n      <pubDate>Fri, 09 Oct 2026
        08:01:15 +0000</pubDate>\n      <link>https://www.plctalk.net/forums/threads/bosch-rexroth-vt-hmc-2-10-m-0-00-00-two-axis-hydraulic-press-project.150118/</link>\n
        \     <guid isPermaLink=\"false\">150118</guid>\n      <author>redacted</author>\n
        \     <category domain=\"https://www.plctalk.net/forums/forums/plc-questions-and-answers.2/\"><![CDATA[PLC
        Questions and Answers]]></category>\n      <dc:creator>redacted</dc:creator>\n
        \     <content:encoded><![CDATA[<div class=\"bbWrapper\">Hello,<br />\n<br
        />\nI have a new project involving a hydraulic press with two-axis control.
        The system consists of an S7-1200 G2 PLC, a Bosch Rexroth VT-HMC-2-10/M-0-00/00,
        and an SD card (synchronization card) with IndraWorks DS software.<br />\n<br
        />\nThis is my first project working with the VT-HMC and IndraWorks DS.<br
        />\n<br />\nWe have two hydraulic axes, and I would like to know how they
        should be configured and synchronized with each other.<br />\ninside the Tia
        portal and Indraworks DS<br />\n<br />\nCould you please support me with this...<br
        />\n<br />\n<a href=\"https://www.plctalk.net/forums/threads/bosch-rexroth-vt-hmc-2-10-m-0-00-00-two-axis-hydraulic-press-project.150118/\"
        class=\"link link--internal\">Read more</a></div>]]></content:encoded>\n      <slash:comments>0</slash:comments>\n
        \   </item>\n    <item>\n      <title>How to control a web accumulator at
        a constant level on an S7-1500 winder?</title>\n      <pubDate>Fri, 09 Oct
        2026 03:15:23 +0000</pubDate>\n      <link>https://www.plctalk.net/forums/threads/how-to-control-a-web-accumulator-at-a-constant-level-on-an-s7-1500-winder.150098/</link>\n
        \     <guid isPermaLink=\"false\">150098</guid>\n      <author>redacted</author>\n
        \     <category domain=\"https://www.plctalk.net/forums/forums/plc-questions-and-answers.2/\"><![CDATA[PLC
        Questions and Answers]]></category>\n      <dc:creator>redacted</dc:creator>\n
        \     <content:encoded><![CDATA[<div class=\"bbWrapper\">Hello everyone,<br
        />\n<br />\nI am working on a <b>winder machine for extruded plastic film</b>
        using an <b>S7-1500 PLC and SINAMICS S120</b>.<br />\nI have a web accumulator
        between the extrusion line and the winder. The accumulator position is measured
        as a percentage.<br />\n<br />\nMy current control strategy is:<br />\n<ul>\n<li
        data-xf-list-type=\"ul\">Normal accumulator setpoint: <b>12%</b></li>\n<li
        data-xf-list-type=\"ul\">If the accumulator rises above <b>20%</b>, I increase
        the winder speed to <b>1.3 \xD7 the normal speed</b> until the accumulator
        drops back to around 12%.</li>\n<li data-xf-list-type=\"ul\">If the...</li>\n</ul><br
        />\n<a href=\"https://www.plctalk.net/forums/threads/how-to-control-a-web-accumulator-at-a-constant-level-on-an-s7-1500-winder.150098/\"
        class=\"link link--internal\">Read more</a></div>]]></content:encoded>\n      <slash:comments>17</slash:comments>\n
        \   </item>\n    <item>\n      <title>PanelView Plus 7 - Info Needed on ActiveX
        Controls</title>\n      <pubDate>Fri, 09 Oct 2026 00:29:11 +0000</pubDate>\n
        \     <link>https://www.plctalk.net/forums/threads/panelview-plus-7-info-needed-on-activex-controls.150113/</link>\n
        \     <guid isPermaLink=\"false\">150113</guid>\n      <author>redacted</author>\n
        \     <category domain=\"https://www.plctalk.net/forums/forums/plc-questions-and-answers.2/\"><![CDATA[PLC
        Questions and Answers]]></category>\n      <dc:creator>redacted</dc:creator>\n
        \     <content:encoded><![CDATA[<div class=\"bbWrapper\">Hi All,<br />\nI&#039;m
        new to working with PanelView HMI&#039;s.  Every other company I&#039;ve worked
        with, we simply ripped these things out and replaced them with C-More.  I
        don&#039;t have that option now, so I am forced to get more involved with
        them.  I came across one that needs to be replaced, and it seems to be more
        complicated than the usual Firmware update, network config and .MER load.
        \ This one has some sort of ActiveX controls along with it.  The integrator
        has everything running off of an SD card...<br />\n<br />\n<a href=\"https://www.plctalk.net/forums/threads/panelview-plus-7-info-needed-on-activex-controls.150113/\"
        class=\"link link--internal\">Read more</a></div>]]></content:encoded>\n      <slash:comments>7</slash:comments>\n
        \   </item>\n    <item>\n      <title>Rexroth Visual Motion 11</title>\n      <pubDate>Thu,
        08 Oct 2026 21:41:09 +0000</pubDate>\n      <link>https://www.plctalk.net/forums/threads/rexroth-visual-motion-11.147558/</link>\n
        \     <guid isPermaLink=\"false\">147558</guid>\n      <author>redacted</author>\n
        \     <category domain=\"https://www.plctalk.net/forums/forums/plc-questions-and-answers.2/\"><![CDATA[PLC
        Questions and Answers]]></category>\n      <dc:creator>redacted</dc:creator>\n
        \     <content:encoded><![CDATA[<div class=\"bbWrapper\">Anyone have experience
        locating or purchasing the Rexroth Visual Motion software?  One of our OEMs
        used their PPC controllers, we have at least a dozen of them.<br />\n<br />\nHad
