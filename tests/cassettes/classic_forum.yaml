        from this power supply fault alarm output. Would I be able to just run a wire
        from the input 1 terminal 19 of the power monitor to the output alarm terminal
        16 on the power supply? It shows...<br />\n<br />\n<a href=\"https://www.plctalk.net/forums/threads/need-input-on-inputs.150110/\"
        class=\"link link--internal\">Read more</a></div>]]></content:encoded>\n      <slash:comments>10</slash:comments>\n
