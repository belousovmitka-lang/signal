        \     <author>redacted</author>\n      <dc:creator>redacted</dc:creator>\n
        \     <content:encoded><![CDATA[So  I have a 2001 Freightliner FL 70 service
        truck. Serial # 1FVABSAK52HJ65268. It has a Cat 3126. Serial # 9SZ06948. It
        will turn over but will not start. Our laptop will not communicate with the
        ECU. With the key on, the message on the LED screen on the dash reads:<br
        />\n<br />\n<br />\nNo Engine<br />\n<br />\nSID 254<br />\n<br />\nFail 07<br
        />\n<br />\n<br />\nWhen I turn the key to start, the message reads:<br />\n<br
        />\n<br />\nNo engine<br />\n<br />\nICU 140<br />\n<br />\nABS 136<br />\n<br
        />\n<br />\nI have changed fuel filters, HEUI pump, and swapped out ECUs with
        a like known running service truck. I have...<br />\n<br />\n<a href=\"https://www.thetruckersreport.com/truckingindustryforum/threads/2001-freightliner-fl-70-service-truck-wont-start.2437073/\"
        class=\"internalLink\">2001 Freightliner FL 70 Service truck wont start</a>]]></content:encoded>\n
