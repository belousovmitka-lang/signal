        \   <item>\n      <title>What if it Snows?</title>\n      <pubDate>Fri, 09
        Oct 2026 23:25:28 +0000</pubDate>\n      <link>https://www.thetruckersreport.com/truckingindustryforum/threads/what-if-it-snows.798509/</link>\n
        \     <guid>https://www.thetruckersreport.com/truckingindustryforum/threads/what-if-it-snows.798509/</guid>\n
        \     <author>redacted</author>\n      <dc:creator>redacted</dc:creator>\n
        \     <content:encoded><![CDATA[Well, I was going to take another day or two,
        but just like in The Godfather, &quot; They pulled me back in.&quot; With
        a high enough paying load going way, way, way up in the forested regions of
        Washington.<br />\nWhat if it snows? You gotta carry more chains than tires
        up there you know.<br />\n<br />\nIf this thread doesn&#039;t get as much
        exposure as IluvCATS Colorado thread, I&#039;m going to feel really bad.<br
        />\n<br />\nRemember when I had Blackie? But now I&#039;m old and decrepit.<br
        />\n<br />\n\n\n\t<a href=\"https://www.thetruckersreport.com/truckingindustryforum/attachments/216823/\"
        target=\"_blank\">View attachment 216823</a>]]></content:encoded>\n      <slash:comments>273603</slash:comments>\n
        \   </item>\n    <item>\n      <title>Anybody run?</title>\n      <pubDate>Fri,
        09 Oct 2026 23:19:51 +0000</pubDate>\n      <link>https://www.thetruckersreport.com/truckingindustryforum/threads/anybody-run.2481271/</link>\n
        \     <guid>https://www.thetruckersreport.com/truckingindustryforum/threads/anybody-run.2481271/</guid>\n
        \     <author>redacted</author>\n      <dc:creator>redacted</dc:creator>\n
        \     <content:encoded><![CDATA[Lookin around today for a challenging hike
        and found this. It has piqued my interest, but I&#039;m not a runner. I am
        a solid 3-4 MPH hiker, but I ain&#039;t pounded out 35 hours either. My biggest
        days are 24-27 miles depending on elevation gains.<br />\n<a href=\"https://www.haremountain100.com/\"
        target=\"_blank\" class=\"externalLink\" rel=\"nofollow\">Hare Mountain 100</a><br
        />\n<br />\nWhat&#039;s the chances an old fat dude can get in shape for this
        in a couple months?<br />\n<br />\nHere&#039;s my first mile since grade school.<br
        />\n<br />\n<br />\n\n\n\t<a href=\"https://www.thetruckersreport.com/truckingindustryforum/attachments/474352/\"
        target=\"_blank\">View attachment 474352</a>\n\t\n \n\n\t<a href=\"https://www.thetruckersreport.com/truckingindustryforum/attachments/474353/\"
        target=\"_blank\">View attachment 474353</a>]]></content:encoded>\n      <slash:comments>243</slash:comments>\n
        \   </item>\n    <item>\n      <title>FCC--Fremont Contract Carriers</title>\n
        \     <pubDate>Fri, 09 Oct 2026 23:18:02 +0000</pubDate>\n      <link>https://www.thetruckersreport.com/truckingindustryforum/threads/fcc-fremont-contract-carriers.462104/</link>\n
        \     <guid>https://www.thetruckersreport.com/truckingindustryforum/threads/fcc-fremont-contract-carriers.462104/</guid>\n
        \     <author>redacted</author>\n      <dc:creator>redacted</dc:creator>\n
        \     <content:encoded><![CDATA[FCC is based out of Fremont, Nebraska. The
        have a dry van and a flatbed division, with  three different divisions,  Mid-West
        regional, South West regional, and the long haul fleet. Living in SC I am
        only eligible for the long haul division. They have approximately 360 tractors,
        almost 2/3 of those are either O/O&#039;s or L/P drivers,  with the rest being
        straight company drivers. I started here 3 months ago, and wanted to wait
        at least 90 days before starting this thread to get a decent feel for...<br
        />\n<br />\n<a href=\"https://www.thetruckersreport.com/truckingindustryforum/threads/fcc-fremont-contract-carriers.462104/\"
        class=\"internalLink\">FCC--Fremont Contract Carriers</a>]]></content:encoded>\n
