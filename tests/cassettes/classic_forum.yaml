        \     <slash:comments>29355</slash:comments>\n    </item>\n    <item>\n      <title>What
        should I do, stay or leave for Old Dominion?</title>\n      <pubDate>Fri,
        09 Oct 2026 22:46:30 +0000</pubDate>\n      <link>https://www.thetruckersreport.com/truckingindustryforum/threads/what-should-i-do-stay-or-leave-for-old-dominion.2545117/</link>\n
        \     <guid>https://www.thetruckersreport.com/truckingindustryforum/threads/what-should-i-do-stay-or-leave-for-old-dominion.2545117/</guid>\n
        \     <author>redacted</author>\n      <dc:creator>redacted</dc:creator>\n
        \     <content:encoded><![CDATA[Would you stay where you\u2019re at and keep
        building CDL experience or try to get your foot in the door at Old Dominion?<br
        />\n<br />\nI\u2019m a newer CDL driver and currently doing beverage delivery.
        I\u2019m making $28/hr right now and go to $30/hr after 6 months. Usually
        work less than 60 hours a week, good benefits and PTO, and it\u2019s pretty
        stable. The job is definitely physical but I\u2019m getting driving experience.<br
        />\n<br />\nI have a friend who is a dock supervisor at Old Dominion, so I
        have an opportunity to get in there...<br />\n<br />\n<a href=\"https://www.thetruckersreport.com/truckingindustryforum/threads/what-should-i-do-stay-or-leave-for-old-dominion.2545117/\"
        class=\"internalLink\">What should I do, stay or leave for Old Dominion?</a>]]></content:encoded>\n
        \     <slash:comments>30</slash:comments>\n    </item>\n    <item>\n      <title>Indian
        River</title>\n      <pubDate>Fri, 09 Oct 2026 22:36:20 +0000</pubDate>\n
        \     <link>https://www.thetruckersreport.com/truckingindustryforum/threads/indian-river.327671/</link>\n
        \     <guid>https://www.thetruckersreport.com/truckingindustryforum/threads/indian-river.327671/</guid>\n
        \     <author>redacted</author>\n      <dc:creator>redacted</dc:creator>\n
        \     <content:encoded><![CDATA[I drove for IRT in 2014 and was pretty happy
        there. I always averaged 3000 miles per week and got along with everyone in
        the offices. I ended up leaving and have been at the same local job ever since
        (last 2 years). Here lately I&#039;ve been kicking it around about going back
        OTR and I always told myself if I ever did, IRT is who I would go back to.
        Just wanted to get some feedback from anyone on here who is currently working
        there or has in the last 2 years since I&#039;ve left. What kind of miles...<br
        />\n<br />\n<a href=\"https://www.thetruckersreport.com/truckingindustryforum/threads/indian-river.327671/\"
        class=\"internalLink\">Indian River</a>]]></content:encoded>\n      <slash:comments>4314</slash:comments>\n
