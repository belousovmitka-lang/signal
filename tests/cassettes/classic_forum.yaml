        \     <guid>https://www.thetruckersreport.com/truckingindustryforum/threads/las-vegas-strip-showgirls-charged-in-battery-over-20-tip-dispute.2546538/</guid>\n
        \     <author>redacted</author>\n      <dc:creator>redacted</dc:creator>\n
        \     <content:encoded><![CDATA[<a href=\"https://www.foxnews.com/us/las-vegas-showgirl-allegedly-beats-tourist-high-heel-20-photo-tip-sparks-brawl\"
