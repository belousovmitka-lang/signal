        \   </item>\n    <item>\n      <title>Want to avoid getting burned by a lease-purchase
        agreement?</title>\n      <pubDate>Fri, 09 Oct 2026 22:54:40 +0000</pubDate>\n
        \     <link>https://www.thetruckersreport.com/truckingindustryforum/threads/want-to-avoid-getting-burned-by-a-lease-purchase-agreement.97250/</link>\n
        \     <guid>https://www.thetruckersreport.com/truckingindustryforum/threads/want-to-avoid-getting-burned-by-a-lease-purchase-agreement.97250/</guid>\n
        \     <author>redacted</author>\n      <dc:creator>redacted</dc:creator>\n
        \     <content:encoded><![CDATA[<span style=\"font-family: 'Georgia'\"><span
        style=\"font-size: 22px\"><span style=\"font-size: 18px\">Want to avoid getting
        burned by a lease-purchase agreement?</span><br />\n<span style=\"font-size:
        15px\"><br />\n</span></span></span><span style=\"font-size: 15px\">It&#039;s
        simple. Just don&#039;t sign on.</span><br />\n\n\n\n<div class=\"bbCodeBlock
        bbCodeQuote\">\n\t<aside>\n\t\t\n\t\t<blockquote class=\"quoteContainer\"><div
        class=\"quote\">Recently, OOIDA&#039;s Business Assistance Department has
        noticed an   alarming increase in people signing on to lease-purchase programs
        with  large  motor carriers. Our experience in reviewing these contracts and
        \ receiving  numerous complaints over the years tells us these programs  almost
        never benefit  anyone...</div><div class=\"quoteExpand\">Click to expand...</div></blockquote>\n\t</aside>\n</div><a
        href=\"https://www.thetruckersreport.com/truckingindustryforum/threads/want-to-avoid-getting-burned-by-a-lease-purchase-agreement.97250/\"
        class=\"internalLink\">Want to avoid getting burned by a lease-purchase agreement?</a>]]></content:encoded>\n
        \     <slash:comments>742</slash:comments>\n    </item>\n    <item>\n      <title>My
        move to Bruce Oakley (Oakley trucking inc)</title>\n      <pubDate>Fri, 09
        Oct 2026 22:52:36 +0000</pubDate>\n      <link>https://www.thetruckersreport.com/truckingindustryforum/threads/my-move-to-bruce-oakley-oakley-trucking-inc.2538481/</link>\n
        \     <guid>https://www.thetruckersreport.com/truckingindustryforum/threads/my-move-to-bruce-oakley-oakley-trucking-inc.2538481/</guid>\n
        \     <author>redacted</author>\n      <dc:creator>redacted</dc:creator>\n
        \     <content:encoded><![CDATA[After 7 years leased to FCC I made the decision
        about a month ago to make the move to Oakley to pull an end dump. They have
        three divisions Hopper bottom, end dump, and pneumatic tanks. This is a 100%
        owner operator company.<br />\n<br />\nI showed up in N. Little Rock, Arkansas
        Sunday, they provided a nice hotel for four days (Wyndham) breakfast buffet
        paid for and lunch provided. You fend for yourself for dinner. Orientation
        is not paid. <br />\n<br />\nThe orientation is very thorough, three days
        in the classroom,...<br />\n<br />\n<a href=\"https://www.thetruckersreport.com/truckingindustryforum/threads/my-move-to-bruce-oakley-oakley-trucking-inc.2538481/\"
        class=\"internalLink\">My move to Bruce Oakley (Oakley trucking inc)</a>]]></content:encoded>\n
