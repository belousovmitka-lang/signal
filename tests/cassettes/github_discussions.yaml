        support as streaming provider\", \"upvoteCount\": 1, \"answerChosenAt\": null,
        \"author\": {\"login\": \"redacted\"}, \"category\": {\"name\": \"Ideas\"},
        \"repository\": {\"nameWithOwner\": \"JRpersonal/streborn\"}, \"comments\":
        {\"totalCount\": 0}}, {\"title\": \"Feature request: paginated, free-form
        reports\", \"url\": \"https://github.com/apache/superset/discussions/45095\",
        \"createdAt\": \"2026-10-08T16:25:28Z\", \"bodyText\": \"My users have asked
        for this. They want to replace Microsoft SQL Server Reporting Service (SSRS),
        where they can lay out reports. I've seen other community members ask for
        this too, e.g., in Slack just now, \\\"Paginated Reports which is easy to
        Print with multiple pages like Bank statements or contracts etc\\\"\\nA dashboard
        has rigid layout meant for charts. This would be an open canvas where you
        can put in a chart, but also a number in the middle of a sentence that would
        be the result of a SQL query. The formatting choices would be richer. And
        the support for multi-page reports would be nicer. Screen captures of dashboards
        aren't built for multi-page reporting or printing and it shows.\\nI don't
