        \"createdAt\": \"2026-10-10T14:35:50Z\", \"bodyText\": \"Add a built-in Environment
        Variables section to the panel, similar to Vercel, allowing users to manage
        environment variables directly from the dashboard without manually creating
        or editing .env files.\\nKey features:\\n\\nAdd, edit, and delete environment
