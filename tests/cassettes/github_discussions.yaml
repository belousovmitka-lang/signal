        {\"login\": \"redacted\"}, \"category\": {\"name\": \"Ideas\"}, \"repository\":
        {\"nameWithOwner\": \"ulsklyc/yuvomi\"}, \"comments\": {\"totalCount\": 1}},
        {\"title\": \"[Feature Request] Thing dependant tasks\", \"url\": \"https://github.com/donetick/donetick/discussions/877\",
        \"createdAt\": \"2026-10-09T16:38:31Z\", \"bodyText\": \"Hello! Maybe this
        is already a planned Feature (or I'm too dumb to realize it already exists),
        but it would be really cool to have tasks that are dependent on Things in
        addition to schedules. So say I have to mow the lawn. In Things I could have
        a Boolean like \\\"IsWinter\\\" and in the task configuration I could have
        a scheduled weekly task that only occurs assuming that the boolean \\\"IsWinter\\\"
        is false. It would offer a lot more depth + the addition that I saw is \\\"in
        progress\\\" of allowing tasks to modify Thing values you could have a lot
        more automated control.\\n(This is a side note but if the HA integration had
        a way to directly modify those Thing values as well you'd be able to configure
        tasks based on any number of smart devices or integrations that are already
        available data points within HA)\", \"upvoteCount\": 1, \"answerChosenAt\":
        null, \"author\": {\"login\": \"redacted\"}, \"category\": {\"name\": \"Ideas\"},
        \"repository\": {\"nameWithOwner\": \"donetick/donetick\"}, \"comments\":
        {\"totalCount\": 0}}, {\"title\": \"Feedback and Feature Requests!\", \"url\":
        \"https://github.com/blueabelwilson/Hestia-1.0/discussions/1\", \"createdAt\":
        \"2026-10-09T00:08:42Z\", \"bodyText\": \"How easy was setup on a scale of
        1\u20135?\\nDid you encounter any bugs or missing dependencies?\\nWhat feature
