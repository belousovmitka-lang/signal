        null, \"author\": {\"login\": \"redacted\"}, \"category\": {\"name\": \"Announcements\"},
        \"repository\": {\"nameWithOwner\": \"blueabelwilson/Hestia-1.0\"}, \"comments\":
        {\"totalCount\": 0}}, {\"title\": \"Feature Request: Delete single Episode\",
        \"url\": \"https://github.com/edde746/plezy/discussions/2615\", \"createdAt\":
        \"2026-10-09T07:26:55Z\", \"bodyText\": \"Just purchase this app. While I'm
        very impressed with all it's options and capabilities (coming from a win 11
        Plex Server/ Nvidia Shield pro Plex viewer environment) , it has one substantial
        design flaw that makes it too annoying to use - There appears to be no way
        to delete a single episode after watching it.  I can delete an entire series
        ( which I learned the hard way) but not a single episode.\\nThis has always
        been possible in plex viewer, but I'm not able to with Plezy. Is there a reason
        this core and crucial capability is not supported? Its simply way too tedious
        to watch a single episode in Plezy, exit that app , start up plex  (or any
        other app) just to delete the file just watched, exit that app, run Plezy
        again and select the next episode, rinse and repeat.\\nThere needs to be a
        common sense delete option for a selected episode.\", \"upvoteCount\": 1,
        \"answerChosenAt\": null, \"author\": {\"login\": \"redacted\"}, \"category\":
        {\"name\": \"General\"}, \"repository\": {\"nameWithOwner\": \"edde746/plezy\"},
        \"comments\": {\"totalCount\": 0}}, {\"title\": \"Feature Request : Replace
