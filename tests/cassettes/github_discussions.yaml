        \"createdAt\": \"2026-10-07T13:11:38Z\", \"bodyText\": \"Can we have option
        to set defaults for TASK creation so this way parent can quickly create task
        with defined default settings.\\nSettings that can be useful:\\n\\nlock editing\\npoints
