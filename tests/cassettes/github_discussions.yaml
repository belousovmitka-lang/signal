        {\"totalCount\": 3}}, {\"title\": \"Feature Request - service tags\", \"url\":
        \"https://github.com/DSheirer/sdrtrunk/discussions/2481\", \"createdAt\":
        \"2026-10-07T20:38:01Z\", \"bodyText\": \"Feature request: Import and export
        RadioReference Service Tags\\nI use SDRTrunk to record local P25 calls and
        upload them through its Rdio Scanner integration to a browser-based playback
        application I\u2019m developing.\\nCould SDRTrunk import RadioReference Service
        Tags\u2014such as Law Dispatch, Law Tac, Fire Dispatch, and Fire-Tac\u2014alongside
