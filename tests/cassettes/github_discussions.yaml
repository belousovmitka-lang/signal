        {\"totalCount\": 1}}, {\"title\": \"Feature Request: CoverFlow\", \"url\":
        \"https://github.com/quodlibet/quodlibet/discussions/4942\", \"createdAt\":
        \"2026-10-08T09:36:31Z\", \"bodyText\": \"I\u2019d love the coverflow feature
        to be added like the version in iTunes 10.7. Would be a killer feature and
