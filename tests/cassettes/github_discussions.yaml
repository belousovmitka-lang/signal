        \"createdAt\": \"2026-10-07T23:39:28Z\", \"bodyText\": \"Drop the existing
        reverbs, specially the useless spring reverb and go for one, usable reverb.\\nI
        am coming from the Teensy platform so i don't know if this is doable but i
        suggest to try to add this one:\\nhttps://github.com/hexeguitar/t40fx/tree/main/Hx_PlateReverb\\nIf
        not possible, it is probably better to remove the existing (unusable) reverbs
        and use their CPU usage for something else.\", \"upvoteCount\": 5, \"answerChosenAt\":
        null, \"author\": {\"login\": \"redacted\"}, \"category\": {\"name\": \"Ideas\"},
        \"repository\": {\"nameWithOwner\": \"hugelton/Felucca\"}, \"comments\": {\"totalCount\":
        7}}, {\"title\": \"Feature request: unquantized recording\", \"url\": \"https://github.com/hugelton/Felucca/discussions/162\",
        \"createdAt\": \"2026-10-08T06:00:30Z\", \"bodyText\": \"Although it changes
        how things are stored, unquantized recording with reversible playback quantization
        is very desirable for a more \\\"human\\\" and natural performance. An implementation
        has been done by: https://github.com/keremimo/melodee/releases/tag/v0.12\",
        \"upvoteCount\": 3, \"answerChosenAt\": null, \"author\": {\"login\": \"redacted\"},
        \"category\": {\"name\": \"Ideas\"}, \"repository\": {\"nameWithOwner\": \"hugelton/Felucca\"},
        \"comments\": {\"totalCount\": 2}}, {\"title\": \"Feature Request: Environment
