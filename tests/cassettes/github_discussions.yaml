        this information is already available, could you point me toward how to access
        it?\", \"upvoteCount\": 1, \"answerChosenAt\": null, \"author\": {\"login\":
        \"redacted\"}, \"category\": {\"name\": \"Ideas\"}, \"repository\": {\"nameWithOwner\":
        \"DSheirer/sdrtrunk\"}, \"comments\": {\"totalCount\": 0}}, {\"title\": \"[Feature
