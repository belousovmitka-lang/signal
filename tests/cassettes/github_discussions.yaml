        1}}, {\"title\": \"Feature Request: Unsubscribe & Delete All\", \"url\": \"https://github.com/hyprlab/hylki/discussions/395\",
        \"createdAt\": \"2026-10-09T11:47:43Z\", \"bodyText\": \"As the title says,
