        {\"author\": {\"matchLevel\": \"none\", \"matchedWords\": [], \"value\": \"wvlia5\"},
        \"story_text\": {\"matchLevel\": \"none\", \"matchedWords\": [], \"value\":
        \"LLMs have an internal language that they translate English into before predicting
        the next token. Like 'king' is translated into a word of an internal language
        that corresponds to vector [monarch, man], which allows king-man+woman=queen.
        Spanish is similar for the case 'queen'=reina, -ina suffix means female, but
        becomes irregular for king=rey.<p>We have tried to create regular, consistent
        languages (loglan, lojban, ithkuil), and there seems to be one in the first
        layers of LLMs, derived from all text ever written. This internal language
        is currently expressed as vectors, but we could devise a lexicon to map them,
        and if we could learn it we could communicate more directly with machines,
        dispensing with some layers and getting rid of language ambiguities.<p>Makes
        sense? Is someone working on this?<p>It's like Arrival but with AI instead
        of aliens.\"}, \"title\": {\"matchLevel\": \"none\", \"matchedWords\": [],
        \"value\": \"Ask HN: Internal AI Language\"}}, \"_tags\": [\"story\", \"author_redacted\",
        \"story_50023533\", \"ask_hn\"], \"author\": \"redacted\", \"created_at\":
        \"2026-10-09T17:07:38Z\", \"created_at_i\": 1791565658, \"num_comments\":
        0, \"objectID\": \"50023533\", \"points\": 1, \"story_id\": 50023533, \"story_text\":
        \"LLMs have an internal language that they translate English into before predicting
        the next token. Like &#x27;king&#x27; is translated into a word of an internal
        language that corresponds to vector [monarch, man], which allows king-man+woman=queen.
        Spanish is similar for the case &#x27;queen&#x27;=reina, -ina suffix means
        female, but becomes irregular for king=rey.<p>We have tried to create regular,
        consistent languages (loglan, lojban, ithkuil), and there seems to be one
        in the first layers of LLMs, derived from all text ever written. This internal
        language is currently expressed as vectors, but we could devise a lexicon
        to map them, and if we could learn it we could communicate more directly with
        machines, dispensing with some layers and getting rid of language ambiguities.<p>Makes
        sense? Is someone working on this?<p>It&#x27;s like Arrival but with AI instead
        of aliens.\", \"title\": \"Ask HN: Internal AI Language\", \"updated_at\":
        \"2026-10-09T17:11:58Z\"}, {\"_highlightResult\": {\"author\": {\"matchLevel\":
        \"none\", \"matchedWords\": [], \"value\": \"ymarkov\"}, \"story_text\": {\"matchLevel\":
        \"none\", \"matchedWords\": [], \"value\": \"We ran an experiment for SF Tech
        Week trying to understand how SF businesses are ready for AI. Very soon, every
        personal assistant like Muse, Instinct, Dots is going to call local places
        for us, so we wanted to understand what happens.<p>Our AI called the businesses
        across different categories - vets, bars, cafes, dentists, hair salons etc.
        It was introducing itself as AI on every call and then asked a question which
        fits the business like \u201CAre you taking new patients\u201D for dental
        places. We called only during business hours.<p>What we found:\\n- Only 1
        out of 3 businesses kept talking after picking the phone\\n- Vets were 79%,
        dentists 61%, bars and dry cleaners - around 20%\\n- Most people did not argue,
        but silently hung up after listening to the intro\\n- 1 out 25 businesses
        already had AI reception answering the phone<p>Caveats - it is just one city
        and one week, so small differences between neighbourhoods could be a noise.<p>We
        would really love to hear how you are handling this if you are building AI
        voice agents calling places for people\"}, \"title\": {\"matchLevel\": \"none\",
        \"matchedWords\": [], \"value\": \"We gave an AI a phone and asked 1000 SF
        businesses a question\"}}, \"_tags\": [\"story\", \"author_redacted\", \"story_50022739\",
        \"ask_hn\"], \"author\": \"redacted\", \"children\": [50023052, 50022756,
        50023053], \"created_at\": \"2026-10-09T16:18:03Z\", \"created_at_i\": 1791562683,
        \"num_comments\": 2, \"objectID\": \"50022739\", \"points\": 2, \"story_id\":
        50022739, \"story_text\": \"We ran an experiment for SF Tech Week trying to
        understand how SF businesses are ready for AI. Very soon, every personal assistant
        like Muse, Instinct, Dots is going to call local places for us, so we wanted
        to understand what happens.<p>Our AI called the businesses across different
        categories - vets, bars, cafes, dentists, hair salons etc. It was introducing
        itself as AI on every call and then asked a question which fits the business
        like \u201CAre you taking new patients\u201D for dental places. We called
        only during business hours.<p>What we found:\\n- Only 1 out of 3 businesses
        kept talking after picking the phone\\n- Vets were 79%, dentists 61%, bars
        and dry cleaners - around 20%\\n- Most people did not argue, but silently
        hung up after listening to the intro\\n- 1 out 25 businesses already had AI
        reception answering the phone<p>Caveats - it is just one city and one week,
        so small differences between neighbourhoods could be a noise.<p>We would really
        love to hear how you are handling this if you are building AI voice agents
        calling places for people\", \"title\": \"We gave an AI a phone and asked
        1000 SF businesses a question\", \"updated_at\": \"2026-10-09T19:48:43Z\"},
        {\"_highlightResult\": {\"author\": {\"matchLevel\": \"none\", \"matchedWords\":
        [], \"value\": \"chrisjj\"}, \"story_text\": {\"matchLevel\": \"none\", \"matchedWords\":
        [], \"value\": \"Local pharmacy phoneline is answered by &quot;Caroline&quot;
        with convincing voice, mannerisms and even background typing noise. You only
        realise she's fake at the first stochastic parrotese.<p>My bank sends emailed
        query responses signed by e.g. Sarah. No disclaimer, e.g. &quot;AI can make
        mistakes&quot;. Again starts convincing but can degenerate into parrotese.
        If I politely ask bot/human?, I get &quot;human&quot;... but if I query nonsensical
        advice, I get a non-resolving answer classic of ChatGPT. The reverse centauar
        in all its ugly glory.\"}, \"title\": {\"matchLevel\": \"none\", \"matchedWords\":
        [], \"value\": \"Meatpupptry is far creepier than pure \\\"AI\\\" fakery\"}},
