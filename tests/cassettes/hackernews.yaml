        {\"matchLevel\": \"none\", \"matchedWords\": [], \"value\": \"nine_k\"}, \"comment_text\":
        {\"fullyHighlighted\": false, \"matchLevel\": \"full\", \"matchedWords\":
        [\"wish\", \"there\", \"was\"], \"value\": \"I frankly find the situation
        around UB puzzling. AFAICT the idea was born in the times of very anemic compilers
        which would translate things that don't make definite sense, or work unpredictably
        on certain architectures. But why is it still a thing now, 50 years later?<p>If
        a compiler can <i>detect</i> UB, I think the only reasonable way for it is
        to have the program terminate immediately, not release &quot;nasal demons&quot;.
        (And, of course, many bugs get smashed against the -Wall which should be the
        default.)<p>Of course, not all UB can be detected at compile time, like reading
        the padding bytes in a struct mentioned in the article. I <em>wish there was</em>
        a way to opt out of <i>all</i> UB, in an arbitrary but predictable way (an
        immediate crash would be fine), something like -fsanitize but for any UB at
        all that might happen at runtime. In quite some important code, I'd agree
        to tolerate the performance hit, it may be cheaper than dealing with the aftermath
        or an RCE exploited. I see that it's not entirely realistic though.\"}, \"story_title\":
