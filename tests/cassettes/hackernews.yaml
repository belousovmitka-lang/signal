        \"value\": \"In 2019 I posted Aim and Shoot here, a browser shooter where
        every enemy is a neural network evolved by a genetic algorithm between rounds:
        <a href=\\\"https://news.ycombinator.com/item?id=21353123\\\">https://news.ycombinator.com/item?id=21353123</a><p>The
        thread had a lot of good feedback that I never got around to. This year I
        gave Claude Code the thread and the repo and worked through it:<p>- &quot;Give
        the player full health every round&quot; (four of you asked): done.<p>- &quot;I
        <em>wish there was</em> a scoreboard, I wanted a screenshot of how far I got&quot;:
        the game-over screen now shows the round you reached and your best.<p>- &quot;The
        gun sound is jarring&quot;: quieter, and M mutes it.<p>- &quot;Enemies spawn
        on top of you and drag you around&quot;: bots now spawn at a safe distance,
        collisions are fixed, and there's a short grace period at the start of each
        round.<p>- &quot;The bots all aim at the top-left corner, so camp bottom-right&quot;:
        this was a bug. Each bot only saw part of the game state. They now see every
        player, and aim, mutation and elitism are fixed too.<p>- &quot;Kill the shooters
        first and the GA breeds pacifists&quot; (by generation 8 they were running
        into walls): the fitness rewarded bots for living long, so your kill order
        picked who reproduced. It now rewards hitting you.<p>The biggest change came
        from a problem nobody quite named: evolution reset every time you died, so
        the bots never got far. Now there's one shared population on the server, and
        every round anyone plays moves it forward. Your browser only reports raw stats
        per bot; the server checks them, scores and breeds. It's PHP + SQLite on a
        small VPS, with a local fallback if the server is down.<p>It's at generation
        1 right now. Whatever the bots are by tonight, you bred them.<p>Code: <a href=\\\"https://github.com/victorqribeiro/aimAndShoot\\\"
        rel=\\\"nofollow\\\">https://github.com/victorqribeiro/aimAndShoot</a>\"},
