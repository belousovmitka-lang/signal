        for certification is the \u201Cofficially\\nreleased\u201D date appearing
        in the opinion.\\n   All opinions are subject to modification and technical\\ncorrect\",
        \"type\": \"lead-opinion\"}], \"panel_ids\": [], \"panel_names\": [], \"posture\":
        \"\", \"procedural_history\": \"Action for, inter alia, the dissolution of
        a marriage, and for other relief, brought to the Superior Court in the judicial
        district of Hartford and tried to the court, Klau, J.; thereafter, the court
        granted in part the defendant's motion to preclude certain evidence; judgment
        in part for the plaintiff, from which the plaintiff appealed to this court.
        Reversed in part; further proceedings. Igor G. Kuperman, for the appellant
        (plaintiff). Brandon B. Fontaine, with whom was Kathleen E. Scelfo, for the
        appellee (defendant).\", \"scdb_id\": \"\", \"sibling_ids\": [11452621], \"source\":
        \"C\", \"status\": \"Published\", \"suitNature\": \"\", \"syllabus\": \"The
        plaintiff appealed from the trial court's judgment dissolving her mar- riage
        to the defendant and finding in his favor as to her claims of conversion and
        statutory (\xA7 52-564) theft. The plaintiff, who was a joint holder with
        the defendant of certain brokerage accounts, claimed, inter alia, that the
        court improperly determined that the torts of conversion and statutory theft
        did not apply to moneys misappropriated by joint account holders. Held: The
        trial court did not abuse its discretion when it precluded the plaintiff's
        expert witness from testifying about the value of the defendant's business
        enterprise, as the expert was not disclosed until the middle of trial even
        though the case had been pending for more than three years, the defendant's
        prior responses to the plaintiff's discovery requests were sufficient for
        an expert to offer an opinion on the value of the business, and the court's
        pre- clusion order was a proportionate sanction for the plaintiff's noncompliance
        with prior disclosure requirements and a reasonable exercise of the court's
        inherent authority to manage its docket. This court declined to review the
        plaintiff's unpreserved, conclusory claim that the trial court's limitation
        of her counsel's direct examination of the defendant at trial constituted
        a violation of the plaintiff's right to procedural due process, as the claim
        was inadequately briefed. The plaintiff's contention that the trial court
        applied an improper legal standard in awarding her only nominal damages on
        her claim of negligent infliction of emotional distress was unavailing, as
        the court effectively compensated the plaintiff through its financial orders
        when dissolving the marriage, virtually all of the evidence to support the
        negligent infliction of emotional distress claim had been presented in the
        dissolution portion of the trial and was relevant to the factors the court
        was required to consider in making its financial orders, and the court recognized
        that an award of damages on the negligent infliction of emotional distress
        claim would violate the common-law rule precluding double recovery. The trial
        court improperly rendered judgment for the defendant on the plaintiff's claims
        of conversion and theft in violation of \xA7 52-564 relative to the parties'
        jointly held brokerage accounts, as the court made no factual findings regarding
        the accounts but, instead, improperly relied on the statute ((Rev. to 2019)
        \xA7 36a-290) governing joint bank and credit union accounts in determining,
        as a matter of law, that the defendant could not be held liable for the conversion
        of funds in the brokerage accounts; accordingly, the judg- ment was reversed
        as to those claims and the case was remanded for further proceedings on those
        counts of the plaintiff's complaint. Donshik v. Donshik This court declined
        to review the plaintiff's claim that the trial court sum- marily denied her
        motion to stay the trial proceedings without first balancing the interests
        of the parties, nonparties, the public and the court, as the plain- tiff's
        failure to seek an articulation of the trial court's reasoning rendered the
        record inadequate for review, and, in the absence of an indication to the
        contrary, it was presumed that the court applied the correct legal standard
        in declining to stay the proceedings. Argued September 18, 2025\u2014officially
        released September 29, 2026\"}, {\"absolute_url\": \"/opinion/10985573/in-re-saama-technologies-litigation/\",
