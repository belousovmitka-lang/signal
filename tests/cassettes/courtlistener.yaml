        false, \"sha1\": \"8f97b30116cc11fb0f9d50be47e051a7fface9f1\", \"snippet\":
        \"************************************************\\n   The \u201Cofficially
        released\u201D date that appears near the\\nbeginning of an opinion is the
        date the opinion will be\\npublished in the Connecticut Law Journal or the
