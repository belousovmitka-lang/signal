# Every source Signal collects from. One entry per connector instance or search profile.
# Schema: signal_connectors/config.py (SourcesFile / SourceConfig). Validated on load.
#
# Rules the loader enforces:
#   - a public_pages source can be enabled only after access_check.decision is "full" (rule 2)
#   - a paid source must name a feature_flag env var and runs only when it is set (rule 6)
#   - blocked sources and access_check "skip" sources cannot be enabled
#   - monthly_budget_usd defaults to 0: the source may make free calls only
#
# Entry reference (all keys except route and source_type are optional):
#
#   <name>:                          # key; used as RawPost.source, cost ledger and run history name
#     connector: rss                 # module in signal_connectors/connectors/ (defaults to the key)
#     enabled: false
#     status: todo                   # todo | done | awaiting_approval | paid_flag_off | blocked
#     status_date: 2026-10-09
#     route: rss                     # own_api | search_api | rss | public_pages
#     source_type: news              # community | social | paid_demand | review | news | government | media | startup | research
#     cadence: daily                 # hourly | daily | weekly | monthly
#     monthly_budget_usd: 0
#     paid: false
#     feature_flag: ENABLE_X         # required when paid: true
#     env: [BRAVE_API_KEY]           # keys the connector needs
#     access_check:                  # rule 2; required before enabling public_pages
#       robots: unchecked            # allowed | partial | disallowed | not_applicable | unchecked
#       terms: unchecked             # allowed | unclear | forbidden | not_applicable | unchecked
#       decision: pending            # full | search_only | skip | pending
#       terms_url: https://...
#       checked_at: 2026-10-09
#       notes: ""
#     rate_limit: {requests_per_second: 1, domains: [example.com]}
#     quota: {units: 10000, window_days: 1}
#     deletion_recheck_days: 2       # Reddit and X: re-check stored items for deletion
#     queries:
#       - keywords: ["is there a tool"]
#         communities: [paralegal]
#         domains: [reddit.com]
#         limit: 50
#         industry_hint: legal
#         params: {}
#     options: {}                    # connector-specific settings

version: 1

defaults:
  requests_per_second: 1.0           # per domain, rule 3
  timeout_seconds: 20
  max_attempts: 5                    # retries on 429/5xx with exponential backoff
  initial_lookback_days: 7           # first run of a source fetches this far back
  limit: 50                          # default results per query
  provider_budgets:                  # monthly caps across all sources, just under the free credits
    brave: 4.50                      # $5 free monthly credit
    exa: 9.00                        # $10 free monthly credit

sources:
  rss:
    enabled: true
    status: done
    status_date: 2026-10-09
    route: rss
    source_type: news
    cadence: daily
    access_check:
      robots: allowed
      terms: unclear
      decision: full
      checked_at: 2026-10-09
      notes: >-
        Feeds come from industries/*.yaml (status: live, set by scripts/verify_industries.py) plus the
        cross-industry feeds below. robots.txt is checked for every feed URL at run time.
        Feeds are published for syndication; we keep text internally and show summaries with links (rule 5).
        Per-publisher terms not reviewed one by one; feeds that disallow us or answer 403 are
        marked blocked in the industry files and skipped.
    options:
      industry_feeds: true           # add every live feed from industries/*.yaml
    queries:
      - {params: {feed: "https://medium.com/feed/tag/small-business", name: medium-small-business}}
      - {params: {feed: "https://www.lennysnewsletter.com/feed", name: lennysnewsletter}}

  hackernews:
    enabled: true
    status: done
    status_date: 2026-10-09
    route: own_api
    source_type: community
    cadence: hourly
    access_check:
      robots: not_applicable
      terms: allowed
      decision: full
      terms_url: https://github.com/HackerNews/API
      checked_at: 2026-10-09
      notes: Official APIs. Firebase API is MIT-licensed with no rate limit; Algolia HN Search is public and keyless.
    rate_limit: {requests_per_second: 5, domains: [hacker-news.firebaseio.com]}
    queries:
      # cross-industry pain phrases; industry maps add role-specific ones
      - keywords: ["is there a tool", "is there an app", "is there software", "I would pay for",
                   "so tired of", "takes forever", "wish there was", "looking for a tool"]
        limit: 100
      - {params: {tags: ask_hn}, limit: 100}          # every new Ask HN
      - {params: {list: jobstories}, limit: 60}        # YC company job posts (paid demand)

  stackexchange:
    enabled: true
    status: done
    status_date: 2026-10-09
    route: own_api
    source_type: community
    cadence: daily
    env: [STACKEXCHANGE_KEY]        # optional; 300 requests/day without it, 10,000 with it
    access_check:
      robots: not_applicable
      terms: allowed
      decision: full
      terms_url: https://stackoverflow.com/legal/api-terms-of-use
      checked_at: 2026-10-09
      notes: >-
        Official API. The ToS non-commercial limit excludes content obtained via the API; content is
        CC BY-SA 4.0. Obligation for the app: visibly credit Stack Exchange and link to each question
        (API Attribution rules). Author names are not stored (rule 4); the link carries attribution.
    queries:
      # tool gaps and professional Q&A: low-volume sites, so take every new question
      # (one call per site; keyword searches here cost 5x the quota for a fraction of the posts)
      - communities: [softwarerecs, webapps, law, workplace, money, academia, diy, pm, freelancing]
        limit: 100
      - communities: [stackoverflow]
        keywords: ["is there a library", "is there a tool"]
        limit: 50

  bluesky:
    connector: search_api
    enabled: true
    status: done
    status_date: 2026-10-09
    route: own_api
    source_type: social
    cadence: weekly                  # Exa's Bluesky coverage is thin (mostly popular posts); ~$0.45/month
    monthly_budget_usd: 2.00         # Exa discovery: 15 searches/run at $0.007
    env: [EXA_API_KEY]
    deletion_recheck_days: 7         # Bluesky developer guideline 3: honor deletions
    access_check:
      robots: allowed
      terms: allowed
      decision: full
      terms_url: https://docs.bsky.app/docs/support/developer-guidelines
      checked_at: 2026-10-09
      notes: >-
        Exa finds post URLs (held in memory only; Exa ToS 4.2(a)); posts are read from the AT Protocol
        public AppView (getPosts), which needs no login. searchPosts itself returns 403 to logged-out
        callers. Authors labelled !no-unauthenticated are skipped. Guidelines: honor deletions
        (scripts/recheck_deletions.py bluesky) and publish a monitored contact email (SIGNAL_CONTACT_EMAIL).
    options:
      industry_templates:
        - profile: bluesky
          provider: exa
          domains: [bsky.app]
          # first-person phrasing matched real posts slightly better than a description (tested 2026-10-09)
          query: "I'm a {roles} and I'm so tired of doing {tasks} by hand. Is there a tool for this?"
          top: 1
          limit: 10

  search_api:
    enabled: true
    status: done
    status_date: 2026-10-09
    route: search_api
    source_type: community
    cadence: weekly
    monthly_budget_usd: 2.00
    env: [EXA_API_KEY, BRAVE_API_KEY]
    access_check:
      robots: allowed
      terms: allowed
      decision: full
      checked_at: 2026-10-09
      notes: >-
        Search results are pointers only: Brave API Terms 3(b)(i) forbid storing results beyond
        transient storage, Exa ToS 4.2(a) forbid copying output. URLs are held in memory, then each post
        is read through its platform's allowed route (Medium and Substack RSS feeds). URLs no resolver
        accepts are dropped unstored.
    options:
      industry_templates:
        - profile: blogs
          provider: exa
          domains: [medium.com, substack.com]
          query: "{roles} writing about the problems with {tasks} and the lack of good software"
          limit: 10

  youtube:
    enabled: false
    status: blocked
    status_date: 2026-10-09
    route: own_api
    source_type: media
    cadence: daily
    env: [YOUTUBE_API_KEY]
    access_check:
      robots: not_applicable
      terms: forbidden
      decision: skip
      terms_url: https://developers.google.com/youtube/terms/developer-policies
      checked_at: 2026-10-09
      notes: >-
        Developer Policies III.E: "Do not aggregate API Data" except per single content owner;
        "must not ... access or use API Data to create new or derived data or metrics"; non-statistics
        data stored at most 30 days. Signal's cross-channel feed, ranking and idea extraction conflict
        with all three. Covered via search_api profile youtube.com/watch instead. Unblock path: YouTube
        API compliance audit + derived-metrics permission (policy section L).

  google_news:
    connector: rss
    enabled: false
    status: blocked
    status_date: 2026-10-09
    route: rss
    source_type: news
    cadence: hourly
    access_check:
      robots: disallowed
      terms: forbidden
      decision: skip
      terms_url: https://news.google.com/
      checked_at: 2026-10-09
      notes: >-
        news.google.com/robots.txt disallows /rss for all agents, and Google News feeds are for
        personal, non-commercial use. Keyword news goes through search_api news search instead,
        and GDELT (Phase 3).
