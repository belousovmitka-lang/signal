# Every source Signal collects from. One entry per connector instance or search profile.
# Schema: signal_connectors/config.py (SourcesFile / SourceConfig). Validated on load.
#
# Rules the loader enforces:
#   - a public_pages source can be enabled only after access_check.decision is "full" (rule 2)
#   - a paid source must name a feature_flag env var and runs only when it is set (rule 6)
#   - blocked sources and access_check "skip" sources cannot be enabled
#   - monthly_budget_usd defaults to 0: the source may make free calls only
#
# Entry reference (all keys except route and source_type are optional):
#
#   <name>:                          # key; used as RawPost.source, cost ledger and run history name
#     connector: rss                 # module in signal_connectors/connectors/ (defaults to the key)
#     enabled: false
#     status: todo                   # todo | done | awaiting_approval | paid_flag_off | blocked
#     status_date: 2026-10-09
#     route: rss                     # own_api | search_api | rss | public_pages
#     source_type: news              # community | social | paid_demand | review | news | government | media | startup | research
#     cadence: daily                 # hourly | daily | weekly | monthly
#     monthly_budget_usd: 0
#     paid: false
#     feature_flag: ENABLE_X         # required when paid: true
#     env: [BRAVE_API_KEY]           # keys the connector needs
#     access_check:                  # rule 2; required before enabling public_pages
#       robots: unchecked            # allowed | partial | disallowed | not_applicable | unchecked
#       terms: unchecked             # allowed | unclear | forbidden | not_applicable | unchecked
#       decision: pending            # full | search_only | skip | pending
#       terms_url: https://...
#       checked_at: 2026-10-09
#       notes: ""
#     rate_limit: {requests_per_second: 1, domains: [example.com]}
#     quota: {units: 10000, window_days: 1}
#     deletion_recheck_days: 2       # Reddit and X: re-check stored items for deletion
#     queries:
#       - keywords: ["is there a tool"]
#         communities: [paralegal]
#         domains: [reddit.com]
#         limit: 50
#         industry_hint: legal
#         params: {}
#     options: {}                    # connector-specific settings

version: 1

defaults:
  requests_per_second: 1.0           # per domain, rule 3
  timeout_seconds: 20
  max_attempts: 5                    # retries on 429/5xx with exponential backoff
  initial_lookback_days: 7           # first run of a source fetches this far back
  limit: 50                          # default results per query

sources:
  rss:
    enabled: true
    status: done
    status_date: 2026-10-09
    route: rss
    source_type: news
    cadence: daily
    access_check:
      robots: allowed
      terms: unclear
      decision: full
      checked_at: 2026-10-09
      notes: >-
        robots.txt is checked for every feed URL at run time; a disallowed feed fails alone.
        Feeds are published for syndication; we keep text internally and show summaries with links (rule 5).
        Per-publisher terms not reviewed one by one. Probed 2026-10-09; left out: Becker's and
        The Register (robots disallow), Healthcare IT News, The Real Deal, Going Concern,
        Search Engine Land (403 to bots), Marketplace Pulse, IndustryWeek, Agriculture.com,
        EdWeek (feed URL 404 or empty).
    queries:
      - {industry_hint: legal, params: {feed: "https://abovethelaw.com/feed/", name: abovethelaw}}
      - {industry_hint: legal, params: {feed: "https://www.artificiallawyer.com/feed/", name: artificiallawyer}}
      - {industry_hint: legal, params: {feed: "https://www.lawnext.com/feed", name: lawsites}}
      - {industry_hint: healthcare, params: {feed: "https://www.fiercehealthcare.com/rss/xml", name: fiercehealthcare}}
      - {industry_hint: healthcare, params: {feed: "https://www.statnews.com/feed/", name: statnews}}
      - {industry_hint: construction, params: {feed: "https://www.constructiondive.com/feeds/news/", name: constructiondive}}
      - {industry_hint: construction, params: {feed: "https://www.enr.com/rss/articles", name: enr}}
      - {industry_hint: construction, params: {feed: "https://www.jlconline.com/feed/", name: jlc}}
      - {industry_hint: real_estate, params: {feed: "https://www.inman.com/feed/", name: inman}}
      - {industry_hint: real_estate, params: {feed: "https://www.housingwire.com/feed/", name: housingwire}}
      - {industry_hint: logistics, params: {feed: "https://www.freightwaves.com/news/feed", name: freightwaves}}
      - {industry_hint: logistics, params: {feed: "https://www.supplychaindive.com/feeds/news/", name: supplychaindive}}
      - {industry_hint: logistics, params: {feed: "https://www.dcvelocity.com/feeds/feed.rss", name: dcvelocity}}
      - {industry_hint: ecommerce, params: {feed: "https://www.modernretail.co/feed/", name: modernretail}}
      - {industry_hint: ecommerce, params: {feed: "https://www.retaildive.com/feeds/news/", name: retaildive}}
      - {industry_hint: restaurants, params: {feed: "https://www.restaurantdive.com/feeds/news/", name: restaurantdive}}
      - {industry_hint: restaurants, params: {feed: "https://www.nrn.com/rss.xml", name: nrn}}
      - {industry_hint: restaurants, params: {feed: "https://skift.com/feed/", name: skift}}
      - {industry_hint: accounting, params: {feed: "https://www.accountingtoday.com/feed?rss=true", name: accountingtoday}}
      - {industry_hint: accounting, params: {feed: "https://www.cpapracticeadvisor.com/feed/", name: cpapracticeadvisor}}
      - {industry_hint: education, params: {feed: "https://www.edsurge.com/articles_rss", name: edsurge}}
      - {industry_hint: education, params: {feed: "https://www.insidehighered.com/rss.xml", name: insidehighered}}
      - {industry_hint: marketing, params: {feed: "https://www.searchenginejournal.com/feed/", name: searchenginejournal}}
      - {industry_hint: marketing, params: {feed: "https://www.adweek.com/feed/", name: adweek}}
      - {industry_hint: hr, params: {feed: "https://www.hrdive.com/feeds/news/", name: hrdive}}
      - {industry_hint: hr, params: {feed: "https://www.ere.net/rss.xml", name: ere}}
      - {industry_hint: insurance, params: {feed: "https://www.insurancejournal.com/rss/news/", name: insurancejournal}}
      - {industry_hint: insurance, params: {feed: "https://www.carriermanagement.com/feed/", name: carriermanagement}}
      - {industry_hint: insurance, params: {feed: "https://www.dig-in.com/feed?rss=true", name: digitalinsurance}}
      - {industry_hint: manufacturing, params: {feed: "https://www.manufacturingdive.com/feeds/news/", name: manufacturingdive}}
      - {industry_hint: manufacturing, params: {feed: "https://www.mmsonline.com/rss/blog", name: modernmachineshop}}
      - {industry_hint: agriculture, params: {feed: "https://agfundernews.com/feed", name: agfundernews}}
      - {industry_hint: it_devtools, params: {feed: "https://feed.infoq.com/", name: infoq}}
      - {industry_hint: it_devtools, params: {feed: "https://thenewstack.io/feed/", name: thenewstack}}
      - {params: {feed: "https://medium.com/feed/tag/small-business", name: medium-small-business}}
      - {params: {feed: "https://www.lennysnewsletter.com/feed", name: lennysnewsletter}}

  hackernews:
    enabled: true
    status: done
    status_date: 2026-10-09
    route: own_api
    source_type: community
    cadence: hourly
    access_check:
      robots: not_applicable
      terms: allowed
      decision: full
      terms_url: https://github.com/HackerNews/API
      checked_at: 2026-10-09
      notes: Official APIs. Firebase API is MIT-licensed with no rate limit; Algolia HN Search is public and keyless.
    rate_limit: {requests_per_second: 5, domains: [hacker-news.firebaseio.com]}
    queries:
      # cross-industry pain phrases; industry maps add role-specific ones
      - keywords: ["is there a tool", "is there an app", "is there software", "I would pay for",
                   "so tired of", "takes forever", "wish there was", "looking for a tool"]
        limit: 100
      - {params: {tags: ask_hn}, limit: 100}          # every new Ask HN
      - {params: {list: jobstories}, limit: 60}        # YC company job posts (paid demand)

  stackexchange:
    enabled: true
    status: done
    status_date: 2026-10-09
    route: own_api
    source_type: community
    cadence: daily
    env: [STACKEXCHANGE_KEY]        # optional; 300 requests/day without it, 10,000 with it
    access_check:
      robots: not_applicable
      terms: allowed
      decision: full
      terms_url: https://stackoverflow.com/legal/api-terms-of-use
      checked_at: 2026-10-09
      notes: >-
        Official API. The ToS non-commercial limit excludes content obtained via the API; content is
        CC BY-SA 4.0. Obligation for the app: visibly credit Stack Exchange and link to each question
        (API Attribution rules). Author names are not stored (rule 4); the link carries attribution.
    queries:
      # tool gaps and professional Q&A: low-volume sites, so take every new question
      # (one call per site; keyword searches here cost 5x the quota for a fraction of the posts)
      - communities: [softwarerecs, webapps, law, workplace, money, academia, diy, pm, freelancing]
        limit: 100
      - communities: [stackoverflow]
        keywords: ["is there a library", "is there a tool"]
        limit: 50

  youtube:
    enabled: false
    status: blocked
    status_date: 2026-10-09
    route: own_api
    source_type: media
    cadence: daily
    env: [YOUTUBE_API_KEY]
    access_check:
      robots: not_applicable
      terms: forbidden
      decision: skip
      terms_url: https://developers.google.com/youtube/terms/developer-policies
      checked_at: 2026-10-09
      notes: >-
        Developer Policies III.E: "Do not aggregate API Data" except per single content owner;
        "must not ... access or use API Data to create new or derived data or metrics"; non-statistics
        data stored at most 30 days. Signal's cross-channel feed, ranking and idea extraction conflict
        with all three. Covered via search_api profile youtube.com/watch instead. Unblock path: YouTube
        API compliance audit + derived-metrics permission (policy section L).

  google_news:
    connector: rss
    enabled: false
    status: blocked
    status_date: 2026-10-09
    route: rss
    source_type: news
    cadence: hourly
    access_check:
      robots: disallowed
      terms: forbidden
      decision: skip
      terms_url: https://news.google.com/
      checked_at: 2026-10-09
      notes: >-
        news.google.com/robots.txt disallows /rss for all agents, and Google News feeds are for
        personal, non-commercial use. Keyword news goes through search_api news search instead,
        and GDELT (Phase 3).
