# Every source Signal collects from. One entry per connector instance or search profile.
# Schema: signal_connectors/config.py (SourcesFile / SourceConfig). Validated on load.
#
# Rules the loader enforces:
#   - a public_pages source can be enabled only after access_check.decision is "full" (rule 2)
#   - a paid source must name a feature_flag env var and runs only when it is set (rule 6)
#   - blocked sources and access_check "skip" sources cannot be enabled
#   - monthly_budget_usd defaults to 0: the source may make free calls only
#
# Entry reference (all keys except route and source_type are optional):
#
#   <name>:                          # key; used as RawPost.source, cost ledger and run history name
#     connector: rss                 # module in signal_connectors/connectors/ (defaults to the key)
#     enabled: false
#     status: todo                   # todo | done | awaiting_approval | paid_flag_off | blocked
#     status_date: 2026-10-09
#     route: rss                     # own_api | search_api | rss | public_pages
#     source_type: news              # community | social | paid_demand | review | news | government | media | startup | research
#     cadence: daily                 # hourly | daily | weekly | monthly
#     monthly_budget_usd: 0
#     paid: false
#     feature_flag: ENABLE_X         # required when paid: true
#     env: [BRAVE_API_KEY]           # keys the connector needs
#     access_check:                  # rule 2; required before enabling public_pages
#       robots: unchecked            # allowed | partial | disallowed | not_applicable | unchecked
#       terms: unchecked             # allowed | unclear | forbidden | not_applicable | unchecked
#       decision: pending            # full | search_only | skip | pending
#       terms_url: https://...
#       checked_at: 2026-10-09
#       notes: ""
#     rate_limit: {requests_per_second: 1, domains: [example.com]}
#     quota: {units: 10000, window_days: 1}
#     deletion_recheck_days: 2       # Reddit and X: re-check stored items for deletion
#     queries:
#       - keywords: ["is there a tool"]
#         communities: [paralegal]
#         domains: [reddit.com]
#         limit: 50
#         industry_hint: legal
#         params: {}
#     options: {}                    # connector-specific settings

version: 1

defaults:
  requests_per_second: 1.0           # per domain, rule 3
  timeout_seconds: 20
  max_attempts: 5                    # retries on 429/5xx with exponential backoff
  initial_lookback_days: 7           # first run of a source fetches this far back
  limit: 50                          # default results per query
  provider_budgets:                  # monthly caps across all sources, just under the free credits
    brave: 4.50                      # $5 free monthly credit
    exa: 9.00                        # $10 free monthly credit

sources:
  rss:
    enabled: true
    status: done
    status_date: 2026-10-09
    route: rss
    source_type: news
    cadence: daily
    access_check:
      robots: allowed
      terms: unclear
      decision: full
      checked_at: 2026-10-09
      notes: >-
        Feeds come from industries/*.yaml (status: live, set by scripts/verify_industries.py) plus the
        cross-industry feeds below. robots.txt is checked for every feed URL at run time.
        Feeds are published for syndication; we keep text internally and show summaries with links (rule 5).
        Per-publisher terms not reviewed one by one; feeds that disallow us or answer 403 are
        marked blocked in the industry files and skipped.
    options:
      industry_feeds: true           # add every live feed from industries/*.yaml
    queries:
      - {params: {feed: "https://medium.com/feed/tag/small-business", name: medium-small-business}}
      - {params: {feed: "https://www.lennysnewsletter.com/feed", name: lennysnewsletter}}

  hackernews:
    enabled: true
    status: done
    status_date: 2026-10-09
    route: own_api
    source_type: community
    cadence: hourly
    access_check:
      robots: not_applicable
      terms: allowed
      decision: full
      terms_url: https://github.com/HackerNews/API
      checked_at: 2026-10-09
      notes: Official APIs. Firebase API is MIT-licensed with no rate limit; Algolia HN Search is public and keyless.
    rate_limit: {requests_per_second: 5, domains: [hacker-news.firebaseio.com]}
    queries:
      # cross-industry pain phrases; industry maps add role-specific ones
      - keywords: ["is there a tool", "is there an app", "is there software", "I would pay for",
                   "so tired of", "takes forever", "wish there was", "looking for a tool"]
        limit: 100
      - {params: {tags: ask_hn}, limit: 100}          # every new Ask HN
      - {params: {list: jobstories}, limit: 60}        # YC company job posts (paid demand)

  stackexchange:
    enabled: true
    status: done
    status_date: 2026-10-09
    route: own_api
    source_type: community
    cadence: daily
    env: [STACKEXCHANGE_KEY]        # optional; 300 requests/day without it, 10,000 with it
    access_check:
      robots: not_applicable
      terms: allowed
      decision: full
      terms_url: https://stackoverflow.com/legal/api-terms-of-use
      checked_at: 2026-10-09
      notes: >-
        Official API. The ToS non-commercial limit excludes content obtained via the API; content is
        CC BY-SA 4.0. Obligation for the app: visibly credit Stack Exchange and link to each question
        (API Attribution rules). Author names are not stored (rule 4); the link carries attribution.
    queries:
      # tool gaps and professional Q&A: low-volume sites, so take every new question
      # (one call per site; keyword searches here cost 5x the quota for a fraction of the posts)
      - communities: [softwarerecs, webapps, law, workplace, money, academia, diy, pm, freelancing]
        limit: 100
      - communities: [stackoverflow]
        keywords: ["is there a library", "is there a tool"]
        limit: 50

  classic_forum:
    enabled: true
    status: done
    status_date: 2026-10-09
    route: rss
    source_type: community
    cadence: daily
    access_check:
      robots: allowed
      terms: allowed
      decision: full
      checked_at: 2026-10-09
      notes: >-
        Feeds come only from industry-map forums whose robots.txt allows us AND whose terms were read
        and allow it (Forum.terms: allowed). 13 forums were read on 2026-10-09; 9 forbid automated or
        commercial use and are recorded as forbidden with the clause.
    options:
      industry_forums: true

  mastodon:
    enabled: true
    status: done
    status_date: 2026-10-09
    route: own_api
    source_type: social
    cadence: daily
    deletion_recheck_days: 7
    access_check:
      robots: allowed
      terms: allowed
      decision: full
      terms_url: https://mastodon.social/terms-of-service
      checked_at: 2026-10-09
      notes: >-
        Public hashtag timelines on mastodon.social, no login. Its terms bind registered users only;
        server rules cover conduct. Consent: only authors who opted in to search (indexable), not noindex,
        not bots, no #nobot/#noindex in bio. Deletions re-checked on each post's home server.
    queries:
      - {industry_hint: legal, communities: [lawyers, legaltech, paralegal], limit: 40}
      - {industry_hint: healthcare, communities: [nursing, medicine, healthit], limit: 40}
      - {industry_hint: construction, communities: [construction, electrician, hvac], limit: 40}
      - {industry_hint: real_estate, communities: [realestate, landlord, propertymanagement], limit: 40}
      - {industry_hint: logistics, communities: [trucking, logistics, supplychain], limit: 40}
      - {industry_hint: ecommerce, communities: [ecommerce, shopify, etsy], limit: 40}
      - {industry_hint: restaurants, communities: [restaurants, hospitality, chefs], limit: 40}
      - {industry_hint: accounting, communities: [accounting, bookkeeping, taxes], limit: 40}
      - {industry_hint: education, communities: [teachers, edtech, highered], limit: 40}
      - {industry_hint: marketing, communities: [marketing, seo, socialmediamarketing], limit: 40}
      - {industry_hint: hr, communities: [hr, recruiting, humanresources], limit: 40}
      - {industry_hint: insurance, communities: [insurance, insurtech], limit: 40}
      - {industry_hint: manufacturing, communities: [manufacturing, machining, cnc], limit: 40}
      - {industry_hint: agriculture, communities: [farming, agriculture, agtech], limit: 40}
      - {industry_hint: it_devtools, communities: [sysadmin, devops, homelab], limit: 40}

  lemmy:
    enabled: true
    status: done
    status_date: 2026-10-09
    route: own_api
    source_type: community
    cadence: daily
    deletion_recheck_days: 7
    access_check:
      robots: allowed
      terms: allowed
      decision: full
      terms_url: https://legal.lemmy.world/tos/
      checked_at: 2026-10-09
      notes: >-
        lemmy.world public API, no login. Its ToS covers the API; bot rules apply to posting, voting and
        advertising bots, not reading. robots.txt Crawl-delay 60 is applied (about 1 request/minute).
        Bot accounts and deleted/removed posts skipped; deletions re-checked on the origin instance.
    queries:
      - keywords: ["is there a tool", "is there an app", "is there software", "so tired of", "takes forever"]
        limit: 50

  app_reviews:
    enabled: true
    status: done
    status_date: 2026-10-09
    route: rss
    source_type: review
    cadence: daily
    access_check:
      robots: allowed
      terms: allowed
      decision: full
      terms_url: https://wordpress.org/support/guidelines/
      checked_at: 2026-10-09
      notes: >-
        WordPress.org plugin review and support-forum feeds; robots.txt allows them (the api.wordpress.org
        plugin info API is disallowed and unused); no restriction found in WordPress.org's policies.
        Not usable (2026-10-09): Apple reviews feed, Chrome Web Store, Atlassian Marketplace API (robots.txt),
        Shopify App Store (ToS forbids robots).
    queries:
      - {industry_hint: ecommerce, params: {plugin: woocommerce, kind: reviews}, limit: 30}
      - {industry_hint: ecommerce, params: {plugin: woocommerce, kind: support}, limit: 30}
      - {industry_hint: ecommerce, params: {plugin: mailpoet, kind: reviews}, limit: 30}
      - {industry_hint: ecommerce, params: {plugin: mailpoet, kind: support}, limit: 30}
      - {industry_hint: restaurants, params: {plugin: restaurant-reservations, kind: reviews}, limit: 30}
      - {industry_hint: restaurants, params: {plugin: restaurant-reservations, kind: support}, limit: 30}
      - {industry_hint: education, params: {plugin: tutor, kind: reviews}, limit: 30}
      - {industry_hint: education, params: {plugin: tutor, kind: support}, limit: 30}
      - {industry_hint: education, params: {plugin: learnpress, kind: reviews}, limit: 30}
      - {industry_hint: education, params: {plugin: learnpress, kind: support}, limit: 30}
      - {industry_hint: healthcare, params: {plugin: bookly-responsive-appointment-booking-tool, kind: reviews}, limit: 30}
      - {industry_hint: healthcare, params: {plugin: bookly-responsive-appointment-booking-tool, kind: support}, limit: 30}
      - {industry_hint: healthcare, params: {plugin: ameliabooking, kind: reviews}, limit: 30}
      - {industry_hint: healthcare, params: {plugin: ameliabooking, kind: support}, limit: 30}
      - {industry_hint: marketing, params: {plugin: wordpress-seo, kind: reviews}, limit: 30}
      - {industry_hint: marketing, params: {plugin: wordpress-seo, kind: support}, limit: 30}
      - {industry_hint: marketing, params: {plugin: seo-by-rank-math, kind: reviews}, limit: 30}
      - {industry_hint: marketing, params: {plugin: seo-by-rank-math, kind: support}, limit: 30}
      - {industry_hint: hr, params: {plugin: wp-job-manager, kind: reviews}, limit: 30}
      - {industry_hint: hr, params: {plugin: wp-job-manager, kind: support}, limit: 30}
      - {industry_hint: accounting, params: {plugin: sliced-invoices, kind: reviews}, limit: 30}
      - {industry_hint: accounting, params: {plugin: sliced-invoices, kind: support}, limit: 30}
      - {industry_hint: real_estate, params: {plugin: essential-real-estate, kind: reviews}, limit: 30}
      - {industry_hint: real_estate, params: {plugin: essential-real-estate, kind: support}, limit: 30}
      - {industry_hint: it_devtools, params: {plugin: wordfence, kind: reviews}, limit: 30}
      - {industry_hint: it_devtools, params: {plugin: wordfence, kind: support}, limit: 30}
      - {industry_hint: it_devtools, params: {plugin: updraftplus, kind: reviews}, limit: 30}
      - {industry_hint: it_devtools, params: {plugin: updraftplus, kind: support}, limit: 30}
      - {industry_hint: legal, params: {plugin: contact-form-7, kind: reviews}, limit: 30}
      - {industry_hint: legal, params: {plugin: contact-form-7, kind: support}, limit: 30}

  gdelt:
    enabled: false                   # 429s even at 1 request/20s from this IP; results noisy (2026-10-09)
    status: todo
    status_date: 2026-10-09
    route: own_api
    source_type: news
    cadence: daily
    rate_limit: {requests_per_second: 0.05, domains: [api.gdeltproject.org]}   # 20s apart: 5s still drew 429s
    access_check:
      robots: not_applicable
      terms: allowed
      decision: full
      terms_url: https://www.gdeltproject.org/about.html
      checked_at: 2026-10-09
      notes: >-
        "unlimited and unrestricted use for any academic, commercial, or governmental use"; any use must
        cite the GDELT Project with a link (app obligation). Titles and links only; replaces Google News.
    queries:
      - {industry_hint: legal, keywords: ['("law firm" OR "law firms" OR paralegal OR "legal tech") (software OR automation OR shortage OR regulation OR startup)'], limit: 75}
      - {industry_hint: healthcare, keywords: ['(hospital OR clinic OR "health system" OR nurses) (software OR automation OR shortage OR regulation OR startup)'], limit: 75}
      - {industry_hint: construction, keywords: ['(contractor OR contractors OR "construction industry") (software OR automation OR shortage OR regulation OR startup)'], limit: 75}
      - {industry_hint: real_estate, keywords: ['("real estate" OR realtors OR "property managers") (software OR automation OR shortage OR regulation OR startup)'], limit: 75}
      - {industry_hint: logistics, keywords: ['(trucking OR freight OR "supply chain") (software OR automation OR shortage OR regulation OR startup)'], limit: 75}
      - {industry_hint: ecommerce, keywords: ['(ecommerce OR "online sellers" OR retailers) (software OR automation OR shortage OR regulation OR startup)'], limit: 75}
      - {industry_hint: restaurants, keywords: ['(restaurant OR restaurants OR hospitality) (software OR automation OR shortage OR regulation OR startup)'], limit: 75}
      - {industry_hint: accounting, keywords: ['(accountants OR accounting OR bookkeeping OR CPA) (software OR automation OR shortage OR regulation OR startup)'], limit: 75}
      - {industry_hint: education, keywords: ['(teachers OR schools OR "school district") (software OR automation OR shortage OR regulation OR startup)'], limit: 75}
      - {industry_hint: marketing, keywords: ['(marketers OR "marketing agencies" OR advertisers) (software OR automation OR shortage OR regulation OR startup)'], limit: 75}
      - {industry_hint: hr, keywords: ['(recruiters OR "human resources" OR hiring) (software OR automation OR shortage OR regulation OR startup)'], limit: 75}
      - {industry_hint: insurance, keywords: ['(insurers OR "insurance agents" OR insurance) (software OR automation OR shortage OR regulation OR startup)'], limit: 75}
      - {industry_hint: manufacturing, keywords: ['(manufacturers OR factories OR manufacturing) (software OR automation OR shortage OR regulation OR startup)'], limit: 75}
      - {industry_hint: agriculture, keywords: ['(farmers OR farming OR agriculture) (software OR automation OR shortage OR regulation OR startup)'], limit: 75}
      - {industry_hint: it_devtools, keywords: ['(sysadmins OR "IT teams" OR developers) (software OR automation OR shortage OR regulation OR startup)'], limit: 75}

  ted:
    enabled: true
    status: done
    status_date: 2026-10-09
    route: own_api
    source_type: government
    cadence: daily
    access_check:
      robots: not_applicable
      terms: allowed
      decision: full
      terms_url: https://ted.europa.eu/en/legal-notice
      checked_at: 2026-10-09
      notes: TED API v3 anonymous search. Reuse authorised (Decision 2011/833/EU) with acknowledgement.
    queries:
      - {params: {cpv: ["72000000", "48000000"]}, limit: 300}    # IT services, software packages

  uk_tenders:
    enabled: true
    status: done
    status_date: 2026-10-09
    route: own_api
    source_type: government
    cadence: daily
    access_check:
      robots: not_applicable
      terms: allowed
      decision: full
      checked_at: 2026-10-09
      notes: Contracts Finder and Find a Tender OCDS APIs, no key. Open Government Licence v3.0.
    queries:
      - {params: {service: contracts_finder, tags: [tender]}, limit: 500}
      - {params: {service: find_a_tender, tags: [tender]}, limit: 500}

  federal_register:
    enabled: true
    status: done
    status_date: 2026-10-09
    route: own_api
    source_type: government
    cadence: daily
    access_check:
      robots: allowed
      terms: allowed
      decision: full
      terms_url: https://www.federalregister.gov/reader-aids/policy/legal-status
      checked_at: 2026-10-09
      notes: Federal Register API v1, no key. US government works are public domain.
    queries:
      - {params: {types: [RULE, PRORULE]}, limit: 400}              # every new rule and proposed rule
      - {params: {types: [NOTICE]}, keywords: ["small business", "small entities"], limit: 100}

  cfpb:
    enabled: true
    status: done
    status_date: 2026-10-09
    route: own_api
    source_type: government
    cadence: daily
    access_check:
      robots: allowed
      terms: allowed
      decision: full
      terms_url: https://www.consumerfinance.gov/complaint/data-use/
      checked_at: 2026-10-09
      notes: >-
        Public complaint data, CC0 (API _meta.license), no key. Narratives are no longer in the API (checked 2026-10-09), so
        records are structured; ZIP codes are not stored. ~4-5k complaints/day: capped per run.
    queries:
      - {limit: 300}
      - {industry_hint: real_estate, params: {product: [Mortgage]}, limit: 100}
      - {industry_hint: accounting, params: {product: ["Debt collection"]}, limit: 100}

  openfda:
    enabled: true
    status: done
    status_date: 2026-10-09
    route: own_api
    source_type: government
    cadence: weekly
    access_check:
      robots: allowed
      terms: allowed
      decision: full
      terms_url: https://open.fda.gov/license/
      checked_at: 2026-10-09
      notes: >-
        openFDA device events (MAUDE), no key (240 requests/minute, 1,000/day per IP). CC0. Data lags
        5-6 weeks, so runs look back 60 days before the cursor. Contact names/phones/addresses not stored.
    queries:
      - {industry_hint: healthcare, limit: 500}

  open_data:
    enabled: true
    status: done
    status_date: 2026-10-09
    route: own_api
    source_type: government
    cadence: weekly
    access_check:
      robots: allowed
      terms: allowed
      decision: full
      checked_at: 2026-10-09
      notes: >-
        Socrata SODA API (NYC, Chicago open data) and CKAN (open.canada.ca), no key. Only the fields
        named per query are stored: no applicant names, phone numbers or street addresses.
    queries:
      - industry_hint: restaurants
        limit: 300
        params:
          kind: socrata
          name: NYC restaurant inspections
          domain: data.cityofnewyork.us
          dataset: 43nn-pn8j
          date_field: inspection_date
          id_fields: [camis, inspection_date, violation_code]
          title: "{dba}: {violation_description}"
          text: "{inspection_type}. {action} Critical: {critical_flag}. Score {score}."
          community: "NYC restaurants / {boro}"
          keep: [cuisine_description, critical_flag, grade, score, inspection_type, violation_code]
      - industry_hint: construction
        limit: 300
        params:
          kind: socrata
          name: Chicago building permits
          domain: data.cityofchicago.org
          dataset: ydr8-5enu
          date_field: issue_date
          id_fields: [id]
          title: "{work_type}: {work_description}"
          text: "{permit_type}. Reported cost ${reported_cost}. Processing time {processing_time} days."
          community: "Chicago permits / {work_type}"
          keep: [permit_type, work_type, reported_cost, processing_time, total_fee, community_area]
      - limit: 300
        params:
          kind: socrata
          name: NYC 311 service requests
          domain: data.cityofnewyork.us
          dataset: erm2-nwe9
          date_field: created_date
          id_fields: [unique_key]
          title: "{complaint_type}: {descriptor}"
          text: "{agency_name}. Status: {status}. {resolution_description}"
          community: "NYC 311 / {borough}"
          keep: [complaint_type, descriptor, agency, borough, status]
      - {limit: 100, params: {kind: ckan, base: "https://open.canada.ca/data"}}

  huggingface:
    enabled: true
    status: done
    status_date: 2026-10-09
    route: own_api
    source_type: startup
    cadence: weekly
    access_check:
      robots: allowed
      terms: allowed
      decision: full
      terms_url: https://huggingface.co/terms-of-service
      checked_at: 2026-10-09
      notes: Hub API, no key. robots.txt allows all; ToS has no clause on automated or API access.
    queries:
      - {params: {kind: spaces}, limit: 100}
      - {params: {kind: models}, limit: 100}

  papers:
    connector: rss
    enabled: true
    status: done
    status_date: 2026-10-09
    route: rss
    source_type: research
    cadence: daily
    rate_limit: {requests_per_second: 0.33, domains: [rss.arxiv.org]}    # "one request every three seconds"
    access_check:
      robots: allowed
      terms: allowed
      decision: full
      terms_url: https://info.arxiv.org/help/api/tou.html
      checked_at: 2026-10-09
      notes: >-
        arXiv RSS (rss.arxiv.org has no robots.txt). export.arxiv.org (the query API) is robots-disallowed
        for all agents, so it is not used. arXiv metadata (title, abstract) is CC0; e-prints are not
        stored. PubMed waits for SIGNAL_CONTACT_EMAIL (NCBI asks for tool + email).
    queries:
      - {params: {feed: "https://rss.arxiv.org/rss/cs.CY", name: arxiv-cs.CY, community: "arXiv cs.CY"}, limit: 100}
      - {params: {feed: "https://rss.arxiv.org/rss/cs.HC", name: arxiv-cs.HC, community: "arXiv cs.HC"}, limit: 100}
      - {params: {feed: "https://rss.arxiv.org/rss/cs.SE", name: arxiv-cs.SE, community: "arXiv cs.SE"}, limit: 100}
      - {params: {feed: "https://rss.arxiv.org/rss/cs.CE", name: arxiv-cs.CE, community: "arXiv cs.CE"}, limit: 100}
      - {params: {feed: "https://rss.arxiv.org/rss/econ.GN", name: arxiv-econ.GN, community: "arXiv econ.GN"}, limit: 100}
      - {params: {feed: "https://rss.arxiv.org/rss/q-fin.GN", name: arxiv-q-fin.GN, community: "arXiv q-fin.GN"}, limit: 100}

  newsapi:
    enabled: false
    status: paid_flag_off
    status_date: 2026-10-09
    paid: true
    feature_flag: ENABLE_NEWSAPI
    route: own_api
    source_type: news
    cadence: daily
    monthly_budget_usd: 0            # set when a plan is bought (Business $449/mo, 2026-10-09)
    env: [NEWSAPI_KEY]
    access_check:
      robots: not_applicable
      terms: allowed
      decision: full
      terms_url: https://newsapi.org/terms
      checked_at: 2026-10-09
      notes: Developer plan is development-only; production needs a paid plan. No competing news database.
    options: {cost_per_call_usd: 0.0018}
    queries:
      - {industry_hint: legal, keywords: ['("law firm" OR paralegal) AND (software OR automation)'], limit: 100}

  bluesky:
    connector: search_api
    enabled: true
    status: done
    status_date: 2026-10-09
    route: own_api
    source_type: social
    cadence: weekly                  # Exa's Bluesky coverage is thin (mostly popular posts); ~$0.45/month
    monthly_budget_usd: 2.00         # Exa discovery: 15 searches/run at $0.007
    env: [EXA_API_KEY]
    deletion_recheck_days: 7         # Bluesky developer guideline 3: honor deletions
    access_check:
      robots: allowed
      terms: allowed
      decision: full
      terms_url: https://docs.bsky.app/docs/support/developer-guidelines
      checked_at: 2026-10-09
      notes: >-
        Exa finds post URLs (held in memory only; Exa ToS 4.2(a)); posts are read from the AT Protocol
        public AppView (getPosts), which needs no login. searchPosts itself returns 403 to logged-out
        callers. Authors labelled !no-unauthenticated are skipped. Guidelines: honor deletions
        (scripts/recheck_deletions.py bluesky) and publish a monitored contact email (SIGNAL_CONTACT_EMAIL).
    options:
      industry_templates:
        - profile: bluesky
          provider: exa
          domains: [bsky.app]
          # first-person phrasing matched real posts slightly better than a description (tested 2026-10-09)
          query: "I'm a {roles} and I'm so tired of doing {tasks} by hand. Is there a tool for this?"
          top: 1
          limit: 10

  search_api:
    enabled: true
    status: done
    status_date: 2026-10-09
    route: search_api
    source_type: community
    cadence: weekly
    monthly_budget_usd: 2.00
    env: [EXA_API_KEY, BRAVE_API_KEY]
    access_check:
      robots: allowed
      terms: allowed
      decision: full
      checked_at: 2026-10-09
      notes: >-
        Search results are pointers only: Brave API Terms 3(b)(i) forbid storing results beyond
        transient storage, Exa ToS 4.2(a) forbid copying output. URLs are held in memory, then each post
        is read through its platform's allowed route (Medium and Substack RSS feeds). URLs no resolver
        accepts are dropped unstored.
    options:
      industry_templates:
        - profile: blogs
          provider: exa
          domains: [medium.com, substack.com]
          query: "{roles} writing about the problems with {tasks} and the lack of good software"
          limit: 10

  youtube:
    enabled: false
    status: blocked
    status_date: 2026-10-09
    route: own_api
    source_type: media
    cadence: daily
    env: [YOUTUBE_API_KEY]
    access_check:
      robots: not_applicable
      terms: forbidden
      decision: skip
      terms_url: https://developers.google.com/youtube/terms/developer-policies
      checked_at: 2026-10-09
      notes: >-
        Developer Policies III.E: "Do not aggregate API Data" except per single content owner;
        "must not ... access or use API Data to create new or derived data or metrics"; non-statistics
        data stored at most 30 days. Signal's cross-channel feed, ranking and idea extraction conflict
        with all three. Covered via search_api profile youtube.com/watch instead. Unblock path: YouTube
        API compliance audit + derived-metrics permission (policy section L).

  google_news:
    connector: rss
    enabled: false
    status: blocked
    status_date: 2026-10-09
    route: rss
    source_type: news
    cadence: hourly
    access_check:
      robots: disallowed
      terms: forbidden
      decision: skip
      terms_url: https://news.google.com/
      checked_at: 2026-10-09
      notes: >-
        news.google.com/robots.txt disallows /rss for all agents, and Google News feeds are for
        personal, non-commercial use. Keyword news goes through search_api news search instead,
        and GDELT (Phase 3).
