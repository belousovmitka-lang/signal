# Every weight, threshold and quota the feed uses (FEED_ALGORITHM.md section 16).
# Values are the spec's starting points: tune here, never in code.
# Bump `version` on any change; it is stored with every event and impression.
version: 1

# Stage A — enrichment (section 3)
enrichment:
  prompt_version: v9                    # bump to re-enrich every post with the new prompt
  spam_drop_threshold: 0.7        # posts above this are kept but never ranked
  # Not shown in the feed (stored, counted, can be turned on later without re-tagging):
  drop_post_types: [research, listing, company_news, general_news, notice, opinion, guide, praise, spam, off_topic]
  monthly_budget_usd: 50.0        # Claude API spend; checked against worst-case cost before every call
  max_retries_invalid_json: 1     # then the post is marked needs_review
  max_input_chars: 6000           # longer posts are cut, with a marker the model sees
  tagger:                         # tags every post
    model: claude-haiku-5-5
    effort: medium
    max_tokens: 4000
  escalation:                     # re-tags posts the tagger was unsure about or declined
    model: claude-sonnet-5-5      # was Opus 5.5: ~2x cheaper; ~3.5% of posts escalate
    effort: medium
    max_tokens: 8000
    below_confidence: 0.5
    server_fallbacks: true        # fallbacks: "default" on sync calls (not allowed on batches)
    max_per_run: 100              # batch collection defers escalations; `enrich.py escalate` runs this many
  batch_min_posts: 50             # use the Batch API (50% off) when at least this many posts are queued
  prefilter:                      # cheap checks before any model call
    min_chars: 30
    # Structured records with no narrative: counted in aggregate later, not tagged one by one.
    skip_sources: ["open_data:", "cfpb"]
  prices_per_mtok:                # USD per million tokens (checked 2026-10-09)
    claude-haiku-5-5: {input: 0.10, output: 0.50}
    claude-sonnet-5-5: {input: 2.00, output: 10.00}
    claude-opus-5-5: {input: 4.00, output: 20.00}
    claude-opus-4-8: {input: 5.00, output: 25.00}
  batch_discount: 0.5
  cache_write_multiplier: 1.25
  cache_read_multiplier: 0.1

embeddings:
  provider: voyage
  model: voyage-4
  dimensions: 1024
  price_per_mtok: 0.06            # first 200M tokens are free; metered anyway
  monthly_budget_usd: 5.0
  max_input_chars: 4000
  batch_size: 128
  # Optional pacing, e.g. for an account without a payment method (3 requests, 10k tokens per minute).
  # requests_per_minute: 3
  # tokens_per_minute: 10000

# Stage B — niche tree growth (section 4.2)
niches:
  split_min_support_90d: 200      # a node is clustered once it has this many posts in 90 days
  child_min_posts: 40
  child_min_authors: 15
  child_min_sources: 2
  retire_after_weeks_below: 8     # support below child_min_posts this many weeks in a row
  support_window_days: 90
  # Most posts have no author (tenders, device reports, news): each one then counts as its own voice.
  authorless_counts_as_distinct: true
  pca_dims: 50                    # HDBSCAN runs on a PCA projection of the embeddings
  hdbscan_min_samples: 5
  merge_cosine: 0.92              # siblings whose centroids are this close are merged
  assign_percentile: 10           # a child accepts posts above this percentile of its members' cosine
  child_min_cosine: 0.55          # ...and never below this cosine, and only if closer to it than to its parent
  child_min_cohesion: 0.62        # median member cosine to the centroid; looser clusters aren't niches
  # A post whose tag names no seeded branch goes to the branch its embedding is nearest, when that
  # branch beats the runner-up by this much (calibrated 2026-10-11: right ~97% on tagged posts).
  seed_match_margin: 0.04
  # Trees that grow new niches. Skills are off for now: clustering inside a skill groups posts by
  # industry, not by sub-skill, so it produced noise ("WordPress site owner"). Grown niches of a tree
  # not listed here are retired.
  grow_trees: [industry]
  name_samples: 15                # pain statements shown to the namer

# Stage C — problems (section 5)
problems:
  cluster_cosine_threshold: 0.82
  borderline_cosine: 0.78         # cluster pairs between this and the threshold go to an LLM check
  merge_checks_per_run: 200       # cap on those checks (cost)
  match_min_jaccard: 0.3          # a rebuilt cluster keeps an old problem's id at this post overlap
  frequency_full_at_voices: 50    # frequency = log(1 + voices) / log(1 + this)
  source_types_full_at: 4
  trend_window_days: 28
  buyer_min_likelihood: 0.67
  confidence_full_at_posts: 20
  early_signal_below: 0.5         # confidence under this is shown as "early signal"
  # Tenders, job posts and gigs form "demand" items, clustered and scored apart from pain problems.
  demand_types: [paid_demand]
  demand_score_weights:
    frequency: 0.40               # distinct buyers asking for the same thing
    money_signal: 0.25            # share stating a budget, rate or contract value
    trend: 0.20
    source_diversity: 0.15
  score_weights:
    frequency: 0.20
    trend: 0.15
    intensity: 0.15
    money_signal: 0.20
    tool_gap: 0.10
    source_diversity: 0.10
    buyer_likelihood: 0.10

# Stage D — user model (section 6)
user_model:
  quiz_prior_affinity: 0.6
  resume_prior_affinity: 0.5
  calibration_cards: 10
  calibration_wildcards: 2
  similar_builders_full_until_events: 20
  similar_builders_zero_at_events: 100
  propagation:
    parent: 0.40
    grandparent: 0.15
  evidence_half_life_days: 21
  drop_in_affinity: 0.35
  drop_in_exposure_budget: 8
  removed_retest_after_days: 60
  committed_other_cap: 0.10
  committed_affinity: 0.9         # inside the committed problem's niche, ranking treats affinity as at least this
  committed_demand_max: 0.25      # committed mode: paid demand at most this share of a page (evidence comes first)
  narrowing:
    child_share_of_positive: 0.60
    child_min_positive_events: 5
    lookback_weeks: 4
    promoted_affinity_factor: 0.9
    fade_min_negative_events: 10
    fade_weeks_without_positive: 3
  rings:
    core_min: 0.6
    regular_min: 0.3
  # Phase 3 (2026-10-11):
  prior_strength: 2.0             # alpha + beta of a quiz prior: a weak, easily moved belief
  default_affinity: 0.1           # nodes the user never chose or touched
  evidence_per_weight: 0.25       # Beta evidence per unit of event weight (a save, +4, adds 1)
  inherit: [1.0, 0.9, 0.8]        # a post's niche affinity: max of leaf, parent x0.9, grandparent x0.8
  type_preference_rate: 0.02      # per unit of event weight, clipped to [-1, 1]
  source_preference_rate: 0.01
  source_preference_cap: 0.5      # one source can never dominate
  similar_builders_min_jaccard: 0.3   # quiz overlap for "builders like you"
  too_small_step: 0.05            # "Not for me: too small" raises this user's minimum problem score

# Map (section 6.5-6.6, Phase 4)
map:
  new_days: 7                     # a node added this recently is flagged "new"
  rising_delta: 0.10              # affinity change since last week's snapshot that flags rising / fading
  child_angle_spread_deg: 14      # children sit this far apart around their parent's angle
  nudge_weight: 3                 # "Show more" / "Show less" counts as an event of this weight on the node
  discover_min_positive_events: 5 # an off-map niche with this many positive events in the lookback and
                                  # affinity >= rings.regular_min joins the map ("discovered")

# Inferred problems (section 17, INFERRED_PROBLEMS.md)
inferred:
  min_evidence: 3                 # an inferred problem needs at least this many evidence items...
  min_source_types: 2             # ...from at least this many source types (17.2, 17.5)
  high_evidence: 8                # 17.6 "high": this many items, this many source types, critic keep, no existing tool
  high_source_types: 3
  high_insider_confirmations: 2   # ...or confirmed by this many insiders
  publish_without_critic: false   # the critic is the check that the AI didn't invent evidence: keep this off
  match_min_jaccard: 0.3          # a re-run keeps an inferred problem's id at this evidence overlap
  counter_evidence_cosine: 0.6    # catalog posts (reviews, tool listings, tool gaps) this close to a cluster count
  counter_evidence_max: 5
  embed_dropped_types: [praise, listing]   # reviews and tool listings are searched for existing tools, so embed them
  paid_workarounds:               # Detector 1 (17.3)
    window_days: 60
    cluster_cosine: 0.80
    min_items: 5
    min_buyers: 3
    min_automatable: 0.5          # v9 tags: skip tasks software can't do (repairs, construction)
    allow_derived_tasks: true     # until posts carry v9 tasks, use the pain statement (never published uncritiqued)
  # 17.11 step 5: detectors 3-6 ship only if insiders confirm them. A `trial` detector's problems go to
  # insider prompts only, never the feed; it goes live by itself once enough of them are rated and confirmed.
  stages:
    paid_workarounds: live
    rule_change: live
    tool_gaps: trial
    labor_pressure: trial
    ignored_requests: trial
    cross_industry: trial
  promote_min_rated: 10           # trial -> live after this many insider-rated problems...
  promote_min_confirmation: 0.5   # ...with at least this share confirmed (17.10 target)
  tool_gaps:                      # Detector 3 (17.3)
    min_mentions: 8               # posts saying they move the same data between the same two tools...
    min_source_types: 2           # ...from at least this many source types
  labor_pressure:                 # Detector 4
    window_days: 90               # this window vs the one before it
    min_rise: 0.20                # volume or stated pay up at least this much
    min_current_posts: 10         # don't read trends into a handful of posts
    min_routine: 0.6              # mean task_automatable of the role's posts (the LLM's routine-share rating)
  ignored_requests:               # Detector 5
    min_votes: 50
    min_age_days: 365
  cross_industry:                 # Detector 6
    task_cosine: 0.75             # tool posts this close to a workaround task count as serving it
    min_tool_posts: 3             # the served industry needs this many tool posts (reviews, listings, launches)
  validation:                     # 17.7
    prompt_every_days: 7          # an insider is asked about at most one inferred problem per this many days
    downgrade_after_net_no: 2     # insider no's minus yes's (partly = half a yes) that lower confidence one level
    reject_after_net_no: 3        # ...and that reject a low-confidence problem
    weight_prior: 2               # detector weights: (confirmed + acted + prior/2) / (rated + prior), x 2
    weight_min: 0.3
    weight_max: 1.5
  rule_change:                    # Detector 2 (17.3)
    job_window_days: 90
    min_role_posts: 10            # a role needs this many recent job posts whose duties match the obligation
    role_cosine: 0.45             # obligation vs. job post similarity that counts as "duties match" (starting guess)
    job_sources: [job_boards]     # posts from these sources are job posts
    job_communities: ["HN Jobs"]  # ...and posts in these communities
    max_job_evidence: 5
    max_comment_evidence: 5
    max_rule_age_days: 180        # 94% of extracted obligations state no deadline: those count while the rule is new
    # Without enough job posts for a role, the affected people's own posts (pain, tool gaps) close to the
    # obligation stand in as the role evidence (2026-10-15: 65 job posts in the store, too few for any role).
    voice_cosine: 0.60            # on pain statements; 0.55 let in topical neighbours (checked 2026-10-15)
    min_voice_posts: 3
    max_voice_evidence: 6
    duplicate_cosine: 0.88        # the same rule extracted from its comments and coverage

# Evaluation (section 13, Phase 7)
evaluation:
  ndcg_k: 20
  # A v2 candidate is activated only if, replayed on held-out users' sessions, it beats v1 on NDCG@20
  # for saves by at least `min_gain` and is no worse than `idea_tolerance` on ideas.
  min_sessions: 30
  min_gain: 0.01
  idea_tolerance: 0.0
  # A/B tests (section 13 "Online"). Each user is assigned once per experiment and keeps the arm.
  # An arm's `overrides` are config values by dotted path; `ranker: v2` uses the given v2 model.
  # Example:
  #   - name: explore-15
  #     arms:
  #       control: {share: 0.5}
  #       more-exploration: {share: 0.5, overrides: {candidates.shares.exploration: 0.15}}
  experiments: []

# Profile sync (section 6.6, Phase 5)
profile:
  # A niche in Core is suggested for the profile once the user has this many positive actions in it
  # (or pinned it there): quiz choices start in Core, and suggesting them all at once would be noise.
  min_positive_events: 3
  resuggest_after_days: 90        # a declined suggestion isn't offered again before this

# Events and their weights (section 6.3)
events:
  weights:
    impression: 0
    scroll_past: -0.3
    read: 1
    expand: 0.5
    open_source: 1.5
    save: 4
    share: 3
    id_build: 5
    idea: 8
    outreach: 12
    useful_yes: 3
    useful_no: -3
    not_for_me: -6
    interested: 2                 # calibration card answer (section 6.2)
    hide_source: -4
    report: -20
  scroll_past_max_dwell_ms: 1500   # a scroll-past counts only below this dwell, fully visible
  read_min_share_of_expected: 0.6  # a read counts only at >= this share of expected reading time
  reading_words_per_minute: 230
  reading_min_expected_ms: 3000    # floor for very short posts and snippets
  max_batch_size: 500
  max_clock_skew_seconds: 300      # client timestamps further in the future are rejected
  max_age_days: 30                 # older client timestamps are rejected (stale offline batches)

# Stage E — candidate generation (section 7)
candidates:
  per_session: 500
  shares:
    niche_match: 0.50
    skill_match: 0.08             # was 0.15: a quiz never captures all of someone's skills (2026-10-11)
    similar_builders: 0.10
    trending_nearby: 0.10
    exploration: 0.12
  exclude_seen_days: 30
  hide_after_reports: 3           # a post reported by this many different users is hidden from everyone (moderation)

# Stage F — ranking (section 8)
ranking:
  quality_factor:
    base: 0.6
    problem_score: 0.4
    toxicity_penalty: 0.5
  survey_every_n_items: 30
  value_model_blend: 0.20
  value_model_min_surveys: 200    # train the "Was this useful?" model once this many answers exist
  v2_min_labeled_impressions: 50000
  # Thompson sampling over post types (section 10): the type_pref feature is a draw from each user's
  # Beta per post type instead of the learned average. The prior is Beta(s/2, s/2). s = 40: at s = 10 the
  # draws moved a new user's scores by +-0.33 (measured 2026-10-11), more than the gap between in-map and
  # off-map posts; s = 40 halves that, so exploration nudges the ranking instead of reshuffling it.
  thompson_post_types: true
  type_thompson_prior: 40
  models_dir: data/models         # v2 model files (git-ignored)
  # v1: hand-set linear estimates of each action's probability (section 8.2), clipped to [0, 1].
  # Features run 0-1 except type_pref (-1..1) and source_pref (-cap..cap). `problem` is the post's
  # problem score as a percentile within its kind (pain or demand), so the two kinds compare fairly.
  # `skill` coefficients were halved on 2026-10-11: listed skills are a small bonus, never a filter.
  # Deep actions use *_fit = relevance x value (relevance = best of affinity, skill / 2, save_sim): a strong
  # post outside someone's interests is not something they save or build from (2026-10-11 audit).
  # `inferred` and `confidence_level` (section 17.8): small nudges for inferred problems, more for confident ones.
  v1:
    coefficients:
      read:        {intercept: 0.15, inferred: 0.03, affinity: 0.30, skill: 0.05, save_sim: 0.20, nfm_sim: -0.15, type_pref: 0.20, source_pref: 0.05, quality: 0.10, fresh: 0.05, social: 0.05}
      save:        {confidence_level: 0.03, affinity: 0.10, skill: 0.025, save_sim: 0.12, nfm_sim: -0.08, type_pref: 0.08, problem_fit: 0.11, intensity_fit: 0.055, money_fit: 0.03, buyer_fit: 0.02, social: 0.05}
      id_build:    {affinity: 0.04, skill: 0.03, save_sim: 0.04, problem_fit: 0.09, intensity_fit: 0.04, money_fit: 0.02, buyer_fit: 0.02}
      idea:        {affinity: 0.015, skill: 0.01, problem_fit: 0.04, money_fit: 0.01, buyer_fit: 0.01}
      outreach:    {affinity: 0.005, problem_fit: 0.02, money_fit: 0.01, buyer_fit: 0.014}
      not_for_me:  {intercept: 0.10, affinity: -0.10, skill: -0.015, save_sim: -0.05, nfm_sim: 0.25, type_pref: -0.10}
      scroll_past: {intercept: 0.45, affinity: -0.30, save_sim: -0.10, nfm_sim: 0.15, quality: -0.10, fresh: -0.05}
    similarity_low: 0.4           # embedding cosine mapped to 0..1 between these
    similarity_high: 0.8
    similar_save_cosine: 0.75     # "you saved N similar posts" counts saves at least this close
    fresh_half_life_hours: 72
    recent_saves: 20

# Stage G — feed composition (section 9)
composition:
  window: 20
  quotas:
    core_regular: 0.60
    paid_demand_min: 0.15
    change_max: 0.20
    exploration_min: 0.10
    exploration_max: 0.15
    builder_max: 0.15
  max_same_leaf_per_10: 3
  max_same_type_in_a_row: 2       # spec said 1; relaxed 2026-10-11 so a minority type isn't forced into every other slot
  fresh_share_first_10: 0.40
  fresh_hours: 48
  # "You're caught up" below this score. Calibrated 2026-10-11 on new users: off-map posts score about
  # -0.06 (p90 -0.03), in-map posts 0.29+ (p10, a narrow Legal user) to 0.7+ (a broad user).
  caught_up_score_floor: 0.2
  page_size: 20
  pins_per_page: 2                # pinned and dropped-in nodes each get a slot per page, up to this many

# Stage H — learning loop (section 10)
learning:
  bubble_leaf_share: 0.50
  bubble_window_impressions: 100
  bubble_exploration: 0.20
