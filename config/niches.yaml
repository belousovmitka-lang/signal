# Seeded second level of the industry tree (FEED_ALGORITHM.md section 4.1). These branches always
# exist, even with no posts yet, so builders can pick them on day one; the tagger chooses a post's
# first sub-niche from its industry's list. The weekly job grows new branches under and beside them.
#
# Branches name the work, not the buyer: a public tender goes under what it buys (a tender for
# fleet servicing is Logistics > Fleet maintenance), never under a "procurement" branch.
# Edit freely; renaming a branch re-files posts on the next re-tag.
