labeler: Claude (claude-opus-5-5), 2026-10-09, reading each post in full; reviewed by the user 2026-10-10 (approved; asked to split
  noise). The noise split is Claude's, unreviewed.
guide: 'Labels follow the tagging prompt v4 definitions. Actionable: pain, paid_demand, tool_gap, change, idea. Everything else says
  what the post is: research (papers), listing (bare model/app/repo/publication listings), company_news (one company: earnings, expansions,
  exec moves, rankings, promos), general_news (accidents, prizes, investigations, outlooks, price tickers), notice (routine official
  notices), opinion, guide (how-to, explainer, advice), praise (positive reviews), spam (ads, self-promotion, adult), off_topic (personal
  chat, politics, bare links). Launches, rules, rulings and data releases are change. Tenders are paid_demand with buyer high and intensity
  low unless the notice states urgency. money = the post states an amount someone pays, budgets or loses. unsure = review first. Set
  reviewed: true after checking a label.'
