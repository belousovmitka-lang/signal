[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-connectors"
version = "0.1.0"
description = "Source connectors for Signal: collect raw posts from every source and store them as uniform records."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "feedparser>=6.0",
    "selectolax>=0.3",
    "beautifulsoup4>=4.12",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "vcrpy>=6",
]

[tool.setuptools.packages.find]
include = ["signal_connectors*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: hits the real network (skipped unless SIGNAL_LIVE_TESTS=1)",
]
