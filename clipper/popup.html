<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Clip to Signal</title>
<style>
  :root { --bg: #fff; --fg: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; --accent: #3a5bd9; --ok: #2e7d32; --bad: #c62828; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1c1e; --fg: #f5f5f7; --muted: #a1a1a6; --line: #3a3a3c; --accent: #7d97ff; --ok: #81c784; --bad: #ef9a9a; }
  }
  body { width: 340px; margin: 0; padding: 14px; font: 13px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  h1 { font-size: 14px; margin: 0 0 4px; }
  .page { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 10px; }
  label { display: block; font-weight: 600; margin: 8px 0 4px; }
  textarea { box-sizing: border-box; width: 100%; resize: vertical; font: inherit; color: inherit; background: transparent;
             border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
  button { margin-top: 10px; width: 100%; padding: 8px; border: 0; border-radius: 6px; background: var(--accent);
           color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #status { min-height: 18px; margin-top: 8px; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
  a { color: var(--accent); }
</style>
</head>
<body>
  <h1>Clip to Signal</h1>
  <div class="page" id="page">…</div>
  <label for="text">What you selected</label>
  <textarea id="text" rows="6" placeholder="Select the part of the post that matters, or write a note below."></textarea>
  <label for="note">Your note</label>
  <textarea id="note" rows="3" placeholder="Why this is a problem worth solving"></textarea>
  <button id="save">Save clip</button>
  <div id="status"></div>
  <div class="hint">Only the link, the title, your selection and your note are sent. <a href="#" id="opts">Settings</a></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
